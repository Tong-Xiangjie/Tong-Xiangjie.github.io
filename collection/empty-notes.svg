<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 纸币主体：外框 + 内框 -->
  <g fill="none" stroke="#000000" stroke-linejoin="round">
    <rect x="20" y="64" width="160" height="80" rx="4" stroke-width="10"/>
    <rect x="38" y="80" width="124" height="42" rx="5" stroke-width="4"/>
  </g>

  <!-- 中央文字：中国人民很行 / 壹佰圆 -->
  <g fill="#000000" font-family="sans-serif" font-weight="bold" text-anchor="middle">
    <text x="100" y="96" font-size="10">中国人民很行</text>
    <text x="100" y="116" font-size="14">壹佰圆</text>
  </g>

  <!-- 左右面额短线，对称三组 -->
  <g fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round">
    <line x1="52" y1="88" x2="66" y2="88"/>
    <line x1="52" y1="101" x2="66" y2="101"/>
    <line x1="52" y1="114" x2="66" y2="114"/>
    <line x1="134" y1="88" x2="148" y2="88"/>
    <line x1="134" y1="101" x2="148" y2="101"/>
    <line x1="134" y1="114" x2="148" y2="114"/>
  </g>

  <!-- 左侧冠字号：竖排，数字方向倒转 -->
  <g fill="#000000" font-family="sans-serif" font-weight="bold" text-anchor="middle">
    <text x="46" y="101" font-size="5"
          transform="rotate(-90 46 101)">FA12345678</text>
  </g>

  <!-- 底部序列号短线 -->
  <g fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round">
    <line x1="68" y1="131" x2="78" y2="131"/>
    <line x1="86" y1="131" x2="96" y2="131"/>
    <line x1="104" y1="131" x2="114" y2="131"/>
    <line x1="122" y1="131" x2="132" y2="131"/>
  </g>

  <!-- 四角 L 形角标 -->
  <g fill="none" stroke="#000000" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 72 H 34 M 28 72 V 78"/>
    <path d="M 172 72 H 166 M 172 72 V 78"/>
    <path d="M 28 136 H 34 M 28 136 V 130"/>
    <path d="M 172 136 H 166 M 172 136 V 130"/>
  </g>
</svg>