<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="暂无图片">
  <!--
    ★ 缺图占位：自绘「古钱币」（方孔圆钱）—— 扁平线条版。

    这张图**不是**直接当图片显示用的，而是当 CSS 蒙版用（mask-image）。
    原因：<img src="..."> 和 background-image 都拿不到 currentColor，
    蒙版 + background-color 取主题变量，才能让占位跟着主题色走
    （深色主题自动变浅，浅色主题自动变深，将来换主题色也一起跟着变）。

    所以这里只画"形状"：线条与文字一律纯黑不透明、其余全透明。
    蒙版按 alpha 取值，可见处 = 蒙版不透明处，颜色完全由 CSS 决定。
    对应样式在 collection/layout.css 的「缺图占位」段，
    消费方有三处：.copy-thumb.no-img::before / .shanhe-list-cell .no-img::before /
    .timeline-no-img::before，以及 404 后降级的 img.img-failed。

    形制：外郭（粗）+ 内郭（细）+ 方孔（粗，中间透空，不是填色块），
    环带上刻四个字「銅の幣紀」（上銅、下の、右幣、左紀）——
    也就是古钱币的「上下右左」对读，先上下、再右左。
    铭文既是品牌，也让占位天然不可能被误认成真品照片。
    刻意保持扁平：没有渐变、没有锈迹、没有划痕 ——
    那些在 36×26 的缩略图上只会糊成一团，深色主题下也更难分辨。

    几何（viewBox 200，圆心 100,100）：
      外郭 r=84 线宽 12 → 边缘 78~90
      内郭 r=66 线宽  5 → 边缘 63.5~68.5
      方孔 52×52 线宽 12 → 外沿到 32
      铭文中心半径 48、字号 26 → 占 35~61，正好落在方孔与内郭之间的环带上
  -->
  <g fill="none" stroke="#000000" stroke-linejoin="round">
    <!-- 外郭 -->
    <circle cx="100" cy="100" r="84" stroke-width="12"/>
    <!-- 内郭 -->
    <circle cx="100" cy="100" r="66" stroke-width="5"/>
    <!-- 方孔（中间透空，背景直接透过去） -->
    <rect x="74" y="74" width="52" height="52" rx="2" stroke-width="12"/>
  </g>

  <!-- 铭文：銅（上）の（下）幣（右）紀（左）—— 对读作「銅の幣紀」 -->
  <g fill="#000000"
     font-family="'Source Han Sans SC','Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
     font-weight="900" font-size="26" text-anchor="middle" dominant-baseline="central">
    <text x="100" y="52">銅</text>
    <text x="100" y="148">の</text>
    <text x="148" y="100">幣</text>
    <text x="52" y="100">紀</text>
  </g>
</svg>
