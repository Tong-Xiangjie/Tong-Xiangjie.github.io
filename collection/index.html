<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>铜の币纪主站</title>
    <script>
        // ★ 在任何样式/绘制之前先把明暗与主题色定下来，否则暗色下会先闪一下白屏。
        //   （配色细节由 theme.js 的 applyTheme() 随后补全，这里只做"别闪"这一步）
        (function () {
            try {
                var el = document.documentElement;
                var mode = localStorage.getItem('collection-color-scheme') || 'system';
                var dark = mode === 'dark' || (mode === 'system' &&
                    window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                el.setAttribute('data-color-scheme', dark ? 'dark' : 'light');
                el.style.colorScheme = dark ? 'dark' : 'light';

                // ★ 这里必须把 applyTheme() 会写的**整套**变量都预置上，不能只设 --theme。
                //   只设 --theme 的后果（实测铜色 #b87333）：
                //     亮色：--bg #eef4ff → #f9f4ef、--sidebar-bg #e4edf8 → #f5ebe2、
                //           --border #d5dce8 → #efe0d2、--theme-light #4096ff → #d4ab85
                //     暗色：--bg #0f1115 → #0b0703、--card-bg #22262e → #1a1007、
                //           --border #2c313a → #736557、--theme-light #4096ff → #d1a47a
                //   也就是**整页背景**会先闪一次"默认蓝那一套"，再跳成主题色那一套；
                //   首屏的 .mode-toggle、各处 hover 边框、山河图例渐变也都先蓝一下。
                //   注意 layout.css 里 html[data-color-scheme] 那份兜底是"按默认蓝算的"，
                //   所以它只挡得住白屏/黑屏，挡不住"闪蓝"。
                //
                //   下面的算式与 theme.js 的 applyTheme()/lightenColor()/darkenColor()
                //   一一对应（含 --border 那种"先压暗再提亮"的两步取整）。
                //   这是**有意的重复**：head 脚本必须在 theme.js 之前同步跑完，没法 import，
                //   换成外链文件反而要多一次阻塞请求、更慢。两份实现不许漂移 ——
                //   verify-theme-init.mjs 会把 theme.js 拦掉量出这里的值，再和 theme.js
                //   算出的值**逐变量**比对（11 个预设色 × 明暗两模式），对不上就失败。
                //   只认 #rgb / #rrggbb（app-theme 只会被 setTheme 写成这个格式）；
                //   其它格式不预置，退回 CSS 默认 —— 和改动前一样，不会更差。
                var t = localStorage.getItem('app-theme');
                if (t && /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(t)) {
                    var h = t.slice(1);
                    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
                    var R = parseInt(h.substr(0, 2), 16),
                        G = parseInt(h.substr(2, 2), 16),
                        B = parseInt(h.substr(4, 2), 16);
                    var up = function (v, r) { return Math.round(v + (255 - v) * r); };  // lightenColor
                    var dn = function (v, r) { return Math.round(v * (1 - r)); };        // darkenColor
                    var hx = function (r, g, b) {
                        var p = function (v) { return ('0' + v.toString(16)).slice(-2); };
                        return '#' + p(r) + p(g) + p(b);
                    };
                    var L = function (r) { return hx(up(R, r), up(G, r), up(B, r)); };    // lightenColor(t, r)
                    var D = function (r) { return hx(dn(R, r), dn(G, r), dn(B, r)); };    // darkenColor(t, r)
                    // --border = lightenColor(darkenColor(t, 0.70), 0.30)，两步都要取整
                    var bd0 = [dn(R, 0.70), dn(G, 0.70), dn(B, 0.70)];
                    var border = hx(up(bd0[0], 0.30), up(bd0[1], 0.30), up(bd0[2], 0.30));
                    var vars = dark ? {
                        '--theme': t, '--theme-light': L(0.35),
                        '--row-hover-bg': 'rgba(255, 255, 255, 0.14)',
                        '--bg': D(0.94), '--bg-light': D(0.90), '--sidebar-bg': D(0.92),
                        '--card-bg': D(0.86), '--border': border, '--thumb-bg': D(0.80),
                        '--text': '#e8eaed', '--text-secondary': '#9aa0a6'
                    } : {
                        '--theme': t, '--theme-light': L(0.4),
                        '--row-hover-bg': 'rgba(0, 0, 0, 0.10)',
                        '--bg': L(0.92), '--bg-light': L(0.96), '--sidebar-bg': L(0.86),
                        '--card-bg': '#ffffff', '--border': L(0.78), '--thumb-bg': L(0.82),
                        '--text': '#000000', '--text-secondary': '#666666'
                    };
                    for (var k in vars) el.style.setProperty(k, vars[k]);
                }
            } catch (e) { /* 隐私模式下 localStorage 会抛，忽略即可 */ }
        })();
    </script>
    <!-- ★ 缺图占位与空状态插图平时只是 CSS 里的 mask-image，浏览器要等"某个元素第一次
         真的用到"才去取 —— 于是首个缺图/空状态会先空一下、再"啪"地跳出钱币或线稿。
         这里在解析 HTML 阶段就声明预加载，让它们和样式表并行取回；12 个合计不到 8KB。
         清单必须与 core.js 的 PLACEHOLDER_ART_FILES 一致（verify-img-placeholder.mjs 会逐项比对）。 -->
    <link rel="preload" as="image" type="image/svg+xml" href="img-placeholder.svg">
    <link rel="preload" as="image" type="image/svg+xml" href="empty-search.svg">
    <link rel="preload" as="image" type="image/svg+xml" href="empty-notes.svg">
    <link rel="preload" as="image" type="image/svg+xml" href="empty-coins.svg">
    <link rel="preload" as="image" type="image/svg+xml" href="empty-articles.svg">
    <link rel="preload" as="image" type="image/svg+xml" href="empty-special.svg">
    <link rel="preload" as="image" type="image/svg+xml" href="empty-shanhe.svg">
    <link rel="preload" as="image" type="image/svg+xml" href="empty-region.svg">
    <link rel="preload" as="image" type="image/svg+xml" href="empty-timeline.svg">
    <link rel="preload" as="image" type="image/svg+xml" href="empty-tag.svg">
    <link rel="preload" as="image" type="image/svg+xml" href="empty-stats.svg">
    <link rel="preload" as="image" type="image/svg+xml" href="empty-color.svg">
    <link rel="stylesheet" href="layout.css">
    <!-- ★ Hammer.js 只服务于灯箱的双指缩放（category-view.js initPinchZoom，打开弹窗时才调用）。
         A3：已改为本地 vendor/hammer.min.js（同一份 2.0.8 构建，20.3KB）——
         站内从此没有任何外部依赖：CDN 被墙/抽风时不会再"静默丢失缩放功能"，
         断网（走 SW 资源缓存）时也能正常加载。仍然 defer，不阻塞首屏解析。 -->
    <script defer src="vendor/hammer.min.js"></script>
</head>
<body>

<div class="app-layout">
    <!-- 顶部搜索栏 -->
    <div class="top-search-container">
        <div class="search-bar">
            <select class="search-select" id="searchType">
                <option value="all">全字段搜索</option>
                <option value="name">按名称搜索</option>
                <option value="version">按冠字号搜索</option>
                <option value="year">按年份搜索</option>
                <option value="agency">按评级机构搜索</option>
                <option value="krause">按目录编号搜索</option>
                <option value="copyid">按评级编号搜索</option>
            </select>
            <div class="search-input-wrapper">
                <input type="text" class="search-input" id="searchInput" placeholder="数据还在路上，先让它跑一会儿～" autocomplete="off">
                <span class="symbol-trigger" id="symbolToggle" title="特殊字符">Ω</span>
            </div>
            <button class="search-btn" id="searchBtn">搜索</button>
            <span class="mode-toggle" id="modeToggle" title="切换搜索模式">■</span>
            <button class="reset-btn" id="resetBtn">重置</button>
            <!-- ★ 面板放在这里，作为 .search-bar 的直接子元素 -->
            <div class="symbol-panel" id="symbolPanel"></div>
        </div>
        <div class="search-tip" id="searchTip">现在是「实时搜索」（边打边搜），点“■”能换成「点击搜索」</div>
    </div>

    <div class="body-row">
        <!-- 侧边栏 -->
        <div class="sidebar" id="sidebar"></div>
        <!-- 侧边栏折叠按钮 -->
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
        <!-- 内容区 -->
        <div class="content">
            <!-- 加载进度条容器 -->
            <div id="loadingContainer" style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;color:var(--text-secondary);font-size:0.9rem;">
                <div class="data-loading-text">数据火速赶来中，请稍候ε=ε=(ノ≧∇≦)ノ</div>
                <div class="data-loading-file" id="dataLoadingFile">正在准备……</div>
                <div class="data-loading-bar"><div class="data-loading-fill" id="dataLoadingFill"></div></div>
            </div>
            <!-- 主应用容器 -->
            <div id="app" style="display:none;height:100%;overflow-y:auto;"></div>
        </div>
    </div>

    <!-- 底部Tab栏 -->
    <div class="bottom-tabbar">
        <div class="tab-item active" data-target="notes">纸币</div>
        <div class="tab-item" data-target="coins">硬币</div>
        <div class="tab-item" data-target="special">专题</div>
        <div class="tab-item" data-target="articles">文章</div>
        <div class="tab-item" data-target="settings">我的</div>
    </div>
</div>

<!-- 图片弹窗 -->
<div id="imageModal" class="modal">
    <div class="modal-close" onclick="closeModal()">×</div>
    <div class="modal-content" id="modalContent">
        <div class="image-container" id="imageContainer">
            <img id="modalImg" class="modal-img" src="" alt="预览图">
        </div>
        <!-- 翻面动画用的浮层：翻面时它负责"把当前这一面压扁带出"，
             真正的 #modalImg 在同一时间从压扁状态展开成另一面。
             两半动画都跑在 #modalImg 之外的独立元素上，所以完全不碰
             Hammer 的捏合缩放（它操作 #imageContainer）。 -->
        <img id="modalImgOverlay" class="modal-img-overlay" src="" alt="">
    </div>
    <div class="modal-tip">
        <!-- ★ "滑动翻面"单独包一层：单面图没有另一面可翻，这句提示就不该出现
             （用户要求）。显隐由 .modal.multi-img 控制，判据和左右两个翻面按钮
             完全一致 —— 都是"有没有第二张不同的图"（见 category-view.js 里
             modal.classList.toggle('multi-img', !!currentModalImg2)）。 -->
        <span class="tip-touch">双指缩放 | 拖动查看<span class="tip-flip"> | 滑动翻面</span> | 单击关闭</span>
        <span class="tip-mouse">滚轮缩放 | 拖动查看 | 单击关闭</span>
        <span class="tip-loading">原图加载中，请稍候</span>
    </div>
    <div class="modal-nav modal-nav-prev" id="modalNavPrev" onclick="modalFlip(-1)" title="看另一面（←）">‹</div>
    <div class="modal-nav modal-nav-next" id="modalNavNext" onclick="modalFlip(1)" title="看另一面（→）">›</div>
</div>

<!-- ========== 配置 + 桥接 ========== -->
<script src="config.js"></script>
<script src="coin-config.js"></script>
<script src="special-bridge.js"></script>
<script src="data-loader.js"></script>

<!-- ========== 核心 + 工具 ========== -->
<script src="theme.js"></script>
<script src="core.js"></script>

<!-- ========== 功能模块（按依赖顺序） ========== -->
<script src="sidebar.js"></script>
<script src="category-view.js"></script>
<script src="overview.js"></script>
<script src="search.js"></script>
<script src="tab-switcher.js"></script>
<script src="special.js"></script>
<script src="stats.js"></script>
<script src="settings.js"></script>

<!-- ========== ★ 同义词表版本号（由 build-synonyms.yml 生成） ========== -->
<!-- 给 data/synonyms.json 提供 ?v= 版本号，避免 CDN/浏览器缓存住旧表。
     此文件缺失时前端自动退化成不带版本号请求，不影响功能。 -->
<script src="data/synonyms-version.js"></script>
<script src="article.js"></script>

<!-- ========== 离线预缓存 ========== -->
<script src="precache.js"></script>

<!-- ========== ★ 特殊字符面板 ========== -->
<script src="symbol-picker.js"></script>

<!-- ========== ★ 深链接路由（hash，无需服务端配合） ========== -->
<script src="router.js"></script>

<!-- ========== 入口 ========== -->
<script src="main.js"></script>

<!-- ========== 自绘滚动条 ==========
     原生滚动条占布局宽度，主滚动容器 .content 一出现纵向滚动条，整页内容就横向缩
     约 15px（用户报的"整个网站横向变窄"）。这里改成自己画：原生条收成 0 宽，
     浮一个自绘滑块，宽度也就永远不变了。逻辑在 scrollbar.js，样式在 layout.css 末尾。 -->
<script src="scrollbar.js"></script>

<!-- ========== 自绘下拉栏 ==========
     把页面上所有原生 <select> 换成自己画的外观（固定宽度、太长就压扁省略、弹出有动画）。
     原生 select 不删，只是 display:none 藏起来继续持有 .value / options / change 契约，
     所以既有逻辑和用例一字不用改。逻辑在 dropdown.js，样式在 layout.css 末尾。 -->
<script src="dropdown.js"></script>

<!-- ========== 图片本地缓存（离线可用） ========== -->
<script>
// 注册图片缓存 Service Worker（scope 为 /collection/）
// file:// 直接打开时不注册：Service Worker 需要安全上下文（https / localhost）
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.warn('[sw] 图片缓存注册失败：', e);
    });
}
</script>

</body>
</html>
