<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- gate:begin（collection 站入口门禁：由 `node collection/tools/gate.mjs apply` 注入，请勿手改） -->
    <meta name="robots" content="noindex,nofollow">
    <style id="collection-gate-guard">
    /* ★ 兜底隐藏：门禁没放行之前整页不可见。这段 CSS 就写在 <head> 里，
       所以**关掉 JavaScript 也进不去**（而且下面 ::before 那句提示照样显示）。
       用 visibility 而不是 display:none：display:none 会让布局塌成 0，
       连提示本身都画不出来，用户只看到一片白。 */
    html:not(.gate-ok) {
        visibility: hidden !important;
    }
    /* ★★ 主题只有一个来源：下面五组「--gate-*」变量块（默认兜底 + 系统浅/暗 + 站点浅/暗）。
       每一组里**背景与图标必然成对** —— 同一组选择器同时给出 --gate-bg 与 --gate-icon，
       组件层只消费变量、自己一个颜色都不写。于是"背景判成浅色、图标却带着暗色的
       invert(1)"这类**白底白画**在结构上不可能再发生。
       用户实测过的坑正是这个：背景同时写在 @media (prefers-color-scheme) 与
       html[data-color-scheme] 两套来源里，图标却只写在媒体查询那一套里 ⇒
       "系统暗色 + 站点主题浅色"时背景 #f6f7f9（浅）配上 invert(1)（白）⇒ 白底白画。
       要加主题或改配色，只动这五组；组件层一个字都不用碰。 */
    :root {
        /* 浅色（默认 / 兜底） */
        --gate-bg: #f6f7f9;
        --gate-fg: #1f2328;
        --gate-icon: brightness(0);                   /* 原画颜色不许被依赖 → 一律纯黑 */
        --gate-in-bg: #ffffff;
        --gate-in-fg: #1f2328;
        --gate-in-bd: #9aa3ad;
        --gate-btn-bg: #1f2328;
        --gate-btn-fg: #f6f7f9;
    }
    /* ① 系统偏好：浅色 —— 背景 + 图标成对（同一组选择器） */
    @media (prefers-color-scheme: light) {
        :root {
            --gate-bg: #f6f7f9;
            --gate-fg: #1f2328;
            --gate-icon: brightness(0);
            --gate-in-bg: #ffffff;
            --gate-in-fg: #1f2328;
            --gate-in-bd: #9aa3ad;
            --gate-btn-bg: #1f2328;
            --gate-btn-fg: #f6f7f9;
            }
    }
    /* ① 系统偏好：暗色 —— 背景 + 图标成对 */
    @media (prefers-color-scheme: dark) {
        :root {
            --gate-bg: #14171c;
            --gate-fg: #e8eaed;
            --gate-icon: brightness(0) invert(1);     /* 强制纯白 */
            --gate-in-bg: #1b1f26;
            --gate-in-fg: #e8eaed;
            --gate-in-bd: #5b6673;
            --gate-btn-bg: #e8eaed;
            --gate-btn-fg: #14171c;
            }
    }
    /* ② 站点主题 html[data-color-scheme]（优先级高于媒体查询，所以**必须自带图标**）：
          暗色 —— 背景 + 图标成对 */
    html[data-color-scheme="dark"] {
        --gate-bg: #14171c;
        --gate-fg: #e8eaed;
        --gate-icon: brightness(0) invert(1);
        --gate-in-bg: #1b1f26;
        --gate-in-fg: #e8eaed;
        --gate-in-bd: #5b6673;
        --gate-btn-bg: #e8eaed;
        --gate-btn-fg: #14171c;
    }
    /* ② 站点主题：浅色 —— 背景 + 图标成对
          （少写 --gate-icon 这一行，就是用户实测到的"白底白画"） */
    html[data-color-scheme="light"] {
        --gate-bg: #f6f7f9;
        --gate-fg: #1f2328;
        --gate-icon: brightness(0);
        --gate-in-bg: #ffffff;
        --gate-in-fg: #1f2328;
        --gate-in-bd: #9aa3ad;
        --gate-btn-bg: #1f2328;
        --gate-btn-fg: #f6f7f9;
    }
    /* 关 JS（或脚本还没跑完）时的提示：画在根元素上，不依赖 body 是否存在。
       背景/前景全部取自上面那组变量 ⇒ 与图标**必然同源**。 */
    html:not(.gate-ok):not(.gate-denied)::before {
        content: "暂无访问权限";
        visibility: visible !important;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
        background: var(--gate-bg);
        color: var(--gate-fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        line-height: 1.6;
    }
    /* 脚本把页面内容换掉之后的那只盒子（document.write 出来的新文档里用的是同一套类名）；
       它是整页唯一允许露出来的东西。 */
    .gate-denied-box,
    .gate-denied-box * {
        visibility: visible !important;
    }
    .gate-denied-box {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
        background: var(--gate-bg);
        color: var(--gate-fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        font-size: 16px;
        line-height: 1.6;
        -webkit-user-select: text;
        user-select: text;
    }
    /* 未授权页的图标：collection/block.svg（站点主人自己画的画）。
       **原画颜色不许被依赖**：描边现在是纯黑，但用户随时可能改色，
       所以用 filter 强制成纯黑/纯白；而 filter 与背景来自**同一组变量**（见上面那段说明）。 */
    .gate-denied-box .gate-denied-icon {
        display: block;
        width: 160px;
        max-width: 60vw;
        height: auto;
        margin: 0 0 1.1rem;
        filter: var(--gate-icon);
    }
    .gate-denied-box .gate-denied-text {
        margin: 0;
        max-width: 100%;
    }
    /* 口令输入框（用户主动要求）：只是省掉"链接里的 #k= 被聊天软件吃掉"的麻烦，
       **不增加任何安全性**。窄屏（375px）靠 flex + min-width:0 保证不横向溢出。 */
    .gate-denied-box .gate-denied-form {
        display: flex;
        gap: .5rem;
        width: 100%;
        max-width: 20rem;
        margin: 1.25rem 0 0;
    }
    .gate-denied-box .gate-denied-input,
    .gate-denied-box .gate-denied-submit {
        /* 输入框与按钮**等高**（2rem = 32px，box-sizing:border-box 把边框算进去）、
           **同圆角**、内边距收紧 —— 改前是 padding .5rem + font 1rem，实测 43.59px 高，
           现在压到 32px。用户要的"矮一点"指的是**高度**，不是字号。 */
        box-sizing: border-box;
        height: 2rem;
        line-height: 1;
        font-family: inherit;
        border-radius: .375rem;
    }
    .gate-denied-box .gate-denied-input {
        flex: 1 1 auto;
        min-width: 0;
        padding: 0 .55rem;
        /* ★ 输入框字号**必须 ≥16px**：iOS Safari 对 font-size < 16px 的输入框，
           聚焦时会**自动放大整页**（页面会跳一下、还得手动缩回去）。
           所以这里固定 1rem，不要为了"看起来更小"往下调。 */
        font-size: 1rem;
        border: 1px solid var(--gate-in-bd);
        background: var(--gate-in-bg);
        color: var(--gate-in-fg);
    }
    .gate-denied-box .gate-denied-submit {
        flex: 0 0 auto;
        padding: 0 .8rem;
        /* 按钮不可聚焦、不触发 iOS 自动放大，所以可以比输入框小一号（高度仍与输入框一致） */
        font-size: .875rem;
        border: 1px solid var(--gate-btn-bg);
        background: var(--gate-btn-bg);
        color: var(--gate-btn-fg);
        cursor: pointer;
    }
    /* 注意：这里**没有** .gate-denied-error 之类的错误文本样式 —— 输错口令走原生 alert()，
       页面上不放任何错误文本 ⇒ 一次失败尝试零版面变化（图片不会移位）。 */
    .gate-denied-box [hidden] {
        display: none !important;
    }
    </style>
    <script id="collection-gate-boot">
    /* ★ 必须同步、必须放在 <head> 最前面：命中下面任意一条就立刻放行，用户看不到任何延迟。
       ① 本地开发（localhost / 127.0.0.1 / ::1）—— 46 个回归套件全靠它，少一条就全红；
       ② file: 协议 —— 双击打开本地 HTML 文件（站点主人的习惯用法，也必须能用）；
       ③ 本机已通过校验：localStorage 里的"标记"等于**当前令牌哈希的前 16 位**。
          标记与哈希绑定，所以 gate.mjs new 换令牌之后，所有老设备自动失效。
          ④ ★ 例外：URL 里带 share 令牌时**不许**在这里放行 —— 带着分享链接进站，
             这一趟必须由 gate.js 按分享规则判（范围/有效期），管理员也不例外。
             否则"本机有全站标记"的浏览器会在 <head> 就被放行，gate.js 里的分享判定
             整段不执行 ⇒ 同一链接在装了标记的浏览器里畅通无阻、在干净浏览器里被拒，
             用户看到的就是"是否被拒绝和浏览器有关"。
       ⚠ ①②只加 gate-ok 类，**不写 localStorage 标记** —— 免得本地放行污染线上判定。
       ⚠ 下面这个 MARK 字面量由 gate.mjs apply 写成 collection/gate.js 里
          GATE_HASHES[0] 的前 16 位，别手改。 */
    (function () {
        try {
            var html = document.documentElement;
            var host = location.hostname.replace(/^\[|\]$/g, '');
            // 本地开发与本地文件打开一律放行（与 collection/gate.js 里那份判定一致）
            if (location.protocol === 'file:' || host === 'localhost' || host === '127.0.0.1' || host === '::1') {
                html.classList.add('gate-ok');
                return;
            }
            // ★ 带分享令牌时不能在这里放行：交给 gate.js 按分享规则判（见上面 ④）。
            //   查 search 与 hash 两处，与 gate.js 的"片段优先、查询串兜底"一致。
            var hasShare = (location.search + location.hash).indexOf('share=') >= 0;
            if (!hasShare && localStorage.getItem('collection-gate') === '63bccacf1f6ddf9a') { html.classList.add('gate-ok'); }
        } catch (e) { /* 隐私模式下 localStorage 会抛，忽略即可 */ }
    })();
    </script>

    <title>铜の币纪主站</title>
    <script>
        // ★ 在任何样式/绘制之前先把明暗与主题色定下来，否则暗色下会先闪一下白屏。
        //   （配色细节由 theme.js 的 applyTheme() 随后补全，这里只做"别闪"这一步）
        (function () {
            try {
                var el = document.documentElement;
                var mode = localStorage.getItem('collection-color-scheme') || 'system';
                var dark = mode === 'dark' || (mode === 'system' &&
                    window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                el.setAttribute('data-color-scheme', dark ? 'dark' : 'light');
                el.style.colorScheme = dark ? 'dark' : 'light';

                // ★ 这里必须把 applyTheme() 会写的**整套**变量都预置上，不能只设 --theme。
                //   只设 --theme 的后果（实测铜色 #b87333）：
                //     亮色：--bg #eef4ff → #f9f4ef、--sidebar-bg #e4edf8 → #f5ebe2、
                //           --border #d5dce8 → #efe0d2、--theme-light #4096ff → #d4ab85
                //     暗色：--bg #0f1115 → #0b0703、--card-bg #22262e → #1a1007、
                //           --border #2c313a → #736557、--theme-light #4096ff → #d1a47a
                //   也就是**整页背景**会先闪一次"默认蓝那一套"，再跳成主题色那一套；
                //   首屏的 .mode-toggle、各处 hover 边框、山河图例渐变也都先蓝一下。
                //   注意 layout.css 里 html[data-color-scheme] 那份兜底是"按默认蓝算的"，
                //   所以它只挡得住白屏/黑屏，挡不住"闪蓝"。
                //
                //   下面的算式与 theme.js 的 applyTheme()/lightenColor()/darkenColor()
                //   一一对应（含 --border 那种"先压暗再提亮"的两步取整）。
                //   这是**有意的重复**：head 脚本必须在 theme.js 之前同步跑完，没法 import，
                //   换成外链文件反而要多一次阻塞请求、更慢。两份实现不许漂移 ——
                //   verify-theme-init.mjs 会把 theme.js 拦掉量出这里的值，再和 theme.js
                //   算出的值**逐变量**比对（11 个预设色 × 明暗两模式），对不上就失败。
                //   只认 #rgb / #rrggbb（app-theme 只会被 setTheme 写成这个格式）；
                //   其它格式不预置，退回 CSS 默认 —— 和改动前一样，不会更差。
                var t = localStorage.getItem('app-theme');
                if (t && /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(t)) {
                    var h = t.slice(1);
                    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
                    var R = parseInt(h.substr(0, 2), 16),
                        G = parseInt(h.substr(2, 2), 16),
                        B = parseInt(h.substr(4, 2), 16);
                    var up = function (v, r) { return Math.round(v + (255 - v) * r); };  // lightenColor
                    var dn = function (v, r) { return Math.round(v * (1 - r)); };        // darkenColor
                    var hx = function (r, g, b) {
                        var p = function (v) { return ('0' + v.toString(16)).slice(-2); };
                        return '#' + p(r) + p(g) + p(b);
                    };
                    var L = function (r) { return hx(up(R, r), up(G, r), up(B, r)); };    // lightenColor(t, r)
                    var D = function (r) { return hx(dn(R, r), dn(G, r), dn(B, r)); };    // darkenColor(t, r)
                    // --border = lightenColor(darkenColor(t, 0.70), 0.30)，两步都要取整
                    var bd0 = [dn(R, 0.70), dn(G, 0.70), dn(B, 0.70)];
                    var border = hx(up(bd0[0], 0.30), up(bd0[1], 0.30), up(bd0[2], 0.30));
                    var vars = dark ? {
                        '--theme': t, '--theme-light': L(0.35),
                        '--row-hover-bg': 'rgba(255, 255, 255, 0.14)',
                        '--bg': D(0.94), '--bg-light': D(0.90), '--sidebar-bg': D(0.92),
                        '--card-bg': D(0.86), '--border': border, '--thumb-bg': D(0.80),
                        '--text': '#e8eaed', '--text-secondary': '#9aa0a6'
                    } : {
                        '--theme': t, '--theme-light': L(0.4),
                        '--row-hover-bg': 'rgba(0, 0, 0, 0.10)',
                        '--bg': L(0.92), '--bg-light': L(0.96), '--sidebar-bg': L(0.86),
                        '--card-bg': '#ffffff', '--border': L(0.78), '--thumb-bg': L(0.82),
                        '--text': '#000000', '--text-secondary': '#666666'
                    };
                    for (var k in vars) el.style.setProperty(k, vars[k]);
                }
            } catch (e) { /* 隐私模式下 localStorage 会抛，忽略即可 */ }
        })();
    </script>
    <!-- ★ 缺图占位与空状态插图平时只是 CSS 里的 mask-image，浏览器要等"某个元素第一次

    <!-- ★ OCR-B（layout.css 里的 'OCRB10PitchBT-Regular'，只给 .copy-info .version-text
         的冠号用；9.3KB woff）。以前**没有任何 preload**：浏览器要等第一张藏品卡被排版、
         真的需要这个字形时才发现它，于是冠号先用回退字体画几帧、字体到位后再跳一次。
         逐帧实测（HTTP/2 + 80ms RTT）：字体请求 t≈1565ms 才开始（加载屏 t≈1201ms 就消失了），
         .version-text 第 74 帧以回退字体出现、第 80 帧换成 OCR-B，宽度 99.15→103.89px、
         92.74→98.16px（每个冠号 +4.7~5.4px）。
         preload 让字节和样式表**并行**下载；`crossorigin` 不能省 —— 字体是按 CORS 模式取的，
         少了它 preload 命不中，浏览器会白下一次（缓存里两份、毫无收益）。
         清单一致性由 verify-ocrb-init.mjs 断言（href 必须与 layout.css 的 src 指向同一文件）。 -->
    <link rel="preload" as="font" type="font/woff" href="../font/OCRB10PitchBT-Regular.woff" crossorigin>

         断网（走 SW 资源缓存）时也能正常加载。仍然 defer，不阻塞首屏解析。 -->
    <script defer src="vendor/hammer.min.js"></script>

<div class="app-layout">
    <!-- 顶部搜索栏 -->
    <div class="top-search-container">
        <div class="search-bar">
            <select class="search-select" id="searchType">
                <option value="all">全字段搜索</option>
                <option value="name">按名称搜索</option>
                <option value="version">按冠字号搜索</option>
                <option value="year">按年份搜索</option>
                <option value="agency">按评级机构搜索</option>

                <option value="copyid">按评级编号搜索</option>
            </select>
            <div class="search-input-wrapper">
                <input type="text" class="search-input" id="searchInput" placeholder="数据还在路上，先让它跑一会儿～" autocomplete="off">
                <span class="symbol-trigger" id="symbolToggle" title="特殊字符">Ω</span>

            <button class="search-btn" id="searchBtn">搜索</button>

            <button class="reset-btn" id="resetBtn">重置</button>
            <!-- ★ 面板放在这里，作为 .search-bar 的直接子元素 -->

<!-- 图片弹窗 -->
<div id="imageModal" class="modal">
    <!-- ★ 黑色蒙版单独一层（以前它就是 .modal 自己的 background，与图片同一层）。
         为什么要分开：关闭时"蒙版渐隐"与"图片飞回缩略图"是两条独立的动画，
         而 CSS 的 opacity 是继承性的 —— 淡父元素必然连图片一起淡。
         分层之后：蒙版层走 .modal-backdrop 的淡出，图片（.modal-content 及里面的
         #modalImg / 垫底层）与整只查看器一起保持 opacity:1，
         飞行图层扛着图片飞回去，两者互不干扰。
         ★ 仍然必须是 #imageModal 的**子元素**（不能挪到外面、也不能换成 ::before）：
           ① .modal.modal-show 的入场淡入是整只查看器一起淡入，靠的正是父子 opacity 相乘；
           ② .modal 是 z-index:1000 的层叠上下文，蒙版留在里面才天然压在图片之下、
              又高于页面内容之上（.modal-content / 提示语 / ‹ › 依次是 1 / 1001 / 1001）。 -->
    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"></div>
    <div class="modal-close" onclick="closeModal()">×</div>
    <div class="modal-content" id="modalContent">
        <div class="image-container" id="imageContainer">
            <img id="modalImg" class="modal-img" src="" alt="预览图">
        </div>
        <!-- 翻面动画用的浮层：翻面时它负责"把当前这一面压扁带出"，
             真正的 #modalImg 在同一时间从压扁状态展开成另一面。
             两半动画都跑在 #modalImg 之外的独立元素上，所以完全不碰
             Hammer 的捏合缩放（它操作 #imageContainer）。 -->
        <img id="modalImgOverlay" class="modal-img-overlay" src="" alt="">
    </div>
    <div class="modal-tip">
        <!-- ★ "滑动翻面"单独包一层：单面图没有另一面可翻，这句提示就不该出现
             （用户要求）。显隐由 .modal.multi-img 控制，判据和左右两个翻面按钮
             完全一致 —— 都是"有没有第二张不同的图"（见 category-view.js 里
             modal.classList.toggle('multi-img', !!currentModalImg2)）。 -->
        <span class="tip-touch">双指缩放 | 拖动查看<span class="tip-flip"> | 滑动翻面</span> | 单击关闭</span>
        <span class="tip-mouse">滚轮缩放 | 拖动查看 | 单击关闭</span>
        <span class="tip-loading">原图加载中，请稍候</span>
    </div>
    <div class="modal-nav modal-nav-prev" id="modalNavPrev" onclick="modalFlip(-1)" title="看另一面（←）">‹</div>
    <div class="modal-nav modal-nav-next" id="modalNavNext" onclick="modalFlip(1)" title="看另一面（→）">›</div>
</div>

<!-- ========== 文章编辑器「工具箱」==========
     ★ 为什么 DOM 写在这里（index.html）而不是由 toolbox.js 动态创建：
       ① 和上面的 #imageModal 完全同一套做法，样式/结构在 HTML 里一眼能看到；
       ② 编辑区是 contenteditable，浏览器对"一开始就在文档里的 contenteditable"
          在光标、选区、撤销栈上最稳；临时 createElement 出来再塞进去，
          首次聚焦和 execCommand 的行为在部分浏览器上会打折扣。
     逻辑在 toolbox.js，样式在 toolbox.css，入口在「我的」页面（settings.js 的
     renderSettingsPage 里那个 onclick="toolboxOpen()" 的按钮）。 -->
<div id="toolboxModal" class="tb-modal" role="dialog" aria-modal="true" aria-label="文章编辑器工具箱">
    <div class="tb-card">
        <!-- 顶栏 = 拖动区（cursor:move）。鼠标/触摸都按住它拖整个窗口，
             但不给拖出屏幕：toolbox.js 的 clamp 保证标题栏永远留在视口里。
             ★ 没有可复用的窗口拖动实现 —— verify-modal-drag.mjs 里的 MODAL_DRAG_SLOP /
               MODAL_DRAG_HOLD_MS 是图片灯箱"下滑关闭"的手势阈值，跟拖动窗口无关，没动它。 -->
        <div class="tb-head" id="tbHead">
            <!-- 左上角不是标题文字，而是**下载文件名**：它要跟这一栏融为一体。
                 ★ 默认值用**真实文本** value="Untitled"（不是 placeholder）：placeholder 的
                   计算颜色天生跟真实文字不同，而用户要求"默认值与输入值颜色完全一样"。
                   颜色只有一个来源 —— .tb-filename 的 color: var(--text)。
                 ★ 下载名字 = 这里的内容 + ".html"（已有 .html/.htm 后缀就先去掉再加，绝不双后缀）；
                   非法字符与首尾空白由 toolboxCleanFileName() 清洗。
                 ★ title 显示**完整名字**（超长被省略号截断时，悬停就能看全），
                   由 toolboxFileNameSyncTitle() 跟着输入实时同步。 -->
            <input type="text" class="tb-filename" id="tbFileName" value="Untitled"
                   title="Untitled" aria-label="下载文件名" autocomplete="off" spellcheck="false">
            <!-- 全屏 / 小窗：图标是**用户给的那两段内联 SVG**（逐字照抄，只把渲染尺寸收到 17px），
                 不是字体符号、也不是自己画的方框 —— ⛶ / ⤡ 这类字形在不同系统里长得不一样，
                 正是之前观感不对的原因。
                 进入全屏的位置放"四角朝外"的那段（title 全屏），进去之后换成"四角朝内"的那段
                 （title 小窗 / aria-label 退出全屏），切换在 toolbox.js 的 toolboxWinIconPaint()。
                 尺寸、内边距、hover 与右上角「关闭」一致。 -->
            <button type="button" class="tb-btn tb-win" data-tb="fullscreen" id="tbFullBtn"
                    title="全屏" aria-label="全屏"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                    height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path
                    d="M9 4H4v5"/><path d="M15 4h5v5"/><path d="M20 15v5h-5"/><path
                    d="M4 15v5h5"/></svg></button>
            <button type="button" class="tb-close" data-tb="close" title="关闭">×</button>
        </div>

        <!-- 工具栏：固定不滚，随内容滚动的一律在下面 .tb-body 里 -->
        <div class="tb-toolbar">
            <button type="button" class="tb-btn" data-tb="undo" id="tbUndoBtn" title="撤回（Ctrl+Z）">撤回</button>
            <button type="button" class="tb-btn" data-tb="redo" id="tbRedoBtn" title="恢复（Ctrl+Shift+Z / Ctrl+Y）">恢复</button>
            <span class="tb-sep"></span>
            <button type="button" class="tb-btn tb-ic" data-tb="bold" title="加粗（Ctrl+B）">B</button>
            <button type="button" class="tb-btn tb-ic-i" data-tb="italic" title="斜体（Ctrl+I）">I</button>
            <button type="button" class="tb-btn tb-ic-u" data-tb="underline" title="下划线（Ctrl+U）">U</button>
            <button type="button" class="tb-btn tb-ic-s" data-tb="strike" title="删除线">S</button>
            <!-- 上标 / 下标：与加粗/斜体/下划线/删除线同一套"字符级三态开关"
                 （全有→取消、否则→给整个选区补满），可跨段落、结构与 <br> 都不动。 -->
            <button type="button" class="tb-btn" data-tb="sup" title="上标">上标</button>
            <button type="button" class="tb-btn" data-tb="sub" title="下标">下标</button>
            <span class="tb-sep"></span>
            <!-- 字号五档。刻意不用 <select>：原生 select 会被 dropdown.js 接管，而它的
                 弹层是 position:fixed + z-index:900，会落到本弹窗(z-index:1200)下面点不到。 -->
            <span class="tb-sizes" role="group" aria-label="字号">
                <button type="button" class="tb-size" data-tb="size" data-size="0.85rem" title="0.85rem">0.85</button>
                <button type="button" class="tb-size" data-tb="size" data-size="1em" title="1em">1</button>
                <button type="button" class="tb-size" data-tb="size" data-size="1.1em" title="1.1em">1.1</button>
                <button type="button" class="tb-size" data-tb="size" data-size="1.3em" title="1.3em">1.3</button>
                <button type="button" class="tb-size" data-tb="size" data-size="1.6em" title="1.6em">1.6</button>
            </span>
            <span class="tb-sep"></span>
            <!-- 文字颜色 / 背景高亮两个功能已按用户要求**整体删除**（他不需要）：
                 连同取色器 UI、hiliteColor 分支、toolboxHighlight 与相关样式、用例一起清掉了。
                 图注用的 #555555 / 0.85rem 是**固定写法**，不再需要用户选颜色。 -->
            <button type="button" class="tb-btn" data-tb="align-left" title="左对齐">左</button>
            <button type="button" class="tb-btn" data-tb="align-center" title="居中对齐">中</button>
            <button type="button" class="tb-btn" data-tb="align-right" title="右对齐">右</button>
            <span class="tb-sep"></span>
            <button type="button" class="tb-btn" data-tb="title" title="">标题</button>
            <!-- 「正文」= 标题的反操作：把选中的内容恢复成正文（字号回默认、去粗、去居中） -->
            <button type="button" class="tb-btn" data-tb="body" title="">正文</button>
            <button type="button" class="tb-btn" data-tb="quote" title="">引用</button>
            <button type="button" class="tb-btn" data-tb="caption" title="">图注</button>
            <button type="button" class="tb-btn" data-tb="image" title="">图片</button>
            <button type="button" class="tb-btn" data-tb="stack" title="">多图</button>
            <button type="button" class="tb-btn" data-tb="link" title="">链接</button>
            <button type="button" class="tb-btn" data-tb="table" title="">表格</button>
            <span class="tb-sep"></span>
            <button type="button" class="tb-btn tb-primary" data-tb="copy" title="复制HTML代码至剪贴板">复制</button>
            <button type="button" class="tb-btn" data-tb="download" title="将代码下载为.html文件">下载</button>
            <button type="button" class="tb-btn tb-danger" data-tb="cleardraft" title="清空正文并删除草稿">清空</button>
        </div>

        <!-- 主体：左正文、右 HTML，各自独立滚动，中间一条 1px 分隔线。
             两个面板**实时双向同步**：左边写 → 右边出 HTML；右边改 → 左边跟着变。
             两块面板各有一行小标题（正文 / HTML）：面板靠 1px 线分隔，不做"卡片套卡片"。 -->
        <div class="tb-body">
            <div class="tb-pane tb-pane-edit">
                <div class="tb-pane-head">编辑区</div>
                <div class="tb-editor" id="tbEditor" contenteditable="true" spellcheck="false"
                     role="textbox" aria-multiline="true" aria-label="编辑区"
                     data-placeholder="从这里开始……"></div>
            </div>
            <div class="tb-pane tb-pane-code">
                <div class="tb-pane-head">HTML</div>
                <div class="tb-code-wrap">
                    <!-- 行号栏（gutter）：只标**逻辑行**（按 \n 划分）的行号，长行折出来的续行留空。
                         纯显示层：aria-hidden + user-select:none + pointer-events:none，
                         且**不参与任何取值路径** —— 复制/下载/导出永远只读 #tbCode.value，
                         行号一个字符都进不去。 -->
                    <div class="tb-code-gutter" id="tbCodeGutter" aria-hidden="true"><div class="tb-code-gutter-inner" id="tbCodeGutterInner"></div></div>
                    <!-- 行号栏的排版测量层：与代码区**同字体/同字号/同行高/同 tab-size/同 padding**、
                         同宽（左边界与 textarea 一致），visibility:hidden（仍然参与排版，能量出
                         每个逻辑行折行后的真实像素高度）。只测量，不显示、不接收事件、不参与序列化。 -->
                    <div class="tb-code-measure" id="tbCodeMeasure" data-tb-display="1" aria-hidden="true"></div>
                    <!-- 代码区高亮镜像层（纯显示，data-tb-display）：textarea 里的文字没法用
                         CSS Custom Highlight API 画高亮（它的 value 不在 DOM 里），所以这里放一层
                         与 textarea 文字、字号、行高完全一致的镜像，高亮的 Range 画在它上面。
                         它在 textarea 下面、pointer-events:none，不改内容、不动选区。 -->
                    <div class="tb-code-hl" id="tbCodeHl" data-tb-display="1" aria-hidden="true"></div>
                    <textarea class="tb-code" id="tbCode" spellcheck="false" wrap="soft"
                              placeholder="可在此粘贴或编辑HTML代码" aria-label="HTML代码"></textarea>
                </div>
                <!-- 校验区：只提示，不阻断复制/下载。计数同时写在 data-errors/data-warnings 上 -->
                <div class="tb-validate" id="tbValidate" data-errors="0" data-warnings="0"></div>
            </div>
        </div>

        <!-- 底部状态栏：固定，只留字数（别的一律不常驻） -->
        <div class="tb-foot">
            <span class="tb-count"><b id="tbCount">0</b> 字</span>
            <span class="tb-spacer"></span>
            <span id="tbWords" hidden>0</span>
        </div>

        <!-- 提示条 -->
        <div class="tb-toast" id="tbToast"></div>

        <!-- 表格右键小菜单：光标在表格里时右键弹出来（插/删行列、插删单元格、合并/拆分）。
             不常驻一排按钮 —— 界面保持干净；内容由 toolbox.js 按 TOOLBOX_TM_ITEMS 生成。 -->
        <div class="tb-tmenu" id="tbTableMenu" hidden role="menu" aria-label="表格操作"></div>

        <!-- 缩放手柄：四条边 + 四个角（八个方向）。
             ★ 边只改一个维度（右/下拉只改宽/高；左/上拉同时移动窗口原点，对面那条边不动），
               四个角等比缩放（保持按下那一刻的宽高比）。
             ★ 手柄贴在卡片内侧（.tb-card 是 overflow:hidden，往外扩会被自己裁掉点不到），
               .tb-body 留了 6px 右/下内边距，所以东/南手柄不会压住编辑区/代码区的滚动条。
             逻辑用 Pointer Events（鼠标/触摸同一套），见 toolbox.js 的 toolboxBindWindow。 -->
        <div class="tb-grip tb-grip-n" data-tb-grip="n" title=""></div>
        <div class="tb-grip tb-grip-s" data-tb-grip="s" title=""></div>
        <div class="tb-grip tb-grip-w" data-tb-grip="w" title=""></div>
        <div class="tb-grip tb-grip-e" data-tb-grip="e" title=""></div>
        <div class="tb-grip tb-grip-nw" data-tb-grip="nw" title=""></div>
        <div class="tb-grip tb-grip-ne" data-tb-grip="ne" title=""></div>
        <div class="tb-grip tb-grip-sw" data-tb-grip="sw" title=""></div>
        <div class="tb-grip tb-grip-se" data-tb-grip="se" title=""></div>

        <!-- 字段对话框：表格参数 / 图片参数 / 超链接共用这一个浮层 -->
        <div class="tb-dialog" id="tbDialog">
            <div class="tb-dialog-card">
                <div class="tb-dialog-title" id="tbDialogTitle"></div>
                <div class="tb-dialog-body" id="tbDialogBody"></div>
                <div class="tb-dialog-foot">
                    <button type="button" class="tb-btn" id="tbDialogCancel">取消</button>
                    <button type="button" class="tb-btn tb-primary" id="tbDialogOk">确定</button>
                </div>
            </div>
        </div>
    </div>
</div>

     所以既有逻辑和用例一字不用改。逻辑在 dropdown.js，样式在 layout.css 末尾。 -->

<!-- ========== 文章编辑器「工具箱」==========
     弹窗 DOM 写在上面（#toolboxModal，和 #imageModal 同一位置），入口在「我的」页面。
     放在最后加载：它是纯"锦上添花"的功能，晚一点就绪不影响主站任何一条链路；
     initToolboxDOM 里也整段包了 try/catch，抛异常不会连累主站。
     ★ 它不注册任何 Service Worker、不请求任何资源，所以不需要进 sw.js 的资源清单
       （那个清单是"缓存哪些后缀"，不是文件白名单 —— 见 sw.js 的 ASSET_RE）。 -->
<script src="toolbox.js"></script>

<!-- ========== 图片本地缓存（离线可用） ========== -->
<script>
// 注册图片缓存 Service Worker（scope 为 /collection/）
// file:// 直接打开时不注册：Service Worker 需要安全上下文（https / localhost）
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.warn('[sw] 图片缓存注册失败：', e);
    });
}
</script>
