<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答题卡生成器 · Answer Sheet Generator</title>
<meta name="description" content="按毫米级精度生成标准化答题卡，定位块与填涂框严格对齐，支持 A4/A3 与双色/黑白。">

<link rel="stylesheet" href="css/shell.css?v=226">
<link rel="stylesheet" href="css/card.css?v=226">
</head>
<body>

<header class="app-header">
  <div class="app-brand">
    <span class="app-brand-mark"></span>
    <span>答题卡生成器</span>
    <span class="app-brand-sub">定位块与填涂框严格对齐</span>
  </div>
  <div class="app-header-spacer"></div>
  <div class="header-stat">版面 <b id="statFormat">A4</b></div>
  <div class="header-stat">面数 <b id="statFaces">1</b></div>
  <div class="header-stat">选择题 <b id="statChoice">0</b></div>
  <div class="header-stat">非选择题 <b id="statSubj">0</b></div>
</header>

<div class="app-body">

  <!-- ══ 左侧参数面板 ══════════════════════════════════════════════════ -->
  <aside class="app-sidebar">

    <div id="status" class="status"></div>

    <!-- 1 试卷信息 -->
    <section class="panel" data-panel="info">
      <div class="panel-head"><span class="panel-num">1</span>试卷信息<span class="chev">▼</span></div>
      <div class="panel-body">
        <div class="field">
          <label class="field-label" for="cardTitle">考试名称</label>
          <input class="input" id="cardTitle" value="" data-default="" placeholder="例如：2026届高三第一次模拟考试">
        </div>
        <div class="row2">
          <div class="field">
            <label class="field-label" for="cardSubject">科目</label>
            <input class="input" id="cardSubject" value="" data-default="" placeholder="例如：数学">
          </div>
          <div class="field">
            <label class="field-label" for="zkLength">准考证号位数</label>
            <input class="input" id="zkLength" type="number" min="1" max="20" value="9" data-default="9">
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="cardFooter">页脚提示（可选）</label>
          <input class="input" id="cardFooter" value="" data-default="" placeholder="留空则自动生成">
        </div>
      </div>
    </section>

    <!-- 2 版式 -->
    <section class="panel" data-panel="layout">
      <div class="panel-head"><span class="panel-num">2</span>版式与外观<span class="chev">▼</span></div>
      <div class="panel-body">
        <div class="field">
          <label class="field-label">纸张</label>
          <div class="seg" id="segFormat">
            <button type="button" data-val="A4" class="on">A4 纵向</button>
            <button type="button" data-val="A3">A3 横向</button>
          </div>
          <div class="field-hint" id="formatHint">A4 每张 1 面，一行铺满；气泡竖长便于填涂。</div>
        </div>
        <div class="field">
          <label class="field-label">主题配色</label>
          <div class="theme-pick" id="themePick">
            <div class="theme-card on" data-theme="color">
              <div class="theme-swatch" style="color:#d93025">
                <i></i><i class="solid"></i>
              </div>
              <div class="theme-name">双色</div>
            </div>
            <div class="theme-card" data-theme="mono">
              <div class="theme-swatch" style="color:#000">
                <i></i><i class="solid"></i>
              </div>
              <div class="theme-name">黑白</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 3 选择题 -->
    <section class="panel" data-panel="choice">
      <div class="panel-head"><span class="panel-num">3</span>选择题<span class="chev">▼</span></div>
      <div class="panel-body">
        <div class="field">
          <label class="field-label" for="choiceTotal">选择题总题数</label>
          <input class="input" id="choiceTotal" type="number" min="0" max="200" value="" data-default="" placeholder="例如：12">
        </div>
        <div class="field">
          <label class="field-label" for="choiceStart">起始题号</label>
          <input class="input" id="choiceStart" type="number" min="1" value="" data-default="" placeholder="例如：1">
        </div>
        <div class="field-hint">5 题一块，每行 4 块（= 20 题），放满自动换行。</div>
      </div>
    </section>

    <!-- 4 非选择题 -->
    <section class="panel" data-panel="subj">
      <div class="panel-head"><span class="panel-num">4</span>非选择题<span class="chev">▼</span></div>
      <div class="panel-body">
        <div class="field">
          <label class="field-label" for="subjStart">起始题号</label>
          <input class="input" id="subjStart" type="number" min="1" value="" data-default="" placeholder="例如：13">
        </div>
        <div class="row2">
          <div class="field">
            <label class="field-label" for="subjCount">题数</label>
            <input class="input" id="subjCount" type="number" min="0" max="60" value="" data-default="" placeholder="例如：5">
          </div>
          <div class="field">
            <label class="field-label" for="subjScore">分值（可留空）</label>
            <input class="input" id="subjScore" value="" data-default="" placeholder="例如：10,12,12">
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="subjLines">作答行数</label>
          <input class="input" id="subjLines" type="number" min="2" max="60" value="" data-default="" placeholder="例如：8">
        </div>
        <div class="field-hint">题数多于 1 时按题逐块排版，跨页自动拆分。</div>
      </div>
    </section>

    <div class="btn-stack">
      <button class="btn btn-primary" id="btnGenerate">重新生成</button>
      <button class="btn" id="btnPdf" disabled>导出 PDF</button>
      <!-- 参数会自动记住（刷新后还在）。这个按钮把面板恢复成初始的空状态。 -->
      <button class="btn btn-quiet" id="btnClear" title="清空所有已填参数，并忘掉自动保存的内容">清空参数</button>
    </div>

  </aside>

  <!-- ══ 右侧预览 ══════════════════════════════════════════════════════ -->
  <main class="app-preview" id="preview">
    <div class="preview-toolbar">
      <span id="previewInfo">正在生成……</span>
      <div class="zoom">
        <button type="button" id="zoomOut">−</button>
        <span class="zoom-val" id="zoomVal">100%</span>
        <button type="button" id="zoomIn">+</button>
        <button type="button" id="zoomFit" style="width:auto;padding:0 8px">适应</button>
      </div>
    </div>
    <div class="preview-stage" id="stage"></div>
  </main>

</div>

<!-- 依赖：html2pdf（含 html2canvas + jsPDF）
     ⚠ html2pdf 把 jsPDF 打包在自己内部，**不暴露全局** `jspdf`。
       矢量导出要直接调 jsPDF 的绘图 API，所以必须另外引一份 UMD 版。
       两者版本对齐（html2pdf 0.10.1 内嵌的就是 jsPDF 3.x），
       位图导出走 html2pdf、矢量导出走这份 jsPDF，互不干扰。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.4/jspdf.umd.min.js"></script>

<!-- 模块按依赖顺序加载（普通 script，避免 file:// 下的 CORS 限制） -->
<script src="js/config.js?v=226"></script>
<script src="js/geometry.js?v=226"></script>
<script src="js/theme.js?v=226"></script>
<script src="js/marks.js?v=226"></script>
<script src="js/builders/choice.js?v=226"></script>
<script src="js/builders/subject.js?v=226"></script>
<script src="js/builders/page.js?v=226"></script>
<script src="js/builders/noanswer.js?v=226"></script>
<script src="js/paginator.js?v=226"></script>
<script src="js/pdf/measure.js?v=226"></script>
<script src="js/pdf/draw.js?v=226"></script>
<script src="js/pdf/vector.js?v=226"></script>
<script src="js/app.js?v=226"></script>

</body>
</html>
