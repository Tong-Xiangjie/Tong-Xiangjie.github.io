<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>全屏时钟</title>

<!-- 字体预加载：与下面 @font-face 的 src 必须是同一个文件。
     提前建连/取字，配合 </style> 之后那句 document.fonts.load()，
     让 OCR-B 在首帧排版前就绪，避免钟面先按回退字体排一遍再跳一下。 -->
<link rel="preload" as="font" type="font/woff" href="../font/OCRB10PitchBT-Regular.woff" crossorigin>

<!-- 提前应用主题，避免刷新时白屏闪烁 -->
<script>
    try {
        if (localStorage.getItem('clockTheme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    } catch (e) {}
</script>

<style>
    /* ═══ 自定义西文字体：OCR-B ═══ */
    @font-face {
        font-family: "OCRB10";
        src: url('../font/OCRB10PitchBT-Regular.woff') format('woff');
        font-weight: normal;
        font-style: normal;
        /* 这一页整屏内容就是 OCR-B 数字（钟面 min(15vw,28vh)），
           回退字体排一遍再换字 = 全屏数字宽度跳 +108.71px，是"跳一下"最刺眼的形态，
           而页面上没有别的正文要看，所以选 block：宁可等字体到了再画，也不先画错字体。
           实测（字体人为延迟 1.5s）：swap 会在回退字体上先画一遍再跳，block 全程不画错字体。 */
        font-display: block;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* ═══ 主题变量（浅色为默认） ═══ */
    :root {
        --bg:        #f5f7fa;
        --fg:        #1a2634;
        --muted:     rgba(26, 38, 52, 0.60);
        --faint:     rgba(26, 38, 52, 0.38);
        --hover:     rgba(26, 38, 52, 0.08);
    }

    :root.dark-mode {
        --bg:        #0a0e12;
        --fg:        #eef2ff;
        --muted:     rgba(238, 242, 255, 0.58);
        --faint:     rgba(238, 242, 255, 0.32);
        --hover:     rgba(238, 242, 255, 0.10);
    }

    html {
        height: 100%;
        background: var(--bg);
        transition: background-color 0.35s ease;
    }

    body {
        min-height: 100%;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: "OCRB10", "Source Han Sans", "Noto Sans CJK SC",
                     "思源黑体", "Segoe UI", system-ui, -apple-system, sans-serif;
        transition: background-color 0.35s ease, color 0.35s ease;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* ═══ 主舞台：时间 + 日期，垂直水平居中 ═══ */
    .stage {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        text-align: center;
    }

    /* 超大时间显示 */
    .time-display {
        font-size: min(15vw, 28vh);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.01em;
        white-space: nowrap;
        transform: scaleX(0.92);
        transform-origin: center center;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1;
    }

    .time-display .sep {
        opacity: 0.75;
    }

    /* AM / PM 标识 */
    .ampm {
        display: none;
        font-size: 0.26em;
        font-weight: 500;
        letter-spacing: 0.08em;
        margin-left: 0.35em;
        vertical-align: baseline;
        opacity: 0.7;
    }

    .ampm.show {
        display: inline-block;
    }

    /* 公历日期 + 星期 */
    .date-area {
        margin-top: clamp(0.8rem, 2.5vh, 1.8rem);
        font-size: clamp(0.95rem, 2.4vw, 1.55rem);
        font-weight: 400;
        letter-spacing: 0.1em;
        color: var(--muted);
    }

    /* 农历日期 */
    .lunar-date {
        margin-top: clamp(0.3rem, 1vh, 0.7rem);
        font-size: clamp(0.78rem, 1.7vw, 1.1rem);
        font-weight: 400;
        letter-spacing: 0.12em;
        color: var(--faint);
    }

    /* ═══ 底部区域：按钮 + 脚注 ═══ */
    .bottom {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(0.6rem, 1.6vh, 1.1rem);
        padding: 0 1rem clamp(0.9rem, 2.4vh, 1.6rem);
    }

    .controls {
        display: flex;
        justify-content: center;
        gap: 0.4rem;
        flex-wrap: wrap;
    }

    /* 扁平化按钮：无边框、无阴影 */
    .mode-btn {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--muted);
        font-family: inherit;
        font-size: clamp(0.72rem, 1.5vw, 0.85rem);
        font-weight: 500;
        letter-spacing: 0.08em;
        padding: 0.5rem 1rem;
        border-radius: 999px;
        cursor: pointer;
        transition: background-color 0.2s ease, color 0.2s ease, transform 0.12s ease;
    }

    .mode-btn:hover {
        background: var(--hover);
        color: var(--fg);
    }

    .mode-btn:active {
        transform: scale(0.96);
    }

    .mode-btn:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
    }

    /* 脚注 */
    .footer {
        text-align: center;
        line-height: 1.7;
        color: var(--faint);
        font-size: clamp(0.62rem, 1.3vw, 0.75rem);
        letter-spacing: 0.05em;
    }

    .footer-line:last-child {
        opacity: 0.72;
    }

    /* ═══ 小屏幕适配 ═══ */
    @media (max-width: 550px) {
        .date-area {
            letter-spacing: 0.06em;
        }
        .lunar-date {
            letter-spacing: 0.08em;
        }
        .mode-btn {
            padding: 0.45rem 0.85rem;
        }
    }
</style>
<!-- 提前把 OCR-B 拉起来（必须放在定义 @font-face 的样式表**之后**，
     否则 CSSOM 里还没有这条规则，load() 会解析成空家族名直接 resolve）。
     与 preload 的区别：preload 只取字节，load() 还会驱动 FontFace 的解析与"就绪"，
     让它赶在首帧排版之前完成。写错也不影响页面，只回退成"迟一拍"。 -->
<script>try{if(document.fonts&&document.fonts.load)document.fonts.load('1em "OCRB10"');}catch(e){}</script>
</head>
<body>

<main class="stage">
    <!-- 超大时钟：时:分:秒 -->
    <div class="time-display" id="timeDisplay"><span id="hours">00</span><span class="sep">:</span><span id="minutes">00</span><span class="sep">:</span><span id="seconds">00</span><span class="ampm" id="ampm"></span></div>

    <!-- 公历日期 + 星期 -->
    <div class="date-area" id="gregorianDate"></div>

    <!-- 农历日期 -->
    <div class="lunar-date" id="lunarDate"></div>
</main>

<div class="bottom">
    <div class="controls">
        <button class="mode-btn" id="themeToggleBtn" type="button">深色模式</button>
        <button class="mode-btn" id="toggleFormatBtn" type="button">12小时制</button>
    </div>

    <div class="footer">
        <div class="footer-line">网页建立时间：2026年4月5日</div>
        <div class="footer-line">&copy; 2026 铜香结 版权所有</div>
        <div class="footer-line">Powered by GitHub Pages</div>
    </div>
</div>

<script>
(function () {
    'use strict';

    /* ══════════════════════════════════════════
       农历数据（1900–2100，共 201 项）
       每项 20 位：
         bit 16      → 闰月大小（1=30天，0=29天）
         bit 15..4   → 12 个常规月大小（1=30天，0=29天）
         bit 3..0    → 闰月月份（0=无闰月）
       ══════════════════════════════════════════ */
    var lunarInfo = [
        0x04bd8, 0x04ae0, 0x0a570, 0x054d5, 0x0d260, 0x0d950, 0x16554, 0x056a0, 0x09ad0, 0x055d2, // 1900-1909
        0x04ae0, 0x0a5b6, 0x0a4d0, 0x0d250, 0x1d255, 0x0b540, 0x0d6a0, 0x0ada2, 0x095b0, 0x14977, // 1910-1919
        0x04970, 0x0a4b0, 0x0b4b5, 0x06a50, 0x06d40, 0x1ab54, 0x02b60, 0x09570, 0x052f2, 0x04970, // 1920-1929
        0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c950, // 1930-1939
        0x0d4a0, 0x1d8a6, 0x0b550, 0x056a0, 0x1a5b4, 0x025d0, 0x092d0, 0x0d2b2, 0x0a950, 0x0b557, // 1940-1949
        0x06ca0, 0x0b550, 0x15355, 0x04da0, 0x0a5b0, 0x14573, 0x052b0, 0x0a9a8, 0x0e950, 0x06aa0, // 1950-1959
        0x0aea6, 0x0ab50, 0x04b60, 0x0aae4, 0x0a570, 0x05260, 0x0f263, 0x0d950, 0x05b57, 0x056a0, // 1960-1969
        0x096d0, 0x04dd5, 0x04ad0, 0x0a4d0, 0x0d4d4, 0x0d250, 0x0d558, 0x0b540, 0x0b6a0, 0x195a6, // 1970-1979
        0x095b0, 0x049b0, 0x0a974, 0x0a4b0, 0x0b27a, 0x06a50, 0x06d40, 0x0af46, 0x0ab60, 0x09570, // 1980-1989
        0x04af5, 0x04970, 0x064b0, 0x074a3, 0x0ea50, 0x06b58, 0x055c0, 0x0ab60, 0x096d5, 0x092e0, // 1990-1999
        0x0c960, 0x0d954, 0x0d4a0, 0x0da50, 0x07552, 0x056a0, 0x0abb7, 0x025d0, 0x092d0, 0x0cab5, // 2000-2009
        0x0a950, 0x0b4a0, 0x0baa4, 0x0ad50, 0x055d9, 0x04ba0, 0x0a5b0, 0x15176, 0x052b0, 0x0a930, // 2010-2019
        0x07954, 0x06aa0, 0x0ad50, 0x05b52, 0x04b60, 0x0a6e6, 0x0a4e0, 0x0d260, 0x0ea65, 0x0d530, // 2020-2029
        0x05aa0, 0x076a3, 0x096d0, 0x04afb, 0x04ad0, 0x0a4d0, 0x1d0b6, 0x0d250, 0x0d520, 0x0dd45, // 2030-2039
        0x0b5a0, 0x056d0, 0x055b2, 0x049b0, 0x0a577, 0x0a4b0, 0x0aa50, 0x1b255, 0x06d20, 0x0ada0, // 2040-2049
        0x14b63, 0x09370, 0x049f8, 0x04970, 0x064b0, 0x168a6, 0x0ea50, 0x06b20, 0x1a6c4, 0x0aae0, // 2050-2059
        0x0a2e0, 0x0d2e3, 0x0c960, 0x0d557, 0x0d4a0, 0x0da50, 0x05d55, 0x056a0, 0x0a6d0, 0x055d4, // 2060-2069
        0x052d0, 0x0a9b8, 0x0a950, 0x0b4a0, 0x0b6a6, 0x0ad50, 0x055a0, 0x0aba4, 0x0a5b0, 0x052b0, // 2070-2079
        0x0b273, 0x06930, 0x07337, 0x06aa0, 0x0ad50, 0x14b55, 0x04b60, 0x0a570, 0x054e4, 0x0d160, // 2080-2089
        0x0e968, 0x0d520, 0x0daa0, 0x16aa6, 0x056d0, 0x04ae0, 0x0a9d4, 0x0a2d0, 0x0d150, 0x0f252, // 2090-2099
        0x0d520                                                                                  // 2100
    ];

    var lunarMonthNames = ['正月', '二月', '三月', '四月', '五月', '六月',
                           '七月', '八月', '九月', '十月', '十一月', '十二月'];

    var lunarDayNames = ['初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
                         '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
                         '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];

    var ganArr = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
    var zhiArr = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

    /* ── 农历基础工具 ── */

    // 某年闰月月份（0 表示无闰月）
    function leapMonth(y) {
        return lunarInfo[y - 1900] & 0xf;
    }

    // 某年闰月天数（0 表示无闰月）
    function leapDays(y) {
        if (leapMonth(y)) {
            return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29;
        }
        return 0;
    }

    // 某年某常规月的天数（29 或 30）
    function monthDays(y, m) {
        return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29;
    }

    // 某农历年的总天数
    function yearDays(y) {
        var sum = 348; // 12 个月最少 29 天
        for (var i = 0x8000; i > 0x8; i >>= 1) {
            sum += (lunarInfo[y - 1900] & i) ? 1 : 0;
        }
        return sum + leapDays(y);
    }

    /* ── 公历 → 农历（含正确的闰月处理） ── */
    function solarToLunar(y, m, d) {
        // 以 1900-01-31 为农历 1900 年正月初一，用 UTC 避免时区/夏令时误差
        var offset = Math.floor(
            (Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000
        );

        var i, temp = 0;

        // 1. 定位农历年
        for (i = 1900; i < 2101 && offset > 0; i++) {
            temp = yearDays(i);
            offset -= temp;
        }
        if (offset < 0) {
            offset += temp;
            i--;
        }

        var lunarYear = i;

        // 2. 定位农历月（关键：闰月排在常规月之后）
        var leap = leapMonth(lunarYear);
        var isLeap = false;
        var j;

        for (j = 1; j < 13 && offset > 0; j++) {
            if (leap > 0 && j === leap + 1 && !isLeap) {
                // 到达闰月位置：先退回常规月索引
                --j;
                isLeap = true;
                temp = leapDays(lunarYear);
            } else {
                temp = monthDays(lunarYear, j);
            }
            // 闰月结束后解除标记
            if (isLeap && j === leap + 1) {
                isLeap = false;
            }
            offset -= temp;
        }

        // 3. 边界修正（恰好落在闰月起始等特殊情况）
        if (offset === 0 && leap > 0 && j === leap + 1) {
            if (isLeap) {
                isLeap = false;
            } else {
                isLeap = true;
                --j;
            }
        }
        if (offset < 0) {
            offset += temp;
            --j;
        }

        return {
            year:   lunarYear,
            month:  j,
            day:    offset + 1,
            isLeap: isLeap
        };
    }

    /* ── 生成农历字符串（干支 + 闰月 + 月日） ── */
    function getLunarDateString(y, m, d) {
        if (y < 1900 || y > 2100) return '';

        var l = solarToLunar(y, m, d);
        var monthName = lunarMonthNames[l.month - 1];
        var dayName = lunarDayNames[l.day - 1];

        // 1900 年为庚子年：庚 index 6，子 index 0
        var offsetYears = l.year - 1900;
        var ganzhi = ganArr[(6 + offsetYears) % 10] + zhiArr[(offsetYears) % 12];

        return ganzhi + '年' + (l.isLeap ? '闰' : '') + monthName + dayName;
    }

    /* ══════════════════════════════════════════
       时钟逻辑
       ══════════════════════════════════════════ */

    var is24Hour = true;

    var hoursEl       = document.getElementById('hours');
    var minutesEl     = document.getElementById('minutes');
    var secondsEl     = document.getElementById('seconds');
    var ampmEl        = document.getElementById('ampm');
    var gregorianEl   = document.getElementById('gregorianDate');
    var lunarEl       = document.getElementById('lunarDate');
    var themeToggleBtn = document.getElementById('themeToggleBtn');
    var formatToggleBtn = document.getElementById('toggleFormatBtn');

    var WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

    function pad2(n) {
        return n < 10 ? '0' + n : '' + n;
    }

    function updateClock() {
        var now = new Date();
        var h24 = now.getHours();
        var m   = now.getMinutes();
        var s   = now.getSeconds();

        // 小时（按制式）
        var displayHour = is24Hour ? h24 : (h24 % 12 || 12);
        hoursEl.textContent   = pad2(displayHour);
        minutesEl.textContent = pad2(m);
        secondsEl.textContent = pad2(s);

        // AM / PM
        if (is24Hour) {
            ampmEl.classList.remove('show');
            ampmEl.textContent = '';
        } else {
            ampmEl.textContent = h24 >= 12 ? 'PM' : 'AM';
            ampmEl.classList.add('show');
        }

        // 公历日期 + 星期
        var year  = now.getFullYear();
        var month = now.getMonth() + 1;
        var date  = now.getDate();
        gregorianEl.textContent =
            year + '年' + month + '月' + date + '日  ' + WEEKDAYS[now.getDay()];

        // 农历
        var lunarStr = getLunarDateString(year, month, date);
        lunarEl.textContent = lunarStr ? '农历' + lunarStr : '';
    }

    /* 自校正调度：每次都在整秒边界触发，长期运行不漂移 */
    function tick() {
        updateClock();
        var delay = 1000 - (Date.now() % 1000);
        setTimeout(tick, delay);
    }

    /* ══════════════════════════════════════════
       主题切换
       ══════════════════════════════════════════ */

    function setTheme(mode) {
        var isDark = (mode === 'dark');
        document.documentElement.classList.toggle('dark-mode', isDark);
        themeToggleBtn.textContent = isDark ? '浅色模式' : '深色模式';
        try {
            localStorage.setItem('clockTheme', isDark ? 'dark' : 'light');
        } catch (e) {}
    }

    /* ══════════════════════════════════════════
       时间制式切换
       ══════════════════════════════════════════ */

    function updateFormatButton() {
        formatToggleBtn.textContent = is24Hour ? '12小时制' : '24小时制';
    }

    /* ══════════════════════════════════════════
       初始化
       ══════════════════════════════════════════ */

    function init() {
        // 主题
        var savedTheme = 'light';
        try {
            savedTheme = localStorage.getItem('clockTheme') || 'light';
        } catch (e) {}
        setTheme(savedTheme === 'dark' ? 'dark' : 'light');

        // 时间制式
        var savedFormat = '24';
        try {
            savedFormat = localStorage.getItem('timeFormat') || '24';
        } catch (e) {}
        is24Hour = (savedFormat !== '12');
        updateFormatButton();

        // 启动时钟
        tick();

        // 事件绑定
        themeToggleBtn.addEventListener('click', function () {
            var isDark = document.documentElement.classList.contains('dark-mode');
            setTheme(isDark ? 'light' : 'dark');
        });

        formatToggleBtn.addEventListener('click', function () {
            is24Hour = !is24Hour;
            try {
                localStorage.setItem('timeFormat', is24Hour ? '24' : '12');
            } catch (e) {}
            updateFormatButton();
            updateClock();
        });
    }

    init();
})();
</script>

</body>
</html>
