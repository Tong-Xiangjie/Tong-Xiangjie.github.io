<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>全屏时钟</title>

<link rel="preload" as="font" type="font/woff" href="../font/OCRB10PitchBT-Regular.woff" crossorigin>

<script>
    try {
        var _theme  = localStorage.getItem('clockTheme');
        var _liquid = localStorage.getItem('clockLiquid');
        var _root   = document.documentElement;
        _root.classList.add(_theme === 'dark' ? 'theme-dark' : 'theme-light');
        if (_liquid === 'on') _root.classList.add('liquid');
    } catch (e) {}
</script>

<style>
    /* ═══ @property：可过渡颜色变量 ═══ */
    @property --aur1 { syntax: '<color>'; inherits: false; initial-value: rgba(0, 229, 255, .40); }
    @property --aur2 { syntax: '<color>'; inherits: false; initial-value: rgba(255, 61, 129, .40); }
    @property --aur3 { syntax: '<color>'; inherits: false; initial-value: rgba(122, 0, 255, .34); }

    @property --o1a { syntax: '<color>'; inherits: false; initial-value: #ff3d81; }
    @property --o1b { syntax: '<color>'; inherits: false; initial-value: #7a00ff; }
    @property --o2a { syntax: '<color>'; inherits: false; initial-value: #00e5ff; }
    @property --o2b { syntax: '<color>'; inherits: false; initial-value: #0047ff; }
    @property --o3a { syntax: '<color>'; inherits: false; initial-value: #ffd166; }
    @property --o3b { syntax: '<color>'; inherits: false; initial-value: #ff7a00; }
    @property --o4a { syntax: '<color>'; inherits: false; initial-value: #5cffb1; }
    @property --o4b { syntax: '<color>'; inherits: false; initial-value: #00c2a8; }
    @property --o5a { syntax: '<color>'; inherits: false; initial-value: #ff8ae2; }
    @property --o5b { syntax: '<color>'; inherits: false; initial-value: #b400ff; }

    @property --gg1 { syntax: '<color>'; inherits: false; initial-value: rgba(255, 255, 255, .14); }
    @property --gg2 { syntax: '<color>'; inherits: false; initial-value: rgba(255, 255, 255, .04); }
    @property --gg3 { syntax: '<color>'; inherits: false; initial-value: rgba(255, 255, 255, .02); }
    @property --gg4 { syntax: '<color>'; inherits: false; initial-value: rgba(255, 255, 255, .10); }

    @property --ge1 { syntax: '<color>'; inherits: false; initial-value: rgba(255, 255, 255, .95); }
    @property --ge2 { syntax: '<color>'; inherits: false; initial-value: rgba(255, 255, 255, .10); }
    @property --ge3 { syntax: '<color>'; inherits: false; initial-value: rgba(255, 255, 255, .02); }
    @property --ge4 { syntax: '<color>'; inherits: false; initial-value: rgba(255, 255, 255, .85); }

    @property --time-a { syntax: '<color>'; inherits: true; initial-value: #1a2634; }
    @property --time-b { syntax: '<color>'; inherits: true; initial-value: #1a2634; }
    @property --time-shadow { syntax: '<color>'; inherits: true; initial-value: transparent; }

    @font-face {
        font-family: "OCRB10";
        src: url('../font/OCRB10PitchBT-Regular.woff') format('woff');
        font-weight: normal;
        font-style: normal;
        font-display: block;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg:    #f5f7fa;
        --fg:    #1a2634;
        --muted: rgba(26, 38, 52, 0.60);
        --faint: rgba(26, 38, 52, 0.38);
        --hover: rgba(26, 38, 52, 0.08);

        --time-a: #1a2634;
        --time-b: #1a2634;
        --time-shadow: transparent;
        --time-ampm-color: rgba(26, 38, 52, 0.70);
    }
    :root.theme-dark {
        --bg:    #0a0e12;
        --fg:    #eef2ff;
        --muted: rgba(238, 242, 255, 0.58);
        --faint: rgba(238, 242, 255, 0.32);
        --hover: rgba(238, 242, 255, 0.10);

        --time-a: #eef2ff;
        --time-b: #eef2ff;
        --time-shadow: transparent;
        --time-ampm-color: rgba(238, 242, 255, 0.70);
    }
    :root.theme-light.liquid {
        --time-a: #16253c;
        --time-b: rgba(22, 37, 60, .72);
        --time-shadow: rgba(120, 160, 220, .22);
        --time-ampm-color: rgba(22, 37, 60, .72);
    }
    :root.theme-dark.liquid {
        --time-a: #ffffff;
        --time-b: rgba(255, 255, 255, .68);
        --time-shadow: rgba(150, 210, 255, .30);
        --time-ampm-color: rgba(255, 255, 255, .75);
    }

    html {
        height: 100%;
        background: var(--bg);
        transition: background-color 0.7s ease;
    }

    body {
        min-height: 100%;
        min-height: 100svh;
        display: flex;
        padding: clamp(12px, 2.5vmin, 28px);
        overflow: hidden;
        position: relative;
        background: var(--bg);
        color: var(--fg);
        font-family: "OCRB10", "Source Han Sans", "Noto Sans CJK SC",
                     "思源黑体", "Segoe UI", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 0.7s ease, color 0.5s ease;
    }

    .backdrop {
        position: fixed;
        inset: -22vmax;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.7s ease, visibility 0s linear 0.7s;
        will-change: transform;
    }
    html.liquid .backdrop {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.7s ease, visibility 0s linear 0s;
    }

    .liquid-base {
        position: absolute;
        inset: 0;
        background:
            radial-gradient(130% 110% at 50% 0%, #ffffff 0%, #f4f8ff 52%, #fdf5fa 100%);
        opacity: 0;
        transition: opacity 0.7s ease;
        pointer-events: none;
    }
    html.theme-light.liquid .liquid-base {
        opacity: 1;
    }

    .aurora {
        position: absolute;
        inset: -25%;
        background:
            radial-gradient(38% 38% at 28% 32%, var(--aur1), transparent 70%),
            radial-gradient(34% 34% at 72% 62%, var(--aur2), transparent 70%),
            radial-gradient(46% 46% at 52% 46%, var(--aur3), transparent 72%);
        filter: blur(50px);
        opacity: 1;
        mix-blend-mode: normal;
        animation: aurora-spin 44s linear infinite;
        will-change: transform;
        transition:
            --aur1 0.7s ease, --aur2 0.7s ease, --aur3 0.7s ease,
            filter 0.7s ease, opacity 0.7s ease;
    }
    html.theme-dark.liquid .aurora {
        --aur1: rgba(0, 229, 255, .40);
        --aur2: rgba(255, 61, 129, .40);
        --aur3: rgba(122, 0, 255, .34);
    }
    html.theme-light.liquid .aurora {
        --aur1: rgba(130, 190, 255, .55);
        --aur2: rgba(255, 160, 200, .50);
        --aur3: rgba(170, 150, 255, .40);
        filter: blur(80px);
        opacity: .72;
    }

    @keyframes aurora-spin {
        from { transform: rotate(0deg)   scale(1.05); }
        to   { transform: rotate(360deg) scale(1.18); }
    }

    .sweep {
        position: absolute;
        inset: -30%;
        background: linear-gradient(115deg,
            transparent 42%,
            rgba(255, 255, 255, .07) 50%,
            transparent 58%);
        background-size: 220% 220%;
        mix-blend-mode: screen;
        animation: sweep 16s ease-in-out infinite;
        will-change: background-position;
    }
    html.theme-light.liquid .sweep {
        mix-blend-mode: soft-light;
        background: linear-gradient(115deg,
            transparent 40%,
            rgba(255, 255, 255, .85) 50%,
            transparent 60%);
        background-size: 220% 220%;
    }
    @keyframes sweep {
        0%   { background-position:   0%   0%; }
        50%  { background-position: 100% 100%; }
        100% { background-position:   0%   0%; }
    }

    .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: .85;
        mix-blend-mode: normal;
        will-change: transform;
        transition:
            --o1a 0.7s ease, --o1b 0.7s ease,
            --o2a 0.7s ease, --o2b 0.7s ease,
            --o3a 0.7s ease, --o3b 0.7s ease,
            --o4a 0.7s ease, --o4b 0.7s ease,
            --o5a 0.7s ease, --o5b 0.7s ease,
            opacity 0.7s ease;
    }
    html.theme-light.liquid .orb {
        opacity: .72;
    }

    .orb-1 {
        width: 55vmax; height: 55vmax;
        background: radial-gradient(circle at 35% 35%, var(--o1a), var(--o1b) 55%, transparent 70%);
        top: -12vmax; left: -14vmax;
    }
    html.theme-dark.liquid .orb-1  { --o1a: #ff3d81; --o1b: #7a00ff; }
    html.theme-light.liquid .orb-1 { --o1a: #3d8eff; --o1b: #5aa6ff; }

    .orb-2 {
        width: 50vmax; height: 50vmax;
        background: radial-gradient(circle at 60% 40%, var(--o2a), var(--o2b) 55%, transparent 72%);
        bottom: -18vmax; right: -12vmax;
    }
    html.theme-dark.liquid .orb-2  { --o2a: #00e5ff; --o2b: #0047ff; }
    html.theme-light.liquid .orb-2 { --o2a: #ff5c96; --o2b: #ff7fae; }

    .orb-3 {
        width: 36vmax; height: 36vmax;
        background: radial-gradient(circle at 50% 50%, var(--o3a), var(--o3b) 55%, transparent 72%);
        top: 42%; left: 46%;
        margin-left: -18vmax;
        margin-top: -18vmax;
    }
    html.theme-dark.liquid .orb-3  { --o3a: #ffd166; --o3b: #ff7a00; }
    html.theme-light.liquid .orb-3 { --o3a: #22d4a0; --o3b: #4ae2b4; }

    .orb-4 {
        width: 26vmax; height: 26vmax;
        background: radial-gradient(circle at 50% 50%, var(--o4a), var(--o4b) 55%, transparent 72%);
        top: -6vmax; right: 6vmax;
    }
    html.theme-dark.liquid .orb-4  { --o4a: #5cffb1; --o4b: #00c2a8; }
    html.theme-light.liquid .orb-4 { --o4a: #8d6bff; --o4b: #a78bff; }

    .orb-5 {
        width: 30vmax; height: 30vmax;
        background: radial-gradient(circle at 50% 50%, var(--o5a), var(--o5b) 55%, transparent 72%);
        bottom: -6vmax; left: 4vmax;
    }
    html.theme-dark.liquid .orb-5  { --o5a: #ff8ae2; --o5b: #b400ff; }
    html.theme-light.liquid .orb-5 { --o5a: #ff9638; --o5b: #ffb15c; }

    .particles {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.7s ease, visibility 0s linear 0.7s;
    }
    html.liquid .particles {
        opacity: .72;
        visibility: visible;
        transition: opacity 0.7s ease, visibility 0s linear 0s;
    }
    html.theme-light.liquid .particles { opacity: .50; }

    .cursor-glow {
        position: fixed;
        left: 0; top: 0;
        width: 460px; height: 460px;
        margin: -230px 0 0 -230px;
        border-radius: 50%;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(circle,
            rgba(80, 190, 255, .22) 0%,
            rgba(120, 90, 255, .10) 42%,
            transparent 68%);
        filter: blur(22px);
        mix-blend-mode: screen;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.7s ease, visibility 0s linear 0.7s;
        will-change: transform;
    }
    html.theme-light.liquid .cursor-glow {
        background: radial-gradient(circle,
            rgba(140, 190, 255, .28) 0%,
            rgba(200, 170, 255, .14) 42%,
            transparent 68%);
        mix-blend-mode: normal;
        filter: blur(24px);
    }
    html.liquid .cursor-glow {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.7s ease, visibility 0s linear 0s;
    }

    .glass-shell {
        position: relative;
        z-index: 2;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        isolation: isolate;
        border-radius: clamp(20px, 3vmin, 36px);
        padding: clamp(16px, 3vmin, 40px) clamp(16px, 3.4vw, 48px);
        transform: perspective(1600px)
                   rotateX(var(--rx, 0deg))
                   rotateY(var(--ry, 0deg));
        transition: transform 0.4s cubic-bezier(.22, 1, .36, 1);
    }

    .glass-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        border-radius: inherit;
        background: linear-gradient(140deg,
            var(--gg1) 0%,
            var(--gg2) 45%,
            var(--gg3) 60%,
            var(--gg4) 100%);
        -webkit-backdrop-filter: blur(24px) saturate(190%) brightness(1.02);
                backdrop-filter: blur(24px) saturate(190%) brightness(1.02);
        opacity: 0;
        visibility: hidden;
        transition:
            opacity 0.5s ease, visibility 0s linear 0.5s,
            --gg1 0.6s ease, --gg2 0.6s ease, --gg3 0.6s ease, --gg4 0.6s ease,
            box-shadow 0.6s ease;
        pointer-events: none;
    }
    html.liquid .glass-shell::before {
        opacity: 1;
        visibility: visible;
        transition:
            opacity 0.5s ease, visibility 0s linear 0s,
            --gg1 0.6s ease, --gg2 0.6s ease, --gg3 0.6s ease, --gg4 0.6s ease,
            box-shadow 0.6s ease;
    }

    html.theme-dark.liquid .glass-shell::before {
        --gg1: rgba(255, 255, 255, .14);
        --gg2: rgba(255, 255, 255, .04);
        --gg3: rgba(255, 255, 255, .02);
        --gg4: rgba(255, 255, 255, .10);
        box-shadow:
            0 40px 90px -40px rgba(0, 0, 0, .85),
            0 12px 30px -14px rgba(0, 0, 0, .60),
            inset 0 1px 0 rgba(255, 255, 255, .70),
            inset 0 -1px 1px rgba(255, 255, 255, .20),
            inset 0 0 80px rgba(255, 255, 255, .05);
    }

    html.theme-light.liquid .glass-shell::before {
        --gg1: rgba(255, 255, 255, .38);
        --gg2: rgba(255, 255, 255, .16);
        --gg3: rgba(255, 255, 255, .12);
        --gg4: rgba(255, 255, 255, .34);
        box-shadow:
            0 40px 90px -40px rgba(150, 190, 255, .26),
            0 12px 30px -14px rgba(150, 190, 255, .18),
            inset 0 1px 0 rgba(255, 255, 255, 1),
            inset 0 -1px 1px rgba(255, 255, 255, .60),
            inset 0 0 80px rgba(255, 255, 255, .26);
    }

    .glass-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 3;
        border-radius: inherit;
        padding: 1.5px;
        background: linear-gradient(140deg,
            var(--ge1) 0%,
            var(--ge2) 25%,
            var(--ge3) 50%,
            var(--ge2) 75%,
            var(--ge4) 100%);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
                mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                mask-composite: exclude;
        opacity: 0;
        visibility: hidden;
        transition:
            opacity 0.5s ease, visibility 0s linear 0.5s,
            --ge1 0.6s ease, --ge2 0.6s ease, --ge3 0.6s ease, --ge4 0.6s ease;
        pointer-events: none;
    }
    html.liquid .glass-shell::after {
        opacity: 1;
        visibility: visible;
        transition:
            opacity 0.5s ease, visibility 0s linear 0s,
            --ge1 0.6s ease, --ge2 0.6s ease, --ge3 0.6s ease, --ge4 0.6s ease;
    }

    html.theme-dark.liquid .glass-shell::after {
        --ge1: rgba(255, 255, 255, .95);
        --ge2: rgba(255, 255, 255, .10);
        --ge3: rgba(255, 255, 255, .02);
        --ge4: rgba(255, 255, 255, .85);
    }
    html.theme-light.liquid .glass-shell::after {
        --ge1: rgba(255, 255, 255, 1);
        --ge2: rgba(255, 255, 255, .55);
        --ge3: rgba(255, 255, 255, .25);
        --ge4: rgba(255, 255, 255, .98);
    }

    .glass-reflect {
        position: absolute;
        inset: 0;
        z-index: 1;
        border-radius: inherit;
        background: radial-gradient(
            600px circle at var(--mx, 50%) var(--my, 0%),
            rgba(255, 255, 255, .30),
            rgba(255, 255, 255, .06) 38%,
            transparent 66%);
        mix-blend-mode: screen;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease, visibility 0s linear 0.4s;
        pointer-events: none;
    }
    html.theme-light.liquid .glass-reflect {
        background: radial-gradient(
            620px circle at var(--mx, 50%) var(--my, 0%),
            rgba(255, 255, 255, .80),
            rgba(255, 255, 255, .22) 38%,
            transparent 66%);
        mix-blend-mode: normal;
    }
    html.liquid .glass-shell:hover .glass-reflect {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.4s ease, visibility 0s linear 0s;
    }
    html.theme-light.liquid .glass-shell:hover .glass-reflect { opacity: .70; }

    .shell-inner {
        position: relative;
        z-index: 2;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
    }

    .stage {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .time-display {
        font-size: min(15vw, 28vh);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.01em;
        white-space: nowrap;
        transform: scaleX(0.92);
        transform-origin: center center;
        font-variant-numeric: tabular-nums;
        font-feature-settings: "tnum" 1;

        background-image: linear-gradient(180deg, var(--time-a), var(--time-b));
        -webkit-background-clip: text;
                background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 16px var(--time-shadow));

        transition:
            --time-a 0.6s ease,
            --time-b 0.6s ease,
            --time-shadow 0.6s ease;
    }

    .time-display .sep { opacity: 0.75; }

    .ampm {
        display: none;
        font-size: 0.26em;
        font-weight: 500;
        letter-spacing: 0.08em;
        margin-left: 0.35em;
        vertical-align: baseline;
        opacity: 0.7;
        color: var(--time-ampm-color);
        -webkit-text-fill-color: currentColor;
        transition: color 0.6s ease;
    }
    .ampm.show { display: inline-block; }

    .date-area {
        margin-top: clamp(0.8rem, 2.5vh, 1.8rem);
        font-size: clamp(0.95rem, 2.4vw, 1.55rem);
        font-weight: 400;
        letter-spacing: 0.1em;
        color: var(--muted);
        transition: color 0.5s ease, text-shadow 0.5s ease;
    }
    .lunar-date {
        margin-top: clamp(0.3rem, 1vh, 0.7rem);
        font-size: clamp(0.78rem, 1.7vw, 1.1rem);
        font-weight: 400;
        letter-spacing: 0.12em;
        color: var(--faint);
        transition: color 0.5s ease, text-shadow 0.5s ease;
    }
    html.liquid.theme-dark .date-area,
    html.liquid.theme-dark .lunar-date {
        text-shadow: 0 1px 14px rgba(0, 0, 0, .35);
    }
    html.liquid.theme-light .date-area  { color: rgba(22, 37, 60, .72); }
    html.liquid.theme-light .lunar-date { color: rgba(22, 37, 60, .50); }

    .bottom {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(0.6rem, 1.6vh, 1.1rem);
        padding-top: clamp(0.8rem, 2vh, 1.4rem);
    }

    .controls {
        display: flex;
        justify-content: center;
        gap: 0.4rem;
        flex-wrap: wrap;
    }

    .mode-btn {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--muted);
        font-family: inherit;
        font-size: clamp(0.72rem, 1.5vw, 0.85rem);
        font-weight: 500;
        letter-spacing: 0.08em;
        padding: 0.5rem 1rem;
        border-radius: 999px;
        cursor: pointer;
        transition: background-color 0.2s ease, color 0.2s ease, transform 0.12s ease;
    }
    .mode-btn:hover { background: var(--hover); color: var(--fg); }
    .mode-btn:active { transform: scale(0.96); }
    .mode-btn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

    html.liquid.theme-dark .mode-btn,
    html.liquid.theme-dark .footer {
        text-shadow: 0 1px 10px rgba(0, 0, 0, .35);
    }
    html.liquid.theme-light .mode-btn { color: rgba(22, 37, 60, .72); }
    html.liquid.theme-light .mode-btn:hover {
        background: rgba(22, 37, 60, .08);
        color: #16253c;
    }

    .footer {
        text-align: center;
        line-height: 1.7;
        color: var(--faint);
        font-size: clamp(0.62rem, 1.3vw, 0.75rem);
        letter-spacing: 0.05em;
        transition: color 0.5s ease;
    }
    html.liquid.theme-light .footer { color: rgba(22, 37, 60, .44); }
    .footer-line:last-child { opacity: 0.72; }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        html.liquid.theme-light .glass-shell::before { background: rgba(255, 255, 255, .92); }
        html.liquid.theme-dark  .glass-shell::before { background: rgba(18, 22, 38, .88); }
    }

    @media (max-width: 550px) {
        .date-area { letter-spacing: 0.06em; }
        .lunar-date { letter-spacing: 0.08em; }
        .mode-btn { padding: 0.45rem 0.85rem; }
        .glass-shell { padding: clamp(14px, 3.5vmin, 28px) clamp(14px, 4vw, 28px); }
    }

    @media (hover: none) {
        .cursor-glow { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
        .aurora, .sweep { animation: none !important; }
        .cursor-glow { display: none; }
    }
</style>

<script>try{if(document.fonts&&document.fonts.load)document.fonts.load('1em "OCRB10"');}catch(e){}</script>
</head>
<body>

<div class="backdrop" id="backdrop" aria-hidden="true">
    <div class="liquid-base"></div>
    <div class="aurora"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>
    <div class="sweep"></div>
</div>

<canvas class="particles" id="particles" aria-hidden="true"></canvas>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

<main class="glass-shell" id="glassShell">
    <div class="glass-reflect" aria-hidden="true"></div>
    <div class="shell-inner">

        <section class="stage">
            <div class="time-display" id="timeDisplay"><span id="hours">00</span><span class="sep">:</span><span id="minutes">00</span><span class="sep">:</span><span id="seconds">00</span><span class="ampm" id="ampm"></span></div>
            <div class="date-area" id="gregorianDate"></div>
            <div class="lunar-date" id="lunarDate"></div>
        </section>

        <section class="bottom">
            <div class="controls">
                <button class="mode-btn" id="themeToggleBtn" type="button">浅色模式</button>
                <button class="mode-btn" id="liquidToggleBtn" type="button">液态玻璃：关</button>
                <button class="mode-btn" id="formatToggleBtn" type="button">24小时制</button>
            </div>
            <div class="footer">
                <div class="footer-line">网页建立时间：2026年4月5日</div>

                <div class="footer-line">Powered by GitHub Pages</div>
            </div>
        </section>

    </div>
</main>

<script>
(function () {
    'use strict';

    var lunarInfo = [
        0x04bd8, 0x04ae0, 0x0a570, 0x054d5, 0x0d260, 0x0d950, 0x16554, 0x056a0, 0x09ad0, 0x055d2,
        0x04ae0, 0x0a5b6, 0x0a4d0, 0x0d250, 0x1d255, 0x0b540, 0x0d6a0, 0x0ada2, 0x095b0, 0x14977,
        0x04970, 0x0a4b0, 0x0b4b5, 0x06a50, 0x06d40, 0x1ab54, 0x02b60, 0x09570, 0x052f2, 0x04970,
        0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c950,
        0x0d4a0, 0x1d8a6, 0x0b550, 0x056a0, 0x1a5b4, 0x025d0, 0x092d0, 0x0d2b2, 0x0a950, 0x0b557,
        0x06ca0, 0x0b550, 0x15355, 0x04da0, 0x0a5b0, 0x14573, 0x052b0, 0x0a9a8, 0x0e950, 0x06aa0,
        0x0aea6, 0x0ab50, 0x04b60, 0x0aae4, 0x0a570, 0x05260, 0x0f263, 0x0d950, 0x05b57, 0x056a0,
        0x096d0, 0x04dd5, 0x04ad0, 0x0a4d0, 0x0d4d4, 0x0d250, 0x0d558, 0x0b540, 0x0b6a0, 0x195a6,
        0x095b0, 0x049b0, 0x0a974, 0x0a4b0, 0x0b27a, 0x06a50, 0x06d40, 0x0af46, 0x0ab60, 0x09570,
        0x04af5, 0x04970, 0x064b0, 0x074a3, 0x0ea50, 0x06b58, 0x055c0, 0x0ab60, 0x096d5, 0x092e0,
        0x0c960, 0x0d954, 0x0d4a0, 0x0da50, 0x07552, 0x056a0, 0x0abb7, 0x025d0, 0x092d0, 0x0cab5,
        0x0a950, 0x0b4a0, 0x0baa4, 0x0ad50, 0x055d9, 0x04ba0, 0x0a5b0, 0x15176, 0x052b0, 0x0a930,
        0x07954, 0x06aa0, 0x0ad50, 0x05b52, 0x04b60, 0x0a6e6, 0x0a4e0, 0x0d260, 0x0ea65, 0x0d530,
        0x05aa0, 0x076a3, 0x096d0, 0x04afb, 0x04ad0, 0x0a4d0, 0x1d0b6, 0x0d250, 0x0d520, 0x0dd45,
        0x0b5a0, 0x056d0, 0x055b2, 0x049b0, 0x0a577, 0x0a4b0, 0x0aa50, 0x1b255, 0x06d20, 0x0ada0,
        0x14b63, 0x09370, 0x049f8, 0x04970, 0x064b0, 0x168a6, 0x0ea50, 0x06b20, 0x1a6c4, 0x0aae0,
        0x0a2e0, 0x0d2e3, 0x0c960, 0x0d557, 0x0d4a0, 0x0da50, 0x05d55, 0x056a0, 0x0a6d0, 0x055d4,
        0x052d0, 0x0a9b8, 0x0a950, 0x0b4a0, 0x0b6a6, 0x0ad50, 0x055a0, 0x0aba4, 0x0a5b0, 0x052b0,
        0x0b273, 0x06930, 0x07337, 0x06aa0, 0x0ad50, 0x14b55, 0x04b60, 0x0a570, 0x054e4, 0x0d160,
        0x0e968, 0x0d520, 0x0daa0, 0x16aa6, 0x056d0, 0x04ae0, 0x0a9d4, 0x0a2d0, 0x0d150, 0x0f252,
        0x0d520
    ];

    var lunarMonthNames = ['正月', '二月', '三月', '四月', '五月', '六月',
                           '七月', '八月', '九月', '十月', '十一月', '十二月'];
    var lunarDayNames = ['初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
                         '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
                         '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];
    var ganArr = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
    var zhiArr = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

    function leapMonth(y) { return lunarInfo[y - 1900] & 0xf; }
    function leapDays(y) {
        if (leapMonth(y)) return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29;
        return 0;
    }
    function monthDays(y, m) {
        return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29;
    }
    function yearDays(y) {
        var sum = 348;
        for (var i = 0x8000; i > 0x8; i >>= 1) {
            sum += (lunarInfo[y - 1900] & i) ? 1 : 0;
        }
        return sum + leapDays(y);
    }

    function solarToLunar(y, m, d) {
        var offset = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000);
        var i, temp = 0;

        for (i = 1900; i < 2101 && offset > 0; i++) {
            temp = yearDays(i);
            offset -= temp;
        }
        if (offset < 0) { offset += temp; i--; }

        var lunarYear = i;
        var leap = leapMonth(lunarYear);
        var isLeap = false;
        var j;

        for (j = 1; j < 13 && offset > 0; j++) {
            if (leap > 0 && j === leap + 1 && !isLeap) {
                --j;
                isLeap = true;
                temp = leapDays(lunarYear);
            } else {
                temp = monthDays(lunarYear, j);
            }
            if (isLeap && j === leap + 1) isLeap = false;
            offset -= temp;
        }

        if (offset === 0 && leap > 0 && j === leap + 1) {
            if (isLeap) isLeap = false;
            else { isLeap = true; --j; }
        }
        if (offset < 0) { offset += temp; --j; }

        return { year: lunarYear, month: j, day: offset + 1, isLeap: isLeap };
    }

    function getLunarDateString(y, m, d) {
        if (y < 1900 || y > 2100) return '';
        var l = solarToLunar(y, m, d);
        var monthName = lunarMonthNames[l.month - 1];
        var dayName = lunarDayNames[l.day - 1];
        var offsetYears = l.year - 1900;
        var ganzhi = ganArr[(6 + offsetYears) % 10] + zhiArr[(offsetYears) % 12];
        return ganzhi + '年' + (l.isLeap ? '闰' : '') + monthName + dayName;
    }

    var hoursEl         = document.getElementById('hours');
    var minutesEl       = document.getElementById('minutes');
    var secondsEl       = document.getElementById('seconds');
    var ampmEl          = document.getElementById('ampm');
    var gregorianEl     = document.getElementById('gregorianDate');
    var lunarEl         = document.getElementById('lunarDate');
    var themeToggleBtn  = document.getElementById('themeToggleBtn');
    var liquidToggleBtn = document.getElementById('liquidToggleBtn');
    var formatToggleBtn = document.getElementById('formatToggleBtn');
    var glassShell      = document.getElementById('glassShell');
    var backdropEl      = document.getElementById('backdrop');
    var cursorGlowEl    = document.getElementById('cursorGlow');
    var canvasEl        = document.getElementById('particles');

    var WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

    var theme    = 'light';
    var liquid   = false;
    var is24Hour = true;

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function pad2(n) { return n < 10 ? '0' + n : '' + n; }

    function updateClock() {
        var now = new Date();
        var h24 = now.getHours();
        var m   = now.getMinutes();
        var s   = now.getSeconds();

        var displayHour = is24Hour ? h24 : (h24 % 12 || 12);
        hoursEl.textContent   = pad2(displayHour);
        minutesEl.textContent = pad2(m);
        secondsEl.textContent = pad2(s);

        if (is24Hour) {
            ampmEl.classList.remove('show');
            ampmEl.textContent = '';
        } else {
            ampmEl.textContent = h24 >= 12 ? 'PM' : 'AM';
            ampmEl.classList.add('show');
        }

        var year  = now.getFullYear();
        var month = now.getMonth() + 1;
        var date  = now.getDate();
        gregorianEl.textContent =
            year + '年' + month + '月' + date + '日  ' + WEEKDAYS[now.getDay()];

        var lunarStr = getLunarDateString(year, month, date);
        lunarEl.textContent = lunarStr ? '农历' + lunarStr : '';
    }

    function tick() {
        updateClock();
        var delay = 1000 - (Date.now() % 1000);
        setTimeout(tick, delay);
    }

    var fx = (function () {
        var ctx = null;
        var cw = 0, ch = 0;
        var particles = [];
        var running = false;
        var rafId = 0;
        var isLight = true;

        var orbEls = document.querySelectorAll('.orb');
        var orbs = [];
        var orbReady = false;
        var orbT = 0;
        var lastNow = 0;

        var targetX = 0, targetY = 0;
        var curX = 0, curY = 0;

        var glowTX = window.innerWidth / 2;
        var glowTY = window.innerHeight / 2;
        var glowX = glowTX, glowY = glowTY;

        function vmax() {
            return Math.max(window.innerWidth, window.innerHeight) / 100;
        }

        function orbRange(i) {
            return (12 + i * 3) * vmax();
        }

        function initOrbs() {
            if (orbReady) return;
            orbs = [];
            for (var i = 0; i < orbEls.length; i++) {
                orbs.push({
                    el: orbEls[i],
                    range: orbRange(i),
                    p: [
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2
                    ],
                    /* ⭐ 速度 ×5：角频率 0.50~1.25 弧度/秒 → 周期约 5~12 秒 */
                    w: [
                        0.850 + Math.random() * 0.400,   // 0.85~1.25
                        0.575 + Math.random() * 0.350,   // 0.575~0.925
                        0.750 + Math.random() * 0.400,   // 0.75~1.15
                        0.500 + Math.random() * 0.300    // 0.50~0.80
                    ],
                    /* ⭐ 呼吸速度 ×2，与移动节奏协调 */
                    sp: 0.60 + Math.random() * 0.50,
                    sp0: Math.random() * Math.PI * 2
                });
            }
            orbReady = true;
        }

        function updateOrbs(t) {
            for (var i = 0; i < orbs.length; i++) {
                var o = orbs[i];

                var x = o.range * (
                    0.62 * Math.sin(t * o.w[0] + o.p[0]) +
                    0.38 * Math.sin(t * o.w[1] + o.p[1])
                );
                var y = o.range * (
                    0.62 * Math.cos(t * o.w[2] + o.p[2]) +
                    0.38 * Math.cos(t * o.w[3] + o.p[3])
                );

                var s = 1 + 0.07 * Math.sin(t * o.sp + o.sp0);

                o.el.style.transform =
                    'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0)' +
                    ' scale(' + s.toFixed(3) + ')';
            }
        }

        function sizeCanvas() {
            if (!canvasEl) return;
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            cw = window.innerWidth;
            ch = window.innerHeight;
            canvasEl.width  = Math.floor(cw * dpr);
            canvasEl.height = Math.floor(ch * dpr);
            canvasEl.style.width  = cw + 'px';
            canvasEl.style.height = ch + 'px';
            if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function makeParticles() {
            var n = cw < 700 ? 36 : 64;
            particles = [];
            for (var i = 0; i < n; i++) {
                particles.push({
                    x: Math.random() * cw,
                    y: Math.random() * ch,
                    r: Math.random() * 1.7 + 0.5,
                    vx: (Math.random() - 0.5) * 0.28,
                    vy: (Math.random() - 0.5) * 0.28,
                    a: Math.random() * 0.4 + 0.15,
                    ph: Math.random() * Math.PI * 2,
                    sp: Math.random() * 0.02 + 0.007
                });
            }
        }

        function particleColor(alpha) {
            return isLight
                ? 'rgba(40,60,90,' + alpha + ')'
                : 'rgba(255,255,255,' + alpha + ')';
        }

        function drawParticles() {
            if (!ctx) return;
            ctx.clearRect(0, 0, cw, ch);
            for (var i = 0; i < particles.length; i++) {
                var p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.ph += p.sp;

                if (p.x < -20) p.x = cw + 20;
                if (p.x > cw + 20) p.x = -20;
                if (p.y < -20) p.y = ch + 20;
                if (p.y > ch + 20) p.y = -20;

                var alpha = p.a * (0.55 + 0.45 * Math.sin(p.ph));
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = particleColor(alpha.toFixed(3));
                ctx.fill();
            }
        }

        function loop(now) {
            if (!running) return;

            if (!lastNow) lastNow = now;
            var dt = (now - lastNow) / 1000;
            if (dt > 0.05) dt = 0.05;
            lastNow = now;
            orbT += dt;

            curX += (targetX - curX) * 0.05;
            curY += (targetY - curY) * 0.05;
            if (backdropEl) {
                backdropEl.style.transform =
                    'translate3d(' + (-curX * 26) + 'px,' + (-curY * 26) + 'px,0)';
            }

            glowX += (glowTX - glowX) * 0.14;
            glowY += (glowTY - glowY) * 0.14;
            if (cursorGlowEl) {
                cursorGlowEl.style.transform =
                    'translate3d(' + glowX + 'px,' + glowY + 'px,0)';
            }

            updateOrbs(orbT);
            drawParticles();

            rafId = requestAnimationFrame(loop);
        }

        function start() {
            if (running || reduceMotion) return;
            if (!ctx && canvasEl && canvasEl.getContext) {
                ctx = canvasEl.getContext('2d');
            }
            initOrbs();
            lastNow = 0;
            running = true;
            sizeCanvas();
            makeParticles();
            rafId = requestAnimationFrame(loop);
        }

        function stop() {
            running = false;
            if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
            if (ctx) ctx.clearRect(0, 0, cw, ch);
            lastNow = 0;
        }

        function setPointer(clientX, clientY) {
            targetX = (clientX / window.innerWidth  - 0.5) * 2;
            targetY = (clientY / window.innerHeight - 0.5) * 2;
            glowTX = clientX;
            glowTY = clientY;
        }

        function resize() {
            if (orbReady) {
                for (var i = 0; i < orbs.length; i++) {
                    orbs[i].range = orbRange(i);
                }
            }
            if (!running) return;
            sizeCanvas();
            makeParticles();
        }

        function setTheme(t) {
            isLight = (t === 'light');
        }

        return {
            start: start,
            stop: stop,
            setPointer: setPointer,
            resize: resize,
            setTheme: setTheme
        };
    })();

    function applyState() {
        var root = document.documentElement;
        root.classList.toggle('theme-light', theme === 'light');
        root.classList.toggle('theme-dark',  theme === 'dark');
        root.classList.toggle('liquid',      liquid);

        themeToggleBtn.textContent  = theme === 'dark' ? '深色模式' : '浅色模式';
        liquidToggleBtn.textContent = liquid ? '液态玻璃：开' : '液态玻璃：关';
        formatToggleBtn.textContent = is24Hour ? '24小时制' : '12小时制';

        fx.setTheme(theme);

        if (liquid) {
            fx.start();
        } else {
            fx.stop();
            glassShell.style.setProperty('--rx', '0deg');
            glassShell.style.setProperty('--ry', '0deg');
        }

        try {
            localStorage.setItem('clockTheme',  theme);
            localStorage.setItem('clockLiquid', liquid ? 'on' : 'off');
            localStorage.setItem('timeFormat',  is24Hour ? '24' : '12');
        } catch (e) {}
    }

    function onPointerMove(e) {
        if (!liquid) return;

        fx.setPointer(e.clientX, e.clientY);

        var rect = glassShell.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;

        glassShell.style.setProperty('--mx', x + 'px');
        glassShell.style.setProperty('--my', y + 'px');

        if (!reduceMotion) {
            var px = x / rect.width  - 0.5;
            var py = y / rect.height - 0.5;
            glassShell.style.setProperty('--ry', (px * 5) + 'deg');
            glassShell.style.setProperty('--rx', (-py * 5) + 'deg');
        }
    }

    window.addEventListener('pointermove', onPointerMove, { passive: true });

    window.addEventListener('touchmove', function (e) {
        if (!liquid) return;
        var t = e.touches[0];
        if (!t) return;
        fx.setPointer(t.clientX, t.clientY);
    }, { passive: true });

    window.addEventListener('resize', function () { fx.resize(); });

    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            fx.stop();
        } else if (liquid) {
            fx.start();
        }
    });

    function init() {
        try {
            var savedTheme = localStorage.getItem('clockTheme') || 'light';
            theme = savedTheme === 'dark' ? 'dark' : 'light';

            liquid = localStorage.getItem('clockLiquid') === 'on';

            var savedFormat = localStorage.getItem('timeFormat') || '24';
            is24Hour = savedFormat !== '12';
        } catch (e) {}

        applyState();
        tick();

        themeToggleBtn.addEventListener('click', function () {
            theme = theme === 'dark' ? 'light' : 'dark';
            applyState();
        });

        liquidToggleBtn.addEventListener('click', function () {
            liquid = !liquid;
            applyState();
        });

        formatToggleBtn.addEventListener('click', function () {
            is24Hour = !is24Hour;
            applyState();
            updateClock();
        });
    }

    init();
})();
</script>
