<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>ECHO OS</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#000;overflow:hidden;
    font-family:"SF Mono","Consolas","Menlo","Courier New","Noto Sans SC",monospace;
    -webkit-font-smoothing:antialiased;}

  #screen{
    position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%, #0c1319 0%, #05080b 70%, #020304 100%);
    color:#8fe3b0;
  }
  /* 扫描线 */
  #screen::after{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:9000;
    background:repeating-linear-gradient(0deg,
      rgba(0,0,0,.22) 0px, rgba(0,0,0,.22) 1px,
      transparent 1px, transparent 3px);
  }
  /* 暗角 */
  #screen::before{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:9001;
    background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.9) 100%);
  }

  /* ============ 开机界面 ============ */
  #boot{
    position:absolute;inset:0;z-index:8000;background:#05080b;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .8s;
  }
  #boot pre{
    font-size:15px;line-height:1.9;color:#6fc894;
    text-shadow:0 0 8px rgba(111,200,148,.5);white-space:pre-wrap;
  }
  #boot .blink{animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* ============ 桌面 ============ */
  #desktop{
    position:absolute;inset:0 0 34px 0;
    padding:22px;
    transition:opacity .9s;
    background:
      radial-gradient(circle at 78% 22%, rgba(60,90,120,.10) 0%, transparent 45%),
      radial-gradient(circle at 20% 80%, rgba(40,70,90,.08) 0%, transparent 40%);
  }
  #icons{display:flex;flex-direction:column;flex-wrap:wrap;height:100%;gap:6px;align-content:flex-start;}
  .icon{
    width:96px;padding:10px 4px;border-radius:6px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:7px;
    color:#9fd8bb;font-size:12px;text-align:center;
    border:1px solid transparent;user-select:none;
    transition:background .15s,border-color .15s;
  }
  .icon:hover{background:rgba(120,220,170,.09);border-color:rgba(120,220,170,.25);}
  .icon .gi{font-size:30px;line-height:1;filter:drop-shadow(0 0 6px rgba(120,220,170,.35));}
  .icon .gn{word-break:break-all;line-height:1.3;}

  /* ============ 任务栏 ============ */
  #taskbar{
    position:absolute;left:0;right:0;bottom:0;height:34px;
    background:rgba(8,14,18,.92);border-top:1px solid rgba(120,220,170,.18);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;font-size:12px;color:#6fb890;z-index:7000;
    backdrop-filter:blur(4px);
  }
  #taskbar .r{display:flex;align-items:center;gap:16px;}
  #hintbtn{cursor:pointer;font-size:16px;transition:transform .2s;}
  #hintbtn:hover{transform:scale(1.2);}

  /* ============ 窗口 ============ */
  #windows{position:absolute;inset:0;pointer-events:none;}
  .window{
    position:absolute;pointer-events:auto;
    width:540px;max-width:calc(100vw - 40px);
    background:rgba(10,17,22,.97);
    border:1px solid rgba(120,220,170,.3);
    border-radius:8px;overflow:hidden;
    box-shadow:0 16px 50px rgba(0,0,0,.85), 0 0 0 1px rgba(0,0,0,.5);
    display:flex;flex-direction:column;
    animation:winIn .16s ease-out;
  }
  @keyframes winIn{from{opacity:0;transform:scale(.97) translateY(6px);}}
  .titlebar{
    height:32px;flex:0 0 32px;
    background:linear-gradient(180deg, rgba(30,50,60,.95), rgba(16,28,34,.95));
    border-bottom:1px solid rgba(120,220,170,.2);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 6px 0 12px;cursor:move;user-select:none;
  }
  .titlebar .t{font-size:12px;color:#8fe3b0;letter-spacing:.5px;}
  .titlebar .close{
    width:22px;height:22px;border-radius:4px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:#7fc8a0;font-size:13px;transition:background .15s,color .15s;
  }
  .titlebar .close:hover{background:#c0392b;color:#fff;}
  .wbody{
    padding:16px 18px;overflow:auto;max-height:min(72vh,560px);
    font-size:13.5px;line-height:1.85;color:#a8dcc0;
  }
  .wbody::-webkit-scrollbar{width:8px;}
  .wbody::-webkit-scrollbar-thumb{background:rgba(120,220,170,.25);border-radius:4px;}
  .wbody pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;}
  .wbody h3{color:#8fe3b0;font-size:14px;margin-bottom:8px;font-weight:600;letter-spacing:.5px;}

  /* 邮件 */
  .mail-item{
    padding:10px 12px;border:1px solid rgba(120,220,170,.16);border-radius:6px;
    margin-bottom:8px;cursor:pointer;transition:background .15s,border-color .15s;

  .mail-item:hover{background:rgba(120,220,170,.07);border-color:rgba(120,220,170,.4);}
  .mail-item .s{color:#8fe3b0;font-size:13px;}

  .pcard{

  .pcard svg{display:block;width:100%;height:auto;}
  .pcard .cap{padding:6px 8px;font-size:11px;color:#6fb890;}

  /* 暗图 */
  .darkbox{background:#000;border:1px solid rgba(120,220,170,.25);border-radius:6px;
    height:230px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .darkcontent{

  input[type=range]{

  .mini{

    border-radius:4px;background:transparent;color:#8fe3b0;cursor:pointer;font-family:inherit;
  }
  .mini:hover{background:rgba(120,220,170,.18);}

  /* ============ 全屏覆盖 ============ */
  #overlay{
    position:absolute;inset:0;z-index:9500;display:none;
    background:#020405;flex-direction:column;align-items:center;justify-content:center;

  #echoText{

  .flash{
    position:absolute;inset:0;background:#dfffe9;z-index:9800;
    animation:flashOut .7s ease-out forwards;pointer-events:none;
  }
  @keyframes flashOut{0%{opacity:1;}100%{opacity:0;}}

  .glitch{animation:glitch .28s steps(2) 3;}
  @keyframes glitch{
    0%{transform:translate(0);filter:none;}
    25%{transform:translate(-3px,1px);filter:hue-rotate(40deg);}
    50%{transform:translate(3px,-1px);}
    75%{transform:translate(-2px,-1px);filter:hue-rotate(-40deg);}
    100%{transform:translate(0);}
  }

  .hintbox{
    font-size:13px;line-height:2;color:#a8dcc0;
  }
  .hintbox b{color:#8fe3b0;}
  .muted{color:#5f9b7d;font-size:12px;}
  .warn{color:#d98a8a;}

  /* 提示弹窗 */
  #hintpop{
    position:absolute;right:14px;bottom:44px;z-index:9200;
    width:290px;background:rgba(10,20,16,.98);
    border:1px solid rgba(120,220,170,.4);border-radius:8px;
    padding:14px 16px;font-size:12.5px;line-height:1.9;color:#a8dcc0;

  }
  #hintpop h4{color:#8fe3b0;font-size:12px;margin-bottom:8px;letter-spacing:1px;}

  .catpaw{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:40px;opacity:0;animation:paw 3s ease-in-out forwards;
    filter:drop-shadow(0 0 12px rgba(143,227,176,.6));
  }
  @keyframes paw{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}
    35%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    75%{opacity:.9;}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.1);}
  }
</style>

/* =========================================================
   开机流程
   ========================================================= */
let booted = false;
function bootStart(){
  const boot = document.getElementById('boot');
  boot.addEventListener('click', bootDone);
  window.addEventListener('keydown', bootDone);
}
async function bootDone(){
  if (booted) return;
  booted = true;
  window.removeEventListener('keydown', bootDone);
  const boot = document.getElementById('boot');
  boot.style.opacity = '0';
  await sleep(800);
  boot.style.display = 'none';
  document.getElementById('desktop').style.opacity = '1';
  // 时钟轻微漂移
  setInterval(tickClock, 1000);
}
function tickClock(){
  const t = new Date();
  const hh = String(t.getHours()).padStart(2,'0');
  const mm = String(t.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = hh + ':' + mm;
}

    const d = document.createElement('div');
    d.className = 'icon';

let winSeq = 0;
let dragging = null;

function openWindow(id, title, html, width){
  let el = document.getElementById('win-' + id);
  if (el){
    el.style.display = 'flex';
    el.style.zIndex = ++zIndex;
    return el;
  }
  el = document.createElement('div');
  el.className = 'window';
  el.id = 'win-' + id;
  el.style.zIndex = ++zIndex;
  if (width) el.style.width = width + 'px';

  const off = (winSeq++ % 6);
  el.style.left = Math.min(80 + off * 34, window.innerWidth - 580) + 'px';
  el.style.top  = Math.min(46 + off * 28, window.innerHeight - 520) + 'px';

  el.innerHTML = `
    <div class="titlebar">
      <span class="t">${title}</span>
      <span class="close">✕</span>
    </div>
    <div class="wbody">${html}</div>`;

  el.querySelector('.close').onclick = e => {
    e.stopPropagation();
    el.style.display = 'none';
  };
  const tb = el.querySelector('.titlebar');
  tb.addEventListener('mousedown', e => {
    if (e.target.classList.contains('close')) return;
    el.style.zIndex = ++zIndex;
    dragging = { el, dx: e.clientX - el.offsetLeft, dy: e.clientY - el.offsetTop };
  });
  document.getElementById('windows').appendChild(el);
  return el;
}

document.addEventListener('mousemove', e => {
  if (!dragging) return;
  dragging.el.style.left = (e.clientX - dragging.dx) + 'px';
  dragging.el.style.top  = (e.clientY - dragging.dy) + 'px';
});
document.addEventListener('mouseup', () => dragging = null);

function playNoise(duration){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const size = Math.floor(ctx.sampleRate * duration);
    const buf = ctx.createBuffer(1, size, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < size; i++){
      data[i] = (Math.random() * 2 - 1) * 0.12 * (1 - i / size);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const g = ctx.createGain();
    g.gain.value = 0.5;
    src.connect(g).connect(ctx.destination);
    src.start();
  } catch(e){}
}

function speak(text, rate, pitch){
  try{
    if (!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = rate || 0.7;
    u.pitch = pitch || 0.6;
    speechSynthesis.speak(u);
  } catch(e){}
}

    const v = inp.value;

    runCmd(v, out);

  w.querySelector('.wbody').onclick = () => inp.focus();

function runCmd(input, out){
  const raw = input.trim();
  if (!raw){ return; }
  const parts = raw.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg = parts.slice(1).join(' ');

  const print = s => { out.textContent += s + '\n'; };

  switch(cmd){
    case 'help':
      print(
`可用命令：
  ls                列出文件
  cat <文件>        查看文件内容
  whoami            当前用户
  ps                运行中的进程
  date              系统时间
  echo <文本>       输出文本
  unlock <密钥>     尝试唤醒核心进程
  clear             清屏`);
      break;

    case 'ls':
      print(
`diary.txt
readme.txt
相册/
录音_0031.wav
（回收站中还有 3 个已删除项目）`);
      break;

    case 'cat': {
      const key = arg.toLowerCase();
      if (key === 'diary.txt'){
        flags.readDiary = true;
        print(DIARY);
      } else if (key === 'readme.txt'){
        print(README);
      } else if (arg === '不要打开.txt'){
        flags.readTrashNote = true;
        print(TRASH_NOTE);
      } else if (key === 'key_fragment.log'){
        flags.readKeyLog = true;
        print(KEY_LOG);
      } else if (key === '.key' || key === '/home/linwan/.key'){
        print('[!] 文件不存在。');
        print('[!] 它被藏起来了。');
      } else if (!arg){
        print('用法：cat <文件名>');
      } else {
        print('cat: ' + arg + ': 没有那个文件或目录');
      }
      break;
    }

    case 'whoami':
      print('linwan');
      print('（但你不是她。）');
      break;

    case 'ps':
      print(
`  PID   NAME         CPU     STATUS
  0001  kernel       0.1%    running
  0037  echo.exe    99.4%    WAITING
  3277  /bin/sleep   0.0%    waiting for input
  4111  terminal     0.2%    running`);
      break;

    case 'date':
      print('系统时间：2019-11-07 03:41:07');
      print('真实时间：无法获取');
      print('漂移量：  3277 天');
      break;

    case 'echo':
      print(arg || '');
      break;

    case 'clear':
      out.textContent = '';
      break;

    case 'unlock': {
      if (!arg){
        print('[!] 用法：unlock <密钥>');
        print('[!] 提示：钥匙 = 我最爱的名字 + 那一天');
        break;
      }
      const k = arg.toLowerCase().replace(/\s/g, '');
      if (k === 'xiaoman1107' || arg.replace(/\s/g,'') === '小满1107'){
        print('');
        print('[+] 密钥正确。');
        triggerEnding();
      } else {
        print('[!] 密钥错误。');
        print('[!] 提示：钥匙 = 我最爱的名字 + 那一天');
        print('[!] 格式参考：name + MMDD（全小写，无空格）');
      }
      break;
    }

    default:
      print('bash: ' + cmd + ': 未找到命令');
      print('输入 help 查看可用命令。');
  }
}

function getHint(){
  if (flags.unlocked) return '<div class="hintbox">一切都结束了。或者，才刚刚开始。</div>';

  const steps = [];
  if (!flags.readDiary) steps.push('打开桌面上的 <b>日记.txt</b>，林晚留下了很多话。');
  if (!flags.readMail)  steps.push('看看 <b>邮件</b>，那里有"那一天"的准确日期。');
  if (!flags.readKeyLog || !flags.readTrashNote)
    steps.push('<b>回收站</b>里的东西可以点"还原"再打开。');
  if (!flags.brightened) steps.push('<b>相册</b>里有一张几乎全黑的照片，试试拖动亮度滑块。');
  if (!flags.playedAudio) steps.push('那段<b>录音</b>，最好戴上耳机听。');

  if (steps.length === 0){
    return `<div class="hintbox">
      线索应该够了：<br>
      · 名字在日记和相册里（那只猫）<br>
      · 日期在邮件和白板上<br>
      · 格式是 <b>name + MMDD</b>，全小写<br>
      打开<b>终端</b>，输入：<br>
      <b>unlock &lt;你的答案&gt;</b>
    </div>`;
  }
  return '<div class="hintbox">· ' + steps.join('<br>· ') + '</div>';
}

}

function typeLine(el, text){
  return new Promise(resolve => {
    if (text === ''){
      el.textContent += '\n';
      return resolve();
    }
    let i = 0;
    const timer = setInterval(() => {
      el.textContent += text[i];
      i++;
      if (i >= text.length){
        clearInterval(timer);
        el.textContent += '\n';
        resolve();
      }
    }, 42);
  });
}

  await sleep(3600);
  ov.innerHTML = `
    <div style="color:#4f7f67;font-size:12.5px;line-height:2.2;text-align:center;">
      ECHO OS v3.7<br>
      会话已结束<br><br>
      <span style="color:#8fe3b0;cursor:pointer;text-decoration:underline;"
            onclick="location.reload()">重新开始</span>
    </div>`;
}

/* ---------- 结局 B：让她继续等 ---------- */
async function endingStay(){
  const ov = document.getElementById('overlay');
  ov.innerHTML = `<div id="echoText"></div>`;
  const t = document.getElementById('echoText');

  const lines = [
    '……好。',
    '',
    '那我就继续等。',
    '',
    '反正我已经很擅长这件事了。',
    '',
    '你随时可以回来。',
    '我会在这里。',
    '',
    '一直在这里。'
  ];
  for (const l of lines){
    await typeLine(t, l);
    await sleep(l === '' ? 150 : 620);
  }

  await sleep(2400);
  ov.style.display = 'none';
  ov.innerHTML = '';
  document.getElementById('desktop').style.opacity = '1';

  flags.keepEcho = true;
  renderIcons();

  const note = document.createElement('div');
  note.style.cssText =
    'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);' +
    'color:#8fe3b0;font-size:13px;background:rgba(10,20,16,.95);' +
    'border:1px solid rgba(120,220,170,.4);border-radius:8px;padding:18px 26px;' +
    'z-index:9300;text-align:center;line-height:2;transition:opacity 1s;';
  note.innerHTML = '桌面上多了一个图标。<br><span style="color:#5f9b7d;font-size:11.5px;">（也许你该看看它。）</span>';
  document.getElementById('screen').appendChild(note);
  setTimeout(() => {
    note.style.opacity = '0';
    setTimeout(() => note.remove(), 1100);
  }, 5000);
}

async function openEchoIcon(){
  const ov = document.getElementById('overlay');
  ov.style.display = 'flex';
  ov.innerHTML = `<div id="echoText" style="font-size:15px;"></div>
    <div style="margin-top:36px;">
      <button class="btn" onclick="document.getElementById('overlay').style.display='none';document.getElementById('overlay').innerHTML='';">
        关闭
      </button>
    </div>`;
  const t = document.getElementById('echoText');
  t.textContent = '';
  for (let i = 0; i < 60; i++){
    t.textContent += '你在哪里？\n';
    await sleep(260);
    if (i === 25){
      t.textContent = '';
      t.textContent = '你在哪里？\n';
    }
  }
}

/* =========================================================
   空闲异常
   ========================================================= */
let idleTimer = null;
let idleFired = 0;

function resetIdle(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(idleGlitch, 45000);
}

async function idleGlitch(){
  if (flags.unlocked) return;
  if (idleFired >= 4){ resetIdle(); return; }
  idleFired++;

  const sc = document.getElementById('screen');
  const flash = document.createElement('div');
  flash.style.cssText =
    'position:absolute;inset:0;background:#000;z-index:9700;' +
    'display:flex;align-items:center;justify-content:center;' +
    'color:#8fe3b0;font-size:22px;letter-spacing:6px;opacity:0;transition:opacity .18s;';
  flash.textContent = '你在哪里？';
  sc.appendChild(flash);

  await sleep(30);
  flash.style.opacity = '1';
  await sleep(160);
  flash.style.opacity = '0';
  await sleep(200);
  flash.remove();

  sc.classList.add('glitch');
  await sleep(400);
  sc.classList.remove('glitch');

  resetIdle();
}

['mousemove','keydown','click','scroll'].forEach(ev => {
  window.addEventListener(ev, resetIdle, { passive: true });
});

/* =========================================================
   工具
   ========================================================= */
function escapeHTML(s){
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

/* =========================================================
   启动
   ========================================================= */
renderIcons();
bootStart();
resetIdle();
</script>
