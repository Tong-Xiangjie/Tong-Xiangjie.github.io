<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>五子棋</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  /* 纯深灰底色，极简暗黑 */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background-color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #ededed;
  }
  
  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 4px;
    color: #ededed;
    cursor: pointer;
    user-select: none;
    transition: color 0.2s;
  }
  
  h1:hover { color: #ffffff; }

  /* 状态栏：纯色块，无发光 */
  .status {
    min-width: 220px;
    text-align: center;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    background-color: #1a1a1a;
    border: 1px solid #333333;
    color: #a0a0a0;
    transition: all .2s;
    cursor: default;
  }
  
  /* 输赢颜色：深色模式下的高对比度底色 */
  .status.win  { background-color: #143621; color: #5ee07f; border-color: #1e4d30; cursor: pointer; }
  .status.lose { background-color: #3b1818; color: #ff7b72; border-color: #522020; cursor: pointer; }
  .status.thinking { background-color: #1a2333; color: #7fb2ff; border-color: #273754; }

  canvas {
    display: block;
    border-radius: 6px;
    /* 纯黑阴影，绝不发光 */
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    cursor: pointer;
    touch-action: manipulation;
    border: 1px solid #333;
  }

  .toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* 按钮扁平化：深灰底色，无动画 */
  button, select {
    font: inherit;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 6px;
    border: 1px solid #333333;
    background-color: #1a1a1a;
    color: #d1d1d1;
    cursor: pointer;
    transition: background-color 0.2s, border-color 0.2s;
    outline: none;
  }

  button:hover:not(:disabled), select:hover { 
    background-color: #262626; 
    border-color: #444;
  }
  
  button:active:not(:disabled) { 
    background-color: #333333; 
  }
  
  button:disabled { 
    opacity: 0.4; 
    cursor: not-allowed; 
  }

  select { padding-right: 32px; }

  /* 弹窗：干脆利落的黑卡片 */
  #import-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.7); 
    z-index: 999;
    align-items: center;
    justify-content: center;
  }
  
  .modal-content {
    background-color: #1a1a1a;
    padding: 24px;
    border-radius: 8px;
    border: 1px solid #333;
    width: 85%;
    max-width: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    text-align: center;
  }
  
  .modal-content h3 { margin: 0 0 16px 0; font-size: 16px; color: #ededed; font-weight: 500; }
  
  .modal-content textarea {
    width: 100%;
    height: 100px;
    padding: 12px;
    border-radius: 6px;
    background-color: #111111;
    border: 1px solid #333;
    color: #d1d1d1;
    font-family: monospace;
    font-size: 13px;
    resize: none;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  
  .modal-content textarea:focus { border-color: #666; }
  
  .modal-btns { display: flex; gap: 12px; justify-content: center; }
  .modal-btns button { flex: 1; padding: 10px 0; border-radius: 6px; }
  
  /* 确认按钮：白底黑字，极致反差 */
  .btn-confirm { 
    background-color: #ededed !important; 
    border-color: #ededed !important; 
    color: #111 !important; 
    font-weight: 600; 
  }
  .btn-confirm:hover { 
    background-color: #ffffff !important; 
    border-color: #ffffff !important;
  }
</style>
</head>
<body>

<div id="import-modal">
  <div class="modal-content">
    <h3>导入对局存档</h3>
    <textarea id="replay-input" placeholder="请在此粘贴完整的复盘码"></textarea>
    <div class="modal-btns">
      <button id="btn-cancel-import">取消</button>
      <button id="btn-confirm-import" class="btn-confirm">确认导入</button>
    </div>
  </div>
</div>

<div class="app">
  <h1 id="title" title="点击导入存档">五子棋</h1>
  <div class="status" id="status">【黑棋】轮到你了！</div>
  <canvas id="board"></canvas>
  <div class="toolbar">
    <button id="btn-restart">重新开始</button>
    <button id="btn-undo">悔棋（剩余3次）</button>
    <select id="level">
      <option value="easy">简单</option>
      <option value="normal" selected>普通</option>
      <option value="hard">困难</option>
    </select>
  </div>
</div>

<script>
(function () {
  'use strict';

  const N = 15;
  const EMPTY = 0, BLACK = 1, WHITE = 2;
  const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const levelEl = document.getElementById('level');
  const undoBtn = document.getElementById('btn-undo');
  const titleEl = document.getElementById('title');
  const importModal = document.getElementById('import-modal');
  const replayInput = document.getElementById('replay-input');

  let board = [];
  let history = [];
  let lastMove = null;
  
  let humanSide = BLACK; 
  let aiSide = WHITE;    
  let turn = BLACK;      
  let gameOver = false;
  let difficulty = 'normal';
  let hoverCell = null;
  let undosLeft = 3;
  let replayCode = '';

  let boardPx = 0, pad = 0, cell = 0;

  function layout() {
    const size = Math.max(260, Math.floor(Math.min(window.innerWidth - 40, window.innerHeight - 250, 560)));
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    boardPx = size;
    pad = Math.round(size * 0.048);
    cell = (size - pad * 2) / (N - 1);
    draw();
  }

  function draw() {
    if (!board.length || boardPx === 0) return;

    // 深邃暗木色，不反光
    ctx.fillStyle = '#CBB28B';
    ctx.fillRect(0, 0, boardPx, boardPx);

    const end = pad + (N - 1) * cell;
    ctx.strokeStyle = 'rgba(80, 60, 40, .6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const p = Math.round(pad + i * cell) + 0.5;
      ctx.moveTo(pad, p); ctx.lineTo(end, p);
      ctx.moveTo(p, pad); ctx.lineTo(p, end);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(80, 60, 40, .8)';
    ctx.lineWidth = 2;
    ctx.strokeRect(pad - 0.5, pad - 0.5, (N - 1) * cell + 1, (N - 1) * cell + 1);

    ctx.fillStyle = 'rgba(80, 60, 40, .8)';
    [[3, 3], [11, 3], [3, 11], [11, 11], [7, 7]].forEach(([i, j]) => {
      ctx.beginPath();
      ctx.arc(pad + i * cell, pad + j * cell, cell * 0.08, 0, Math.PI * 2);
      ctx.fill();
    });

    if (hoverCell && !gameOver && turn === humanSide) {
      ctx.globalAlpha = 0.4;
      drawStone(hoverCell.x, hoverCell.y, humanSide);
      ctx.globalAlpha = 1;
    }

    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (board[y][x] !== EMPTY) drawStone(x, y, board[y][x]);
      }
    }

    if (lastMove) {
      ctx.beginPath();
      ctx.arc(pad + lastMove.x * cell, pad + lastMove.y * cell, cell * 0.15, 0, Math.PI * 2);
      ctx.strokeStyle = '#E53E3E';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  function drawStone(x, y, player) {
    const cx = pad + x * cell, cy = pad + y * cell, r = cell * 0.42;
    
    const grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
    if (player === BLACK) {
      grad.addColorStop(0, '#444');
      grad.addColorStop(1, '#000');
    } else {
      grad.addColorStop(0, '#fff');
      grad.addColorStop(1, '#e0e0e0');
    }
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  function inBoard(x, y) { return x >= 0 && x < N && y >= 0 && y < N; }

  function isWin(x, y, p) {
    for (let d = 0; d < 4; d++) {
      const dx = DIRS[d][0], dy = DIRS[d][1];
      let count = 1;
      for (const s of [1, -1]) {
        for (let i = 1; ; i++) {
          const nx = x + dx * i * s, ny = y + dy * i * s;
          if (!inBoard(nx, ny) || board[ny][nx] !== p) break;
          count++;
        }
      }
      if (count >= 5) return true;
    }
    return false;
  }

  function buildLine(x, y, dx, dy, player) {
    let s = '';
    for (let i = -4; i <= 4; i++) {
      if (i === 0) { s += '1'; continue; }
      const nx = x + dx * i, ny = y + dy * i;
      if (!inBoard(nx, ny)) { s += '2'; continue; }
      const v = board[ny][nx];
      s += v === EMPTY ? '0' : (v === player ? '1' : '2');
    }
    return s;
  }

  function lineScore(s) {
    if (s.indexOf('11111') !== -1) return 10000000;
    if (s.indexOf('011110') !== -1) return 100000;
    if (s.indexOf('011112') !== -1 || s.indexOf('211110') !== -1 || s.indexOf('11011') !== -1 || s.indexOf('10111') !== -1 || s.indexOf('11101') !== -1) return 10000;
    if (s.indexOf('01110') !== -1 || s.indexOf('010110') !== -1 || s.indexOf('011010') !== -1) return 1000;
    if (s.indexOf('001112') !== -1 || s.indexOf('211100') !== -1 || s.indexOf('010112') !== -1 || s.indexOf('211010') !== -1 || s.indexOf('011012') !== -1 || s.indexOf('210110') !== -1 || s.indexOf('10011') !== -1 || s.indexOf('11001') !== -1 || s.indexOf('10101') !== -1) return 100;
    if (s.indexOf('001100') !== -1 || s.indexOf('01100') !== -1 || s.indexOf('00110') !== -1 || s.indexOf('01010') !== -1 || s.indexOf('010010') !== -1) return 60;
    if (s.indexOf('000112') !== -1 || s.indexOf('211000') !== -1 || s.indexOf('001012') !== -1 || s.indexOf('210100') !== -1 || s.indexOf('010012') !== -1 || s.indexOf('210010') !== -1 || s.indexOf('10001') !== -1) return 12;
    return 1;
  }

  function scorePoint(x, y, player) {
    let total = 0;
    for (let d = 0; d < 4; d++) total += lineScore(buildLine(x, y, DIRS[d][0], DIRS[d][1], player));
    return total;
  }

  function hasNeighbor(x, y, dist) {
    for (let dy = -dist; dy <= dist; dy++) {
      for (let dx = -dist; dx <= dist; dx++) {
        if (dx === 0 && dy === 0) continue;
        const nx = x + dx, ny = y + dy;
        if (inBoard(nx, ny) && board[ny][nx] !== EMPTY) return true;
      }
    }
    return false;
  }

  function getCandidates() {
    const list = [];
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (board[y][x] === EMPTY && hasNeighbor(x, y, 2)) list.push({ x, y });
      }
    }
    return list;
  }

  function findBestMove() {
    if (history.length === 0) return { x: 7, y: 7 };
    const cands = getCandidates();
    if (cands.length === 0) return null;

    for (const c of cands) {
      board[c.y][c.x] = aiSide; const win = isWin(c.x, c.y, aiSide); board[c.y][c.x] = EMPTY;
      if (win) return c;
    }

    for (const c of cands) {
      board[c.y][c.x] = humanSide; const win = isWin(c.x, c.y, humanSide); board[c.y][c.x] = EMPTY;
      if (win) return c;
    }

    const cfg = { easy: { def: 0.7, rand: 0.30, noise: 400 }, normal: { def: 0.9, rand: 0.00, noise: 40 }, hard: { def: 1.05, rand: 0.00, noise: 5 } }[difficulty];

    if (Math.random() < cfg.rand) {
      const pool = cands.filter(c => hasNeighbor(c.x, c.y, 1));
      const pick = pool.length ? pool : cands;
      return pick[Math.floor(Math.random() * pick.length)];
    }

    let best = null, bestScore = -Infinity;
    for (const c of cands) {
      const score = scorePoint(c.x, c.y, aiSide) + scorePoint(c.x, c.y, humanSide) * cfg.def + Math.random() * cfg.noise;
      if (score > bestScore) { bestScore = score; best = c; }
    }
    return best;
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  function generateReplayCode() {
    return history.map(h => (h.player === humanSide ? 'H' : 'A') + h.x + ',' + h.y).join('');
  }

  function loadReplayCode(rawCode) {
    const cleanCode = rawCode.replace(/\s+/g, '');
    const matches = cleanCode.match(/[HA]\d+,\d+/g);
    
    if (!matches || matches.length === 0) {
      alert('这个复盘码……你认真的吗？');
      return;
    }

    humanSide = matches[0][0] === 'H' ? BLACK : WHITE;
    aiSide = humanSide === BLACK ? WHITE : BLACK;

    newGame(false, true); 
    let winner = null;

    for (const m of matches) {
      const p = m[0] === 'H' ? humanSide : aiSide;
      const [x, y] = m.substring(1).split(',').map(Number);
      
      if (!inBoard(x, y) || board[y][x] !== EMPTY) break;

      board[y][x] = p;
      history.push({ x, y, player: p });
      lastMove = { x, y };
      
      if (isWin(x, y, p)) {
        winner = p;
        break;
      }
    }

    if (winner) {
      gameOver = true;
      if (winner === humanSide) setStatus('我早就说过，AI替代不了人类。', 'win');
      else setStatus('人类拉完了……', 'lose');
      draw();
    } else {
      gameOver = false;
      turn = history.length === 0 ? BLACK : (history[history.length - 1].player === BLACK ? WHITE : BLACK);
      
      if (turn === aiSide) {
        setStatus(`【${turn === BLACK ? '黑棋' : '白棋'}】AI思考中……`, 'thinking');
        draw();
        setTimeout(() => {
          if (gameOver || turn !== aiSide) return;
          const mv = findBestMove();
          if (mv) placeStone(mv.x, mv.y, aiSide);
        }, 300);
      } else {
        setStatus(`【${turn === BLACK ? '黑棋' : '白棋'}】轮到你了！`, '');
        draw();
      }
    }
  }

  function placeStone(x, y, player) {
    board[y][x] = player;
    history.push({ x, y, player });
    lastMove = { x, y };
    hoverCell = null;
    draw();

    if (isWin(x, y, player)) {
      gameOver = true;
      replayCode = generateReplayCode();
      setStatus(player === humanSide ? '我早就说过，AI替代不了人类。' : '人类拉完了……', player === humanSide ? 'win' : 'lose');
      return;
    }
    if (history.length === N * N) {
      gameOver = true;
      replayCode = generateReplayCode();
      setStatus('旗鼓相当的对手。', '');
      return;
    }

    turn = player === BLACK ? WHITE : BLACK;
    
    if (turn === aiSide) {
      setStatus(`【${turn === BLACK ? '黑棋' : '白棋'}】AI思考中……`, 'thinking');
      setTimeout(() => {
        if (gameOver || turn !== aiSide) return;
        const mv = findBestMove();
        if (mv) placeStone(mv.x, mv.y, aiSide);
      }, 220);
    } else {
      setStatus(`【${turn === BLACK ? '黑棋' : '白棋'}】轮到你了！`, '');
    }
  }

  function posToCell(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    const i = Math.round((px - pad) / cell), j = Math.round((py - pad) / cell);
    if (!inBoard(i, j)) return null;
    if (Math.hypot(px - (pad + i * cell), py - (pad + j * cell)) > cell * 0.8) return null;
    return { x: i, y: j };
  }

  canvas.addEventListener('click', (e) => {
    const c = posToCell(e.clientX, e.clientY);
    if (c && !gameOver && turn === humanSide && board[c.y][c.x] === EMPTY) {
      placeStone(c.x, c.y, humanSide);
    }
  });

  canvas.addEventListener('mousemove', (e) => {
    let c = null;
    if (!gameOver && turn === humanSide) {
      const p = posToCell(e.clientX, e.clientY);
      if (p && board[p.y][p.x] === EMPTY) c = p;
    }
    if ((c === null && hoverCell !== null) || (c && hoverCell && (c.x !== hoverCell.x || c.y !== hoverCell.y))) {
      hoverCell = c; draw();
    }
  });

  canvas.addEventListener('mouseleave', () => { if (hoverCell) { hoverCell = null; draw(); } });

  statusEl.addEventListener('click', () => {
    if (gameOver && replayCode) {
      const oldText = statusEl.textContent;
      const fallbackCopy = (text) => {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed"; ta.style.top = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          statusEl.textContent = '已复制，点击标题可导入';
        } catch (err) {
          alert('自动复制失败，请手动复制：\n\n' + text);
        }
        document.body.removeChild(ta);
        setTimeout(() => { statusEl.textContent = oldText; }, 2500);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(replayCode).then(() => {
          statusEl.textContent = '已复制，点击标题可导入';
          setTimeout(() => { statusEl.textContent = oldText; }, 2500);
        }).catch(() => fallbackCopy(replayCode));
      } else {
        fallbackCopy(replayCode);
      }
    }
  });

  titleEl.addEventListener('click', () => {
    importModal.style.display = 'flex';
    replayInput.value = '';
    replayInput.focus();
  });

  document.getElementById('btn-cancel-import').addEventListener('click', () => {
    importModal.style.display = 'none';
  });

  document.getElementById('btn-confirm-import').addEventListener('click', () => {
    const code = replayInput.value.trim();
    if (code) {
      loadReplayCode(code);
      importModal.style.display = 'none';
    }
  });

  importModal.addEventListener('click', (e) => {
    if (e.target === importModal) importModal.style.display = 'none';
  });

  function newGame(isRandom = true, skipAiMove = false) {
    board = Array.from({ length: N }, () => new Array(N).fill(EMPTY));
    history = [];
    lastMove = null;
    gameOver = false;
    hoverCell = null;
    undosLeft = 3;
    replayCode = '';
    
    undoBtn.disabled = false;
    undoBtn.textContent = `悔棋（剩余${undosLeft}次）`;

    if (isRandom) {
      const isHumanFirst = Math.random() < 0.5;
      humanSide = isHumanFirst ? BLACK : WHITE;
      aiSide = isHumanFirst ? WHITE : BLACK;
    }
    
    turn = BLACK;
    layout(); 

    if (!skipAiMove && turn === aiSide) {
      setStatus('【黑棋】AI思考中……', 'thinking');
      setTimeout(() => {
        if (gameOver || turn !== aiSide) return;
        const mv = findBestMove();
        if (mv) placeStone(mv.x, mv.y, aiSide);
      }, 500);
    } else if (!skipAiMove) {
      setStatus('【黑棋】轮到你了！', '');
    }
  }

  undoBtn.addEventListener('click', () => {
    if (gameOver || turn !== humanSide || history.length === 0 || undosLeft <= 0) return;

    undosLeft--;
    undoBtn.textContent = `悔棋（剩余${undosLeft}次）`;
    if (undosLeft === 0) undoBtn.disabled = true;

    let removedHuman = false;
    while (history.length > 0 && !removedHuman) {
      const last = history.pop();
      board[last.y][last.x] = EMPTY;
      if (last.player === humanSide) removedHuman = true;
    }

    lastMove = history.length ? { x: history[history.length - 1].x, y: history[history.length - 1].y } : null;
    gameOver = false;
    hoverCell = null;

    turn = history.length === 0 ? BLACK : (history[history.length - 1].player === BLACK ? WHITE : BLACK);

    if (turn === aiSide) {
      setStatus(`【${turn === BLACK ? '黑棋' : '白棋'}】AI思考中……`, 'thinking');
      draw();
      setTimeout(() => {
        if (gameOver || turn !== aiSide) return;
        const mv = findBestMove();
        if (mv) placeStone(mv.x, mv.y, aiSide);
      }, 400);
    } else {
      setStatus(`【${turn === BLACK ? '黑棋' : '白棋'}】轮到你了！`, '');
      draw();
    }
  });

  document.getElementById('btn-restart').addEventListener('click', () => newGame(true));
  levelEl.addEventListener('change', () => { difficulty = levelEl.value; });
  window.addEventListener('resize', layout);

  newGame(true);
})();
</script>
</body>
</html>
