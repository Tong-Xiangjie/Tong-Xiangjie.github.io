<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404宿舍 · 备份记录</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#07070a;color:#b9b9c2;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;display:flex;justify-content:center;overflow:hidden;
  }
  #app{
    width:100%;max-width:520px;height:100%;background:#101014;
    display:flex;flex-direction:column;position:relative;
    box-shadow:0 0 60px rgba(0,0,0,.9);
  }
  #app.shake{animation:shake .18s 3;}
  @keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-3px);}75%{transform:translateX(3px);}}

  /* ---------- header ---------- */
  header{
    padding:12px 16px 10px;border-bottom:1px solid #1d1d24;background:#15151a;
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  }
  .h-title{font-size:15px;color:#dcdce4;font-weight:600;letter-spacing:.5px;}
  .h-sub{font-size:11px;color:#5c5c6a;margin-top:4px;}
  .read-link{cursor:pointer;transition:color .2s;border-bottom:1px dotted #3a3a48;}
  .read-link:hover{color:#9a9aac;}
  .frag{font-size:11px;color:#41414e;letter-spacing:1px;font-variant-numeric:tabular-nums;transition:.3s;}
  .frag.on{color:#6ec9b8;text-shadow:0 0 10px rgba(110,201,184,.6);}

  #typing{
    font-size:11px;color:#4a4a58;padding:0 16px;height:18px;line-height:18px;
    opacity:0;transition:opacity .45s;font-style:italic;flex-shrink:0;
  }

  /* ---------- chat ---------- */
  #chat{flex:1;overflow-y:auto;padding:16px 12px 10px;scroll-behavior:smooth;}
  #chat::-webkit-scrollbar{width:5px;}
  #chat::-webkit-scrollbar-thumb{background:#25252e;border-radius:3px;}
  #chat::-webkit-scrollbar-track{background:transparent;}

  .time-divider{text-align:center;font-size:11px;color:#41414e;margin:20px 0 14px;letter-spacing:.5px;}
  .sys-msg{text-align:center;font-size:12px;color:#4e4e5c;margin:8px 0;line-height:1.7;}
  .recall-msg{text-align:center;font-size:11px;color:#41414e;margin:8px 0;font-style:italic;}

  .msg{display:flex;gap:9px;margin-bottom:14px;animation:msgIn .35s ease both;}
  @keyframes msgIn{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
  .avatar{
    width:32px;height:32px;border-radius:6px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;border:1px solid #2a2a34;background:#1a1a22;
  }
  .msg-body{max-width:calc(100% - 60px);}
  .sender{font-size:11px;margin-bottom:4px;opacity:.85;}
  .bubble{
    background:#1b1b22;border:1px solid #24242d;
    border-radius:3px 10px 10px 10px;padding:8px 11px;
    font-size:13.5px;line-height:1.6;color:#c2c2cc;word-break:break-word;
  }
  .msg-time{font-size:10px;color:#3a3a46;margin-top:5px;}

  .msg.self{flex-direction:row-reverse;}
  .msg.self .msg-body{text-align:right;}
  .msg.self .bubble{background:#1c2624;border-color:#28332f;border-radius:10px 3px 10px 10px;color:#b0c4be;}
  .msg.self .sender{text-align:right;color:#6a8a80;}

  .img-bubble{cursor:pointer;padding:6px;}
  .thumb{width:150px;height:100px;border-radius:6px;position:relative;overflow:hidden;}
  .thumb-room{background:linear-gradient(165deg,#20202c,#101017 60%,#0a0a0f);}
  .thumb-corridor{background:linear-gradient(180deg,#16161f,#0c0c12 70%,#08080c);}
  .thumb::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 72% 38%, rgba(190,195,220,.10), transparent 62%);
  }
  .img-label{font-size:11px;color:#5a5a6a;margin-top:6px;}

  .voice-bubble{cursor:pointer;display:flex;align-items:center;gap:8px;min-width:130px;}
  .wave{color:#6ec9b8;letter-spacing:1px;font-size:12px;}
  .vlen{font-size:11px;color:#5a5a6a;}
  .voice-text{
    margin-top:7px;font-size:12px;color:#8a8a9a;
    border-top:1px dashed #2a2a34;padding-top:7px;line-height:1.7;
    animation:msgIn .4s ease both;
  }

  /* ---------- footer ---------- */
  footer{
    display:flex;gap:8px;padding:10px 12px 14px;
    border-top:1px solid #1d1d24;background:#15151a;flex-shrink:0;
  }
  #input{
    flex:1;background:#0e0e13;border:1px solid #24242d;border-radius:6px;
    padding:9px 12px;color:#c2c2cc;font-size:13px;outline:none;font-family:inherit;
  }
  #input:focus{border-color:#3a3a48;}
  #input::placeholder{color:#3f3f4c;}
  #send{
    background:#1e1e28;border:1px solid #2a2a36;color:#8a8a9a;
    padding:0 16px;border-radius:6px;cursor:pointer;font-size:13px;
    font-family:inherit;transition:.2s;
  }
  #send:hover{background:#26262f;color:#c2c2cc;}

  /* ---------- lightbox ---------- */
  #lightbox{
    position:fixed;inset:0;background:rgba(4,4,6,.95);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    z-index:100;opacity:0;pointer-events:none;transition:opacity .35s;
  }
  #lightbox.show{opacity:1;pointer-events:auto;}
  .lb-box{width:88%;max-width:400px;}
  .photo{
    width:100%;aspect-ratio:4/3;border-radius:8px;position:relative;
    background:linear-gradient(170deg,#1a1a24,#0d0d13);
    overflow:hidden;border:1px solid #22222c;
  }
  .photo::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 60% 35%, rgba(180,190,220,.09), transparent 65%);
  }
  .fig{
    position:absolute;bottom:20%;width:24px;height:56px;
    background:#08080d;border-radius:12px 12px 3px 3px;opacity:.9;
  }
  .fig::after{
    content:'';position:absolute;top:-13px;left:50%;transform:translateX(-50%);
    width:18px;height:18px;border-radius:50%;background:#08080d;
  }
  .p-mirror{
    position:absolute;right:9%;top:16%;width:24%;height:50%;
    border:1px solid #3a3a48;background:rgba(140,150,175,.05);
    cursor:pointer;border-radius:2px;transition:.3s;
  }
  .p-mirror:hover{border-color:#5a5a70;background:rgba(140,150,175,.09);}
  .p-shadow{
    position:absolute;left:50%;bottom:6%;transform:translateX(-50%);
    width:19px;height:42px;background:#000;opacity:0;
    border-radius:9px 9px 2px 2px;transition:opacity .9s;filter:blur(1.5px);
  }
  .p-shadow::after{
    content:'';position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    width:15px;height:15px;border-radius:50%;background:#000;
  }
  .p-mirror.revealed{border-color:#7a2a2a;background:rgba(120,30,30,.08);}
  .p-mirror.revealed .p-shadow{opacity:.95;}
  .lb-hint{text-align:center;font-size:12px;color:#4e4e5c;letter-spacing:.5px;min-height:18px;}
  .lb-close{
    background:#1a1a22;border:1px solid #2a2a34;color:#7a7a8a;
    padding:8px 22px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;
  }
  .lb-close:hover{color:#c2c2cc;border-color:#3a3a48;}

  /* ---------- read modal ---------- */
  .modal{
    position:fixed;inset:0;background:rgba(4,4,6,.9);
    display:flex;align-items:center;justify-content:center;
    z-index:110;opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .modal.show{opacity:1;pointer-events:auto;}
  .modal-box{
    width:80%;max-width:330px;background:#15151a;border:1px solid #24242d;
    border-radius:10px;padding:20px;
  }
  .modal-title{font-size:13px;color:#8a8a9a;margin-bottom:16px;letter-spacing:.5px;}
  .read-list{display:flex;flex-direction:column;gap:11px;margin-bottom:18px;}
  .read-item{display:flex;align-items:center;gap:10px;font-size:13px;color:#a2a2b2;}
  .read-item .avatar{width:28px;height:28px;font-size:12px;}
  .ghost-av{
    background:#2a0d0d !important;border-color:#5a1a1a !important;color:#e05a5a !important;
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{0%,100%{opacity:.55;}50%{opacity:1;}}
  .ghost span{color:#c04a4a;font-style:italic;}
  .modal-close{
    width:100%;background:#1c1c24;border:1px solid #2a2a34;color:#8a8a9a;
    padding:9px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;
  }
  .modal-close:hover{color:#c2c2cc;}
</style>

/* ============ 渲染 ============ */
function scrollBottom(){
  requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; });
}

function buildChatMsg(m, self){
  const mem = MEMBERS[m.f] || { name:'?', color:'#888', avatar:'?' };
  const wrap = el('div', 'msg' + (self ? ' self' : ''));

  const av = el('div', 'avatar', self ? '你' : mem.avatar);
  if (self){
    av.style.background = '#1c2624';
    av.style.color = '#6a8a80';
    av.style.borderColor = '#28332f';
  } else {
    av.style.background = mem.color + '22';
    av.style.color = mem.color;
    av.style.borderColor = mem.color + '55';
  }

  const body = el('div', 'msg-body');
  const name = el('div', 'sender', self ? '你' : mem.name);
  if (!self) name.style.color = mem.color;
  body.appendChild(name);

  let content;
  if (m.img){
    content = el('div', 'bubble img-bubble');
    content.innerHTML = `<div class="thumb thumb-${m.img}"></div>
                         <div class="img-label">[图片] 点击查看</div>`;
    content.addEventListener('click', ()=> handleImageClick(m.img));
  } else if (m.voice){
    content = el('div', 'bubble voice-bubble');
    content.innerHTML = `<span class="wave">▁▃▅▂▇▃▁</span>
                         <span class="vlen">语音 ${m.voiceLen || 8}"</span>`;
    content.addEventListener('click', ()=> playVoice(content, m));
  } else {
    content = el('div', 'bubble', esc(m.x));
  }

  body.appendChild(content);
  if (m.t) body.appendChild(el('div', 'msg-time', m.t));

  wrap.appendChild(av);
  wrap.appendChild(body);
  return wrap;
}

function buildAll(){
  MESSAGES.forEach(m => {

    if (m.k === 'time'){
      node = el('div', 'time-divider', m.x);
    } else if (m.k === 'sys'){
      node = el('div', 'sys-msg', m.x);
    } else if (m.k === 'recall'){
      const mem = MEMBERS[m.f];
      node = el('div', 'recall-msg',
        `<span style="color:${mem.color};opacity:.6">${mem.name}</span> 撤回了一条消息`);
    } else {
      node = buildChatMsg(m, false);
    }
    chatEl.appendChild(node);
  });
}

/* ============ 追加消息 ============ */
function pushSys(text, d = 0){
  return new Promise(res => {
    setTimeout(()=>{
      chatEl.appendChild(el('div', 'sys-msg', text));
      scrollBottom();
      res();
    }, d);
  });
}

function xiaoluSay(text, d = 0){
  return new Promise(res => {
    setTimeout(()=>{
      chatEl.appendChild(buildChatMsg({ f:'xiaolu', x:text, t:nowTime() }, false));
      scrollBottom();
      res();
    }, d);
  });
}

function appendSelf(text){
  chatEl.appendChild(buildChatMsg({ f:'self', x:text, t:nowTime() }, true));
  scrollBottom();
}

/* ============ 碎片 ============ */
function collect(id){
  if (state.fragments.has(id)) return false;
  state.fragments.add(id);
  fragEl.textContent = `◌ ${state.fragments.size}/7`;
  fragEl.classList.add('on');
  shake();
  return true;
}

function shake(){
  const app = document.getElementById('app');
  app.classList.remove('shake');
  void app.offsetWidth;
  app.classList.add('shake');
  setTimeout(()=>app.classList.remove('shake'), 700);
}

/* ============ 图片 ============ */
function handleImageClick(kind){
  if (kind === 'corridor'){
    pushSys('图片已损坏，无法显示。');
    return;
  }
  openLightbox();
}

function openLightbox(){
  lbEl.classList.add('show');
}

lbCloseEl.addEventListener('click', ()=> lbEl.classList.remove('show'));

mirrorEl.addEventListener('click', async ()=>{
  if (mirrorEl.classList.contains('revealed')) return;
  mirrorEl.classList.add('revealed');
  shake();
  lbHint.textContent = '……他一直在那里。';
  lbHint.style.color = '#c05050';
  await delay(900);
  if (collect('f2')){
    await delay(400);
    await xiaoluSay('他一直在那里。', 300);
    await xiaoluSay('语音里也有。听完它们。', 1100);
  }
});

/* ============ 语音 ============ */
function playVoice(node, m){
  if (node.dataset.played) return;
  node.dataset.played = '1';
  const txt = el('div', 'voice-text', esc(m.voice));
  node.appendChild(txt);
  scrollBottom();

  if (collect('f3')){
    setTimeout(async ()=>{
      await xiaoluSay('你听见了。', 400);
      await xiaoluSay('看看谁读过这些话。', 1400);
    }, 500);
  }
}

/* ============ 已读列表 ============ */
function renderReadList(){
  readListEl.innerHTML = '';
  ['azhe','laochen','panghu','amay','akai','xiaolu'].forEach(k=>{
    const m = MEMBERS[k];
    const d = el('div', 'read-item');
    d.innerHTML = `<div class="avatar" style="background:${m.color}22;color:${m.color};border-color:${m.color}55">${m.avatar}</div><span>${m.name}</span>`;
    readListEl.appendChild(d);
  });
  const g = el('div', 'read-item ghost');
  g.innerHTML = `<div class="avatar ghost-av">?</div><span>你</span>`;
  readListEl.appendChild(g);
}

readEl.addEventListener('click', async ()=>{
  renderReadList();
  readModal.classList.add('show');
  if (collect('f4')){
    setTimeout(async ()=>{
      await xiaoluSay('七个。', 400);
      await xiaoluSay('试着撤回一条消息。', 1400);
    }, 800);
  }
});

readCloseEl.addEventListener('click', ()=> readModal.classList.remove('show'));

/* ============ 输入处理 ============ */
async function submit(){
  const t = inputEl.value.trim();
  if (!t) return;
  inputEl.value = '';
  await handle(t);
}

sendEl.addEventListener('click', submit);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

async function handle(t){
  if (state.ended) return;

  if (t === '我不读'){
    if (state.fragments.size >= 7) return trueEnding();
    await pushSys('还差一些东西。');
    return;
  }
  if (t === '在'){ return badEnding(); }
  if (t === '404'){ return search404(); }
  if (t === '03:33' || t === '0333' || t === '3:33'){ return search333(); }
  if (t === '镜中人'){ await pushSys('该词条不存在。'); return; }
  if (t === '/recall'){ return doRecall(); }
  if (t === '/members'){ return doMembers(); }
  if (t === '/whoami'){ return doWhoami(); }
  if (t === '/help'){
    await pushSys('可用指令：/recall /members /whoami');
    return;
  }
  return plainMessage(t);
}

/* ---------- 搜索 404 ---------- */
async function search404(){
  if (state.fragments.has('f1')){
    await pushSys('第 404 条消息不存在。');
    return;
  }
  await pushSys('正在定位第 404 条消息…');
  await pushSys('该消息不存在。', 900);
  await pushSys('该消息存在。', 1300);
  collect('f1');
  readEl.textContent = '已读 7';
  readEl.style.color = '#c05050';
  await xiaoluSay('你找到了。', 500);
  await xiaoluSay('那你已经数到七了。', 1100);
  await xiaoluSay('照片里的镜子，再看一次。', 1800);
}

/* ---------- 搜索 03:33 ---------- */
async function search333(){
  if (!state.fragments.has('f6')){
    await pushSys('搜索无结果。');
    return;
  }
  if (state.fragments.has('f7')){
    await pushSys('时间 03:33 已经在那里了。');
    return;
  }
  collect('f7');
  await pushSys('定位到时间戳 03:33…');
  await pushSys('该时间戳在本记录中出现了 404 次。', 900);
  await xiaoluSay('够了。', 700);
  await xiaoluSay('现在输入：我不读', 1500);
}

/* ---------- /recall ---------- */
async function doRecall(){
  if (!state.fragments.has('f4')){
    await pushSys('权限不足。你不在这个群里。');
    return;
  }
  if (state.fragments.has('f5')){
    await pushSys('没有更多可撤回的消息了。');
    return;
  }
  collect('f5');
  await pushSys('正在撤回…');
  await delay(800);
  await pushSys('已撤回：<span style="color:#6ec9b8">小鹿</span>：我不想被删掉。');
  await delay(500);
  await xiaoluSay('有些话本来就不该存在。', 800);
  await xiaoluSay('问问这个群有几个人。', 1600);
}

/* ---------- /members ---------- */
async function doMembers(){
  if (!state.fragments.has('f5')){
    await pushSys('未知指令。');
    return;
  }
  if (state.fragments.has('f6')){
    await pushSys('成员列表已展开。');
    return;
  }
  collect('f6');
  await pushSys('成员列表：');
  await pushSys('阿哲 · 老陈 · 胖虎 · 阿May · 阿凯 · 小鹿', 500);
  await pushSys('以及：<span style="color:#c05050">你</span>', 1100);
  memberEl.textContent = '7 人';
  memberEl.style.color = '#c05050';
  await xiaoluSay('现在你知道了。', 900);
  await xiaoluSay('03:33。你早就看见了。', 1700);
}

/* ---------- /whoami ---------- */
async function doWhoami(){
  if (!state.fragments.has('f1')){
    await pushSys('访客。');
    return;
  }
  await pushSys('你是第 <span style="color:#c05050">7</span> 个已读。');
}

/* ---------- 普通消息 ---------- */
async function plainMessage(t){
  if (!state.warned){
    state.warned = true;
    appendSelf(t);
    await delay(700);
    await xiaoluSay('别说话。', 400);
    await xiaoluSay('它会顺着声音找到你。', 1100);
    return;
  }
  appendSelf(t);
  await delay(600);
  badEnding();
}

/* ---------- 坏结局 ---------- */
async function badEnding(){
  if (state.ended) return;
  state.ended = true;
  inputEl.disabled = true;
  sendEl.disabled = true;

  await pushSys('已读回执已更新。');
  await xiaoluSay('你不该说话的。', 500);
  await xiaoluSay('现在他们知道你在看了。', 1100);
  await xiaoluSay('现在他们知道你在哪了。', 1700);
  await delay(1400);

  document.querySelectorAll('.avatar').forEach(a=>{
    a.textContent = '你';
    a.style.background = '#2a0d0d';
    a.style.color = '#e05a5a';
    a.style.borderColor = '#5a1a1a';
  });
  shake();
  await pushSys('<span style="color:#c05050;font-size:14px">你在群里了。</span>', 1200);
  document.title = '404宿舍 (1)';
}

/* ---------- 真结局 ---------- */
async function trueEnding(){
  if (state.ended) return;
  state.ended = true;
  inputEl.disabled = true;
  sendEl.disabled = true;

  await pushSys('——');
  await delay(600);
  await xiaoluSay('谢谢。', 400);
  await delay(1200);
  await pushSys('群聊已解散。');
  await pushSys('404宿舍 不存在。', 600);
  await pushSys('已读 (0)', 1200);
  readEl.textContent = '已读 0';
  readEl.style.color = '#4e4e5c';
  fragEl.style.opacity = '0';
  document.title = '未读 (0)';

  await delay(2600);
  appendSelf('别回头，它在看你的历史记录。');
}

/* ============ 幽灵输入状态 ============ */
function startGhostTyping(){
  const loop = ()=>{
    if (state.ended) return;
    typingEl.style.opacity = '1';
    setTimeout(()=>{ typingEl.style.opacity = '0'; }, 1900);
    setTimeout(loop, 11000 + Math.random() * 6000);
  };
  setTimeout(loop, 8000);
}

/* ============ 启动 ============ */
buildAll();
scrollBottom();
startGhostTyping();

// 首次进入的小提示
setTimeout(async ()=>{
  await pushSys('检测到未读消息 404 条。');
}, 2000);

})();
</script>
</body>
</html>
