# 自动生成 collection 站点的图片缩略图。
#
# 背景：缩略图不是运行时生成的，而是预先批量生成的静态文件
#   <图片根目录>/<相对路径>.<ext>  →  <图片根目录>/thumb/<相对路径>.jpg
# 前端 collection/core.js 的 getThumbUrl() 按这个约定推导路径。漏生成不会导致
# 图片显示不出来（会自动回退原图），只是多耗流量 —— 所以这是个"能自动就自动"的活儿。
#
# 这个 workflow 做的事：图片有变动时，在 Windows runner 上跑 make-thumbs.ps1，
# 把新生成的缩略图提交回仓库。这样新增纸币就只剩"放图 + 填数据"两步。
#
# 为什么用 windows-latest：make-thumbs.ps1 依赖 System.Drawing（GDI+）读图、
# 按 EXIF 纠正方向、编码 JPEG。System.Drawing 是 Windows 专有实现，
# 在 ubuntu 上需要额外装 libgdiplus 且行为不完全一致，没必要绕。
#
# ★ 下面所有 run: 的脚本正文都刻意只用 ASCII。
#   GitHub Actions 会把 run 内容写成临时脚本文件；若某个环节用 Windows PowerShell
#   5.1 且脚本是 UTF-8 无 BOM，5.1 会按 ANSI(GBK) 解码，中文字符串里的引号会被
#   截断成非法 token（本仓库的 make-thumbs.ps1 就踩过这个坑）。
#   pwsh 7 没这个问题，但没必要赌 —— 说明写在 YAML 注释里，正文保持 ASCII。
name: 生成缩略图

on:
  push:
    branches: [main]
    # 只有"可能影响缩略图"的改动才触发，避免每次改代码都跑一遍。
    # 注意：仓库根就是 tong-xiangjie.github.io，所以路径从仓库根起算。
    paths:
      - 'notecollection/image/**'
      - 'coincollection/image/**'
      - 'funcollection/*/images/**'
      - 'collection/tools/make-thumbs.ps1'
      # 本 workflow 自身改动时也跑一次，便于验证改动是否可用
      - '.github/workflows/thumbs.yml'
  # 允许在 Actions 页面手动触发（补跑历史遗漏的缩略图很有用）
  workflow_dispatch:

# 只有拿到写权限才能把缩略图提交回仓库。
# 若仓库 Settings → Actions → General 里 Workflow permissions 选的是
# "Read repository contents permission"，这里的写权限会被拒（403），
# 需要改成 "Read and write permissions"。
permissions:
  contents: write

# 同一分支的多次推送只保留最新一次，避免两次运行同时写仓库产生冲突。
concurrency:
  group: thumbs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  thumbs:
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # fetch-depth 0：提交历史完整，push 回本仓库不会因浅克隆被拒
          fetch-depth: 0

      - name: 生成缩略图
        # 脚本本身是"增量"的：缩略图已存在且不比原图旧就跳过，可重复运行。
        # continue-on-error：个别图生成失败时不中断整个 workflow，让下一步把
        # 已经成功生成的缩略图先提交上去；失败项在日志里以 Warning 列出。
        # 脚本在所有图都失败时会 exit 1，所以才需要它，而不是直接忽略退出码。
        continue-on-error: true
        shell: pwsh
        run: ./collection/tools/make-thumbs.ps1

      - name: 提交新缩略图
        shell: pwsh
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # pathspec MUST use the :(glob) magic. In a plain pathspec '*' does not
          # cross '/', so '*/image/thumb' matches nothing at all (verified: 0 hits).
          # This repo has two thumbnail layouts, hence two patterns:
          #   notecollection/image/thumb/** and coincollection/image/thumb/**
          #   funcollection/<name>/images/thumb/**
          $spec = @(':(glob)**/image/thumb/**', ':(glob)**/images/thumb/**')

          $changed = git status --porcelain -- $spec
          if (-not $changed) {
            Write-Host 'No new or updated thumbnails; nothing to commit.'
            exit 0
          }

          Write-Host 'New or updated thumbnails:'
          $changed | ForEach-Object { Write-Host "  $_" }

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $spec
          # [skip ci] keeps this commit from triggering the workflow again
          git commit -m 'chore: auto-generate image thumbnails [skip ci]'

          # Rebase first in case someone pushed while we were generating
          git pull --rebase --autostash origin $env:BRANCH
          git push origin "HEAD:$env:BRANCH"
