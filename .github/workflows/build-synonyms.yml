# 构建期生成文章搜索的同义扩展表（collection/data/synonyms.json）。
#
# 背景：文章板块要支持「生肖钞 → 十二生肖」「荷花钞 → 莲花」这类模糊搜索。
# 实测过在浏览器里跑语义模型（bge-small-zh-v1.5 / bge-large-zh-v1.5）：
#   · 小模型不具备这类世界知识，挖出来的扩张词全是「银行」这种泛词，检索被淹没；
#   · 大模型知道，但运行期要下载 312 MB，且语料同质化严重（435 对随机文章
#     平均相似度 0.648），文档级向量检索排不出正确结果。
# 也试过构建期调 LLM 现编同义词：产量大但质量不可控，产出里混着「息图」
# （从"全息图案"切出来的残片）这种根本不是词的碎片。
#
# ★ 现在的做法：构建期查《哈工大同义词词林扩展版》（人工编纂、带编码层级），
#   用田久乐 2010 的相似度算法把同义关系离线算好，写成一张小表提交进仓库；
#   运行期只做纯词法匹配 + 查表扩展 —— 零下载、零外部请求、命中原因可解释。
#   全程离线：不需要任何 API Key、不花钱、结果确定可复现。
#   算法与词典见 collection/tools/cilin.mjs 与 collection/tools/cilin_ex.txt。
name: 生成文章搜索同义词表

on:
  push:
    branches: [main]
    # 只有"可能改变术语集合"的改动才触发：
    #   · 文章正文（readmes/**）新增或修改
    #   · 纸币/硬币的分类配置（config.js / coin-config.js）—— 它决定哪些文章被收录
    #     以及分类名，而分类名本身也是搜索术语的来源之一
    paths:
      - 'notecollection/readmes/**'
      - 'coincollection/readmes/**'
      - 'funcollection/*/readmes/**'
      - 'collection/config.js'
      - 'collection/coin-config.js'
      - 'collection/tools/build-synonyms.mjs'
      - 'collection/tools/cilin.mjs'
      - 'collection/tools/cilin_ex.txt'
      - '.github/workflows/build-synonyms.yml'
  # ★ 刻意**不**接受 pull_request 触发：这个 workflow 要写仓库，
  #   不能因为任何人提 PR 就跑起来。只能 push 到 main 或手动触发。
  workflow_dispatch:

# 要把生成的表提交回仓库，必须有写权限。
# 若仓库 Settings → Actions → General → Workflow permissions 选的是
# "Read repository content permission"，这里的写权限会被拒（403），
# 需要改成 "Read and write permissions"。
permissions:
  contents: write

# 同一分支的多次推送只保留最新一次，避免两次运行同时写仓库产生冲突。
concurrency:
  group: synonyms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-synonyms:
    runs-on: ubuntu-latest
    # 纯查表，本地实测不到 1 秒；给足余量是因为 checkout/commit 可能慢。
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # fetch-depth 0：提交历史完整，push 回本仓库不会因浅克隆被拒
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ★ 这一步不是形式：cilin.mjs 是参考实现（PyPI WordSimilarity 0.0.3）
      #   的逐行移植，词典文件哪天被换掉，移植就可能对不上。
      #   这里做一次自检 —— 词林的编码层级和几个已知相似度必须成立，
      #   否则说明词典或解析坏了，宁可让 workflow 红，也不要提交一张坏表。
      - name: 自检词林解析
        shell: bash
        run: |
          set -euo pipefail
          # 用 --input-type=module：cilin.mjs 是 ESM，require() 在 Node 20 上会 ERR_REQUIRE_ESM
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { loadCilin, similarity } from "./collection/tools/cilin.mjs";
            const t = loadCilin(readFileSync("collection/tools/cilin_ex.txt", "utf8"));
            const expect = [
              ["人民", "国民", 1],
              ["人民", "群众", 0.9576614882494312],
              ["抄袭", "克隆", 0.585642777645155],
            ];
            for (const [a, b, want] of expect) {
              const got = similarity(t, a, b);
              if (got !== want) {
                console.error(`::error::词林自检失败 ${a}/${b}: 得到 ${got}，期望 ${want}`);
                process.exit(1);
              }
            }
            console.log(`词林自检通过：${t.codes.size} 词 / ${t.lines.length} 行`);
          '

      - name: 生成同义词表
        shell: bash
        run: node collection/tools/build-synonyms.mjs

      - name: 提交新表
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "repo=$GITHUB_REPOSITORY branch=$BRANCH event=$GITHUB_EVENT_NAME"

          # 只提交这两个生成物，绝不 git add -A（仓库里可能有别的手工改动）
          SPEC=(collection/data/synonyms.json collection/data/synonyms-version.js)

          if [ -z "$(git status --porcelain -- "${SPEC[@]}")" ]; then
            echo "同义词表没有变化，无需提交。"
            exit 0
          fi

          echo "本次变化："
          git status --porcelain -- "${SPEC[@]}"

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${SPEC[@]}"
          # [skip ci]：防止这次提交把 workflow 自己再触发一遍
          git commit -m 'chore: 自动更新文章搜索同义词表 [skip ci]'

          # 生成期间若有人推送，先 rebase 再推
          git pull --rebase --autostash origin "$BRANCH"

          LOCAL="$(git rev-parse HEAD)"
          echo "pushing $LOCAL to $BRANCH ..."
          set +e
          git push origin "HEAD:$BRANCH" 2>&1 | tee /tmp/push.log
          PUSH_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$PUSH_EXIT" -ne 0 ]; then
            echo "::error::git push 失败。若是 403，请把 Settings → Actions → General → Workflow permissions 设为 \"Read and write permissions\"。"
            exit 1
          fi

          # 不轻信退出码，确认真落到远端了
          REMOTE="$(git ls-remote origin "refs/heads/$BRANCH")"
          case "$REMOTE" in
            "$LOCAL"*) echo "已推送 $LOCAL 到 $BRANCH。" ;;
            *) echo "::error::push 未落地：本地 $LOCAL，远端 $REMOTE"; exit 1 ;;
          esac
