# 回归用例（collection/tools/tests/ 下的用例 + collection/tools/verify-mode-registry.mjs + check-data.mjs）
#
# 为什么要有这个 workflow：
#   这些用例原本只存在开发机上（用 .git/info/exclude 排除），换机器或误删就全没了。
#   它们记录的是这一路踩过的坑（翻面状态机、缩回动画落点、滚动记忆、占位图、
#   空状态、SW 缓存与离线、数据自检……），是这个纯静态站点唯一的自动化防线。
#   进仓库后每次 push 到 main 自动跑一遍，就不用靠"记得手动跑"了。
#
# 为什么是 ubuntu + windows 两个平台（原来只有 windows-latest）：
#   用例是在 Windows 上写的，断言里有些尺寸/文本度量依赖字体与渲染细节，所以
#   windows-latest 是"保真"的那一份（曾经担心换到 ubuntu 会踩字体差异）。
#   但只有 Windows 一份等于没验证过跨平台，而目标要求"用例在 CI（Linux/Chrome）可跑"。
#   于是改成矩阵：ubuntu 那份是**新增**的验证面，windows 那份保真不动。
#   公开仓库的 Actions 分钟数免费，多一平台只是多花点时间。
#   ★ fail-fast: false —— 两个平台各自报结果，避免一个红就把另一个还没跑完的掐掉
#     （跨平台问题恰恰需要两边都看到）。
#   ★ 2026-10 的教训：CI 上有一批"本地全绿、CI 全红"的用例，根因是 CI 环境默认关闭系统动画
#     （Chrome 报 prefers-reduced-motion: reduce），而用例断言"动画应该播"。
#     现在这类用例自己用 Emulation.setEmulatedMedia 把偏好钉成 no-preference。
#
# ★ 与 thumbs.yml 同样的约定：run: 的正文保持 ASCII，中文只写在注释和 name 里。
#   （GitHub Actions 会把 run 内容写成临时脚本，Windows PowerShell 5.1 遇到
#     UTF-8 无 BOM 的中文可能截断字符串；这里虽然只是两条 node 命令，
#     也没必要赌。）

name: 回归用例

on:
  # ★★ 2026-10-21 起**关闭 push 自动触发**（用户决定）：
  #   每次 push 到 main 都会自动跑一轮双平台回归，一旦有红就发 GitHub 失败邮件；
  #   用户明确要求"把会发邮件的那个功能关掉"，所以改成**只手动触发**。
  #   ⇒ 想跑：仓库 → Actions → 左侧「回归用例」→ Run workflow（workflow_dispatch）。
  #   ⇒ 想恢复自动：把下面两行加回来即可
  #        push:
  #          branches: [main]
  #
  #   ★ 历史教训仍然有效（将来手动跑或重新打开自动跑时先看这三类"本地全绿、CI 全红"：
  #     都与环境有关，不是产品坏了）：
  #   · CI 上 Chrome 报 prefers-reduced-motion: reduce，而用例断言"动画应该播" → 用例启动时钉死 no-preference
  #   · 断言里写死机器相关的量：窗口尺寸(14)、采样帧数(20)、按字体宽度写死的 px 阈值 → 改成按视口/相对判据
  #   · verify-sw-cache：测试服务器给 sw.js 也发了 max-age=600，导致 SW 更新被 HTTP 缓存挡住 → 只对 sw.js 发 no-cache
  #   · 2026-10-21 追加：verify-ocrb-init 的两条"反向验证"（验证"退回旧实现确实会跳"）在 windows runner
  #     上会因字体加载时序不同而红 —— 站点本身没问题，是这类"反向验证"断言依赖环境时序。
  #
  # 允许在 Actions 页面手动触发（改完用例想立刻验证时很有用）
  workflow_dispatch:

# 同一分支上新的一次 push 直接取消上一次还没跑完的，省时间也省额度
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 用例里用了全局 WebSocket / fetch，需要 Node 22+
      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 打印环境信息
        run: |
          node --version
          node -e "console.log('chrome:', process.env.CHROME_PATH || '(auto)')"

      # ★ collection 入口门禁自检：从目录现算"应覆盖清单"，断言每个 collection/**/*.html
      #   （排除 collection/tools/**）都带齐三样（meta noindex + 兜底隐藏 CSS + 同步 gate.js），
      #   并校验 robots.txt、哈希格式、"全仓库不含明文令牌"。
      #   放在跑用例**之前**：将来谁往 collection/ 里加了没挂门禁的 HTML 入口，这里立刻红，
      #   不用人肉记得去改。（这个纯静态仓库没有构建步骤，只能靠 CI 当"构建期的守卫"。）
      #   这一条只用 node 内置模块，不依赖 Chrome。
      - name: collection 门禁自检
        run: node collection/tools/gate.mjs check

      - name: 数据自检 + 全部回归用例
        run: node collection/tools/tests/run.mjs

      - name: 失败时提示怎么本地复现
        if: failure()
        run: |
          echo "See the summary at the end of the previous step."
          echo "Run locally: node collection/tools/tests/run.mjs --only <name>"
