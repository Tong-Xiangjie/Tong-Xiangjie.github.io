<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="manifest" href="../manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>学术搜索入口</title>
    <style>
        /* ═══ 字体 ═══ */
        @font-face {
            font-family: "OCRB10";
            src: url('../font/OCRB10PitchBT-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: #000000;
            font-family: "OCRB10", "Source Han Sans", "Noto Sans CJK SC", "思源黑体", "Segoe UI", system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            touch-action: pan-y;
        }

        .glass-panel {
            background: #000000;
            border-radius: 2.5rem;
            border: none;
            width: 100%;
            max-width: 580px;
            overflow: hidden;
        }

        .content {
            padding: 2.2rem 2rem 2.5rem;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 120px;
            height: 120px;
            object-fit: contain;
            opacity: 0.9;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #e6f3ff, #00aaff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 0.5rem;
        }

        .sub {
            font-size: 0.75rem;
            color: #7e8a9e;
            border-top: 1px dashed #2a3644;
            display: inline-block;
            margin-top: 0.6rem;
            padding-top: 0.5rem;
        }

        .dashboard {
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
            border-left: 5px solid #00aaff;
            padding-left: 1rem;
            color: #e6f3ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-right-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .title-btn {
            background: transparent;
            border: 1px solid #3c5a7a;
            color: #8ab3d6;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .title-btn:hover {
            background: #00aaff20;
            border-color: #00aaff;
            color: white;
        }
        .title-btn.manage-active {
            border-color: #00aaff;
            color: #66ccff;
        }

        .site-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            list-style: none;
            margin-bottom: 1.5rem;
            min-height: 100px;
        }

        .site-card {
            background: #000000;
            border-radius: 1.8rem;
            padding: 0.7rem 1rem;
            border: 1px solid #2c3e55;
            transition: border-color 0.2s, background 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: default;
            position: relative;
            touch-action: none;
            will-change: transform;
        }
        .site-card:hover {
            border-color: #3c8dbc;
        }
        .site-card.dragging-source {
            opacity: 0.3;
            border-color: #00aaff;
            background: #0a1420;
        }
        /* 拖拽时的克隆样式（浮动卡片） */
        .dragging-clone {
            border-radius: 1.8rem;
            padding: 0.7rem 1rem;
            background: #000000;
            border: 2px solid #00aaff;
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.3);
            pointer-events: none;
            z-index: 1000;
            transition: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.95;
            transform: scale(1.02);
        }
        .dragging-clone .site-name {
            color: #fff;
        }
        .dragging-clone .site-link {
            opacity: 0.7;
        }

        /* 左侧操作区（仅管理模式可见） */
        .card-actions {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            flex-shrink: 0;
        }
        .drag-handle {
            font-size: 1.4rem;
            color: #5a7a9a;
            cursor: grab;
            padding: 0.2rem 0.2rem 0 0.2rem;
            line-height: 1;
            touch-action: none;
            user-select: none;
            transition: color 0.2s;
        }
        .drag-handle:hover {
            color: #8ab3d6;
        }
        .drag-handle:active {
            cursor: grabbing;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #5a7a9a;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            line-height: 1;
            touch-action: manipulation;
        }
        .delete-btn:hover {
            color: #ff6b6b;
        }

        /* 中间名称 */
        .site-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #cde0ff;
            flex: 0 1 auto;
            min-width: 60px;
            word-break: break-word;
            margin-right: auto;
        }

        /* 右侧链接 */
        .site-link {
            background: #0b1422;
            padding: 0.3rem 0.9rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            text-decoration: none;
            color: #00aaff;
            border: 1px solid #2e5570;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .site-link:hover {
            background: #00aaff20;
            color: white;
            border-color: #00aaff;
        }

        /* 添加表单（默认隐藏，管理模式显示） */
        .add-form {
            display: none;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin: 1.2rem 0 1rem;
            border-top: 1px dashed #2a3644;
            padding-top: 1.5rem;
        }
        .add-form.visible {
            display: flex;
        }

        .add-form input {
            background: #0b1422;
            border: 1px solid #2c3e55;
            border-radius: 2rem;
            padding: 0.5rem 1rem;
            color: #cde0ff;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        .add-form input:focus {
            border-color: #00aaff;
        }
        .add-form input::placeholder {
            color: #4a6080;
        }
        .add-form #siteNameInput {
            flex: 0 1 130px;
            min-width: 80px;
        }
        .add-form #siteUrlInput {
            flex: 2 1 180px;
            min-width: 120px;
        }
        .add-form .add-btn {
            background: #00aaff;
            border: none;
            border-radius: 2rem;
            padding: 0.5rem 1.5rem;
            color: #000;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            flex: 0 0 auto;
            touch-action: manipulation;
        }
        .add-form .add-btn:hover {
            background: #66ccff;
            transform: scale(1.02);
        }

        .datetime-display {
            text-align: center;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #5a6e8a;
            font-family: "OCRB10", "Source Han Sans", "Noto Sans CJK SC", "思源黑体", monospace;
            transform: scaleX(0.9);
            transform-origin: center center;
            letter-spacing: 0.5px;
            border-top: 1px dashed #2a3644;
            padding-top: 1rem;
        }

        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            text-align: center;
            color: #3f506e;
            border-top: 1px solid #1e2a3a;
            padding-top: 1rem;
        }
        .footer-note a {
            color: #00aaff;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .content { padding: 1.2rem; }
            .add-form #siteNameInput { flex: 1 1 100%; }
            .add-form #siteUrlInput { flex: 1 1 100%; }
            .add-form .add-btn { flex: 1 1 100%; }
            .site-card { flex-wrap: wrap; gap: 0.3rem; }
            .site-name { flex: 1 1 auto; margin-right: 0; }
            .card-actions { order: 0; }
            .site-name { order: 1; }
            .site-link { order: 2; }
            .title-right-buttons { gap: 0.3rem; }
            .title-btn { font-size: 0.6rem; padding: 0.1rem 0.5rem; }
        }
    </style>
</head>
<body>
<div class="glass-panel" id="appRoot">
    <div class="content">
        <div class="dashboard">
            <div class="logo-area" style="margin-bottom: 1rem;">
                <img src="../image/headphoto.png" class="logo-icon" alt="学术搜索门户图标">
                <h1>学术搜索入口</h1>
                <div class="sub">ACADEMIC SEARCH PORTAL</div>
            </div>

            <div class="section-title">
                <span>学术数据库</span>
                <div class="title-right-buttons">
                    <button class="title-btn" id="manageBtn">站点管理</button>
                    <button class="title-btn" id="resetDefaultBtn" style="display:none;">↻ 恢复默认</button>
                </div>
            </div>

            <ul class="site-list" id="siteList"></ul>

            <div class="add-form" id="addForm">
                <input type="text" id="siteNameInput" placeholder="站点名称" />
                <input type="url" id="siteUrlInput" placeholder="网址" />
                <button class="add-btn" id="addSiteBtn">＋ 添加</button>
            </div>

            <div class="datetime-display" id="dashboardDatetime">--年--月--日 --:--:--</div>
            <div class="footer-note">
                需要<a href="https://wallesspku.org" target="_blank">梯子</a>？<br><br>
                网页建立时间：2026年7月30日<br>© 2026 铜香结 版权所有<br>Powered by GitHub Pages
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ═══ 默认站点 ═══
        const DEFAULT_SITES = [
            { id: 'default-1', name: 'Google Scholar', url: 'https://scholar.google.com/' },
            { id: 'default-2', name: '中国知网（CNKI）', url: 'http://www.cnki.net/' },
            { id: 'default-3', name: '读秀', url: 'https://www.duxiu.com/' },
            { id: 'default-3', name: 'Z-Library', url: 'https://zh.101ml.by/' },
            { id: 'default-3', name: '北京大学图书馆', url: 'https://www.lib.pku.edu.cn/' },
            { id: 'default-4', name: '清华大学图书馆', url: 'https://lib.tsinghua.edu.cn/' }
        ];

        const STORAGE_KEY = 'customSites';

        // ─── 状态 ───
        let isAdmin = false;
        let sites = [];

        // ─── 工具函数 ───
        function generateId() {
            return Date.now() + '-' + Math.random().toString(36).slice(2, 6);
        }

        function loadSites() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length) return parsed;
                }
            } catch (e) { /* ignore */ }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_SITES));
            return [...DEFAULT_SITES];
        }

        function saveSites(sites) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(sites));
        }

        sites = loadSites();

        // ─── 渲染函数 ───
        function render() {
            const container = document.getElementById('siteList');
            container.innerHTML = '';
            sites.forEach((site, index) => {
                const li = document.createElement('li');
                li.className = 'site-card';
                li.dataset.id = site.id;
                li.dataset.index = index;

                // 左侧操作区（仅在管理模式显示）
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'card-actions';
                if (isAdmin) {
                    // 拖动手柄
                    const handle = document.createElement('span');
                    handle.className = 'drag-handle';
                    handle.textContent = '≡';
                    handle.setAttribute('draggable', 'false');
                    actionsDiv.appendChild(handle);

                    // 删除按钮
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.textContent = '×';
                    delBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        deleteSite(index);
                    });
                    actionsDiv.appendChild(delBtn);
                }
                li.appendChild(actionsDiv);

                // 中间名称
                const nameSpan = document.createElement('span');
                nameSpan.className = 'site-name';
                nameSpan.textContent = site.name;
                li.appendChild(nameSpan);

                // 右侧链接
                const linkA = document.createElement('a');
                linkA.className = 'site-link';
                linkA.href = site.url;
                linkA.target = '_blank';
                linkA.textContent = site.url.replace(/^https?:\/\//, '').replace(/\/$/, '') + ' ↗';
                li.appendChild(linkA);

                container.appendChild(li);
            });
            updateIndices();

            // 控制添加表单和恢复默认按钮的显示
            const addForm = document.getElementById('addForm');
            const resetBtn = document.getElementById('resetDefaultBtn');
            if (isAdmin) {
                addForm.classList.add('visible');
                resetBtn.style.display = '';
            } else {
                addForm.classList.remove('visible');
                resetBtn.style.display = 'none';
            }

            // 管理按钮文本
            const manageBtn = document.getElementById('manageBtn');
            manageBtn.textContent = isAdmin ? '退出管理' : '站点管理';
            manageBtn.classList.toggle('manage-active', isAdmin);
        }

        function updateIndices() {
            const cards = document.querySelectorAll('.site-card');
            cards.forEach((card, idx) => {
                card.dataset.index = idx;
            });
        }

        // ─── 拖拽逻辑（只在管理模式有效） ───
        let dragState = null;

        function getTargetIndex(clientY, excludeElement) {
            const container = document.getElementById('siteList');
            const cards = Array.from(container.children).filter(c => c !== excludeElement);
            if (cards.length === 0) return 0;

            const firstRect = cards[0].getBoundingClientRect();
            if (clientY < firstRect.top) return 0;

            const lastRect = cards[cards.length - 1].getBoundingClientRect();
            if (clientY > lastRect.bottom) return cards.length;

            for (let i = 0; i < cards.length; i++) {
                const rect = cards[i].getBoundingClientRect();
                const midY = rect.top + rect.height / 2;
                if (clientY < midY) {
                    return i;
                }
            }
            return cards.length;
        }

        function movePlaceholderToIndex(targetIndex) {
            const element = dragState.element;
            const container = document.getElementById('siteList');
            const children = Array.from(container.children);

            if (targetIndex === dragState.index) return;

            if (element.parentNode) {
                element.parentNode.removeChild(element);
            }

            if (targetIndex >= children.length) {
                container.appendChild(element);
            } else {
                const newChildren = Array.from(container.children);
                if (targetIndex < newChildren.length) {
                    container.insertBefore(element, newChildren[targetIndex]);
                } else {
                    container.appendChild(element);
                }
            }

            const movedSite = sites.splice(dragState.index, 1)[0];
            let insertIdx = targetIndex;
            if (targetIndex > dragState.index) insertIdx = targetIndex - 1;
            sites.splice(insertIdx, 0, movedSite);
            dragState.index = insertIdx;
            updateIndices();
        }

        function onDragStart(e) {
            if (!isAdmin) return; // 非管理模式禁止拖拽
            const handle = e.target.closest('.drag-handle');
            if (!handle) return;
            e.preventDefault();

            const card = handle.closest('.site-card');
            if (!card) return;
            const index = parseInt(card.dataset.index, 10);
            if (isNaN(index)) return;

            const rect = card.getBoundingClientRect();
            const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

            const clone = card.cloneNode(true);
            clone.style.position = 'fixed';
            clone.style.pointerEvents = 'none';
            clone.style.zIndex = '1000';
            clone.style.width = rect.width + 'px';
            clone.style.height = rect.height + 'px';
            clone.style.left = (clientX - (clientX - rect.left)) + 'px';
            clone.style.top = (clientY - (clientY - rect.top)) + 'px';
            clone.classList.add('dragging-clone');
            clone.querySelectorAll('button, a').forEach(el => {
                el.style.pointerEvents = 'none';
            });
            document.body.appendChild(clone);

            card.classList.add('dragging-source');

            dragState = {
                element: card,
                index: index,
                clone: clone,
                offsetX: clientX - rect.left,
                offsetY: clientY - rect.top
            };

            const moveEvent = e.type === 'touchstart' ? 'touchmove' : 'mousemove';
            const upEvent = e.type === 'touchstart' ? 'touchend' : 'mouseup';

            function onMove(ev) {
                ev.preventDefault();
                const cx = ev.type === 'touchmove' ? ev.touches[0].clientX : ev.clientX;
                const cy = ev.type === 'touchmove' ? ev.touches[0].clientY : ev.clientY;

                dragState.clone.style.left = (cx - dragState.offsetX) + 'px';
                dragState.clone.style.top = (cy - dragState.offsetY) + 'px';

                const targetIndex = getTargetIndex(cy, dragState.element);
                if (targetIndex !== -1 && targetIndex !== dragState.index) {
                    movePlaceholderToIndex(targetIndex);
                }
            }

            function onUp(ev) {
                if (dragState.clone && dragState.clone.parentNode) {
                    dragState.clone.parentNode.removeChild(dragState.clone);
                }
                if (dragState.element) {
                    dragState.element.classList.remove('dragging-source');
                }
                saveSites(sites);
                document.removeEventListener(moveEvent, onMove);
                document.removeEventListener(upEvent, onUp);
                dragState = null;
            }

            document.addEventListener(moveEvent, onMove);
            document.addEventListener(upEvent, onUp);
        }

        // ─── 操作函数 ───
        function deleteSite(index) {
            if (!isAdmin) return;
            if (sites.length <= 1) {
                alert('请至少保留一个站点。');
                return;
            }
            if (!confirm(`确定要删除“${sites[index].name}”吗？`)) return;
            sites.splice(index, 1);
            saveSites(sites);
            render();
        }

        function addSite(name, url) {
            if (!isAdmin) return false;
            name = name.trim();
            url = url.trim();
            if (!name || !url) {
                alert('请输入站点名称和网址。');
                return false;
            }
            try {
                new URL(url);
            } catch (_) {
                alert('请输入有效的网址！');
                return false;
            }
            const newSite = { id: generateId(), name, url };
            sites.push(newSite);
            saveSites(sites);
            render();
            return true;
        }

        function resetToDefault() {
            if (!isAdmin) return;
            if (!confirm('确认要恢复默认吗？当前所有自定义修改将丢失。')) return;
            sites = DEFAULT_SITES.map(s => ({ ...s }));
            saveSites(sites);
            render();
        }

        // ─── 切换管理模式 ───
        function toggleAdmin() {
            isAdmin = !isAdmin;
            render();
            // 如果退出管理，且当前有拖拽未完成，强制结束（但拖拽会在鼠标释放后结束）
            if (!isAdmin && dragState) {
                // 模拟结束
                if (dragState.clone && dragState.clone.parentNode) {
                    dragState.clone.parentNode.removeChild(dragState.clone);
                }
                if (dragState.element) {
                    dragState.element.classList.remove('dragging-source');
                }
                dragState = null;
                // 移除可能残留的事件监听（但这里无法轻易移除，不过释放鼠标时会自动清理）
                // 也可以忽略，因为下次拖拽会重新绑定
            }
        }

        // ─── 初始化 ───
        function init() {
            sites = loadSites();
            render();

            // 管理按钮
            document.getElementById('manageBtn').addEventListener('click', toggleAdmin);

            // 恢复默认
            document.getElementById('resetDefaultBtn').addEventListener('click', resetToDefault);

            // 添加按钮
            document.getElementById('addSiteBtn').addEventListener('click', function() {
                const nameInput = document.getElementById('siteNameInput');
                const urlInput = document.getElementById('siteUrlInput');
                if (addSite(nameInput.value, urlInput.value)) {
                    nameInput.value = '';
                    urlInput.value = '';
                }
            });
            document.getElementById('siteNameInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); document.getElementById('addSiteBtn').click(); }
            });
            document.getElementById('siteUrlInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); document.getElementById('addSiteBtn').click(); }
            });

            // 拖拽事件（委托）
            const list = document.getElementById('siteList');
            list.addEventListener('mousedown', onDragStart);
            list.addEventListener('touchstart', onDragStart, { passive: false });

            // 时钟
            function formatCurrentDateTime() {
                const now = new Date();
                return `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
            }
            function updateDatetime() {
                const el = document.getElementById('dashboardDatetime');
                if (el) el.textContent = formatCurrentDateTime();
            }
            updateDatetime();
            setInterval(updateDatetime, 1000);
        }

        if (document.readyState === 'complete') {
            init();
        } else {
            window.addEventListener('load', init);
        }
    })();
</script>

<!-- Service Worker -->
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../sw.js').catch(e => console.warn('SW注册失败', e));
}
</script>
</body>
