  return fromHoriz < ANG_FLAT;
}

function addParticles(x, y, color, n = 12, power = 1){
  for (let i = 0; i < n; i++){
    const a = rnd(0, TAU), sp = rnd(40, 260) * power;
    particles.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: rnd(.3, .8), max: .8, color, r: rnd(1.5, 3.6)
    });
  }
}

const BRICK_COLORS = ['#31f2ff', '#4dff9e', '#ffd93d', '#ff9f1c', '#ff3ea5'];

function brickColor(b){
  if (b.solid)  return '#6b7fa8';
  if (b.portal) return '#8b5cf6';                       // 传送门画成圆环，见 drawBricks
  if (b.golden) return '#fff0b8';                       // 浅金：和三血砖的 #ffd93d 明确区分
  if (b.turn)   return '#e2e8f0';                       // 银白：箭头看得最清楚
  if (b.bomb)   return '#ff6b35';                       // 橙红：危险信号
  if (b.magnet) return '#a3e635';                       // 黄绿：和场地绿 #4dff9e 拉开
  // 软砖用深棕，刻意比裂纹砖的 #a9744a 更暗更红：两者都是"棕色系"，
  // 但裂纹砖是"旧的、有裂缝的"，软砖是"被炸开、变脆了"，靠明度分得开。
  if (b.soft)   return b.hp <= 1 ? '#6d3a22' : '#8b4a2b';
  if (b.crack)  return b.hp <= (b.crackAt || CRACK_AT) ? '#8a5a3b' : '#a9744a';
  return BRICK_COLORS[clamp(b.hp - 1, 0, 4)];
}

// 选关缩略图用的颜色（按图案里的类型值取色，没有砖块对象）
function tilePreviewColor(v){
  if (v === T.SOLID)    return 'rgba(122,146,190,.85)';
  if (v === T.GOLD)     return '#fff0b8';
  if (v === T.SOFT)     return '#8b4a2b';
  if (v === T.BOMB)     return '#ff6b35';
  if (v === T.MAGNET)   return '#a3e635';
  if (isPortalTile(v))  return '#8b5cf6';
  if (isTurnTile(v))    return '#e2e8f0';
  if (isCrackTile(v))   return '#a9744a';
  return BRICK_COLORS[clamp(v - 1, 0, 4)];
}

// 练习模式（无限生命）的分数不计入最高分
function saveBest(){
  if (G.practice) return;
  if (G.score > G.best){
    G.best = G.score;
    localStorage.setItem('neon-breaker-best', String(G.best));
  }
}

// 实心砖被炸开 -> 变成棕色软砖。
// 注意是"就地换一个 type"，不是标 dead：软砖的可破坏，所以它自动进入通关条件
// （通关判定是 every(b => b.dead || isFurniture(b))，软砖既没死也不是 furniture）。
// 每块实心砖只会被炸开一次（炸过之后 solid 就是 false 了）。
function convertSolidToSoft(b){
  b.type = T.SOFT;
  b.solid = false;
  b.soft = true;
  b.hp = SOFT_HP;
  b.max = SOFT_HP;
  b.hit = 1;
  addParticles(b.x + b.w/2, b.y + b.h/2, '#8b4a2b', 14, 1);
  floats.push({ x: b.x + b.w/2, y: b.y + b.h/2, text: '炸开了', color: '#c98a5a', life: .9, vy: -46 });
}

// 爆炸（炸药砖被打掉时触发）—— 缓释环：
// 波前随时间向外扩张，碰到砖才结算，所以视觉和因果是一致的
// （如果吃到瞬间一次性算完，那个环就只是事后动画）。
// 每块砖对同一波最多结算一次（hit 数组按砖对象引用去重）。
const BOMB_R0 = 12, BOMB_RMAX = 150, BOMB_SPEED = 680, MAX_WAVES = 6;
function explode(x, y, opts){
  opts = opts || {};
  // 炸药砖在关卡里不会只出现一块：旧版把它们全生成在同一个位置，
  // 环会重叠成一个点，所以给一点偏移。
  const cx = x + rnd(-8, 8), cy = y + rnd(-8, 8);
  if (shockwaves.length >= MAX_WAVES) shockwaves.shift();
  shockwaves.push({
    x: cx, y: cy, r: BOMB_R0, rmax: opts.rmax || BOMB_RMAX,
    speed: opts.speed || BOMB_SPEED,
    forceSolids: opts.forceSolids !== false,   // 是否把实心砖炸成软砖
    hit: [], done: false, t: 0
  });
  G.flash = Math.max(G.flash, .45);
  G.shake = Math.max(G.shake, 13);
  addParticles(cx, cy, '#ff6b35', 22, 1.2);
  Sound.hard();
}

// 一圈波打碎了一堆砖，连击不能就这么无限涨上去：
// 单次最多推进 COMBO_PER_EXPLOSION 级（与设计文档里的 min(hits,4) 对齐），
// 否则"一炸 15 块"会让倍率直接冲到 3 倍以上，后面的分数全乱。
const COMBO_PER_EXPLOSION = 4, COMBO_CAP = 10;
function splashDamage(b, x, y){
  const before = G.combo;
  if (before >= COMBO_CAP) { damage(b, x, y); G.combo = before; return; }
  damage(b, x, y);
  if (G.combo - before > COMBO_PER_EXPLOSION) G.combo = before + COMBO_PER_EXPLOSION;
}

function updateShockwaves(dt){
  for (let i = shockwaves.length - 1; i >= 0; i--){
    const w = shockwaves[i];
    w.t += dt;
    w.r += w.speed * dt;
    explodingDepth++;                 // 波内的炸药砖不再自行爆炸（只连锁一级）
    for (const b of bricks){
      if (b.dead || b.portal) continue;
      if (w.hit.includes(b)) continue;
      const dx = b.x + b.w/2 - w.x, dy = b.y + b.h/2 - w.y;
      if (dx*dx + dy*dy > w.r * w.r) continue;
      w.hit.push(b);
      if (b.solid){
        // 每块实心砖只被炸开一次，不反复消耗同一块
        if (w.forceSolids && !w.softened) { convertSolidToSoft(b); w.softened = true; }
      } else {
        splashDamage(b, b.x + b.w/2, b.y + b.h/2);
      }
    }
    explodingDepth--;
    if (w.r >= w.rmax) shockwaves.splice(i, 1);
  }
}

// ============================ 磁力 buff ============================
// 打中磁铁砖的那颗球会被磁化 MAGNET_LIFE 秒，期间主动朝最近的活砖修正航向。
//
// 这一版是**刻意替换掉引力井**的。旧版"打掉磁铁砖 -> 原地留一个引力井"有两个
// 实测出来的死穴：
//   · 井的偏转只有 1~6°（球越快越小，而球每次撞挡板都加速 1.2%），玩家根本感受不到；
//   · 实测 5 分钟真实对局里，球落在井半径内的时间只占 **0.2%~0.6% 的帧**。
//     因为井开在砖区（磁铁砖原地），而球大部分时间在中下部飞，井只活 8 秒。
// 结果就是"看不见的装饰"。现在改成把状态**挂在球身上**：效果跟球走，玩家一眼
// 能看见球变色、能看见球拐弯去找砖。
//
// 磁力买的是**操作量的减免**：磁力期间玩家只要保证球别掉下去，瞄准交给球自己。
// 两条硬约束：
//   1. **只在上行时修正**（vy < 0）。球往下掉时若还朝砖修正，它就永远回不到
//      挡板、也就永远不会掉 —— 等于把游戏唯一的失败条件删掉了。
//   2. **只转方向、不改速率**。在速度矢量上做纯旋转，速率原样保留，所以磁力
//      既不会凭空加速、也不会减速，1000 的速率上限不受影响。
const MAGNET_LIFE = 10;                        // 磁力持续 10 秒
// 规则 3：磁力球用引导的加强版。基准取引导的**残局基准**（4°/帧），乘 2.5
// -> 10°/帧 ≈ 600°/s。这个量级下球约 9 帧（0.15 秒）就能转过 90°，
// 视觉上就是"被磁铁吸着走"，和"这段时间球自己会找砖"的承诺一致。
// 磁力**不**受残局门控约束 —— 它是打掉磁铁砖换来的奖励，本来就该一直有效。
const MAGNET_BOOST = 2.5;
const MAGNET_TURN = ASSIST_TURN_BASE * MAGNET_BOOST;

// 给球挂上磁力（打中磁铁砖时调用）。
function grantMagnet(ball){
  if (!ball) return;
  ball.magnet = MAGNET_LIFE;
  // 磁力是"球自己会找砖"，所以反馈打在球上：一圈绿环从球上炸开
  addParticles(ball.x, ball.y, '#a3e635', 16, 1.0);
}

// 每帧对一颗球调用一次：消耗磁力时长，并在上行时把速度矢量朝最近的活砖旋转。
// 返回本帧是否真的转了方向（供视觉标记使用）。
function applyMagnet(b, dt){
  if (!(b.magnet > 0)) return false;
  // 递减必须夹到**精确的 0**：浮点累积会留下 ~1e-18 的正残渣，
  // 那样 b.magnet > 0 会多成立一帧（球多绿一帧、还多转一次方向）。
  b.magnet -= dt;
  if (b.magnet < 1e-6) b.magnet = 0;
  if (b.magnet === 0) return false;
  if (b.vy >= 0) return false;                 // 只在上行时修正，见上面的约束 1
  // 只瞄**直线打得着**的砖（nearestAimBrick 会跳过被死砖挡住的目标）。
  // 这里**不回退**：磁力是奖励，宁可这一帧不掰，也不能把球往死砖上送。
  const tgt = nearestAimBrick(b.x, b.y, false);
  // 记下这一帧真正瞄的是哪块砖，画引导线时直接用它 ——
  // 画的和掰的必须是同一个目标，否则那条线就是在骗玩家。
  b.magTarget = tgt ? { x: tgt.x + tgt.w/2, y: tgt.y + tgt.h/2 } : null;
  if (!tgt) return false;
  const sp = Math.hypot(b.vx, b.vy);
  if (sp <= 1) return false;
  const cur = Math.atan2(b.vy, b.vx);
  const want = Math.atan2(tgt.y + tgt.h / 2 - b.y, tgt.x + tgt.w / 2 - b.x);
  const diff = Math.atan2(Math.sin(want - cur), Math.cos(want - cur));
  const turn = clamp(diff, -MAGNET_TURN, MAGNET_TURN);
  if (!turn) return false;
  const na = cur + turn;
  b.vx = Math.cos(na) * sp;                    // 纯旋转：速率原样保留
  b.vy = Math.sin(na) * sp;
  return true;
}

function damage(b, bx, by, ball){
  if (isFurniture(b)){
    // 实心砖与传送门都打不掉（传送门在碰撞循环里已单独处理，这里只是兜底）
    Sound.hard();
    addParticles(bx, by, b.portal ? '#8b5cf6' : '#9fb3d9', 6, .5);
    G.shake = Math.max(G.shake, b.portal ? 3 : 5);
    return;
  }
  // 只要**打中**就重置停滞计时，不是只有打碎才算。
  // 这是防卡死引导的关键前提：引导要解决的是"球永远碰不到剩下的砖"，
  // 而不是"玩家打得慢"。旧版按"砖数变化"重置，于是对着 5 血砖连敲 5 下、
  // 只要超过阈值引导就开，实测第 20 关有 39% 的帧处于引导状态。
  //
  // 注意上面 furniture 的早退**故意**在重置之前：撞实心砖不算"有进展"。
  // 如果撞实心砖也清零，那么球被夹在实心砖之间来回弹时会永远不清零，
  // 引导和 40 秒强制重发**双双失效** —— 那才是真正的死循环。
  G.stuckTimer = 0;
  b.hp--; b.hit = 1;
  if (b.hp > 0){
    Sound.brick(b.row);
    addParticles(bx, by, brickColor(b), 6, .6);
    return;
  }
  // 击破
  b.dead = true;
  if (b.crack){
    // 裂纹砖：碎掉但不加分、不累计连击、也不掉道具 —— 它是纯障碍，
    // 但必须清掉才能通关，所以要付出击打次数作为代价。
    addParticles(b.x + b.w/2, b.y + b.h/2, '#8a5a3b', 18, 1.1);
    Sound.hard();
    return;
  }
  if (b.bomb){
    // 炸药砖：一击即爆，在它自己的位置放一圈爆炸。
    // 爆炸能清掉邻近的砖、也能把实心砖炸成软砖；但"炸药砖引爆炸药砖"
    // 只允许连一级，否则一排炸药砖会连锁掉半屏，分数和连击都失控。
    const cx = b.x + b.w/2, cy = b.y + b.h/2;
    addParticles(cx, cy, '#ff6b35', 20, 1.2);
    G.combo++; G.comboTimer = 2.2;
    G.score += 60;
    saveBest();
    floats.push({ x: cx, y: cy, text: '爆炸', color: '#ff6b35', life: .9, vy: -46 });
    Sound.hard();
    if (!explodingDepth) explode(cx, cy);
    return;
  }
  if (b.magnet){
    // 磁铁砖：打掉它的那颗球获得 10 秒磁力（球自己会去找砖），球会变色。
    // 注意它和其它砖一样正常加分/掉道具 —— 磁力是额外赠品，不是替代品。
    const cx = b.x + b.w/2, cy = b.y + b.h/2;
    G.combo++; G.comboTimer = 2.2;
    const mult = 1 + Math.min(G.combo - 1, 9) * .25;
    const gain = Math.round((20 + (b.max - 1) * 15) * mult);
    G.score += gain;
    saveBest();
    floats.push({ x: cx, y: cy, text: '+' + gain + ' 磁力', color: '#a3e635', life: .9, vy: -46 });
    addParticles(cx, cy, '#a3e635', 20, 1.1);
    Sound.brick(b.row);
    grantMagnet(ball);
    spawnDrops(cx, cy);
    return;
  }
  G.combo++; G.comboTimer = 2.2;
  const mult = 1 + Math.min(G.combo - 1, 9) * .25;
  const base = b.golden ? 120 : 20 + (b.max - 1) * 15;
  const gain = Math.round(base * mult);
  G.score += gain;
  saveBest();
  floats.push({ x: b.x + b.w/2, y: b.y + b.h/2, text: '+'+gain + (G.combo>1?` x${mult.toFixed(2)}`:''), color: brickColor(b), life: .8, vy: -50 });
  addParticles(b.x + b.w/2, b.y + b.h/2, brickColor(b), b.golden ? 26 : 14, b.golden ? 1.3 : 1);
  Sound.brick(b.row);
  spawnDrops(b.x + b.w/2, b.y + b.h/2);
}

function loseLife(){
  if (G.practice){
    // 本局是练习模式：不扣命、不结束，直接重发球
    // 只认 practice（而不是选关开关 infinite），避免开关状态影响普通模式
    G.combo = 0;
    G.shake = 6;
    Sound.lose();
    resetBall();
    // 挡板宽度保持不变：其他道具效果（三球、减速）在掉命后也不重置，
    // 单独把宽度打回 130 会让玩家觉得"吃的 W 白吃了"。
    G.state = S.READY;
    G.msg = '重新发球';
    G.msgTimer = 1.2;
    return;
  }
  G.lives--;
  G.combo = 0;
  G.shake = 18;
  if (G.lives <= 0){
    G.state = S.OVER;
    Sound.over();
    clearSave(false);       // 命耗尽了：存档作废，避免读档回到必死局面
    autoSaveArmed = false;
    return;
  }
  Sound.lose();
  resetBall();
  // 同上：掉命不重置挡板宽度，否则刚吃到的加宽道具会被无声收回
  G.state = S.READY;
  G.msg = '剩余 ' + G.lives + ' 条命';
  G.msgTimer = 1.4;
  saveProgress(false);      // 掉命也是关键节点
}

/* ============================ 更新 ============================ */
function update(dt){
  G.time += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 60);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 1.6);
  if (G.slowFx > 0) G.slowFx = Math.max(0, G.slowFx - dt);
  if (G.msgTimer > 0) G.msgTimer = Math.max(0, G.msgTimer - dt);
  if (G.comboTimer > 0){ G.comboTimer -= dt; if (G.comboTimer <= 0) G.combo = 0; }

  // 自动存档：游玩中每 60 秒写一次（只在真正在打的时候计时）
  if (autoSaveArmed && G.state === S.PLAY){
    G.playTime += dt;
    autoSaveTimer += dt;
    if (autoSaveTimer >= 60) saveProgress(false);
  }

  // 进度停滞计时：长时间没打掉砖块 -> 反弹时会逐渐加扰动（见挡板碰撞处）
  const remain = bricks.reduce((n, b) => n + (isFurniture(b) || b.dead ? 0 : 1), 0);
  if (remain !== G.lastBricks){ G.lastBricks = remain; G.stuckTimer = 0; }
  else if (G.state === S.PLAY) G.stuckTimer += dt;

  // 兜底：扰动+引导都还没打开局面，就直接把球召回挡板重新发射，
  // 换一个全新角度。40 秒空等本身已经很难受了，这一步对正常玩法不可见。
  if (G.stuckTimer > 40 && G.state === S.PLAY && balls.length && !balls[0].stuck){
    G.stuckTimer = 0;
    const b = balls[0];
    b.stuck = true;
    b.x = paddle.x + paddle.w/2;
    b.y = paddle.y - b.r - 1;
    b.vx = 0; b.vy = 0;
    b.trail.length = 0;
    b.vTimer = 0;
    addParticles(b.x, b.y, '#ffd93d', 18, 1);
    floats.push({ x: b.x, y: b.y - 22, text: '重新发球', color: '#ffd93d', life: 1.0, vy: -40 });
    if (window.__NB_DEBUG) window.__NB_DEBUG.reloads = (window.__NB_DEBUG.reloads || 0) + 1;
    launch();                                   // 立刻以全新角度再发一次
  }

  // 粒子 & 飘字（任何状态都跑，视觉上不断）
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1 - 2.2*dt); p.vy = p.vy*(1 - 2.2*dt) + 190*dt;
    if (p.life <= 0) particles.splice(i,1);
  }
  for (let i = floats.length - 1; i >= 0; i--){
    const f = floats[i];
    f.life -= dt; f.y += f.vy*dt; f.vy *= (1 - 1.4*dt);
    if (f.life <= 0) floats.splice(i,1);
  }
  for (const b of bricks) if (b.hit > 0) b.hit = Math.max(0, b.hit - dt*4);

  if (G.state !== S.PLAY && G.state !== S.READY) return;

  /* ---- 挡板 ---- */
  const spd = 760;
  let dir = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A'])  dir -= 1;
  if (keys['ArrowRight']|| keys['d'] || keys['D'])  dir += 1;
  const prevX = paddle.x;
  if (dir){
    paddle.x += dir * spd * dt;
    pointerTarget = null;              // 键盘优先，避免鼠标残留位置拽走挡板
  } else if (pointerTarget !== null){
    const want = pointerTarget - paddle.w/2;
    paddle.x += (want - paddle.x) * Math.min(1, dt * 16);
  }
  clampPaddle();
  paddle.vx = (paddle.x - prevX) / Math.max(dt, 1e-4);

  /* ---- 球 ---- */
  for (let i = balls.length - 1; i >= 0; i--){
    const b = balls[i];

    if (b.stuck){
      b.x = paddle.x + paddle.w/2 + b.offset;
      b.y = paddle.y - b.r - 1;
    } else {
      // 子步长防穿透
      const speed = Math.hypot(b.vx, b.vy);
      const steps = clamp(Math.ceil(speed * dt / 6), 1, 8);
      const sdt = dt / steps;
      for (let s = 0; s < steps; s++){
        b.x += b.vx * sdt;
        b.y += b.vy * sdt;

        // 墙
        let hitWall = false;
        if (b.x - b.r < 24){ b.x = 24 + b.r; b.vx = Math.abs(b.vx); hitWall = true; Sound.wall(); addParticles(b.x, b.y, '#31f2ff', 4, .4); }
        if (b.x + b.r > W - 24){ b.x = W - 24 - b.r; b.vx = -Math.abs(b.vx); hitWall = true; Sound.wall(); addParticles(b.x, b.y, '#31f2ff', 4, .4); }
        if (b.y - b.r < 24){ b.y = 24 + b.r; b.vy = Math.abs(b.vy); hitWall = true; Sound.wall(); addParticles(b.x, b.y, '#31f2ff', 4, .4); }
        if (hitWall){
          // 保险 4：撞墙也算一次"死反弹"（没碰到任何可破坏砖）
          b.deadBounces++;
          if (!cycleBreak(b)) reflectNudge(b, null);   // 转个圈优先于拨正
        }

        // 挡板
        if (b.vy > 0 &&
            b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
            b.x >= paddle.x - b.r && b.x <= paddle.x + paddle.w + b.r){
          b.y = paddle.y - b.r;
          const rel = clamp((b.x - (paddle.x + paddle.w/2)) / (paddle.w/2), -1, 1);
          let sp = Math.hypot(b.vx, b.vy);
          sp = clamp(sp * 1.012, 400, 1000);
          // 最小偏角 12°：rel≈0 时也不能打成正垂直，否则会陷入竖直死循环
          const MINA = 0.2095;                         // 12°
          let ang = rel * (Math.PI/3);
          if (Math.abs(ang) < MINA) ang = (rel < 0 ? -MINA : MINA);
          // 防卡死：**只在残局**（可破坏砖 ≤3）时介入，否则某些角度组合会让最后几块砖
          // 永远打不到。触发只有停滞计时器一条（8 秒开始爬升，25 秒满强度）。
          //
          // 这里**没有**"出射角贴水平就当场拨"那条分支：挡板模型的出射角是
          // `rel × 60°` 偏离竖直（|rel| ≤ 1，另有 12° 最小偏角），也就是
          // 离水平 **30°~78°** —— 永远不可能 < 30°。所以挡板弹射这一侧
          // 由构造决定不会产生"贴水平"，检查它是死代码。贴水平只可能来自
          // 墙/砖反射，那两种在 reflectNudge 里处理。
          let assist = assistGate() ? clamp((G.stuckTimer - 8) / 17, 0, 1) : 0;
          // 规则 2：最后几块砖加强（砖越少，同样 assist 值改得越狠）
          assist = clamp(assist * assistBoost(), 0, 1);
          if (assist > 0){
            b.assistFx = .2;                       // 视觉标记：这球正在被引导
            ang += (Math.random() * 2 - 1) * assist * 0.5;
            ang = clamp(ang, -1.45, 1.45);
            // 和"每帧引导"、"磁力"统一：一律瞄砖心（原来这里瞄的是砖的左上角）。
            // fallback=true 保住「卡关」修复 —— 口袋里的砖直线是被挡着的。
            const tgt = nearestAimBrick(b.x, b.y, true);
            if (tgt){
              const cx = tgt.x + tgt.w / 2, cy = tgt.y + tgt.h / 2;
              const want = Math.atan2(cy - b.y, cx - b.x) + (Math.random() - 0.5) * 0.3;
              const cur = Math.atan2(-Math.abs(Math.cos(ang)), Math.sin(ang));  // 反弹后的实际方向
              let diff = want - cur;
              diff = Math.atan2(Math.sin(diff), Math.cos(diff));
              const na = cur + diff * assist;          // 满强度时直接指向目标砖
              ang = Math.atan2(Math.sin(na), -Math.abs(Math.cos(na)));
              // 记下真正瞄的点，否则引导线会画到上一次（或根本没有）的目标上
              b.aimTarget = { x: cx, y: cy };
            }
          }
          b.vx = Math.sin(ang) * sp + paddle.vx * .10;
          b.vy = -Math.abs(Math.cos(ang) * sp);
          // 挡板横甩极快时可能把 vx 顶到过大，收一下比例保证仍是向上的球
          const maxVx = sp * 0.86;
          if (Math.abs(b.vx) > maxVx) b.vx = Math.sign(b.vx) * maxVx;
          b.vy = -Math.sqrt(Math.max(sp*sp - b.vx*b.vx, sp*sp*0.26));
          Sound.paddle();
          addParticles(b.x, paddle.y, '#4dff9e', 5, .5);
        }

        // 传送门：球心进入门格就送到配对的另一扇门（不反弹）
        if (b.portalCd > 0) b.portalCd = Math.max(0, b.portalCd - sdt);
        else {
          const pg = portalAt(b.x, b.y);
          const pair = pg === portalA ? portalB : pg === portalB ? portalA : null;
          if (pg && pair){
            b.x = pair.x + pair.w/2;
            b.y = pair.y + pair.h/2;
            b.portalCd = 0.25;            // 防止刚穿出来就被另一扇门吸回去
            b.trail.length = 0;           // 清拖尾，否则会画出一条横跨全屏的线
            addParticles(b.x, b.y, '#8b5cf6', 16, 1);
            Sound.power();
            // ★ 次数是**一对门共享**的（不分 A/B）：每成功传送一次就少一次，
            //   用满 PORTAL_MAX_USES (10) 次之后**两扇门一起消失**。
            //   为什么共享而不是各算各的：门是"一对装置"，玩家在门之间来回穿，
            //   按 A/B 各算 10 次会让一对门实际能用 20 次，和"传送门是有限资源"
            //   这个设计意图不符。门上显示的数字就是**剩余次数**（见 drawPortalBrick）。
            portalUses++;
            if (portalUses >= PORTAL_MAX_USES) expirePortals();
          }
        }

        // 砖块
        for (const br of bricks){
          if (br.dead || br.portal) continue;   // 传送门只负责传送，不参与碰撞
          if (b.x + b.r < br.x || b.x - b.r > br.x + br.w) continue;
          if (b.y + b.r < br.y || b.y - b.r > br.y + br.h) continue;

          // 找出从哪一侧撞入
          const ox = Math.min(Math.abs(b.x + b.r - br.x), Math.abs(br.x + br.w - (b.x - b.r)));
          const oy = Math.min(Math.abs(b.y + b.r - br.y), Math.abs(br.y + br.h - (b.y - b.r)));
          if (ox < oy){
            b.vx = -b.vx;
            b.x += (b.x < br.x + br.w/2) ? -(ox + .5) : (ox + .5);
          } else {
            b.vy = -b.vy;
            b.y += (b.y < br.y + br.h/2) ? -(oy + .5) : (oy + .5);
          }
          damage(br, b.x, b.y, b);
          // 保险 4 的计数：撞死砖 = 死反弹；打到可破坏砖 = 有进展，计数清零
          if (br.solid) b.deadBounces++;
          else b.deadBounces = 0;
          // 转弯砖：先按正常反弹离开砖面，再按砖上的箭头改写方向
          // （先反弹再改向，避免球被送进砖块内部）
          if (br.turn && br.dir){
            const s2 = Math.hypot(b.vx, b.vy) || 1;
            const base = Math.atan2(br.dir[1], br.dir[0]);
            const a = base + (Math.random() - 0.5) * 0.20;   // ±5.7°，避开正竖直的退化轨迹
            b.vx = Math.cos(a) * s2;
            b.vy = Math.sin(a) * s2;
            b.vTimer = 0;
            // 转弯砖给的是**设计者指定的方向**，不是"卡住的角度"。
            // 规则 1 的角度触发如果不让路，就会在下一帧把它原样掰回去
            // （最近的那块砖往往就是刚撞的这块），转弯砖在残局里等于废掉。
            // 所以给一个短暂的"让路窗口"：这段时间里只有停滞计时器能触发引导。
            b.turnLock = 0.35;
            addParticles(b.x, b.y, '#e2e8f0', 8, .8);
          }
          // 撞砖瞬间的拨正：出射角不对就一次拨正（刚被转弯砖改过向时 turnLock 会让路）
          // 死砖上的"连续砸了 10 次"由保险 4 接管（它转完就不必再拨了）
          if (!(br.solid && cycleBreak(b))) reflectNudge(b, br);
          break;
        }
      }
    }

    // 磁力 buff：打中磁铁砖的球在 10 秒内会主动朝最近的活砖修正航向
    // （只在上行时，见 applyMagnet 的约束）。它是**可见且刻意**的：球会变色，
    // 玩家能一眼看出"这一段时间球自己会去找砖"，于是可以把注意力全放在别掉球上。
    if (applyMagnet(b, dt)) b.magnetFx = 1;

    // 保险 2：**反弹瞬间的一次性拨正**（玩家反馈："如果拨正了就不要一直管了，
    //   只有检测到某次反弹的瞬间角度不对就引导一下，否则不引导"）。
    //
    // 这条取代了原来的"每帧朝目标转一点点"。区别很关键：
    //   · 旧版是**过程**——只要航向落在危险角度里就每帧都掰，实测介入 10.6% 的帧、
    //     相邻介入间隔中位数只有 1 帧，于是 0.2 秒的视觉残留被不停续上，
    //     屏幕上就是一条"一直在"的引导线（等于持续自动瞄准）；
    //   · 新版是**事件**——只在墙/砖/挡板反射发生的那一帧判断出射角，
    //     不对就一次拨正、然后**撒手**。两帧之间球走的是**纯净的反射**。
    // 触发条件是**贴水平**（规则 1 收窄后不再含竖直）。
    // 强度：一次到位（按比例直接拨向目标砖），不再受"每帧最多几度"的限制 ——
    //   既然是单次事件，就该一下拨够；残局里仍按规则 2 乘加强倍率。
    if (b.turnLock > 0) b.turnLock = Math.max(0, b.turnLock - dt);
    // 保险 4 的"转个圈"静默期：这段时间护送先别瞄，让新轨道真的走出去
    if (b.aimMute > 0) b.aimMute = Math.max(0, b.aimMute - dt);

    // 保险 2b：**残局的停滞护送** —— 这一条仍然是**每帧**的。
    //
    // 为什么它不能跟着一起改成事件：它的活是"把球弄进那个被实心砖围住的口袋"，
    // 而**绕过障碍进到某个位置**本质上需要连续修正 —— 只在反射那一帧拨一次，
    // 球会在口袋里被弹开、下一次反射又拨回来，来回蹭却进不去。
    // 实测代价：改成一事件制之后，"被实心砖封死的盘面 300 秒内过关 ≥1 次"
    // 这条端到端断言开始**偶发失败**（12 次里有 2 次读到「过关 0 次」）。
    //
    // 它和角度规则的分工很清楚：
    //   · 角度规则管"这一趟航向不对"——一次拨正就够，而且必须撒手（玩家要求）；
    //   · 护送管"球还没到那个够不到的地方"——是一件要持续做的事，停不下来。
    // 触发仍然只有残局（`assistGate()`）+ 停滞 > 5 秒，所以中局不会因此常亮。
    escortToBricks(b);

    // 视觉标记衰减（磁力本身用 b.magnet 计时，这里只是给绘制用的残留计时）
    if (b.assistFx > 0) b.assistFx = Math.max(0, b.assistFx - dt);
    if (b.magnetFx > 0) b.magnetFx = Math.max(0, b.magnetFx - dt * 2.5);

    // 拖尾
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 14) b.trail.shift();

    // 保险 3：连续 5 秒近乎纯竖直弹跳 -> 强制纠偏，避免无限竖直死循环
    verticalNudge(b, dt);

    // 掉落
    if (b.y - b.r > H + 20){
      balls.splice(i, 1);
    }
  }

  if (balls.length === 0 && (G.state === S.PLAY)) loseLife();

  /* ---- 道具下落 ---- */
  for (let i = drops.length - 1; i >= 0; i--){
    const d = drops[i];
    d.t += dt;
    d.y += d.v * dt;
    if (d.y > H + 30){ drops.splice(i,1); continue; }
    if (d.y > paddle.y - 12 && d.y < paddle.y + paddle.h + 10 &&
        d.x > paddle.x - 14 && d.x < paddle.x + paddle.w + 14){
      applyPower(d.p, POWER_SCORE);
      addParticles(d.x, d.y, d.p.c, 16, .9);
      drops.splice(i,1);
    }
  }

  /* ---- 爆炸波（炸药砖）---- */
  updateShockwaves(dt);

  /* ---- 通关判定 ---- */
  if (G.state === S.PLAY && bricks.every(b => b.dead || isFurniture(b))){
    G.score += 250 + G.level * 100;
    saveBest();
    G.state = S.LEVEL;
    G.msg = '关卡清除！ +' + (250 + G.level*100);
    G.msgTimer = 3;
    Sound.win();
    for (let i = 0; i < 60; i++) addParticles(rnd(60, W-60), rnd(80, 360), ['#31f2ff','#ff3ea5','#ffd93d','#4dff9e'][i%4], 1, 1.2);
    // 不在这里存档：此刻砖块全空，存档会正好落在"待进下一关"的瞬间。
    // 存档点放在 nextLevel() 里（新一关刚铺好）。
  }
}

/* ============================ 绘制 ============================ */
function roundRect(x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

// 把整个画布（含 16:10 之外多出来的留边）填成和游戏内一致的底色。
// 以前留边是"清空后的透明"，露出 body 的 CSS 渐变，于是画面上有一条明显的黑带，
// 看起来像"游戏没铺满、鼠标会跑出去"。填上之后整个窗口是一块完整的画面。
// 注意：这里在 CSS 像素坐标系里画（调用点已 setTransform(dpr,...)），所以用 view.w/h。
function fillWholeCanvas(){
  ctx.save();
  const g = ctx.createLinearGradient(0, 0, 0, view.h);
  g.addColorStop(0, '#0b1030');
  g.addColorStop(1, '#05060f');
  ctx.fillStyle = g;
  // 多画 2px：画面被屏幕震动平移时不会在边缘露出未填充的一线
  ctx.fillRect(-1, -1, view.w + 2, view.h + 2);
  ctx.restore();
}

function drawBackground(){
  fillWholeCanvas();

  // 网格
  ctx.save();
  ctx.strokeStyle = 'rgba(49,242,255,.065)';
  ctx.lineWidth = 1;
  const off = (G.time * 18) % 40;
  for (let x = -40 + off; x < W + 40; x += 40){
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = -40 + off; y < H + 40; y += 40){
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();

  // 边框
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, 'rgba(49,242,255,.55)');
  g.addColorStop(.5, 'rgba(120,80,255,.35)');
  g.addColorStop(1, 'rgba(255,62,165,.55)');
  ctx.save();
  ctx.strokeStyle = g;
  ctx.lineWidth = 3;
  roundRect(22, 22, W-44, H-44, 14);
  ctx.stroke();
  ctx.restore();
}

// 裂纹砖的裂纹（打到阈值后才画）
function drawCrackLines(b){
  ctx.strokeStyle = 'rgba(28,14,4,.8)';
  ctx.lineWidth = 1.6;
  const cx = b.x + b.w/2, cy = b.y + b.h/2;
  for (let i = 0; i < 3; i++){
    const o = (i - 1) * b.w * 0.22;
    ctx.beginPath();
    ctx.moveTo(cx + o - 6, b.y + 4);
    ctx.lineTo(cx + o + 3, cy);
    ctx.lineTo(cx + o - 3, b.y + b.h - 4);
    ctx.stroke();
  }
}

// 传送门：黑洞本体 + 旋转能量环 + **剩余次数**
//
// 门上标的是"这对门还能用几次"（`PORTAL_MAX_USES - portalUses`）。
// 原来标的是 A/B 字母，现在换掉了，两个原因：
//   · 次数是**一对共享**的（不分 A/B），两端显示同一个数字 —— 字母本来就是为了
//     区分两端，既然次数不分家，"哪个是 A"对玩家已经没有任何用处；
//   · 剩下几次是玩家真正需要的信息（它决定了要不要现在就用掉这扇门）。
// 快用完（≤3）时数字转成琥珀色，并在门内圈出一道剩余量的弧。
function drawPortalBrick(b){
  const cx = b.x + b.w/2, cy = b.y + b.h/2;
  const rr = Math.min(b.w, b.h) * 0.52;
  ctx.save();
  ctx.shadowColor = '#8b5cf6';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#08061a';
  ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.fill();

  ctx.strokeStyle = '#8b5cf6';
  ctx.lineWidth = 2.4;
  const a0 = G.time * 2.2 + (b.portalId === 2 ? Math.PI : 0);   // 两个门反向转
  for (let i = 0; i < 3; i++){
    const a = a0 + i * (TAU / 3);
    ctx.beginPath(); ctx.arc(cx, cy, rr + 1, a, a + 1.1); ctx.stroke();
  }
  ctx.globalAlpha = .45 + .3 * Math.sin(G.time * 4);
  ctx.strokeStyle = '#c4b5fd';
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(cx, cy, rr * 0.55, 0, TAU); ctx.stroke();

  // 剩余次数（一对共享，所以两端显示的是同一个数）
  const left = Math.max(0, PORTAL_MAX_USES - portalUses);
  const low = left <= 3;
  const ink = low ? '#ffd93d' : '#e9d5ff';
  // 剩余量弧：和数字同义，但一眼能看出"还剩多少比例"
  ctx.globalAlpha = .9;
  ctx.strokeStyle = low ? '#ffd93d' : '#a78bfa';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, rr - 1.5, -Math.PI/2, -Math.PI/2 + TAU * (left / PORTAL_MAX_USES));
  ctx.stroke();

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.fillStyle = ink;
  ctx.font = 'bold 11px Segoe UI, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(left), cx, cy + 1);
  ctx.restore();
}

function drawBricks(){
  for (const b of bricks){
    if (b.dead) continue;
    if (b.portal){ drawPortalBrick(b); continue; }     // 传送门画成圆环，不是方块
    const col = brickColor(b);
    const glow = b.hit > 0 ? .55 + b.hit * .8 : (b.solid ? .12 : .3);
    ctx.save();
    ctx.shadowColor = col;
    ctx.shadowBlur = b.solid ? 6 : 14 * glow + 6;

    const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    grad.addColorStop(0, col);
    grad.addColorStop(1, 'rgba(0,0,0,.35)');
    ctx.globalAlpha = b.solid ? .5 : .9;
    ctx.fillStyle = grad;
    roundRect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();

    // 金砖再镶一圈白光：它和三血砖都偏黄，靠这道边 + ★ 区分开
    if (b.golden){
      ctx.globalAlpha = .45 + .4 * Math.sin(G.time * 5);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      roundRect(b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3, 5);
      ctx.stroke();
    }

    // 高光条
    ctx.globalAlpha = b.solid ? .25 : .5;
    ctx.fillStyle = '#fff';
    roundRect(b.x + 3, b.y + 3, b.w - 6, 3, 2);
    ctx.fill();

    // 血量刻度 / 特殊标记
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    if (b.solid){
      ctx.strokeStyle = 'rgba(200,220,255,.35)';
      ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++){
        ctx.beginPath();
        ctx.moveTo(b.x + b.w*i/4, b.y + 5);
        ctx.lineTo(b.x + b.w*i/4, b.y + b.h - 5);
        ctx.stroke();
      }
    } else if (b.bomb){
      // 炸药砖：实心圆 + 引线火花，中心一个"爆"字提示
      const cx = b.x + b.w/2, cy = b.y + b.h/2;
      ctx.fillStyle = 'rgba(40,14,4,.85)';
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(b.w, b.h) * 0.30, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = '#ffd9a0';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(b.w, b.h) * 0.30, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = '#ffe8c8';
      ctx.font = 'bold 12px Segoe UI, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('爆', cx, cy + 1);
    } else if (b.turn){
      // 转弯砖：大大的方向箭头（箭头决定球被打中后往哪飞）
      ctx.fillStyle = 'rgba(18,24,44,.9)';
      ctx.font = 'bold 16px Segoe UI, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(TURN_ARROW[b.type] || '?', b.x + b.w/2, b.y + b.h/2 + 1);
    } else if (b.golden){
      ctx.fillStyle = 'rgba(70,50,0,.7)';
      ctx.font = 'bold 14px Segoe UI, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('★', b.x + b.w/2, b.y + b.h/2 + 1);
    } else if (b.magnet){
      // 磁铁砖：一个"磁"字 + 一道马蹄弧，远远就能认出来
      const cx = b.x + b.w/2, cy = b.y + b.h/2;
      ctx.strokeStyle = 'rgba(20,34,8,.85)';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(cx, cy - 1, Math.min(b.w, b.h) * 0.24, Math.PI, 0);   // 马蹄的弯
      ctx.stroke();
      ctx.fillStyle = 'rgba(20,34,8,.9)';
      ctx.font = 'bold 11px Segoe UI, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('磁', cx, cy + 4);
    } else if (b.soft){
      // 软砖：深棕 + 几道"碎纹"，提醒它是被炸脆的（区别于裂纹砖的竖裂缝）
      ctx.strokeStyle = 'rgba(255,214,170,.30)';
      ctx.lineWidth = 1.2;
      const sx = b.x + b.w/2, sy = b.y + b.h/2;
      for (let i = -1; i <= 1; i++){
        ctx.beginPath();
        ctx.moveTo(sx + i * b.w * 0.22 - 4, sy - 6);
        ctx.lineTo(sx + i * b.w * 0.22 + 3, sy + 1);
        ctx.lineTo(sx + i * b.w * 0.22 - 2, sy + 7);
        ctx.stroke();
      }
      if (b.hp > 1){
        ctx.fillStyle = 'rgba(255,225,200,.75)';
        ctx.font = 'bold 13px Segoe UI, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(b.hp, sx, sy + 1);
      }
    } else if (b.crack){
      // 裂纹砖：打到阈值后显出裂纹，并把剩余耐久写在中间
      if (b.hp <= (b.crackAt || CRACK_AT)) drawCrackLines(b);
      ctx.fillStyle = 'rgba(30,16,6,.65)';
      ctx.font = 'bold 13px Segoe UI, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(b.hp, b.x + b.w/2, b.y + b.h/2 + 1);
    } else if (b.hp > 1){
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.font = 'bold 13px Segoe UI, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(b.hp, b.x + b.w/2, b.y + b.h/2 + 1);
    }
    ctx.restore();
  }
}

function drawShockwaves(){
  if (!shockwaves.length) return;
  ctx.save();
  for (const w of shockwaves){
    const k = clamp(w.r / w.rmax, 0, 1);
    ctx.shadowColor = '#ff6b35';
    ctx.shadowBlur = 16;
    // 外圈：主波前。注意每画一个圆都要重新 beginPath ——
    // 否则两个 arc 会挂进同一条路径，stroke 时被连成一条线。
    ctx.globalAlpha = (1 - k) * 0.85;
    ctx.strokeStyle = '#ffb066';
    ctx.lineWidth = 3 * (1 - k) + 1;
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r, 0, TAU);
    ctx.stroke();
    // 内圈跟在后面，制造"冲击"的层次感
    ctx.globalAlpha = (1 - k) * 0.4;
    ctx.strokeStyle = '#ff8a4a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r * 0.62, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPaddle(){
  const grad = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
  grad.addColorStop(0,   '#31f2ff');
  grad.addColorStop(.5,  '#ffffff');
  grad.addColorStop(1,   '#ff3ea5');
  ctx.save();
  ctx.shadowColor = '#31f2ff';
  ctx.shadowBlur = 22;
  ctx.fillStyle = grad;
  roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
  ctx.fill();
  ctx.restore();
}

// 球的外观。磁力会整体变色，所以抽成一个函数：绘制和测试共用同一份定义，
// 不会出现"测试以为变色了、实际画的时候没变"。
function ballStyle(b){
  return b.magnet > 0
    ? { edge: '#a3e635', core: '#f2ffd6', glow: '#a3e635', blur: 26 }   // 磁化：黄绿
    : { edge: '#31f2ff', core: '#ffffff', glow: '#ffffff', blur: 20 };  // 平常：青白
}

function drawBalls(){
  for (const b of balls){
    const mag = b.magnet > 0;
    // 球的外观要能一眼读出两件事：
    //   · 磁力（b.magnet > 0）  -> 整个球变黄绿，拖尾也变黄绿
    //   · 防卡死引导正在掰弯它  -> 外面加一圈琥珀色虚线环 + 一条指向目标砖的虚线
    // 这两件事玩家都"看不见原因"（一个是 buff，一个是系统介入），所以必须画出来，
    // 否则玩家只会觉得"球莫名其妙拐弯了"。
    const st = ballStyle(b);

    // 拖尾
    ctx.save();
    for (let i = 0; i < b.trail.length; i++){
      const t = b.trail[i];
      const k = i / b.trail.length;
      ctx.globalAlpha = k * .38;
      ctx.fillStyle = st.edge;
      ctx.beginPath();
      ctx.arc(t.x, t.y, b.r * k * .95, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.shadowColor = st.glow;
    ctx.shadowBlur = st.blur;
    const grad = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, b.r + 2);
    grad.addColorStop(0, st.core);
    grad.addColorStop(1, st.edge);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill();
    ctx.restore();

    // 磁力：外面套一个脉冲环，让"球正被磁化"一眼可见
    if (mag){
      ctx.save();
      ctx.globalAlpha = .55 + .35 * Math.sin(G.time * 9);
      ctx.strokeStyle = '#a3e635';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 4.5, 0, TAU);
      ctx.stroke();
      ctx.restore();

      // 磁力引导线：绿色虚线环 + 指向"它正在瞄的那块砖"的虚线，和琥珀色的
      // 防卡死引导同构 —— 两种机制用颜色区分，玩家一眼能认出是谁在掰球。
      // 目标直接取 applyMagnet 这一帧真正用的 b.magTarget，画的和掰的保证是同一个，
      // 否则这条线就是在骗玩家。只在上行时画：球往下掉时磁力本来就不介入。
      const mt = b.magTarget;
      if (mt && b.vy < 0){
        ctx.save();
        ctx.globalAlpha = .8;
        ctx.strokeStyle = '#a3e635';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 8.5, 0, TAU);
        ctx.stroke();
        ctx.globalAlpha = .5;
        ctx.setLineDash([5, 6]);
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(mt.x, mt.y);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 防卡死引导：琥珀色虚线环 + 指向目标砖的虚线，说明球为什么在拐弯。
    // 目标用引导这一帧真正瞄的 b.aimTarget，**不重新算** ——
    // 否则屏幕上那条线和球实际被掰的方向可能不是同一块砖。
    if (b.assistFx > 0){
      ctx.save();
      ctx.globalAlpha = clamp(b.assistFx / .2, 0, 1) * .95;
      ctx.strokeStyle = '#ffd93d';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 7, 0, TAU);
      ctx.stroke();
      const tgt = b.aimTarget;
      if (tgt){
        ctx.globalAlpha *= .55;
        ctx.setLineDash([5, 6]);
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(tgt.x, tgt.y);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}

function drawDrops(){
  for (const d of drops){
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(Math.sin(d.t * 4) * .22);
    // 深色胶囊 + 彩色亮边 + 白色字符：形状和砖块明确区分，
    // 颜色也不必再和砖块调色板挤在一起
    ctx.shadowColor = d.p.c;
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#0a0f24';
    roundRect(-15, -11, 30, 22, 7);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = d.p.c;
    ctx.lineWidth = 2;
    roundRect(-15, -11, 30, 22, 7);
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px Segoe UI, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(d.p.ch, 0, 1);
    ctx.restore();
  }
}

function drawParticles(){
  ctx.save();
  for (const p of particles){
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawFloats(){
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats){
    ctx.globalAlpha = clamp(f.life / .8, 0, 1);
    ctx.font = 'bold 16px Segoe UI, sans-serif';
    ctx.shadowColor = f.color; ctx.shadowBlur = 10;
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.restore();
}

function drawHUD(){
  ctx.save();
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 22px Segoe UI, sans-serif';

  // 分数
  ctx.textAlign = 'left';
  ctx.shadowColor = '#31f2ff'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#dff6ff';
  ctx.fillText(String(G.score).padStart(6, '0'), 40, 48);

  ctx.shadowBlur = 0;
  ctx.font = '11px Segoe UI, sans-serif';
  ctx.fillStyle = 'rgba(223,246,255,.45)';
  ctx.fillText('BEST ' + G.best, 40, 68);

  // 练习模式横幅（分数不计入最高分）
  if (G.practice){
    ctx.save();
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 11px Segoe UI, sans-serif';
    ctx.strokeStyle = 'rgba(255,217,61,.75)';
    ctx.lineWidth = 1.4;
    ctx.shadowColor = '#ffd93d'; ctx.shadowBlur = 10;
    roundRect(40, 78, 186, 19, 9);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd93d';
    ctx.fillText('练习模式 · 无限生命 · 不计分', 50, 88);
    ctx.restore();
  }

  // 生命
  ctx.textAlign = 'right';
  if (G.infinite){
    ctx.save();
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ffd93d'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffd93d';
    ctx.font = 'bold 26px Segoe UI, sans-serif';
    ctx.fillText('∞', W - 40, 48);
    ctx.font = '11px Segoe UI, sans-serif';
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,217,61,.6)';
    ctx.fillText('无限生命', W - 40, 68);
    ctx.restore();
  } else {
    // 最多画 7 个点，多出来的用 "+N" 表示，避免生命很多时被静默截断
    const MAXDOTS = 7;
    const dots = Math.min(G.lives, MAXDOTS);
    for (let i = 0; i < dots; i++){
      ctx.save();
      ctx.shadowColor = '#ff3ea5'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#ff3ea5';
      ctx.beginPath();
      ctx.arc(W - 42 - i*22, 48, 6, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    if (G.lives > MAXDOTS){
      ctx.save();
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 13px Segoe UI, sans-serif';
      ctx.fillStyle = '#ff3ea5';
      ctx.shadowColor = '#ff3ea5'; ctx.shadowBlur = 10;
      ctx.fillText('+' + (G.lives - MAXDOTS), W - 42 - dots*22 - 4, 48);
      ctx.restore();
    }
    ctx.save();
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.font = '11px Segoe UI, sans-serif';
    ctx.fillStyle = 'rgba(223,246,255,.45)';
    ctx.fillText('LEVEL ' + (G.level + 1), W - 40, 68);
    ctx.restore();
  }

  // 连击
  if (G.combo > 1){
    ctx.save();
    ctx.textAlign = 'center';
    const k = clamp(G.comboTimer / 2.2, 0, 1);
    ctx.globalAlpha = .45 + .55 * k;
    ctx.font = 'bold 20px Segoe UI, sans-serif';
    ctx.shadowColor = '#ffd93d'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#ffd93d';
    ctx.fillText('COMBO x' + G.combo, W/2, 48);
    ctx.restore();
  }

  // 慢动作提示
  if (G.slowFx > 0){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.globalAlpha = clamp(G.slowFx, 0, 1) * .8;
    ctx.fillStyle = '#31f2ff';
    ctx.font = 'bold 13px Segoe UI, sans-serif';
    ctx.fillText('SLOW MOTION', W/2, 72);
    ctx.restore();
  }
  ctx.restore();
}

function centerText(lines){
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach(l => {
    ctx.font = l.font;
    ctx.shadowColor = l.color; ctx.shadowBlur = l.blur ?? 16;
    ctx.fillStyle = l.color;
    ctx.fillText(l.text, W/2, l.y);
  });
  ctx.restore();
}

    ctx.restore();
    centerText([

      { text: '本局分数  ' + G.score, y: H/2 + 14, font: '22px Segoe UI, sans-serif', color: '#dff6ff' },

// 选关卡片里的迷你地图（每行一条 12px 色条，按 10 格切分）
function drawPreview(grid, x, y, cw, rh){
  const g = 1.5, cwid = cw / 10;
  const oy = y - (grid.length - 1) * (rh + g) / 2;
  for (let r = 0; r < grid.length; r++){
    const row = grid[r];
    const ry = oy + r * (rh + g);
    for (let c = 0; c < 10; c++){
      const v = row[c];
      if (!v) continue;
      ctx.fillStyle = tilePreviewColor(v);
      roundRect(x + c * (cwid + g), ry, cwid, rh, 1.5);
      ctx.fill();
    }
  }
}

    ctx.font = '11px Segoe UI, sans-serif';

    ctx.fillText(it.note, 304, y + 34);

    if (it.kind === 'random'){
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(255,217,61,.75)';
      ctx.font = 'bold 11px Segoe UI, sans-serif';
      ctx.fillText('随机生成', 878, y + 16);
    }
    ctx.restore();
  });

  centerText([{ text: `最高分 ${G.best}`, y: H - 40, font: '12px Segoe UI, sans-serif',
                color: 'rgba(223,246,255,.4)', blur: 0 }]);
}

                color: shareUI.copied ? '#4dff9e' : 'rgba(223,246,255,.65)', blur: 0 }]);

  const lines = wrapCode(shareUI.code, 44);
  const top = 132, lh = 19;
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 15px Consolas, "Courier New", monospace';
  ctx.fillStyle = '#dff6ff';
  ctx.shadowColor = '#31f2ff'; ctx.shadowBlur = 6;
  // 用暗色底衬出选区，方便三击选中整段
  const bw = Math.min(44, ...lines.map(l => l.length)) * 9.1 + 24;
  ctx.globalAlpha = .5;
  ctx.fillStyle = 'rgba(49,242,255,.10)';
  roundRect(60, top - 16, W - 120, lines.length * lh + 20, 10);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#dff6ff';
  lines.forEach((l, i) => ctx.fillText(l, 74, top + i * lh));
  ctx.restore();

  centerText([
    { text: '同一台设备的备份：按 F9 读档即可恢复', y: H - 96, font: '13px Segoe UI, sans-serif',
      color: 'rgba(223,246,255,.5)', blur: 0 },
    { text: '换设备：把上面整段发过去（聊天/备忘录都行），在那台设备打开游戏后按 I 粘贴导入',
      y: H - 70, font: '14px Segoe UI, sans-serif', color: '#9fe8ff', blur: 6 },
    { text: 'Esc / Enter 关闭', y: H - 38, font: 'bold 15px Segoe UI, sans-serif', color: '#ffd93d' },
  ]);
}

// 存档码导入界面
function drawImportScreen(){
  ctx.save();
  ctx.fillStyle = '#04050d';   // 不透明：避免透出后面的 HUD/关卡
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  centerText([{ text: '导 入 存 档', y: 92, font: '900 36px Segoe UI, sans-serif', color: '#4dff9e' }]);
  centerText([{ text: importUI.msg, y: 130, font: '14px Segoe UI, sans-serif',
                color: importUI.ok ? '#4dff9e' : (importUI.text ? '#ff9f1c' : 'rgba(223,246,255,.7)'), blur: 0 }]);

  // 输入框
  ctx.save();
  ctx.strokeStyle = importUI.ok ? '#4dff9e' : 'rgba(49,242,255,.5)';
  ctx.lineWidth = 2;
  if (importUI.ok){ ctx.shadowColor = '#4dff9e'; ctx.shadowBlur = 12; }
  roundRect(70, 168, W - 140, 132, 12);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = 'bold 14px Consolas, "Courier New", monospace';
  ctx.fillStyle = importUI.text ? '#dff6ff' : 'rgba(223,246,255,.3)';
  const shown = importUI.text || '（在这里 Ctrl+V 粘贴存档码…）';
  wrapCode(shown, 52).slice(0, 6).forEach((l, i) => ctx.fillText(l, 88, 186 + i * 19));
  ctx.restore();

  centerText([
    { text: 'Ctrl+V 粘贴   ·   回车 导入   ·   Esc 取消', y: H - 108, font: 'bold 16px Segoe UI, sans-serif', color: '#ffd93d' },
    { text: '存档码来自另一台设备的「E 导出」', y: H - 76, font: '13px Segoe UI, sans-serif',
      color: 'rgba(223,246,255,.5)', blur: 0 },
    { text: '导入会覆盖本机当前存档', y: H - 46, font: '13px Segoe UI, sans-serif', color: 'rgba(255,91,91,.75)', blur: 0 },
  ]);
}

// 自绘准星：细十字 + 中心点 + 外圈虚线 + 一道光晕（因为原生光标被 cursor:none 隐藏了）
// 坐标已由 toWorld 夹进游戏区，所以准星永远可见、永远指向挡板实际会去的位置。
// 这里不再有"变暗"分支 —— 变暗窗口存在的前提是"有区域不控制挡板"，而我们已经消除了那种区域。
function drawReticle(){
  if (!mouse.hasPointer) return;
  const x = clamp(mouse.x, 14, W - 14);
  const y = clamp(mouse.y, 14, H - 14);
  const pulse = 0.85 + 0.15 * Math.sin(G.time * 4.5);
  ctx.save();
  ctx.shadowColor = '#31f2ff';
  ctx.shadowBlur = 10;
  ctx.lineWidth = 1.6;

  // 十字：留有中心空隙
  ctx.globalAlpha = pulse * 0.9;
  ctx.strokeStyle = '#dff6ff';
  ctx.beginPath();
  ctx.moveTo(x - 17, y); ctx.lineTo(x - 6, y);
  ctx.moveTo(x + 6,  y); ctx.lineTo(x + 17, y);
  ctx.moveTo(x, y - 17); ctx.lineTo(x, y - 6);
  ctx.moveTo(x, y + 6);  ctx.lineTo(x, y + 17);
  ctx.stroke();

  // 中心点
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(x, y, 1.9, 0, TAU);
  ctx.fill();

  // 外圈（虚线旋转）
  ctx.globalAlpha = pulse * 0.5;
  ctx.strokeStyle = '#31f2ff';
  ctx.lineWidth = 1.4;
  const a0 = G.time * 1.6;
  for (let i = 0; i < 4; i++){
    const a = a0 + i * (TAU / 4);
    ctx.beginPath();
    ctx.arc(x, y, 21, a, a + 0.55);
    ctx.stroke();
  }
  ctx.restore();

  // 指向挡板的引导虚线（挡板跟鼠标走，给一点"连起来了"的反馈）
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.strokeStyle = '#31f2ff';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);
  ctx.beginPath();
  ctx.moveTo(x, y + 26);
  ctx.lineTo(x, paddle.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function render(){
  // 先按 CSS 像素清空整个画布（含留边），再切回逻辑坐标系绘制
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, view.w, view.h);
  setFrameTransform();

  ctx.save();
  if (G.shake > .2){
    ctx.translate(rnd(-G.shake, G.shake) * .35, rnd(-G.shake, G.shake) * .35);
  }
  drawBackground();
  drawBricks();
  drawShockwaves();       // 爆炸波画在砖之上：砖被炸开时环是压在砖面上的
  drawDrops();
  drawPaddle();
  drawBalls();
  drawParticles();
  drawFloats();
  ctx.restore();

  if (G.flash > 0){
    ctx.save();
    ctx.globalAlpha = G.flash * .25;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  if (G.state === S.SELECT){
    drawSelect();         // 选关界面自带布局，不叠游戏 HUD
  } else {
    drawHUD();
    drawOverlay();
  }
  // 存档码界面压在最上层（可能从任意状态唤起）
  if (shareUI.active) drawShareScreen();
  else if (importUI.active) drawImportScreen();
  drawReticle();          // 最后画，保证浮在所有覆盖层之上
}

/* ============================ 主循环 ============================ */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 1/30);           // 掉帧保护
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ============================ 启动 ============================ */
// 全屏按钮（鼠标用户不用记快捷键）
const fsBtn = document.getElementById('fsBtn');
if (fsBtn){
  fsBtn.addEventListener('click', e => { e.stopPropagation(); toggleFullscreen(); });
  fsBtn.addEventListener('pointerdown', e => { e.stopPropagation(); }, { passive:true });
}
function syncFsBtn(){
  if (fsBtn) fsBtn.textContent = isFullscreen() ? '⤡' : '⛶';
}
for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) document.addEventListener(ev, syncFsBtn, false);
syncFsBtn();

// 恢复设置（静音 / 练习模式开关）
loadSettings();
// 退出前兜底存一次，避免关标签页丢进度
addEventListener('beforeunload', () => { if (autoSaveArmed && G.state !== S.OVER) saveProgress(false); });

resize();
paddle = makePaddle();
balls = [ makeBall(W/2, paddle.y - 8, 0, 0) ];
balls[0].stuck = true;
bricks = []; drops = []; particles = []; floats = []; shockwaves = []; explodingDepth = 0;
requestAnimationFrame(frame);

// 让 canvas 一开始就拿到键盘焦点
cv.tabIndex = 0;
cv.focus();
</script>
</body>
