<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEON BREAKER · 霓虹打砖块</title>
<style>
  :root{
    --neon:#31f2ff;
    --pink:#ff3ea5;
    --bg0:#05060f;
    --bg1:#0b1030;
    --txt:#dff6ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(120% 90% at 50% 0%,#131a4a 0%,var(--bg1) 38%,var(--bg0) 100%);

    font-family:"Segoe UI",-apple-system,"Microsoft YaHei",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  /* 画布铺满整个视口：逻辑 16:10 的画面在里面等比缩放居中，
     多出来的部分在画布内部留边 —— 这样鼠标永远在游戏区内 */
  #stage{position:fixed;inset:0}
  canvas{
    position:absolute;inset:0;width:100%;height:100%;
    display:block;
    background:#04050d;
    touch-action:none;
    cursor:none;
  }
  #fsBtn{
    position:absolute;top:12px;right:12px;z-index:5;
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;line-height:1;
    color:rgba(223,246,255,.6);
    border:1px solid rgba(49,242,255,.32);
    background:rgba(6,10,26,.55);
    cursor:pointer;
    transition:color .15s,border-color .15s,box-shadow .15s;
    -webkit-user-select:none;user-select:none;
  }
  #fsBtn:hover{color:#dff6ff;border-color:#31f2ff;box-shadow:0 0 14px rgba(49,242,255,.35)}
  #hint{
    position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    z-index:5;pointer-events:none;
    font-size:12px;letter-spacing:.14em;color:rgba(223,246,255,.35);white-space:nowrap;
  }
  @media (max-width:720px){#hint{display:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="fsBtn" title="全屏 (F)">⛶</div>
  <div id="hint">← → / 鼠标 = 挡板 &nbsp;·&nbsp; 空格 = 发射 &nbsp;·&nbsp; P = 暂停 &nbsp;·&nbsp; C = 选关 &nbsp;·&nbsp; F = 全屏</div>
</div>
<script>
"use strict";
/* ============================================================
   NEON BREAKER — 一个给自己玩的霓虹打砖块
   单文件 / 无依赖 / Canvas 2D
   - 4 种道具 + 2 种负面效果
   - 连击倍率、拖尾球、粒子、屏幕震动
   - 6 个关卡 + 无限生成的后续关卡
   - 最高分存 localStorage
   ============================================================ */

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');

/* ---------- 视口与坐标映射 ----------
   画布铺满整个视口，逻辑画面固定 16:10（W×H）等比缩放居中，
   多出来的部分由 drawBackground 画成暗色留边。
   这样鼠标指针永远落在 canvas 上，不会"移出框"。 */
const W = 960, H = 600;
const view = { w: W, h: H, scale: 1, ox: 0, oy: 0, dpr: 1 };
let cssW = W, cssH = H;

function resize(){
  const r = cv.getBoundingClientRect();
  cssW = Math.max(1, Math.round(r.width));
  cssH = Math.max(1, Math.round(r.height));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);

  view.dpr   = dpr;
  view.w     = cssW;
  view.h     = cssH;
  view.scale = Math.min(cssW / W, cssH / H);          // 等比，保证整幅画面可见
  view.ox    = (cssW - W * view.scale) / 2;
  view.oy    = (cssH - H * view.scale) / 2;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);             // CSS 像素坐标系
  setFrameTransform();
}

// 把逻辑坐标 (960×600) 映射到当前视口
function setFrameTransform(){
  ctx.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale,
                   view.dpr * view.ox, view.dpr * view.oy);
}

function toggleFullscreen(){
  const el = document.documentElement;
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (!fsEl){
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const p = req.call(el); if (p && p.catch) p.catch(() => {}); }
  } else {
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex) { const p = ex.call(document); if (p && p.catch) p.catch(() => {}); }
  }
}
function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
// 全屏状态变化后布局尺寸会变，等一帧再量
for (const ev of ['fullscreenchange', 'webkitfullscreenchange']){
  document.addEventListener(ev, () => { requestAnimationFrame(resize); }, false);
}

// 屏幕坐标 -> 逻辑坐标（超出 0..W / 0..H 说明指针落在留边上）
function toWorld(clientX, clientY){
  const r = cv.getBoundingClientRect();
  const x = (clientX - r.left - view.ox) / view.scale;
  const y = (clientY - r.top  - view.oy) / view.scale;
  return { x, y, inside: x >= 0 && x <= W && y >= 0 && y <= H };
}

addEventListener('resize', resize);
addEventListener('orientationchange', resize);

/* ============================ 音效 ============================ */
const Sound = (() => {
  let actx = null, muted = false;
  function ac(){
    if (!actx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      actx = new C();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type = 'square', vol = .05, slide = 0){
    if (muted) return;
    const a = ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
    o.connect(g).connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + .02);
  }
  return {
    unlock(){ ac(); },
    toggle(){ muted = !muted; saveSettings(); return muted; },
    setMuted(v){ muted = !!v; },
    get muted(){ return muted; },
    paddle(){ tone(240, .05, 'square', .04); },
    wall(){ tone(380, .04, 'triangle', .03); },
    brick(row){ tone(320 + (5 - Math.min(row,5)) * 70, .07, 'square', .045); },
    hard(){ tone(120, .12, 'sawtooth', .05, -60); },
    power(){ tone(520, .08, 'triangle', .06, 340); setTimeout(()=>tone(880,.09,'triangle',.05,220),60); },
    bad(){ tone(200, .18, 'sawtooth', .06, -120); },
    lose(){ [440,330,247,165].forEach((f,i)=>setTimeout(()=>tone(f,.22,'sawtooth',.06,-40), i*130)); },
    win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.06), i*110)); },
    over(){ [392,349,294,196].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sawtooth',.07,-50), i*180)); }
  };
})();

/* ============================ 工具 ============================ */
const rnd  = (a,b) => a + Math.random()*(b-a);
const clamp= (v,a,b) => v<a?a:v>b?b:v;
const TAU  = Math.PI*2;

/* ============================ 关卡 ============================ */
// 0 = 空, 1..5 = 普通砖(耐久=类型值), -1 = 不可破坏, 9 = 金砖(必掉道具)
// 每行必须正好 10 个字符；空位一律写 0，不要写 '.'（Number('.') === NaN）
function pattern(n){
  const P = [];
  const rows = (a) => a.forEach(r => P.push(r.split('').map(Number)));

  if (n === 0){                      // 1 · 上手关
    rows([
      "1111111111",
      "1111991111",                // 中间两块金砖
      "1111111111"
    ]);
    return { grid:P, msg:'SPACE 发射 · 左右移动' };
  }
  if (n === 1){                      // 2 · 菱形
    rows([
      "0022222200",
      "0222222220",
      "2203333022",
      "2033003302",
      "0033333300"
    ]);
  } else if (n === 2){               // 3 · 交错条纹
    rows([
      "1010101010",
      "0202020202",
      "3030303030",
      "0202020202",
      "1010101010"
    ]);
  } else if (n === 3){               // 4 · 要塞（带不可破坏墙）
    // 直接写字面量数组，不用字符串映射：-1 是实心砖，避免 Number('x') -> NaN
    P.push([ 0, 0, 4, 4, 4, 4, 4, 4, 0, 0]);
    P.push([ 0, 4,-1, 0, 0, 0, 0,-1, 4, 0]);
    P.push([ 4,-1, 0, 1, 1, 1, 1, 0,-1, 4]);
    P.push([ 4,-1, 0, 0, 9, 0, 0, 0,-1, 4]);
    P.push([ 4,-1, 0, 1, 1, 1, 1, 0,-1, 4]);
    P.push([ 0, 4,-1, 0, 0, 0, 0,-1, 4, 0]);
    P.push([ 0, 0, 4, 4, 4, 4, 4, 4, 0, 0]);
  } else if (n === 4){               // 5 · 金字塔
    rows([
      "0000550000",
      "0005445000",
      "0054444500",
      "0544444450",
      "5444444445",
      "4000000004",
      "0400000040",
      "0040000400",
      "0004004000",
      "0000400000"
    ]);
  } else {
    // 无限生成：随机但保证可通关（必有可破坏砖，且不会整行不可破坏）
    const nr = 5 + (n % 3);
    for (let r = 0; r < nr; r++){
      const line = [];
      for (let c = 0; c < 10; c++){
        const roll = Math.random();
        if (roll < .10)      line.push(-1);
        else if (roll < .18) line.push(9);
        else                 line.push(1 + ((r + n) % 5));   // 恒在 1..5，与颜色表对齐
      }
      P.push(line);
    }
    P.forEach(row => { if (row.every(v => v === -1)) row[Math.floor(Math.random()*10)] = 3; });
  }
  return { grid:P, msg:null };
}

/* ============================ 道具表 ============================ */
const POWERS = [
  { k:'wide',  c:'#4dff9e', ch:'W', good:true,  name:'加宽挡板' },
  { k:'multi', c:'#ffd93d', ch:'3', good:true,  name:'三球齐发' },
  { k:'slow',  c:'#31f2ff', ch:'S', good:true,  name:'时间变慢' },
  { k:'life',  c:'#ff6ec7', ch:'+', good:true,  name:'额外生命' },
  { k:'narrow',c:'#ff5b5b', ch:'N', good:false, name:'挡板变窄' },
  { k:'fast',  c:'#ff9f1c', ch:'F', good:false, name:'球速暴涨' }
];

/* ============================ 游戏状态 ============================ */
const S = { TITLE:0, READY:1, PLAY:2, PAUSE:3, LEVEL:4, DEAD:5, OVER:6, WIN:7, SELECT:8 };

// 练习 / 选关：5 个设计关卡 + 2 个随机关卡入口
const LEVEL_NAMES  = ['上手关', '菱形', '交错条纹', '要塞', '金字塔'];const LEVEL_NOTES  = ['三行整排，无实心砖', '菱形空洞，中心三血砖', '砖最少洞最多，球路活',
                      '十块实心砖围成要塞', '金字塔，五血砖最密'];
const SELECT_MARKS = ['1', '2', '3', '4', '5', '6', '7'];
const selectItems = LEVEL_NAMES.map((name, i) => ({
  kind: 'designed', level: i, name,
  note: `${LEVEL_NOTES[i]} · ${(function(){ const f = pattern(i).grid.flat();
    const br = f.filter(v => v > 0).length, so = f.filter(v => v === -1).length, go = f.filter(v => v === 9).length;
    return `可破坏 ${br} · 实心 ${so} · 金砖 ${go}`; })()}`
})).concat(Array.from({ length: 2 }, (_, i) => ({
  kind: 'random', level: 5 + i * 3, name: '随机关卡',
  note: '每次进入重新生成',
  grid: pattern(5 + i * 3).grid          // 界面里预览一张真实样例
})));

const G = {
  state: S.TITLE,
  level: 0,
  score: 0,
  best: +(localStorage.getItem('neon-breaker-best') || 0) || 0,
  lives: 3,
  combo: 0,
  comboTimer: 0,
  shake: 0,
  time: 0,
  stuckTimer: 0,          // 距上次击破砖块的时间，用于打破角度自洽的死循环
  lastBricks: -1,
  infinite: false,        // 练习模式：无限生命
  practice: false,        // 本局是否练习模式（练习分数不计入最高分）
  selectIdx: 0,
  selectHint: 0,
  confirmNew: false,      // "开新局会覆盖存档"的二次确认
  msg: '',
  msgTimer: 0,
  flash: 0,
  slowFx: 0,
  playTime: 0             // 本局累计游玩秒数（存进存档）
};

let paddle, balls, bricks, drops, particles, floats;
let brickW, brickH, brickTop, cols = 10;
let autoSaveArmed = false;      // 本局是否需要自动存档（开局/读档后开启）
let autoSaveTimer = 0;          // 距上次自动存档的秒数

function makePaddle(){
  return { w: 130, h: 14, x: W/2 - 65, y: H - 46, vx: 0 };
}

// 挡板位置统一夹取到墙内侧（两侧各留 24px），宽度变化后也必须调用
function clampPaddle(){
  paddle.x = clamp(paddle.x, 24, W - 24 - paddle.w);
}

function makeBall(x, y, vx, vy){
  return {
    x, y,
    r: 7,
    vx, vy,
    trail: [],
    stuck: false,
    offset: 0,
    vTimer: 0        // 近乎纯竖直运动的累计时长（防死循环）
  };
}

function resetBall(){
  balls = [ makeBall(paddle.x + paddle.w/2, paddle.y - 8, 0, 0) ];
  balls[0].stuck = true;
}

// 按二维网格铺砖。网格既可以来自 pattern()，也可以来自存档
// （随机关卡每次生成的地图不同，只存砖块下标是不可靠的，必须把地图本身存下来）
function buildFromGrid(grid){
  cols = 10;
  brickW = (W - 120) / cols;
  brickH = 26;
  brickTop = 90;
  bricks = [];
  grid.forEach((row, r) => {
    row.forEach((v, c) => {
      if (v === 0 || v === undefined || v === null) return;   // 空位
      if (Number.isNaN(v)) return;                            // 防御：绝不生成 NaN 砖
      bricks.push({
        x: 60 + c*brickW,
        y: brickTop + r*(brickH + 7),
        w: brickW - 6,
        h: brickH,
        row: r, col: c,
        type: v,
        hp: (v === -1 || v === 9) ? 1 : v,
        max: (v === -1 || v === 9) ? 1 : v,
        solid: v === -1,
        golden: v === 9,
        hit: 0,
        dead: false
      });
    });
  });
}

function loadLevel(n, gridOverride){
  const num = Math.round(Number(n));
  n = Number.isFinite(num) ? Math.max(0, num) : 0;   // 防御：非法关卡号一律退回第 1 关
  const p = pattern(n);
  const grid = gridOverride || p.grid;
  buildFromGrid(grid);
  drops = []; particles = []; floats = [];
  G.combo = 0; G.comboTimer = 0;
  G.stuckTimer = 0;
  G.lastBricks = bricks.filter(b => !b.solid && !b.dead).length;
  G.msg = gridOverride ? `第 ${n} 关 · 已还原` : (p.msg || `第 ${n} 关`);
  G.msgTimer = 1.8;
  resetBall();
  G.state = S.READY;
}

// 回到标题/选关界面时把场地清空，否则半透明遮罩下会透出残局砖块
function clearBoard(){
  bricks = [];
  balls = [ makeBall(paddle.x + paddle.w/2, paddle.y - 8, 0, 0) ];
  balls[0].stuck = true;
  drops = []; particles = []; floats = [];
  G.combo = 0; G.comboTimer = 0;
  G.stuckTimer = 0;
  G.shake = 0; G.flash = 0; G.slowFx = 0;
  G.msgTimer = 0;
}

function newGame(){
  G.level = 0; G.score = 0; G.lives = 3; G.shake = 0; G.flash = 0;
  G.practice = false;
  G.infinite = false;     // 普通模式必须显式关掉无限生命，否则会从选关界面"泄漏"进来
  G.playTime = 0;
  G.confirmNew = false;
  paddle = makePaddle();
  loadLevel(0);
  autoSaveArmed = true;
  saveProgress(false);
}

// 练习模式：从选关界面开始，无限生命，分数不计入最高分
function startSelect(){
  G.infinite = false;
  G.selectIdx = 0;
  G.selectHint = 0;
  G.confirmNew = false;
  clearBoard();
  G.state = S.SELECT;
}

function startLevel(idx){
  const it = selectItems[clamp(idx, 0, selectItems.length - 1)];
  G.level = it.level;
  G.score = 0;
  G.practice = G.infinite;
  G.lives = G.infinite ? 99 : 3;
  G.shake = 0; G.flash = 0;
  G.playTime = 0;
  paddle = makePaddle();
  loadLevel(it.level);
  G.msg = `第 ${it.level + 1} 关${it.kind === 'random' ? ' · 随机生成' : ' · ' + it.name}${G.infinite ? ' · 无限生命' : ''}`;
  G.msgTimer = 2.2;
  autoSaveArmed = true;
  saveProgress(false);
}

/* ============================ 存档 ============================ */
const SAVE_KEY = 'neon-breaker-save-v1';
const SET_KEY  = 'neon-breaker-settings-v1';
const SAVE_VERSION = 1;

// localStorage 可能被禁用（隐私模式等），统一走安全包装
const Store = (() => {
  let ok = true;
  try { localStorage.setItem('__nb_t', '1'); localStorage.removeItem('__nb_t'); }
  catch (e){ ok = false; }
  const mem = {};
  return {
    get available(){ return ok; },
    get(k){
      try { const v = ok ? localStorage.getItem(k) : mem[k]; return v === undefined ? null : v; }
      catch (e){ return null; }
    },
    set(k, v){ try { if (ok) localStorage.setItem(k, v); else mem[k] = String(v); } catch (e){} },
    del(k){ try { if (ok) localStorage.removeItem(k); else delete mem[k]; } catch (e){} },
  };
})();

// 紧凑编码：砖块只存"存活砖的 下标:剩余血量(36进制)"，球只存位置与速度
// 注意：必须记录所有还活着的砖（含满血砖），否则读档时缺项会被当成"已击破"
const b36 = n => Math.round(n).toString(36);

function serializeSave(){
  const st = bricks.map((b, i) => b.dead ? null : i + ':' + b36(b.hp))
                   .filter(Boolean).join(',');
  // 存下当前实际地图（每行一个字符串，非空格用 36 进制数字），
  // 否则随机关卡读档时会重新随机，砖块下标对不上
  const gri = bricks.reduce((rows, b) => {
    if (!rows[b.row]) rows[b.row] = Array(10).fill('0');
    rows[b.row][b.col] = b.type === -1 ? '-' : b36(b.type);
    return rows;
  }, []).map(r => (r || Array(10).fill('0')).join(''));
  const bl = balls.filter(b => isFinite(b.x) && isFinite(b.y))
                  .map(b => [Math.round(b.x), Math.round(b.y), Math.round(b.vx), Math.round(b.vy),
                             b.stuck ? 1 : 0, +(b.offset || 0).toFixed(2)]);
  return {
    v: SAVE_VERSION,
    ts: Date.now(),
    level: G.level,
    score: Math.round(G.score),
    best: G.best,
    lives: G.lives,
    infinite: !!G.infinite,
    practice: !!G.practice,
    paddleW: paddle.w,
    playTime: Math.round(G.playTime),
    state: G.state,
    bricks: st,
    grid: gri,
    balls: bl
  };
}

/* ---------- 跨设备：存档码 ----------
   没有服务器，localStorage 不会自己同步。这里把存档压成一段可复制的文本，
   用聊天工具/备忘录传过去，在另一台设备粘贴导入即可。 */
const SHARE_PREFIX = 'NB1';

function checksum(str){
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
  return h.toString(36).slice(0, 4).padStart(4, '0');
}

function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// 返回存档码（形如 NB1-ab12-<base64>），失败返回 null
function encodeShareCode(){
  try {
    const json = JSON.stringify(serializeSave());
    return SHARE_PREFIX + '-' + checksum(json) + '-' + b64encode(json);
  } catch (e){ return null; }
}

// 解析存档码。失败返回 { error: '原因' }
function decodeShareCode(text){
  const raw = String(text || '').replace(/\s+/g, '');      // 容忍换行/空格
  if (!raw) return { error: '内容为空' };
  const parts = raw.split('-');
  if (parts.length < 3) return { error: '格式不对（应以 NB1- 开头）' };
  if (parts[0] !== SHARE_PREFIX) return { error: '版本不符（' + parts[0] + '）' };
  const sum = parts[1];
  const body = parts.slice(2).join('-');                    // base64 里可能有 '-'？标准表没有，保险起见拼回去
  let json;
  try { json = b64decode(body); }
  catch (e){ return { error: '编码损坏，复制时可能少了字符' }; }
  if (checksum(json) !== sum) return { error: '校验失败，多半是复制不完整' };
  let data;
  try { data = JSON.parse(json); }
  catch (e){ return { error: '内容不是合法存档' }; }
  try { Store.set(SAVE_KEY, JSON.stringify(data)); }
  catch (e){ return { error: '写入存档失败（空间不足）' }; }
  const info = saveInfo();
  if (!info) { Store.del(SAVE_KEY); return { error: '存档校验未通过，已丢弃' }; }
  return { ok: true, info };
}

/* ---------- 导入界面状态 ---------- */
const importUI = { active: false, text: '', msg: '', ok: false };

function openImport(){

  importUI.ok = false;

}
function closeImport(){

  importUI.msg = '';
}
function tryImport(text){

function saveProgress(manual){
  const data = serializeSave();
  try { Store.set(SAVE_KEY, JSON.stringify(data)); }
  catch (e){ if (manual) toast('存档失败：空间不足'); return false; }
  autoSaveTimer = 0;
  if (manual) toast('已存档 · 第 ' + (data.level + 1) + ' 关');
  return true;
}

function saveInfo(){
  const raw = Store.get(SAVE_KEY);
  if (!raw) return null;
  try {
    const d = JSON.parse(raw);
    if (!d || typeof d !== 'object' || d.v !== SAVE_VERSION) return null;
    // 关卡号必须是有限整数，否则 loadLevel 会生成空局面
    if (!Number.isFinite(d.level) || Math.round(d.level) !== d.level || d.level < 0) return null;
    if (!Number.isFinite(d.lives) || d.lives < 1) return null;
    if (!Number.isFinite(d.score) || !Number.isFinite(d.paddleW)) return null;
    if (typeof d.bricks !== 'string') return null;
    if (!Array.isArray(d.balls)) return null;
    if (d.grid !== undefined && !Array.isArray(d.grid)) return null;
    return d;
  } catch (e){ return null; }
}

function hasSave(){ return saveInfo() !== null; }

function clearSave(announce){
  Store.del(SAVE_KEY);
  if (announce) toast('存档已清除');
}

// 从存档恢复。返回 false 表示存档无效
function loadProgress(){
  const d = saveInfo();
  if (!d) return false;

  // 优先用存档里的地图还原（随机关卡必须如此），并据此确定下标上界
  let grid = null;
  if (Array.isArray(d.grid)){
    grid = d.grid.map(row => String(row).split('').map(ch => ch === '-' ? -1 : parseInt(ch, 36)));
    const okShape = grid.length > 0 && grid.length <= 40 && grid.every(r => r.length === 10 && r.every(Number.isFinite));
    if (!okShape) grid = null;
  }
  // bricks 数组包含所有非空格（普通砖 + 金砖 + 实心砖）
  let cells = 0;
  (grid || pattern(d.level).grid).forEach(row => row.forEach(v => { if (v !== 0) cells++; }));

  // 第一遍：只校验，不动任何游戏状态
  const alive = new Set();
  const hpMap = new Map();
  for (const part of String(d.bricks).split(',')){
    if (!part) continue;
    const [is, hs] = part.split(':');
    const i = parseInt(is, 10);
    const hp = parseInt(hs, 36);
    if (!Number.isInteger(i) || i < 0 || i >= cells) return false;   // 下标必须在本关范围内
    if (!Number.isFinite(hp) || hp < 1) return false;
    if (hpMap.has(i) && hpMap.get(i) !== hp) return false;           // 同一下标冲突
    hpMap.set(i, hp);
  }
  // 第二遍：数值都干净，才真正落地
  G.level = d.level;
  G.practice = !!d.practice;
  G.infinite = !!d.infinite;
  paddle = makePaddle();
  loadLevel(d.level, grid);                 // 会重置砖块/球/粒子并进入 READY
  G.level = d.level;

  hpMap.forEach((hp, i) => {
    const b = bricks[i];
    if (!b) return;
    b.hp = clamp(hp, 1, b.max);
    b.dead = false;
    alive.add(i);
  });
  // 存档里没提到的可破坏砖 = 已击破
  bricks = bricks.filter((b, i) => b.solid || alive.has(i));

  G.score = Math.max(0, Math.round(d.score));
  G.best = Math.max(G.best, Math.round(d.best) || 0);
  G.lives = clamp(Math.round(d.lives), 1, 999);
  paddle.w = clamp(Math.round(d.paddleW), 60, 260);
  clampPaddle();
  G.playTime = Math.max(0, Math.round(d.playTime) || 0);

  balls = d.balls.map(a => {
    const b = makeBall(Number(a[0]) || W/2, Number(a[1]) || paddle.y - 8,
                       Number(a[2]) || 0, Number(a[3]) || 0);
    b.stuck = !!a[4];
    b.offset = Number(a[5]) || 0;
    return b;
  });
  if (!balls.length) resetBall();
  // 球掉了但还没结算的状态，读档后先给一个安全的贴板球
  if (balls.every(b => b.y > H + 40)) resetBall();

  drops = []; particles = []; floats = [];
  G.combo = 0; G.comboTimer = 0;
  G.stuckTimer = 0;
  G.lastBricks = bricks.filter(b => !b.solid && !b.dead).length;
  G.shake = 0; G.flash = 0; G.slowFx = 0;
  G.confirmNew = false;              // 读档即退出"开新局"确认态
  G.state = (d.state === S.PLAY && balls.some(b => !b.stuck)) ? S.PLAY : S.READY;
  G.msg = '已读档 · 第 ' + (G.level + 1) + ' 关';
  G.msgTimer = 2.2;
  Sound.win();
  return true;
}

const shareUI = { active: false, code: '', copied: false, msg: '' };

function openShare(){
  const code = encodeShareCode();
  if (!code){ toast('没有可导出的存档'); return; }
  shareUI.active = true;

}
function closeShare(){ shareUI.active = false; shareUI.code = ''; shareUI.msg = ''; }

// 把长代码按固定宽度切成多行（canvas 不能自动换行）
function wrapCode(code, perLine){
  const out = [];
  for (let i = 0; i < code.length; i += perLine) out.push(code.slice(i, i + perLine));
  return out;
}


const keys = Object.create(null);
let pointerTarget = null;
/* ============================ 输入 ============================ */
// 自绘准星状态：canvas 上设了 cursor:none（挡板就是光标），所以必须自己画一个，
// 否则游戏区里完全看不见鼠标。用鼠标操作时显示，键盘操作/指针离开时隐藏。
const mouse = { x: W/2, y: H/2, hasPointer: false, onField: true };

// 选关界面：把屏幕点击 / 触摸映射到卡片（返回 true 表示已处理）
function selectHitTest(px, py){
  const top = 150, gap = 61, h = 48;
  for (let i = 0; i < selectItems.length; i++){
    const y = top + gap * i;
    if (py >= y && py <= y + h && px >= 60 && px <= 900){
      G.selectIdx = i;
      startLevel(i);
      return true;
    }
  }
  return false;
}

// 选关界面的键盘操作
function selectKey(k){
  if (k === 'ArrowUp')   { G.selectIdx = (G.selectIdx - 1 + selectItems.length) % selectItems.length; G.selectHint = 0; return true; }
  if (k === 'ArrowDown') { G.selectIdx = (G.selectIdx + 1) % selectItems.length; G.selectHint = 0; return true; }
  if (k === 'Enter' || k === ' ') { startLevel(G.selectIdx); return true; }
  if (k === 'i' || k === 'I'){ G.infinite = !G.infinite; G.selectHint = 2.0; saveSettings(); return true; }
  if (k === 'Escape' || k === 'c' || k === 'C'){ clearBoard(); G.state = S.TITLE; G.selectHint = 0; return true; }
  const num = '1234567'.indexOf(k);
  if (num >= 0 && num < selectItems.length){ G.selectIdx = num; startLevel(num); return true; }
  if (k === 'r' || k === 'R'){ G.selectIdx = 5; startLevel(5); return true; }
  return false;
}

addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  if (e.key === 'F5' || e.key === 'F9') e.preventDefault();   // 占用来存/读档，别刷新页面
  keys[e.key] = true;
  mouse.hasPointer = false;            // 一按键盘就交还控制权，准星隐去
  Sound.unlock();

  // ---- 模态输入界面必须最先拦截，否则 m / f / r 这类单键会被下面的快捷键吃掉 ----
  if (importUI.active){
    if (e.key === 'Enter'){ tryImport(importUI.text); return; }
    if (e.key === 'Escape'){ closeImport(); return; }
    if (e.key === 'Backspace'){
      importUI.text = importUI.text.slice(0, -1);
      importUI.msg = importUI.text ? '长度 ' + importUI.text.length + ' · 回车导入 · Esc 取消'
                                   : '把存档码粘贴进来（Ctrl+V），或直接手输';
      importUI.ok = false;
      return;
    }
    // 允许手输的字符（存档码是 base64 + 数字字母短横线）
    if (e.key.length === 1 && /[A-Za-z0-9+/=_-]/.test(e.key)){
      if (importUI.text.length < 20000) importUI.text += e.key;
      importUI.msg = '长度 ' + importUI.text.length + ' · 回车导入 · Esc 取消';
      importUI.ok = false;
    }
    return;
  }

  // ---- 导出存档码界面 ----
  if (shareUI.active){
    if (['Escape','e','E','Enter','r','R'].includes(e.key)){ closeShare(); return; }
    return;                                  // 界面打开时吞掉其余按键
  }

  if (e.key === 'm' || e.key === 'M'){ const m = Sound.toggle(); toast(m ? '静音' : '声音开'); return; }
  if (e.key === 'f' || e.key === 'F'){ toggleFullscreen(); return; }

  // R = 继续存档（标题页最显眼的位置就是这个）
  if (e.key === 'r' || e.key === 'R'){
    if (G.state === S.TITLE || G.state === S.PAUSE || G.state === S.OVER || G.state === S.WIN){
      G.confirmNew = false;              // 继续存档即取消"开新局"的确认
      if (hasSave() && loadProgress()) autoSaveArmed = true;
      else toast('没有找到存档');
      return;
    }
  }

  // 确认开新局期间按了别的键：先取消确认，再让该按键正常生效
  // （而不是把按键整个吞掉——否则想按 C 进选关会"按了没反应"）
  if (G.confirmNew && e.key !== ' ' && e.key !== 'Enter'){
    G.confirmNew = false;
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') return;   // 这两个只用于取消
  }

  // 存 / 读 / 删档
  if (e.key === 'F5'){
    if (G.state === S.TITLE || G.state === S.SELECT) toast('先开始一局才能存档');
    else saveProgress(true);
    return;
  }
  if (e.key === 'F9'){
    if (!hasSave()){ toast('没有找到存档'); return; }
    if (loadProgress()) autoSaveArmed = true;
    return;
  }
  // E / I：导出、导入存档码（跨设备就靠这个）
  if (e.key === 'e' || e.key === 'E'){ openShare(); return; }
  if (e.key === 'i' || e.key === 'I'){
    if (G.state === S.SELECT){ selectKey(e.key); return; }   // 选关界面里 I 是无限生命开关
    openImport();
    return;
  }
  if (e.key === 'Delete' || e.key === 'Backspace'){
    if (hasSave()){ clearSave(true); return; }
  }

  // 练习/选关界面：吃掉所有按键
  if (G.state === S.SELECT){ selectKey(e.key); return; }

  // C 键随时进入选关（练习模式）
  if (e.key === 'c' || e.key === 'C'){ startSelect(); return; }

  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape'){
    if (G.state === S.PLAY){ G.state = S.PAUSE; }
    else if (G.state === S.PAUSE){ G.state = S.PLAY; }
    return;
  }
  if (e.key === ' '){
    if (G.state === S.TITLE || G.state === S.OVER || G.state === S.WIN){ requestNewGame(); return; }
    if (G.state === S.READY){ launch(); return; }
    if (G.state === S.LEVEL){ nextLevel(); return; }
  }
  if (e.key === 'Enter'){
    if (G.state === S.TITLE || G.state === S.OVER || G.state === S.WIN) requestNewGame();
    else if (G.state === S.READY) launch();
    else if (G.state === S.LEVEL) nextLevel();
  }
});
addEventListener('keyup', e => { keys[e.key] = false; });
// 导入时直接支持 Ctrl+V 粘贴
addEventListener('paste', e => {
  if (!importUI.active) return;
  const t = (e.clipboardData && e.clipboardData.getData) ? e.clipboardData.getData('text') : '';
  if (!t) return;
  if (e.preventDefault) e.preventDefault();
  importUI.text = t.trim();
  importUI.msg = '已粘贴 ' + importUI.text.length + ' 个字符 · 回车导入 · Esc 取消';
  importUI.ok = false;
});
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  if (G.state === S.PLAY) G.state = S.PAUSE;
});

// 鼠标 / 触摸：挡板跟随 + 准星定位（坐标经 toWorld 反向映射，自动处理留边）
function pointerMove(clientX, clientY){
  if (!cssW || !cssH) return;
  const w = toWorld(clientX, clientY);
  pointerTarget = clamp(w.x, 0, W);
  mouse.y = clamp(w.y, 0, H);
  mouse.x = pointerTarget;
  mouse.onField = w.inside;
  mouse.hasPointer = true;
}
cv.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
cv.addEventListener('mouseleave', () => { mouse.hasPointer = false; });
cv.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') pointerMove(e.clientX, e.clientY); });
// 整个视口都在 canvas 里，pointerleave 基本不会触发；留着以防嵌入 iframe
cv.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') mouse.hasPointer = false; });
cv.addEventListener('touchstart', e => { Sound.unlock(); pointerMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive:true });
cv.addEventListener('touchmove',  e => { pointerMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive:true });
cv.addEventListener('touchend',   () => { mouse.hasPointer = false; }, { passive:true });
cv.addEventListener('touchcancel',() => { mouse.hasPointer = false; }, { passive:true });
cv.addEventListener('pointerdown', e => {
  Sound.unlock();
  const w = toWorld(e.clientX, e.clientY);
  if (G.state === S.SELECT){           // 点卡片直接进关
    selectHitTest(w.x, w.y);
    return;
  }
  if (G.state === S.TITLE || G.state === S.OVER || G.state === S.WIN) requestNewGame();
  else if (G.state === S.READY) launch();
  else if (G.state === S.LEVEL) nextLevel();
});

/* ============================ 动作 ============================ */
// 开新局要防误触：有存档时按一次只是"请求"，再按一次才真的开始
// （否则一个手滑的空格就把存档覆盖了）
function requestNewGame(){
  if (hasSave() && !G.confirmNew){
    G.confirmNew = true;
    Sound.hard();
    return;
  }
  G.confirmNew = false;
  newGame();
}

function cancelConfirm(){
  if (G.confirmNew){ G.confirmNew = false; return true; }
  return false;
}

function launch(){
  if (!balls.length) return;
  // 必须释放所有贴板的球：吃过"3"（三球齐发）后掉命，会有一批球一起贴板，
  // 只发射 balls[0] 的话其余的会永远粘在挡板上。
  const stuck = balls.filter(b => b.stuck);
  if (!stuck.length) return;
  for (const b of stuck){
    b.stuck = false;
    b.offset = 0;
    const speed = 460;
    const ang = rnd(-0.5, 0.5) + (-Math.PI/2);   // 每个球各自带一点角度差
    b.vx = Math.cos(ang) * speed;
    b.vy = Math.sin(ang) * speed;
  }
  G.state = S.PLAY;
  Sound.wall();
}

function nextLevel(){
  G.level++;
  loadLevel(G.level);
  saveProgress(false);        // 新一关刚铺好，是个干净的存档点
}

function toast(text){ G.msg = text; G.msgTimer = 1.6; }

function spawnDrops(x, y){
  if (Math.random() > 0.30) return;
  const good = POWERS.filter(p => p.good);
  const bad  = POWERS.filter(p => !p.good);
  const pick = Math.random() < .72
      ? good[Math.floor(Math.random()*good.length)]
      : bad [Math.floor(Math.random()*bad.length)];
  drops.push({ x, y, v: 150, p: pick, t: 0 });
}

function applyPower(p){
  if (p.good){ G.flash = Math.max(G.flash, .35); }
  else { G.shake = Math.max(G.shake, 14); }
  if (p.k === 'wide'){ paddle.w = Math.min(260, paddle.w + 42); Sound.power(); }
  if (p.k === 'narrow'){ paddle.w = Math.max(60, paddle.w - 34); Sound.bad(); }
  // 宽度变了必须重新夹取位置，否则贴边吃道具时挡板会插进侧墙
  clampPaddle();
  if (p.k === 'slow'){
    balls.forEach(b => { if (!b.stuck){ b.vx *= .68; b.vy *= .68; } });
    G.slowFx = 4; Sound.power();
  }
  if (p.k === 'fast'){
    balls.forEach(b => {
      if (b.stuck) return;
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const ns = clamp(sp * 1.32, 400, 1000);   // 乘完必须夹回上限，否则会突破设计速度
      b.vx *= ns / sp; b.vy *= ns / sp;
    });
    Sound.bad();
  }
  if (p.k === 'life'){ G.lives++; Sound.power(); }
  if (p.k === 'multi'){
    Sound.power();
    const src = balls[0];
    if (src){
      for (let i = 0; i < 2; i++){
        const nb = makeBall(src.x, src.y, 0, 0);
        const ang = -Math.PI/2 + (i ? .5 : -.5);
        const sp = Math.hypot(src.vx, src.vy) || 440;
        nb.vx = Math.cos(ang)*sp;
        nb.vy = Math.sin(ang)*sp;
        nb.stuck = src.stuck;
        balls.push(nb);
      }
    }
  }
  floats.push({ x: paddle.x + paddle.w/2, y: paddle.y - 26, text: p.name, color: p.c, life: 1.1, vy: -34 });
  toast(p.name);
}

// 距离 (x,y) 最近的、还能被打掉的砖（用于卡死时的柔性引导）
function nearestBrick(x, y){
  let best = null, bd = Infinity;
  for (const br of bricks){
    if (br.dead || br.solid) continue;
    const dx = br.x + br.w/2 - x, dy = br.y + br.h/2 - y;
    const d = dx*dx + dy*dy;
    if (d < bd){ bd = d; best = br; }
  }
  return best;
}

function addParticles(x, y, color, n = 12, power = 1){
  for (let i = 0; i < n; i++){
    const a = rnd(0, TAU), sp = rnd(40, 260) * power;
    particles.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: rnd(.3, .8), max: .8, color, r: rnd(1.5, 3.6)
    });
  }
}

const BRICK_COLORS = ['#31f2ff', '#4dff9e', '#ffd93d', '#ff9f1c', '#ff3ea5'];

function brickColor(b){
  if (b.solid)     return '#6b7fa8';
  if (b.golden)    return '#ffd93d';
  return BRICK_COLORS[clamp(b.hp - 1, 0, 4)];
}

// 练习模式（无限生命）的分数不计入最高分
function saveBest(){
  if (G.practice) return;
  if (G.score > G.best){
    G.best = G.score;
    localStorage.setItem('neon-breaker-best', String(G.best));
  }
}

function damage(b, bx, by){  if (b.solid){
    Sound.hard();
    addParticles(bx, by, '#9fb3d9', 6, .5);
    G.shake = Math.max(G.shake, 5);
    return;
  }
  b.hp--; b.hit = 1;
  if (b.hp > 0){
    Sound.brick(b.row);
    addParticles(bx, by, brickColor(b), 6, .6);
    return;
  }
  // 击破
  b.dead = true;
  G.combo++; G.comboTimer = 2.2;
  const mult = 1 + Math.min(G.combo - 1, 9) * .25;
  const base = b.golden ? 120 : 20 + (b.max - 1) * 15;
  const gain = Math.round(base * mult);
  G.score += gain;
  saveBest();
  floats.push({ x: b.x + b.w/2, y: b.y + b.h/2, text: '+'+gain + (G.combo>1?` x${mult.toFixed(2)}`:''), color: brickColor(b), life: .8, vy: -50 });
  addParticles(b.x + b.w/2, b.y + b.h/2, brickColor(b), b.golden ? 26 : 14, b.golden ? 1.3 : 1);
  Sound.brick(b.row);
  spawnDrops(b.x + b.w/2, b.y + b.h/2);
}

function loseLife(){
  if (G.practice){
    // 本局是练习模式：不扣命、不结束，直接重发球
    // 只认 practice（而不是选关开关 infinite），避免开关状态影响普通模式
    G.combo = 0;
    G.shake = 6;
    Sound.lose();
    resetBall();
    paddle.w = 130;
    clampPaddle();
    G.state = S.READY;
    G.msg = '无限生命 · 重发球';
    G.msgTimer = 1.2;
    return;
  }
  G.lives--;
  G.combo = 0;
  G.shake = 18;
  if (G.lives <= 0){
    G.state = S.OVER;
    Sound.over();
    clearSave(false);       // 命耗尽了：存档作废，避免读档回到必死局面
    autoSaveArmed = false;
    return;
  }
  Sound.lose();
  resetBall();
  paddle.w = 130;
  clampPaddle();
  G.state = S.READY;
  G.msg = '剩余 ' + G.lives + ' 条命';
  G.msgTimer = 1.4;
  saveProgress(false);      // 掉命也是关键节点
}

/* ============================ 更新 ============================ */
function update(dt){
  G.time += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 60);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 1.6);
  if (G.slowFx > 0) G.slowFx = Math.max(0, G.slowFx - dt);
  if (G.msgTimer > 0) G.msgTimer = Math.max(0, G.msgTimer - dt);
  if (G.comboTimer > 0){ G.comboTimer -= dt; if (G.comboTimer <= 0) G.combo = 0; }

  // 自动存档：游玩中每 60 秒写一次（只在真正在打的时候计时）
  if (autoSaveArmed && G.state === S.PLAY){
    G.playTime += dt;
    autoSaveTimer += dt;
    if (autoSaveTimer >= 60) saveProgress(false);
  }

  // 进度停滞计时：长时间没打掉砖块 -> 反弹时会逐渐加扰动（见挡板碰撞处）
  const remain = bricks.reduce((n, b) => n + (b.solid || b.dead ? 0 : 1), 0);
  if (remain !== G.lastBricks){ G.lastBricks = remain; G.stuckTimer = 0; }
  else if (G.state === S.PLAY) G.stuckTimer += dt;

  // 兜底：扰动+引导都还没打开局面，就直接把球召回挡板重新发射，
  // 换一个全新角度。40 秒空等本身已经很难受了，这一步对正常玩法不可见。
  if (G.stuckTimer > 40 && G.state === S.PLAY && balls.length && !balls[0].stuck){
    G.stuckTimer = 0;
    const b = balls[0];
    b.stuck = true;
    b.x = paddle.x + paddle.w/2;
    b.y = paddle.y - b.r - 1;
    b.vx = 0; b.vy = 0;
    b.trail.length = 0;
    b.vTimer = 0;
    addParticles(b.x, b.y, '#ffd93d', 18, 1);
    floats.push({ x: b.x, y: b.y - 22, text: '重新发球', color: '#ffd93d', life: 1.0, vy: -40 });
    if (window.__NB_DEBUG) window.__NB_DEBUG.reloads = (window.__NB_DEBUG.reloads || 0) + 1;
    launch();                                   // 立刻以全新角度再发一次
  }

  // 粒子 & 飘字（任何状态都跑，视觉上不断）
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1 - 2.2*dt); p.vy = p.vy*(1 - 2.2*dt) + 190*dt;
    if (p.life <= 0) particles.splice(i,1);
  }
  for (let i = floats.length - 1; i >= 0; i--){
    const f = floats[i];
    f.life -= dt; f.y += f.vy*dt; f.vy *= (1 - 1.4*dt);
    if (f.life <= 0) floats.splice(i,1);
  }
  for (const b of bricks) if (b.hit > 0) b.hit = Math.max(0, b.hit - dt*4);

  if (G.state !== S.PLAY && G.state !== S.READY) return;

  /* ---- 挡板 ---- */
  const spd = 760;
  let dir = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A'])  dir -= 1;
  if (keys['ArrowRight']|| keys['d'] || keys['D'])  dir += 1;
  const prevX = paddle.x;
  if (dir){
    paddle.x += dir * spd * dt;
    pointerTarget = null;              // 键盘优先，避免鼠标残留位置拽走挡板
  } else if (pointerTarget !== null){
    const want = pointerTarget - paddle.w/2;
    paddle.x += (want - paddle.x) * Math.min(1, dt * 16);
  }
  clampPaddle();
  paddle.vx = (paddle.x - prevX) / Math.max(dt, 1e-4);

  /* ---- 球 ---- */
  for (let i = balls.length - 1; i >= 0; i--){
    const b = balls[i];

    if (b.stuck){
      b.x = paddle.x + paddle.w/2 + b.offset;
      b.y = paddle.y - b.r - 1;
    } else {
      // 子步长防穿透
      const speed = Math.hypot(b.vx, b.vy);
      const steps = clamp(Math.ceil(speed * dt / 6), 1, 8);
      const sdt = dt / steps;
      for (let s = 0; s < steps; s++){
        b.x += b.vx * sdt;
        b.y += b.vy * sdt;

        // 墙
        if (b.x - b.r < 24){ b.x = 24 + b.r; b.vx = Math.abs(b.vx); Sound.wall(); addParticles(b.x, b.y, '#31f2ff', 4, .4); }
        if (b.x + b.r > W - 24){ b.x = W - 24 - b.r; b.vx = -Math.abs(b.vx); Sound.wall(); addParticles(b.x, b.y, '#31f2ff', 4, .4); }
        if (b.y - b.r < 24){ b.y = 24 + b.r; b.vy = Math.abs(b.vy); Sound.wall(); addParticles(b.x, b.y, '#31f2ff', 4, .4); }

        // 挡板
        if (b.vy > 0 &&
            b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
            b.x >= paddle.x - b.r && b.x <= paddle.x + paddle.w + b.r){
          b.y = paddle.y - b.r;
          const rel = clamp((b.x - (paddle.x + paddle.w/2)) / (paddle.w/2), -1, 1);
          let sp = Math.hypot(b.vx, b.vy);
          sp = clamp(sp * 1.012, 400, 1000);
          // 最小偏角 12°：rel≈0 时也不能打成正垂直，否则会陷入竖直死循环
          const MINA = 0.2095;                         // 12°
          let ang = rel * (Math.PI/3);
          if (Math.abs(ang) < MINA) ang = (rel < 0 ? -MINA : MINA);
          // 防卡死：长时间没打掉砖块 -> 反弹角加随机扰动，并朝最近的活砖柔性引导，
          // 否则某些角度组合会让最后几块砖永远打不到。
          const assist = clamp((G.stuckTimer - 8) / 17, 0, 1);   // 8s 开始，25s 满强度
          if (assist > 0){
            ang += (Math.random() * 2 - 1) * assist * 0.5;
            ang = clamp(ang, -1.45, 1.45);
            const tgt = nearestBrick(b.x, b.y);
            if (tgt){
              const want = Math.atan2(tgt.y - b.y, tgt.x - b.x) + (Math.random() - 0.5) * 0.3;
              const cur = Math.atan2(-Math.abs(Math.cos(ang)), Math.sin(ang));  // 反弹后的实际方向
              let diff = want - cur;
              diff = Math.atan2(Math.sin(diff), Math.cos(diff));
              const na = cur + diff * assist;          // 满强度时直接指向目标砖
              ang = Math.atan2(Math.sin(na), -Math.abs(Math.cos(na)));
            }
          }
          b.vx = Math.sin(ang) * sp + paddle.vx * .10;
          b.vy = -Math.abs(Math.cos(ang) * sp);
          // 挡板横甩极快时可能把 vx 顶到过大，收一下比例保证仍是向上的球
          const maxVx = sp * 0.86;
          if (Math.abs(b.vx) > maxVx) b.vx = Math.sign(b.vx) * maxVx;
          b.vy = -Math.sqrt(Math.max(sp*sp - b.vx*b.vx, sp*sp*0.26));
          Sound.paddle();
          addParticles(b.x, paddle.y, '#4dff9e', 5, .5);
        }

        // 砖块
        for (const br of bricks){
          if (br.dead) continue;
          if (b.x + b.r < br.x || b.x - b.r > br.x + br.w) continue;
          if (b.y + b.r < br.y || b.y - b.r > br.y + br.h) continue;

          // 找出从哪一侧撞入
          const ox = Math.min(Math.abs(b.x + b.r - br.x), Math.abs(br.x + br.w - (b.x - b.r)));
          const oy = Math.min(Math.abs(b.y + b.r - br.y), Math.abs(br.y + br.h - (b.y - b.r)));
          if (ox < oy){
            b.vx = -b.vx;
            b.x += (b.x < br.x + br.w/2) ? -(ox + .5) : (ox + .5);
          } else {
            b.vy = -b.vy;
            b.y += (b.y < br.y + br.h/2) ? -(oy + .5) : (oy + .5);
          }
          damage(br, b.x, b.y);
          break;
        }
      }
    }

    // 保险 2：长时间打不到砖 -> 每帧把速度朝最近的活砖转一点点。
    // 单帧最大约 4°，正常玩法几乎感知不到，但足以让"打不到的循环"收敛。
    if (!b.stuck && G.state === S.PLAY && G.stuckTimer > 5){
      const tgt = nearestBrick(b.x, b.y);
      if (tgt){
        const sp = Math.hypot(b.vx, b.vy);
        if (sp > 1){
          const cur = Math.atan2(b.vy, b.vx);
          const want = Math.atan2(tgt.y + tgt.h/2 - b.y, tgt.x + tgt.w/2 - b.x);
          let diff = want - cur;
          diff = Math.atan2(Math.sin(diff), Math.cos(diff));
          const maxTurn = clamp((G.stuckTimer - 5) / 25, 0, 1) * (4 * Math.PI/180);
          const turn = clamp(diff, -maxTurn, maxTurn);
          if (turn){
            const na = cur + turn;
            b.vx = Math.cos(na) * sp;
            b.vy = Math.sin(na) * sp;
          }
        }
      }
    }

    // 拖尾
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 14) b.trail.shift();

    // 保险：连续 5 秒近乎纯竖直弹跳 -> 强制纠偏，避免无限竖直死循环
    if (!b.stuck){
      const sp = Math.hypot(b.vx, b.vy) || 1;
      if (Math.abs(b.vx) / sp < 0.10) b.vTimer += dt;
      else b.vTimer = 0;
      if (b.vTimer > 5){
        b.vTimer = 0;
        const s = sp, dir = Math.random() < .5 ? -1 : 1;
        const ang = dir * (0.30 + Math.random() * 0.45);   // 17°~43°
        b.vx = Math.sin(ang) * s;
        b.vy = Math.sign(b.vy || -1) * Math.abs(Math.cos(ang) * s);
        addParticles(b.x, b.y, '#ffd93d', 10, .8);
        if (window.__NB_DEBUG) window.__NB_DEBUG.nudges = (window.__NB_DEBUG.nudges || 0) + 1;
      }
    }

    // 掉落
    if (b.y - b.r > H + 20){
      balls.splice(i, 1);
    }
  }

  if (balls.length === 0 && (G.state === S.PLAY)) loseLife();

  /* ---- 道具下落 ---- */
  for (let i = drops.length - 1; i >= 0; i--){
    const d = drops[i];
    d.t += dt;
    d.y += d.v * dt;
    if (d.y > H + 30){ drops.splice(i,1); continue; }
    if (d.y > paddle.y - 12 && d.y < paddle.y + paddle.h + 10 &&
        d.x > paddle.x - 14 && d.x < paddle.x + paddle.w + 14){
      applyPower(d.p);
      addParticles(d.x, d.y, d.p.c, 16, .9);
      drops.splice(i,1);
    }
  }

  /* ---- 通关判定 ---- */
  if (G.state === S.PLAY && bricks.every(b => b.dead || b.solid)){
    G.score += 250 + G.level * 100;
    saveBest();
    G.state = S.LEVEL;
    G.msg = '关卡清除！ +' + (250 + G.level*100);
    G.msgTimer = 3;
    Sound.win();
    for (let i = 0; i < 60; i++) addParticles(rnd(60, W-60), rnd(80, 360), ['#31f2ff','#ff3ea5','#ffd93d','#4dff9e'][i%4], 1, 1.2);
    // 不在这里存档：此刻砖块全空，存档会正好落在"待进下一关"的瞬间。
    // 存档点放在 nextLevel() 里（新一关刚铺好）。
  }
}

/* ============================ 绘制 ============================ */
function roundRect(x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

function drawBackground(){
  // 网格
  ctx.save();
  ctx.strokeStyle = 'rgba(49,242,255,.065)';
  ctx.lineWidth = 1;
  const off = (G.time * 18) % 40;
  for (let x = -40 + off; x < W + 40; x += 40){
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = -40 + off; y < H + 40; y += 40){
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();

  // 边框
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, 'rgba(49,242,255,.55)');
  g.addColorStop(.5, 'rgba(120,80,255,.35)');
  g.addColorStop(1, 'rgba(255,62,165,.55)');
  ctx.save();
  ctx.strokeStyle = g;
  ctx.lineWidth = 3;
  roundRect(22, 22, W-44, H-44, 14);
  ctx.stroke();
  ctx.restore();
}

function drawBricks(){
  for (const b of bricks){
    if (b.dead) continue;
    const col = brickColor(b);
    const glow = b.hit > 0 ? .55 + b.hit * .8 : (b.solid ? .12 : .3);
    ctx.save();
    ctx.shadowColor = col;
    ctx.shadowBlur = b.solid ? 6 : 14 * glow + 6;

    const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    grad.addColorStop(0, col);
    grad.addColorStop(1, 'rgba(0,0,0,.35)');
    ctx.globalAlpha = b.solid ? .5 : .9;
    ctx.fillStyle = grad;
    roundRect(b.x, b.y, b.w, b.h, 6);
    ctx.fill();

    // 高光条
    ctx.globalAlpha = b.solid ? .25 : .5;
    ctx.fillStyle = '#fff';
    roundRect(b.x + 3, b.y + 3, b.w - 6, 3, 2);
    ctx.fill();

    // 血量刻度 / 特殊标记
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    if (b.solid){
      ctx.strokeStyle = 'rgba(200,220,255,.35)';
      ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++){
        ctx.beginPath();
        ctx.moveTo(b.x + b.w*i/4, b.y + 5);
        ctx.lineTo(b.x + b.w*i/4, b.y + b.h - 5);
        ctx.stroke();
      }
    } else if (b.hp > 1){
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.font = 'bold 13px Segoe UI, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(b.hp, b.x + b.w/2, b.y + b.h/2 + 1);
    } else if (b.golden){
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.font = 'bold 14px Segoe UI, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('★', b.x + b.w/2, b.y + b.h/2 + 1);
    }
    ctx.restore();
  }
}

function drawPaddle(){
  const grad = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
  grad.addColorStop(0,   '#31f2ff');
  grad.addColorStop(.5,  '#ffffff');
  grad.addColorStop(1,   '#ff3ea5');
  ctx.save();
  ctx.shadowColor = '#31f2ff';
  ctx.shadowBlur = 22;
  ctx.fillStyle = grad;
  roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
  ctx.fill();
  ctx.restore();
}

function drawBalls(){
  for (const b of balls){
    // 拖尾
    ctx.save();
    for (let i = 0; i < b.trail.length; i++){
      const t = b.trail[i];
      const k = i / b.trail.length;
      ctx.globalAlpha = k * .38;
      ctx.fillStyle = '#31f2ff';
      ctx.beginPath();
      ctx.arc(t.x, t.y, b.r * k * .95, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 20;
    const grad = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, b.r + 2);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(1, '#31f2ff');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawDrops(){
  for (const d of drops){
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(Math.sin(d.t * 4) * .22);
    ctx.shadowColor = d.p.c;
    ctx.shadowBlur = 16;
    ctx.fillStyle = d.p.c;
    roundRect(-15, -11, 30, 22, 7);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.72)';
    ctx.font = 'bold 14px Segoe UI, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(d.p.ch, 0, 1);
    ctx.restore();
  }
}

function drawParticles(){
  ctx.save();
  for (const p of particles){
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawFloats(){
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats){
    ctx.globalAlpha = clamp(f.life / .8, 0, 1);
    ctx.font = 'bold 16px Segoe UI, sans-serif';
    ctx.shadowColor = f.color; ctx.shadowBlur = 10;
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.restore();
}

function drawHUD(){
  ctx.save();
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 22px Segoe UI, sans-serif';

  // 分数
  ctx.textAlign = 'left';
  ctx.shadowColor = '#31f2ff'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#dff6ff';
  ctx.fillText(String(G.score).padStart(6, '0'), 40, 48);

  ctx.shadowBlur = 0;
  ctx.font = '11px Segoe UI, sans-serif';
  ctx.fillStyle = 'rgba(223,246,255,.45)';
  ctx.fillText('BEST ' + G.best, 40, 68);

  // 练习模式横幅（分数不计入最高分）
  if (G.practice){
    ctx.save();
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 11px Segoe UI, sans-serif';
    ctx.strokeStyle = 'rgba(255,217,61,.75)';
    ctx.lineWidth = 1.4;
    ctx.shadowColor = '#ffd93d'; ctx.shadowBlur = 10;
    roundRect(40, 78, 186, 19, 9);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd93d';
    ctx.fillText('练习模式 · 无限生命 · 不计分', 50, 88);
    ctx.restore();
  }

  // 生命
  ctx.textAlign = 'right';
  if (G.infinite){
    ctx.save();
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ffd93d'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffd93d';
    ctx.font = 'bold 26px Segoe UI, sans-serif';
    ctx.fillText('∞', W - 40, 48);
    ctx.font = '11px Segoe UI, sans-serif';
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,217,61,.6)';
    ctx.fillText('无限生命', W - 40, 68);
    ctx.restore();
  } else {
    // 最多画 7 个点，多出来的用 "+N" 表示，避免生命很多时被静默截断
    const MAXDOTS = 7;
    const dots = Math.min(G.lives, MAXDOTS);
    for (let i = 0; i < dots; i++){
      ctx.save();
      ctx.shadowColor = '#ff3ea5'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#ff3ea5';
      ctx.beginPath();
      ctx.arc(W - 42 - i*22, 48, 6, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    if (G.lives > MAXDOTS){
      ctx.save();
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 13px Segoe UI, sans-serif';
      ctx.fillStyle = '#ff3ea5';
      ctx.shadowColor = '#ff3ea5'; ctx.shadowBlur = 10;
      ctx.fillText('+' + (G.lives - MAXDOTS), W - 42 - dots*22 - 4, 48);
      ctx.restore();
    }
    ctx.save();
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.font = '11px Segoe UI, sans-serif';
    ctx.fillStyle = 'rgba(223,246,255,.45)';
    ctx.fillText('LEVEL ' + (G.level + 1), W - 40, 68);
    ctx.restore();
  }

  // 连击
  if (G.combo > 1){
    ctx.save();
    ctx.textAlign = 'center';
    const k = clamp(G.comboTimer / 2.2, 0, 1);
    ctx.globalAlpha = .45 + .55 * k;
    ctx.font = 'bold 20px Segoe UI, sans-serif';
    ctx.shadowColor = '#ffd93d'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#ffd93d';
    ctx.fillText('COMBO x' + G.combo, W/2, 48);
    ctx.restore();
  }

  // 慢动作提示
  if (G.slowFx > 0){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.globalAlpha = clamp(G.slowFx, 0, 1) * .8;
    ctx.fillStyle = '#31f2ff';
    ctx.font = 'bold 13px Segoe UI, sans-serif';
    ctx.fillText('SLOW MOTION', W/2, 72);
    ctx.restore();
  }
  ctx.restore();
}

function centerText(lines){
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach(l => {
    ctx.font = l.font;
    ctx.shadowColor = l.color; ctx.shadowBlur = l.blur ?? 16;
    ctx.fillStyle = l.color;
    ctx.fillText(l.text, W/2, l.y);
  });
  ctx.restore();
}

// 选关卡片里的迷你地图（每行一条 12px 色条，按 10 格切分）
function drawPreview(grid, x, y, cw, rh){
  const g = 1.5, cwid = cw / 10;
  const oy = y - (grid.length - 1) * (rh + g) / 2;
  for (let r = 0; r < grid.length; r++){
    const row = grid[r];
    const ry = oy + r * (rh + g);
    for (let c = 0; c < 10; c++){
      const v = row[c];
      if (!v) continue;
      ctx.fillStyle = v === -1 ? 'rgba(122,146,190,.85)'
                    : v === 9  ? '#ffd93d'
                    : BRICK_COLORS[Math.min(v - 1, 4)];
      roundRect(x + c * (cwid + g), ry, cwid, rh, 1.5);
      ctx.fill();
    }
  }
}

// 自绘准星：细十字 + 中心点 + 外圈虚线 + 一道光晕（因为原生光标被 cursor:none 隐藏了）
// 全屏后指针始终在画布内；若落在上下/左右的留边上，准星变暗表示"这里不控制挡板"
function drawReticle(){
  if (!mouse.hasPointer) return;
  const x = clamp(mouse.x, 14, W - 14);
  const y = clamp(mouse.y, 14, H - 14);
  const dim = mouse.onField === false ? 0.35 : 1;
  const pulse = (0.85 + 0.15 * Math.sin(G.time * 4.5)) * dim;
  ctx.save();
  ctx.shadowColor = '#31f2ff';
  ctx.shadowBlur = 10;
  ctx.lineWidth = 1.6;

  // 十字：留有中心空隙
  ctx.globalAlpha = pulse * 0.9;
  ctx.strokeStyle = '#dff6ff';
  ctx.beginPath();
  ctx.moveTo(x - 17, y); ctx.lineTo(x - 6, y);
  ctx.moveTo(x + 6,  y); ctx.lineTo(x + 17, y);
  ctx.moveTo(x, y - 17); ctx.lineTo(x, y - 6);
  ctx.moveTo(x, y + 6);  ctx.lineTo(x, y + 17);
  ctx.stroke();

  // 中心点
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(x, y, 1.9, 0, TAU);
  ctx.fill();

  // 外圈（虚线旋转）
  ctx.globalAlpha = pulse * 0.5;
  ctx.strokeStyle = '#31f2ff';
  ctx.lineWidth = 1.4;
  const a0 = G.time * 1.6;
  for (let i = 0; i < 4; i++){
    const a = a0 + i * (TAU / 4);
    ctx.beginPath();
    ctx.arc(x, y, 21, a, a + 0.55);
    ctx.stroke();
  }
  ctx.restore();

  // 指向挡板的引导虚线（挡板跟鼠标走，给一点"连起来了"的反馈）
  ctx.save();
  ctx.globalAlpha = 0.16 * dim;
  ctx.strokeStyle = '#31f2ff';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);
  ctx.beginPath();
  ctx.moveTo(x, y + 26);
  ctx.lineTo(x, paddle.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function render(){
  // 先按 CSS 像素清空整个画布（含留边），再切回逻辑坐标系绘制
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, view.w, view.h);
  setFrameTransform();

  ctx.save();
  if (G.shake > .2){
    ctx.translate(rnd(-G.shake, G.shake) * .35, rnd(-G.shake, G.shake) * .35);
  }
  drawBackground();
  drawBricks();
  drawDrops();
  drawPaddle();
  drawBalls();
  drawParticles();
  drawFloats();
  ctx.restore();

  if (G.flash > 0){
    ctx.save();
    ctx.globalAlpha = G.flash * .25;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  if (G.state === S.SELECT){
    drawSelect();         // 选关界面自带布局，不叠游戏 HUD
  } else {
    drawHUD();
    drawOverlay();
  }
  // 存档码界面压在最上层（可能从任意状态唤起）
  if (shareUI.active) drawShareScreen();
  else if (importUI.active) drawImportScreen();
  drawReticle();          // 最后画，保证浮在所有覆盖层之上
}

/* ============================ 主循环 ============================ */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 1/30);           // 掉帧保护
  update(dt);
  render();
  requestAnimationFrame(frame);
}
