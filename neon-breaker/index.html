<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEON BREAKER · 霓虹打砖块</title>
<style>
  :root{
    --neon:#31f2ff;
    --pink:#ff3ea5;
    --bg0:#05060f;
    --bg1:#0b1030;
    --txt:#dff6ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(120% 90% at 50% 0%,#131a4a 0%,var(--bg1) 38%,var(--bg0) 100%);
    color:var(--txt);
    font-family:"Segoe UI",-apple-system,"Microsoft YaHei",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  /* 画布铺满整个视口：逻辑 16:10 的画面在里面等比缩放居中，
     多出来的部分在画布内部留边 —— 这样鼠标永远在游戏区内 */
  #stage{position:fixed;inset:0}
  canvas{
    position:absolute;inset:0;width:100%;height:100%;
    display:block;
    background:#04050d;
    touch-action:none;
    cursor:none;
  }
  #fsBtn{
    position:absolute;top:12px;right:12px;z-index:5;
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;line-height:1;
    color:rgba(223,246,255,.6);
    border:1px solid rgba(49,242,255,.32);
    background:rgba(6,10,26,.55);
    cursor:pointer;
    transition:color .15s,border-color .15s,box-shadow .15s;
    -webkit-user-select:none;user-select:none;
  }
  #fsBtn:hover{color:#dff6ff;border-color:#31f2ff;box-shadow:0 0 14px rgba(49,242,255,.35)}
  #hint{
    position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    z-index:5;pointer-events:none;
    font-size:12px;letter-spacing:.14em;color:rgba(223,246,255,.35);white-space:nowrap;
  }
  @media (max-width:720px){#hint{display:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="fsBtn" title="全屏 (F)">⛶</div>
  <div id="hint">← → / 鼠标 = 挡板 &nbsp;·&nbsp; 空格 = 发射 &nbsp;·&nbsp; P = 暂停 &nbsp;·&nbsp; C = 选关 &nbsp;·&nbsp; F = 全屏</div>
</div>
<script>
"use strict";
/* ============================================================
   NEON BREAKER — 一个给自己玩的霓虹打砖块
   单文件 / 无依赖 / Canvas 2D
   - 4 种道具 + 2 种负面效果
   - 连击倍率、拖尾球、粒子、屏幕震动
   - 6 个关卡 + 无限生成的后续关卡
   - 最高分存 localStorage
   ============================================================ */

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');

/* ---------- 视口与坐标映射 ----------
   画布铺满整个视口，逻辑画面固定 16:10（W×H）等比缩放居中，
   多出来的部分由 drawBackground 画成暗色留边。
   这样鼠标指针永远落在 canvas 上，不会"移出框"。 */
const W = 960, H = 600;
const view = { w: W, h: H, scale: 1, ox: 0, oy: 0, dpr: 1 };
let cssW = W, cssH = H;

function resize(){
  const r = cv.getBoundingClientRect();
  const nextW = Math.max(1, Math.round(r.width));
  const nextH = Math.max(1, Math.round(r.height));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  // 尺寸没变就不要重设 size：设置 canvas.width 会清空整块位图，
  // 在"改的是 devicePixelRatio 而不是尺寸"这类 resize 里会白白闪一下黑屏。
  if (nextW === cssW && nextH === cssH && dpr === view.dpr) return;

  cssW = nextW;
  cssH = nextH;
  cv.width  = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);

  view.dpr   = dpr;
  view.w     = cssW;
  view.h     = cssH;
  view.scale = Math.min(cssW / W, cssH / H);          // 等比，保证整幅画面可见
  view.ox    = (cssW - W * view.scale) / 2;
  view.oy    = (cssH - H * view.scale) / 2;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);             // CSS 像素坐标系
  setFrameTransform();
}

// 把逻辑坐标 (960×600) 映射到当前视口
function setFrameTransform(){
  ctx.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale,
                   view.dpr * view.ox, view.dpr * view.oy);
}

function toggleFullscreen(){
  const el = document.documentElement;
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (!fsEl){
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const p = req.call(el); if (p && p.catch) p.catch(() => {}); }
  } else {
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex) { const p = ex.call(document); if (p && p.catch) p.catch(() => {}); }
  }
}
function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
// 全屏状态变化后布局尺寸会变，等一帧再量
for (const ev of ['fullscreenchange', 'webkitfullscreenchange']){
  document.addEventListener(ev, () => { requestAnimationFrame(resize); }, false);
}

// 屏幕坐标 -> 逻辑坐标。结果一律夹取到 0..W / 0..H：
// 视口比例不是 16:10 时，画面四周会多出一条留边，如果指针进了留边就"不控制挡板"，
// 那这条留边就是个死区 —— 鼠标移过去挡板不动、准星还隐掉，看起来像卡住了。
// 夹取之后整个窗口的每一个像素都能控制挡板，指针永远不会"丢"。
function toWorld(clientX, clientY){
  const r = cv.getBoundingClientRect();
  const x = (clientX - r.left - view.ox) / view.scale;
  const y = (clientY - r.top  - view.oy) / view.scale;
  return { x: clamp(x, 0, W), y: clamp(y, 0, H) };
}

addEventListener('resize', resize);
addEventListener('orientationchange', resize);

/* ============================ 音效 ============================ */
const Sound = (() => {
  let actx = null, muted = false;
  function ac(){
    if (!actx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      actx = new C();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type = 'square', vol = .05, slide = 0){
    if (muted) return;
    const a = ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
    o.connect(g).connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + .02);
  }
  return {
    unlock(){ ac(); },
    toggle(){ muted = !muted; saveSettings(); return muted; },
    setMuted(v){ muted = !!v; },
    get muted(){ return muted; },
    paddle(){ tone(240, .05, 'square', .04); },
    wall(){ tone(380, .04, 'triangle', .03); },
    brick(row){ tone(320 + (5 - Math.min(row,5)) * 70, .07, 'square', .045); },
    hard(){ tone(120, .12, 'sawtooth', .05, -60); },
    power(){ tone(520, .08, 'triangle', .06, 340); setTimeout(()=>tone(880,.09,'triangle',.05,220),60); },
    bad(){ tone(200, .18, 'sawtooth', .06, -120); },
    lose(){ [440,330,247,165].forEach((f,i)=>setTimeout(()=>tone(f,.22,'sawtooth',.06,-40), i*130)); },
    win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.06), i*110)); },
    over(){ [392,349,294,196].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sawtooth',.07,-50), i*180)); }
  };
})();

/* ============================ 工具 ============================ */
const rnd  = (a,b) => a + Math.random()*(b-a);
const clamp= (v,a,b) => v<a?a:v>b?b:v;
const TAU  = Math.PI*2;

/* ---------- 随机关卡的生成参数 ----------
   行数固定 5~7 行：不是随便定的。砖区底边 = brickTop + 行数*行距 + brickH，
   而挡板在 paddle.y。这个"净空"决定了球从砖底弹回挡板的来回趟数，
   行数放宽到 10 行时净空只剩 141px（约一个球径 + 两倍砖高），玩家来不及反应。
   所以 SAFE_MIN_GAP 只管随机关卡；设计关卡不受它约束 —— 第 5 关"金字塔"
   是刻意做成 10 行、底边距挡板 141px 的（越往下越窄，是它自己的玩法）。 */
const SAFE_MIN_GAP = 180;                 // 随机关卡砖区底边到挡板的最小净空（px）

// 随机关卡的密度保底：形状风格（islands / bands / frame）天然稀疏，
// 不保底会开出"场上没几块砖"的空关。
// 门限按"不少于最大砖数的 60%"定：场地是 10 列 × 最多 7 行 = 70 格，
// 实测随机关卡最多 60 块砖，60% 即 42 块。每行至少 6 块（5 行时合计 30，
// 由全局门限 42 兜住；6~7 行时逐行门限独立生效）。
// 注意这两个数保的是"骨架格子数"，而骨架铺成实体时会有约 10%~22% 的格子
// 变成实心砖/金砖（不增加可破坏砖），所以落地后还会再补一次 —— 见 topUpRows。
const MIN_BRICKS_PER_ROW = 6;             // 每一行至少这么多块砖
const MIN_BRICK_COUNT    = 42;            // 整关至少这么多块砖

// 普通砖血量权重：随关卡从"偏轻"滑向"偏重"。
// 权重做成曲线而不是硬编码表，便于以后调"哪一关开始变难"。
const HP_W_LIGHT = [30, 26, 20, 14, 10];  // 第 1 档：平均耐久 2.5
const HP_W_HEAVY = [ 4, 10, 16, 28, 42];  // 最高档：平均耐久 3.9
function hpWeights(n){
  const t = clamp((n - 5) / 20, 0, 1);    // 第 6 关起生效，第 26 关后封顶
  return HP_W_LIGHT.map((v, i) => v + (HP_W_HEAVY[i] - v) * t);
}
// 按权重取一个 1..5 的血量
function rollHp(w){
  let total = 0;
  for (const v of w) total += v;
  let x = Math.random() * total;
  for (let i = 0; i < w.length; i++){ x -= w[i]; if (x <= 0) return i + 1; }
  return w.length;
}

// 图案骨架：让随机关卡有"可读的形状"，而不是一片噪点
const GEN_STYLES = ['noise', 'mirrorH', 'mirrorV', 'bands', 'frame', 'islands'];

function genNoise(nr, n){ return Array.from({length: nr}, () => Array(10).fill(1)); }

// 左右镜像：右半来自左半，形状一眼看得出是"设计过的"
function genMirrorH(nr){
  const g = Array.from({length: nr}, () => Array(10).fill(0));
  for (let r = 0; r < nr; r++)
    for (let c = 0; c < 5; c++){
      const on = Math.random() < .78 ? 1 : 0;
      g[r][c] = on; g[r][9 - c] = on;
    }
  return g;
}

function genMirrorV(nr){
  const g = Array.from({length: nr}, () => Array(10).fill(0));
  const half = Math.ceil(nr / 2);
  for (let r = 0; r < half; r++)
    for (let c = 0; c < 10; c++){
      const on = Math.random() < .78 ? 1 : 0;
      g[r][c] = on;
      if (nr - 1 - r !== r) g[nr - 1 - r][c] = on;
    }
  return g;
}

// 斜带：相位随机，所以每一关的斜纹位置都不同（旧版是 (r+n)%5，5 行一循环）
function genBands(nr){
  const g = Array.from({length: nr}, () => Array(10).fill(0));
  const slope = Math.random() < .5 ? 1 : -1;
  const period = 3 + Math.floor(Math.random() * 3);      // 3..5
  const phase = Math.random() * period;
  for (let r = 0; r < nr; r++)
    for (let c = 0; c < 10; c++){
      const t = ((c + slope * r * 1.5 + phase) % period + period) % period;
      g[r][c] = t < 1.6 ? 1 : 0;
    }
  return g;
}

function genFrame(nr){
  const g = Array.from({length: nr}, () => Array(10).fill(0));
  for (let r = 0; r < nr; r++)
    for (let c = 0; c < 10; c++){
      const edge = (r === 0 || r === nr - 1 || c === 0 || c === 9);
      const inner = (r === 1 || r === nr - 2 || c === 1 || c === 8);
      g[r][c] = edge ? 1 : (inner && Math.random() < .2 ? 1 : 0);
    }
  return g;
}

// 块状聚集：先撒几颗种子再向邻居蔓延，形成"岛"而不是逐格独立噪点
function genIslands(nr){
  const g = Array.from({length: nr}, () => Array(10).fill(0));
  const seeds = 3 + Math.floor(Math.random() * 3);
  const target = Math.round(nr * 10 * (0.55 + Math.random() * 0.3));
  let filled = 0, guard = 0;
  if (!seeds) return g;
  const queue = [];
  for (let i = 0; i < seeds; i++){
    const r = Math.floor(Math.random() * nr), c = Math.floor(Math.random() * 10);
    if (!g[r][c]){ g[r][c] = 1; filled++; queue.push([r, c]); }
  }
  while (filled < target && queue.length && guard++ < 4000){
    const i = Math.floor(Math.random() * queue.length);
    const [r, c] = queue.splice(i, 1)[0];
    const nbrs = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
    const [nr2, nc2] = nbrs[Math.floor(Math.random() * nbrs.length)];
    if (nr2 < 0 || nr2 >= nr || nc2 < 0 || nc2 >= 10) continue;
    if (g[nr2][nc2]) continue;
    g[nr2][nc2] = 1; filled++; queue.push([nr2, nc2]);
  }
  return g;
}

function genSkeleton(style, nr, n){
  let skel;
  if (style === 'mirrorH')      skel = genMirrorH(nr);
  else if (style === 'mirrorV') skel = genMirrorV(nr);
  else if (style === 'bands')   skel = genBands(nr);
  else if (style === 'frame')   skel = genFrame(nr);
  else if (style === 'islands') skel = genIslands(nr);
  else                          skel = genNoise(nr, n);
  return fillSkeleton(skel, style);
}

// 对称骨架补砖时必须"成对"补，否则补出来的格子是单边的，对称性就废了。
// mirrorH 补左右镜像，mirrorV 补上下镜像；其他风格没有对称约束，返回自身。
function mirrorCells(style, nr, nc, r, c){
  if (style === 'mirrorH') return [[r, nc - 1 - c]];
  if (style === 'mirrorV') return [[nr - 1 - r, c]];
  return [];
}
// 用"成对补砖"把一行填到至少 MIN_BRICKS_PER_ROW（计数只算这一行，但补的格子可能落在镜像行）
function fillRowMirrored(g, style, nr, nc, r){
  let inRow = 0;
  for (const v of g[r]) if (v) inRow++;
  let guard = 0;
  while (inRow < MIN_BRICKS_PER_ROW && guard++ < nc * 4){
    const c = Math.floor(Math.random() * nc);
    if (g[r][c]) continue;
    g[r][c] = 1; inRow++;
    for (const [r2, c2] of mirrorCells(style, nr, nc, r, c))
      if (!g[r2][c2]) g[r2][c2] = 1;
  }
}

// 密度保底：islands / bands / frame 这些"有形状"的风格天然稀疏
// （实测 islands 平均只有 11 块砖、最少 3 块，还有 24% 的整行为空），
// 于是玩家会开到"场上没几块砖"的空关。这里保证每个骨架都达到最低密度：
// 先逐行补够 MIN_BRICKS_PER_ROW，再整体补到 MIN_BRICK_COUNT。
// 只填空位、不重建任何已有结构，所以图案形状不会被打乱。
function fillSkeleton(g, style){
  const nr = g.length, nc = g[0] ? g[0].length : 10;
  let count = 0;
  for (const row of g) for (const v of row) if (v) count++;

  // 1) 逐行：太稀疏的行先补起来（空行尤其致命，球会直接穿过去）
  for (let r = 0; r < nr; r++) fillRowMirrored(g, style, nr, nc, r);

  // 2) 整体：补到最低砖数（同样成对补，保持对称）
  count = 0;
  for (const row of g) for (const v of row) if (v) count++;
  let guard = 0;
  while (count < MIN_BRICK_COUNT && guard++ < nr * nc * 10){
    const r = Math.floor(Math.random() * nr), c = Math.floor(Math.random() * nc);
    if (g[r][c]) continue;
    g[r][c] = 1; count++;
    for (const [r2, c2] of mirrorCells(style, nr, nc, r, c))
      if (!g[r2][c2]){ g[r2][c2] = 1; count++; }
  }
  return g;
}

// 铺完特殊砖之后，逐行再补一次密度（并满足整关门限）。
// 原因：传送门/裂纹/转弯砖都是"替换"某个普通砖格，不新增格子 —— 一扇门落进
// 本来就刚够底的某一行，那一行就会掉到门限以下，于是又出现稀疏行。
// 只填空位，不碰任何已有格子，所以传送门配对不会被破坏（配对由 fixPortals 收尾）。
function topUpRows(P){
  const nr = P.length, nc = P[0] ? P[0].length : 10;
  const cellCount = () => { let n = 0; for (const row of P) for (const v of row) if (v) n++; return n; };
  let guard = 0;
  // 1) 逐行门限
  for (let r = 0; r < nr; r++){
    let inRow = 0;
    for (const v of P[r]) if (v) inRow++;
    while (inRow < MIN_BRICKS_PER_ROW && guard++ < nr * nc * 4){
      const c = Math.floor(Math.random() * nc);
      if (P[r][c]) continue;
      P[r][c] = 1; inRow++;
    }
  }
  // 2) 整关门限：特殊砖替换 + 骨架阶段"格子数 vs 可破坏砖数"的差额都在这一步补齐
  guard = 0;
  while (cellCount() < MIN_BRICK_COUNT && guard++ < nr * nc * 6){
    const r = Math.floor(Math.random() * nr), c = Math.floor(Math.random() * nc);
    if (!P[r][c]) P[r][c] = 1;
  }
}

/* ============================ 关卡 ============================ */
// 0 = 空, 1..5 = 普通砖(耐久=类型值), -1 = 不可破坏, 9 = 金砖(必掉道具)
// 每行必须正好 10 个字符；空位一律写 0，不要写 '.'（Number('.') === NaN）
/* ============================ 砖块类型编码 ============================
   关卡图案与存档共用一套小整数编码（存档走 36 进制，天然覆盖 0..35）：
     0 空 · 1..5 普通砖(血量) · -1 实心砖 · 9 金砖
     6 裂纹砖 · 10~13 转弯砖(上/右/下/左) · 20/21 传送门 A/B
     14 棕色软砖（实心砖被炸开后的形态） · 15 炸药砖 · 16 磁铁砖（击破它的球获得 10 秒磁力）
   14/15/16 落在 6~13 之后、20 之前，和既有编码不冲突；
   存档写的是 b36(type)，所以 14 -> 'e'、15 -> 'f'、16 -> 'g'，格式不用改版本号。  */
const T = { EMPTY:0, SOLID:-1, CRACK:6, GOLD:9,
            TURN_U:10, TURN_R:11, TURN_D:12, TURN_L:13,
            SOFT:14, BOMB:15, MAGNET:16,
            PORTAL_A:20, PORTAL_B:21 };
const TURN_DIRS  = { 10:[0,-1], 11:[1,0], 12:[0,1], 13:[-1,0] };
const TURN_ARROW = { 10:'▲', 11:'▶', 12:'▼', 13:'◀' };
const CRACK_HP = 5;     // 裂纹砖总耐久
const CRACK_AT = 3;     // 剩余耐久降到这个值开始显裂纹
const TURN_HP  = 2;     // 转弯砖耐久（做成可破坏：否则两两相对时球会永久弹射）
const SOFT_HP  = 2;     // 棕色软砖耐久（与 TURN_HP 同档：软化不等于白送）
const BOMB_HP  = 1;     // 炸药砖一击即爆
const MAGNET_HP = 2;    // 磁铁砖耐久（和转弯/软砖同档）
// 图案里可用的字符：. 空   - 实心   * 金砖   c 裂纹   u/r/d/l 转弯   p/q 传送门
//   软砖/炸药砖/磁铁砖只由随机生成和"实心砖被炸开"产生，不给图案字符（写不出来）
const TILE_CH = { '.':0, '-':-1, '*':9, 'c':6, 'u':10, 'r':11, 'd':12, 'l':13, 'p':20, 'q':21 };

const isTurnTile    = (v) => v >= 10 && v <= 13;
const isPortalTile  = (v) => v === 20 || v === 21;
const isCrackTile   = (v) => v === 6;
const isSoftTile    = (v) => v === 14;
const isBombTile    = (v) => v === 15;
const isMagnetTile  = (v) => v === 16;
// 可被打掉的砖（计入通关条件）。软砖必须算进来：实心砖被炸成软砖后
// 就不再是 furniture 了，通关判定 'every(b => b.dead || isFurniture(b))'
// 会自动要求把它清掉 —— 这正是"墙被炸开、现在必须拆掉"该有的效果。
const tileBreakable = (v) => (v >= 1 && v <= 5) || isCrackTile(v) || isTurnTile(v) ||
                              isSoftTile(v) || isBombTile(v) || isMagnetTile(v);
// 不可破坏、也不计入通关条件的"场景砖"（实心砖、传送门）
const isFurniture   = (b) => b.solid || b.portal;

// 在图案里随机挑 k 个"普通砖(1..5)"格子，返回 [[r,c],...]（已被改写的格子不会被重复选中）
function pickNormalCells(P, k){
  const spots = [];
  P.forEach((row, r) => row.forEach((v, c) => { if (v >= 1 && v <= 5) spots.push([r, c]); }));
  for (let i = spots.length - 1; i > 0; i--){          // Fisher-Yates
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = spots[i]; spots[i] = spots[j]; spots[j] = tmp;
  }
  return spots.slice(0, Math.max(0, k));
}

// 逐行保底：一行里至少要有一块"可打掉"的砖，否则球会像穿过漏斗一样从那一行溜走，
// 而且那一行永远清不掉。骨架级调用能修掉"整行实心砖"，特殊砖铺完后的调用
// 还能修掉"pickNormalCells 把某行最后一块普通砖换成了传送门"这种情况。
//   · 只"补"砖，不删传送门 —— 删掉一扇门会让配对失效（死门）。
//   · 优先补在空格上。空格补砖既修好了这一行，又不会覆盖任何东西，
//     所以绝不会拆散传送门配对（也就不会逼 fixPortals 去删门）。
//     只有当这一行一个空格都没有时，才退化成覆盖一个非传送门的格子。
function repairRows(P, w){
  for (const row of P){
    if (row.some(v => tileBreakable(v))) continue;          // 这行已经能打通
    const empties = [], fills = [];
    row.forEach((v, c) => {
      if (v === 0) empties.push(c);
      else if (!isPortalTile(v)) fills.push(c);
    });
    const pool = empties.length ? empties : fills;
    if (!pool.length) continue;                             // 只剩传送门，无从下手（保持配对优先）
    row[pool[Math.floor(Math.random() * pool.length)]] = rollHp(w);
  }
}

// 密度保底：把空格补成普通砖，直到总数达到门限（找不到空格就停手）。
function pickEmptyCells(P, want){
  const empties = [];
  P.forEach((row, r) => row.forEach((v, c) => { if (v === 0) empties.push([r, c]); }));
  for (let i = empties.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = empties[i]; empties[i] = empties[j]; empties[j] = tmp;
  }
  return empties.slice(0, Math.max(0, want));
}
function addBricksToDensity(P){
  const count = () => { let n = 0; for (const row of P) for (const v of row) if (v) n++; return n; };
  const short = MIN_BRICK_COUNT - count();
  if (short <= 0) return;
  for (const [r, c] of pickEmptyCells(P, short)) P[r][c] = 1;
}

// 传送门必须成对：portalA / portalB 是单例，map 里也是靠这两个值配对。
// 成对（2 扇）就放过；只剩 1 扇就是"死门"（球进去什么都不发生）→ 清掉它，
// 但必须在同一格补一块普通砖：否则这一关会凭空少一块砖，密度门限就守不住了。
function fixPortals(P){
  const cells = [];
  P.forEach((row, r) => row.forEach((v, c) => { if (isPortalTile(v)) cells.push([r, c, v]); }));
  if (cells.length === 2) return;
  for (const [r, c] of cells) P[r][c] = 1;
}

/* ---------------- 可达性：哪些格子球真的够得到 ----------------
   这是"卡关"的根因所在，值得把几何讲清楚：

   砖格是 84×33，但砖本身只有 78×26 —— 于是相邻两列之间留 6px 水平缝，
   相邻两行之间留 7px 垂直缝。而球的**直径是 14px**。
   一个直径 14px 的圆，无论以什么角度，都不可能穿过 6px 或 7px 的缝。
   结论：**球只能从"空着的整格"进出，钻不过砖缝**。

   所以"够得到"可以离散化成四连通洪水填充：
     · 实心砖（-1）是永久的墙（只有炸药砖能软化它，不能指望）；
     · 其它一切（空位、普通砖、裂纹砖、软砖、炸药砖、磁铁砖、传送门）都不算墙 ——
       除了实心砖，别的砖都打得掉，打掉之后那格就能进，所以它们"可通行"。
     · 砖区四周都是开阔地：上方 66px 净空、左右各 36px 竖井、下方是主战场。
       所以贴着砖区边界、且本身不是实心砖的格子，球一定够得到 → 拿来当种子。
     · 传送门是"直达"：一扇门够得到，另一扇也就够得到了（球会被送过去），
       哪怕另一扇在封闭口袋里 —— 所以门要额外传播一次。
   注：**故意不把炸药砖算作"能拆墙"**。炸药砖确实能把实心砖炸成软砖，但那是
   玩家的操作、还要求炸药砖本身够得到。这里按"只能靠实心砖以外的手段"保守估计 ——
   保守只会偶尔多开一道门（无害），漏判则会留下永远打不通的关卡（致命）。 */
function reachableCells(P){
  const R = P.length, C = P[0].length;
  const open = (r, c) => r >= 0 && r < R && c >= 0 && c < C && P[r][c] !== T.SOLID;
  const seen = Array.from({ length: R }, () => new Array(C).fill(false));
  const q = [];
  const seed = (r, c) => { if (open(r, c) && !seen[r][c]){ seen[r][c] = true; q.push([r, c]); } };
  for (let r = 0; r < R; r++){ seed(r, 0); seed(r, C - 1); }
  for (let c = 0; c < C; c++){ seed(0, c); seed(R - 1, c); }
  // 两轮：第一轮灌满场地，第二轮处理"另一扇门在口袋里"的情况
  for (let round = 0; round < 2; round++){
    while (q.length){
      const [r, c] = q.pop();
      seed(r - 1, c); seed(r + 1, c); seed(r, c - 1); seed(r, c + 1);
    }
    const ps = [];
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (isPortalTile(P[r][c])) ps.push([r, c]);
    if (ps.length !== 2) break;
    const aIn = seen[ps[0][0]][ps[0][1]], bIn = seen[ps[1][0]][ps[1][1]];
    if (aIn === bIn) break;
    const far = aIn ? ps[1] : ps[0];
    seed(far[0], far[1]);
  }
  return seen;
}

// 收尾：保证**每一块可破坏砖都真的够得到**。
//
// 为什么必须有这一步：实心砖不可破坏，而球钻不过 6/7px 的砖缝 —— 于是一块可破坏砖
// 如果四正交邻居全是实心砖，它就被彻底封死了。这种盘面会出现（随机关卡的实心砖
// 概率高达 22%，四面包围是小概率但必然发生的组合），后果是**这一关永远通不了**：
//   · 防卡死引导会一直把球朝它引，但球每次都撞在实心砖上弹回来；
//   · 40 秒强制重发只是换个角度重发，角度再换也进不去。
// 实测：这种盘面跑满 300 秒自动驾驶（18000 帧），中心砖一次都没被打到，过关 0 次。
//
// 修法：把**封住它的那块实心砖改成普通砖**，相当于在墙上开一道门。
//   · 为什么不改成空格：关卡门限（总数 ≥42 / 每行 ≥6）数的是"非空格子"，
//     砸成空格会直接冲掉门限。改成普通砖则格子仍非空，门限不受影响。
//   · 为什么不改成软砖：软砖有"生成器不得产出"的既有约束（只来自实心砖被炸开）。
//   · 改成普通砖还顺带保住了内容：原本打不到的那块砖现在真的能打了，而不是被删掉。
// 优先挑一块**自己已经贴着连通区**的实心砖（改它一次就通了）；口袋里层那块
// 可能四个邻居都在口袋里，所以是先扫出"有实心邻居"的那块再动手。
// 每轮至少把一块实心砖变成普通砖（实心砖数严格减少），所以一定收敛。
// trappedFixCount 只是统计用：让测试能证明"这个坑确实会出现"，
// 而不是让"修复后 0 例"变成一句空转的断言。
let trappedFixCount = 0;
// `changed` 是可选的出参：把"这次开了哪几道门"的格子坐标收集起来。
// 关卡生成时用不上，但**传送门用尽次数后**要在场地中途补一次修复，
// 那次必须把改动落到场上的砖对象上（见 repairAfterPortalLoss）。
function openTrappedBricks(P, changed){
  const R = P.length, C = P[0].length;
  const inside = (r, c) => r >= 0 && r < R && c >= 0 && c < C;
  for (let guard = 0; guard < R * C; guard++){
    const seen = reachableCells(P);
    const trapped = [];
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++)
      if (tileBreakable(P[r][c]) && !seen[r][c]) trapped.push([r, c]);
    if (!trapped.length) return;
    // 只处理"有实心砖邻居"的那块：改它的实心邻居才开得出门，
    // 而且这样绝不会让任何一行失去最后一块可破坏砖。
    const nbrsOf = ([r, c]) => [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]
      .filter(([nr, nc]) => inside(nr, nc) && P[nr][nc] === T.SOLID);
    let host = null, wall = null;
    for (const t of trapped){
      const ns = nbrsOf(t);
      if (!ns.length) continue;
      host = t;
      // 优先挑一块自己就贴着连通区的实心砖 —— 只改它一块门就开了
      wall = ns.find(([nr, nc]) => [[nr-1,nc],[nr+1,nc],[nr,nc-1],[nr,nc+1]]
        .some(([ar, ac]) => inside(ar, ac) && seen[ar][ac])) || ns[0];
      break;
    }
    if (!host){                       // 极端兜底：整片口袋连一块实心边界都没有（理论上不可能）
      P[trapped[0][0]][trapped[0][1]] = T.SOLID;
      continue;
    }
    P[wall[0]][wall[1]] = 1;          // 实心砖 -> 普通砖（1 血，最小改动）
    if (changed) changed.push([wall[0], wall[1]]);
    trappedFixCount++;                // 统计用：本次开局一共开了几道门
  }
}

/* ── 收尾 2：把"只有一条一格宽的缝"的洞放宽 ──────────────────────────────
   第 78 关的存档（玩家发来的分享码）就是这个形状：两块可破坏砖蹲在一格宽的洞里，
   入口只有右边竖井里的一条缝 —— 球心窗口只有 26px，还必须带着"向左"的速度。
   这不是"够不到"（洪水填充判定它够得到），所以 openTrappedBricks 一声不吭，
   而玩家在那儿"弹来弹去、40 秒重置一次"。

   判据 `mouthBand`：球心穿过一条缝时能用的**净空**（只把实心砖当障碍，
   可破坏砖算"打得掉、不挡路" —— 和 reachableCells 是同一个模型）：
     · 一格高的横缝 = 33*2 - 26 - 14 = **26px**（第 78 关那条）
     · 两格高       = 33*3 - 26 - 14 = **59px**
     · 一格宽的竖缝 = 84*2 - 78 - 14 = **76px**（竖直方向天生就宽）
   净空 < `NARROW_BAND`(45px) 就算"过窄"。

   修法沿用开门的同一套约定：把**卡住这条缝的那块实心砖改成普通砖（1 血）**。
     · 为什么不直接砸成空格：门限（总数 ≥42 / 每行 ≥6）数的是"非空格子"，
       砸成空格会冲掉门限 —— 和 openTrappedBricks 同一个理由。
     · 新砖自己贴着连通区、只有 1 血，所以很快会被打掉；它一掉，
       这条缝就从"一格高"变成"两格高"（26px → 59px）。
     · 优先挑**自己已经贴着连通区**的那块（改它一次就够），和 openTrappedBricks 一致。
   一次修复只开一格：判据把可破坏砖当"不挡路"，所以开完这一格缝隙就达标了，
   不会把整面墙拆光（`narrowFixCount` 是给测试用的统计，证明这条规则真的会触发）。 */
const NARROW_BAND = 45;              // px：球心净空小于这个数就算"过窄"
const CELL_X = 84, CELL_Y = 33;      // 格距
const BRICK_W = 78, BRICK_H = 26;    // 砖的实际尺寸
let narrowFixCount = 0;

// 球心从 (r,c) 穿过 (dr,dc) 那一面时能用的净空（px）
function mouthBand(P, r, c, dr, dc, radius){
  const R = P.length, C = P[0].length;
  const solid = (rr, cc) => (rr < 0 || rr >= R || cc < 0 || cc >= C) ? false : (P[rr][cc] === T.SOLID);
  if (dr !== 0){                       // 上/下两个面：障碍在这一行与邻行的左右两侧
    let cl = -1, cr = C;
    for (let cc = c - 1; cc >= 0; cc--) if (solid(r, cc) || solid(r + dr, cc)){ cl = cc; break; }
    for (let cc = c + 1; cc < C; cc++) if (solid(r, cc) || solid(r + dr, cc)){ cr = cc; break; }
    return CELL_X * (cr - cl) - BRICK_W - 2 * radius;
  }
  // 左/右两个面：障碍在这一列与邻列的上下两侧
  const c2 = c + dc;
  let a = -1, b = R;
  for (let rr = r - 1; rr >= 0; rr--) if (solid(rr, c) || solid(rr, c2)){ a = rr; break; }
  for (let rr = r + 1; rr < R; rr++) if (solid(rr, c) || solid(rr, c2)){ b = rr; break; }
  return CELL_Y * (b - a) - BRICK_H - 2 * radius;
}

// 卡住 (r,c) 朝 (dr,dc) 这条缝的那两块实心砖（返回优先改的那一块）
function narrowBottleneck(P, seen, r, c, dr, dc){
  const R = P.length, C = P[0].length;
  const inside = (rr, cc) => rr >= 0 && rr < R && cc >= 0 && cc < C;
  const solid = (rr, cc) => inside(rr, cc) && P[rr][cc] === T.SOLID;
  const cand = [];
  if (dr !== 0){
    for (let cc = c - 1; cc >= 0; cc--) if (solid(r, cc) || solid(r + dr, cc)){ if (solid(r, cc)) cand.push([r, cc]); if (solid(r + dr, cc)) cand.push([r + dr, cc]); break; }
    for (let cc = c + 1; cc < C; cc++) if (solid(r, cc) || solid(r + dr, cc)){ if (solid(r, cc)) cand.push([r, cc]); if (solid(r + dr, cc)) cand.push([r + dr, cc]); break; }
  } else {
    const c2 = c + dc;
    for (let rr = r - 1; rr >= 0; rr--) if (solid(rr, c) || solid(rr, c2)){ if (solid(rr, c)) cand.push([rr, c]); if (solid(rr, c2)) cand.push([rr, c2]); break; }
    for (let rr = r + 1; rr < R; rr++) if (solid(rr, c) || solid(rr, c2)){ if (solid(rr, c)) cand.push([rr, c]); if (solid(rr, c2)) cand.push([rr, c2]); break; }
  }
  // 优先"自己贴着连通区"的那块：改成普通砖之后立刻就能打，不必再拆第二块
  const touches = ([rr, cc]) => [[rr-1,cc],[rr+1,cc],[rr,cc-1],[rr,cc+1]]
    .some(([ar, ac]) => inside(ar, ac) && seen[ar][ac]);
  return cand.find(touches) || cand[0] || null;
}

function widenNarrowPockets(P, changed){
  const R = P.length, C = P[0].length;
  const inside = (r, c) => r >= 0 && r < R && c >= 0 && c < C;
  const tried = Object.create(null);          // 找不到实心瓶颈的砖，别反复看它
  for (let guard = 0; guard < R * C; guard++){
    const seen = reachableCells(P);
    let fix = null;
    for (let r = 0; r < R && !fix; r++) for (let c = 0; c < C && !fix; c++){
      if (!tileBreakable(P[r][c]) || !seen[r][c]) continue;   // 只修"够得到但缝太窄"的
      if (tried[r * C + c]) continue;
      const doors = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]]
        .filter(([dr, dc]) => inside(dr, dc) && P[dr][dc] === 0);
      if (!doors.length) continue;                            // 四个邻居全是砖 -> 归 openTrappedBricks 管
      let ok = false, narrow = null;
      for (const [dr, dc] of doors){
        for (const [fr, fc] of [[-1,0],[1,0],[0,-1],[0,1]]){    // 洞口格的四个面
          const nr = dr + fr, nc = dc + fc;
          if (nr === r && nc === c) continue;                   // 朝着这块砖自己的那一面
          if (inside(nr, nc) && P[nr][nc] !== 0) continue;       // 那一面外面是砖/实心 -> 不是口
          const band = mouthBand(P, dr, dc, fr, fc, 7);
          if (band >= NARROW_BAND){ ok = true; break; }
          if (!narrow || band > narrow.band) narrow = { r: dr, c: dc, fr, fc, band };
        }
        if (ok) break;
      }
      if (ok) continue;
      if (!narrow){ tried[r * C + c] = 1; continue; }
      const wall = narrowBottleneck(P, seen, narrow.r, narrow.c, narrow.fr, narrow.fc);
      if (!wall){ tried[r * C + c] = 1; continue; }
      fix = wall;
    }
    if (!fix) return;
    P[fix[0]][fix[1]] = 1;        // 实心砖 -> 普通砖（1 血，最小改动）
    if (changed) changed.push(fix);
    narrowFixCount++;
  }
}

function pattern(n){
  const P = [];
  const rows = (a) => a.forEach(r => P.push(r.split('').map(ch => (ch in TILE_CH) ? TILE_CH[ch] : Number(ch))));

  if (n === 0){                      // 1 · 上手关
    rows([
      "1111111111",
      "1111991111",                // 中间两块金砖
      "1111111111"
    ]);
    return { grid:P, msg:'SPACE 发射 · 左右移动' };
  }
  if (n === 1){                      // 2 · 菱形
    rows([
      "0022222200",
      "0222222220",
      "2203333022",
      "2033003302",
      "0033333300"
    ]);
  } else if (n === 2){               // 3 · 交错条纹
    rows([
      "1010101010",
      "0202020202",
      "3030303030",
      "0202020202",
      "1010101010"
    ]);
  } else if (n === 3){               // 4 · 要塞（带不可破坏墙）
    // 直接写字面量数组，不用字符串映射：-1 是实心砖，避免 Number('x') -> NaN
    P.push([ 0, 0, 4, 4, 4, 4, 4, 4, 0, 0]);
    P.push([ 0, 4,-1, 0, 0, 0, 0,-1, 4, 0]);
    P.push([ 4,-1, 0, 1, 1, 1, 1, 0,-1, 4]);
    P.push([ 4,-1, 0, 0, 9, 0, 0, 0,-1, 4]);
    P.push([ 4,-1, 0, 1, 1, 1, 1, 0,-1, 4]);
    P.push([ 0, 4,-1, 0, 0, 0, 0,-1, 4, 0]);
    P.push([ 0, 0, 4, 4, 4, 4, 4, 4, 0, 0]);
  } else if (n === 4){               // 5 · 金字塔
    rows([
      "0000550000",
      "0005445000",
      "0054444500",
      "0544444450",
      "5444444445",
      "4000000004",
      "0400000040",
      "0040000400",
      "0004004000",
      "0000400000"
    ]);
  } else {
    /* 无限生成：随机但保证可通关（必有可破坏砖，且不会整行不可破坏）
       旧版这里普通砖写的是 1 + ((r + n) % 5) —— 血量的纯函数，零随机：
       每行是一个常数，整幅图是 45° 纯色斜带，而且 5 行一循环（%5），
       所以第 6 关和第 30 关在纹理上根本是同一张图。
       现在改成：先随机挑一个骨架风格造形状，再逐格独立按权重抽血量。 */
    const nr = 5 + (n % 3);
    const style = n >= 3
      ? GEN_STYLES[Math.floor(Math.random() * GEN_STYLES.length)]
      : 'noise';
    const skel = genSkeleton(style, nr, n);

    // 骨架 -> 实体：实心砖概率随关卡从 10% 涨到 22%（旧版恒为 10%，难度阶梯是平的）
    const solidP = Math.min(.10 + (n - 5) * .006, .22);
    const goldP  = 0.08;
    const w = hpWeights(n);
    for (let r = 0; r < nr; r++){
      const line = [];
      for (let c = 0; c < 10; c++){
        if (!skel[r][c]){ line.push(0); continue; }       // 骨架之外是空位
        const roll = Math.random();
        if (roll < solidP)           line.push(-1);
        else if (roll < solidP + goldP) line.push(9);
        else                         line.push(rollHp(w));  // 逐格独立，行内可混排
      }
      P.push(line);
    }

    // 骨架可能整行都是实心砖或空位，那样这行永远打不穿 -> 逐行保底一块可破坏砖
    repairRows(P, w);

    // 后方关卡随机撒一些特殊砖块。数量随关卡增长，并且封顶值要够高 ——
    // 旧版转弯砖写成 Math.min(2, ...)，从第 7 关起就永远钉死在 2 块，等于没有成长。
    if (n >= 5){
      const lv = n - 4;                                    // 1,2,3… 越往后越多
      // 传送门必须成对才有意义。注意：引擎只支持"一对" —— portalA / portalB 是单例，
      // 编码里也只有 20/21 两个值，所以这里不能生成多于一对（多对需要改 portalAt
      // 与存档编码，属于引擎改动，不在随机性修复范围内）。
      if (Math.random() < Math.min(.35 + lv * .06, .8)){
        const two = pickNormalCells(P, 2);
        if (two.length === 2){
          P[two[0][0]][two[0][1]] = T.PORTAL_A;
          P[two[1][0]][two[1][1]] = T.PORTAL_B;
        }
      }
      // 转弯砖（第 7 关起）
      if (n >= 7){
        const nTurn = Math.min(6, 1 + Math.floor((n - 7) / 3));
        for (const [r, c] of pickNormalCells(P, nTurn))
          P[r][c] = T.TURN_U + Math.floor(Math.random() * 4);
      }
      // 裂纹砖（第 11 关起，不加分，属于纯障碍）
      if (n >= 11){
        const nCrack = Math.min(8, 2 + Math.floor((n - 11) / 3));
        for (const [r, c] of pickNormalCells(P, nCrack))
          P[r][c] = T.CRACK;
      }
      // 炸药砖（第 13 关起）：一击即爆，能清邻砖、也能把实心砖炸成软砖
      if (n >= 13){
        const nBomb = Math.min(4, 1 + Math.floor((n - 13) / 5));
        for (const [r, c] of pickNormalCells(P, nBomb))
          P[r][c] = T.BOMB;
      }
      // 磁铁砖（第 17 关起）：打掉它的那颗球获得 10 秒磁力（球变色、会自己找砖）
      if (n >= 17){
        const nMagnet = Math.min(3, 1 + Math.floor((n - 17) / 6));
        for (const [r, c] of pickNormalCells(P, nMagnet))
          P[r][c] = T.MAGNET;
      }
    }

    // 特殊砖铺完后收拾（顺序有讲究，前一步都在处理后一步可能带进来的问题）：
    //   1. repairRows          —— 消掉"漏斗行"（整行没有可破坏砖）。
    //      它优先补空格，所以不会拆散传送门配对。
    //   2. fixPortals          —— 万一还是落了单门，清掉并就地补一块普通砖
    //      （不补砖会凭空少一块，密度门限就守不住了）。
    //   3. addBricksToDensity  —— 最后兜一次总砖数门限。放在最后是因为
    //      第 2 步之后可能还有格子被改动，这里是唯一的"最终保证"。
    //      注意它只填空格、只加不减，所以不会再引入需要修复的东西。
    repairRows(P, w);
    topUpRows(P);
    fixPortals(P);
    addBricksToDensity(P);

    // 兜底：必须至少有一块可打掉的砖，否则这关无法通过。
    // 旧版这里把 P[0][0] 写死成 3，于是"随机"关卡永远有一个固定的左上角砖，
    // 而且不看那格原本是不是空位。改成真随机挑一格。
    if (!P.some(row => row.some(v => tileBreakable(v)))){
      const spots = [];
      P.forEach((row, r) => row.forEach((v, c) => { if (v !== -1) spots.push([r, c]); }));
      if (spots.length){
        const [r, c] = spots[Math.floor(Math.random() * spots.length)];
        P[r][c] = rollHp(w);
      }
    }

    // 最后一道、也是唯一的"可通关"保证：每一块可破坏砖都要够得到。
    // 必须放在最后 —— 上面每一步都可能新放进一块砖（包括刚补的那块兜底砖），
    // 而只有这一步会看"球到底进不进得去"。见 openTrappedBricks 的注释。
    openTrappedBricks(P);
    widenNarrowPockets(P);          // 收尾 2：够得到、但只有一条一格宽的缝 -> 放宽
  }
  return { grid:P, msg:null };
}

/* ============================ 道具表 ============================
   配色刻意与 BRICK_COLORS 完全错开：以前道具直接抄砖块调色板，
   结果「3」和五角星砖/三血砖都是 #ffd93d，玩家分不清该接还是该躲。 */
const POWERS = [
  { k:'wide',  c:'#5eead4', ch:'W', good:true,  name:'加宽挡板' },
  { k:'multi', c:'#c084fc', ch:'3', good:true,  name:'三球齐发' },
  { k:'slow',  c:'#93c5fd', ch:'S', good:true,  name:'时间变慢' },
  { k:'life',  c:'#ff8fab', ch:'+', good:true,  name:'额外生命' },
  // 冲击波：唯一的"瞬发"道具 —— 没有持续时间、没有状态，吃到就在挡板位置放一圈波。
  // 正因为无状态，连吃 3 个天然就是 3 次独立爆发，不需要任何叠加/进化逻辑；
  // 效果锚定在"空间"（挡板当前位置）而不是锚定在"玩家属性"上，所以也不会互相冲突。
  { k:'shock', c:'#38bdf8', ch:'◎', good:true,  name:'冲击波' },
  { k:'narrow',c:'#ff4d4d', ch:'N', good:false, name:'挡板变窄' },
  { k:'fast',  c:'#fb923c', ch:'F', good:false, name:'球速暴涨' }
];
const POWER_SCORE = 50;        // 接到道具的奖励分

/* ============================ 游戏状态 ============================ */
const S = { TITLE:0, READY:1, PLAY:2, PAUSE:3, LEVEL:4, DEAD:5, OVER:6, WIN:7, SELECT:8 };

// 练习 / 选关：5 个设计关卡 + 2 个随机关卡入口
const LEVEL_NAMES  = ['上手关', '菱形', '交错条纹', '要塞', '金字塔'];const LEVEL_NOTES  = ['三行整排，无实心砖', '菱形空洞，中心三血砖', '砖最少洞最多，球路活',
                      '十块实心砖围成要塞', '金字塔，五血砖最密'];
const SELECT_MARKS = ['1', '2', '3', '4', '5', '6', '7'];
const selectItems = LEVEL_NAMES.map((name, i) => ({
  kind: 'designed', level: i, name,
  note: `${LEVEL_NOTES[i]} · ${(function(){ const f = pattern(i).grid.flat();
    const br = f.filter(v => v > 0).length, so = f.filter(v => v === -1).length, go = f.filter(v => v === 9).length;
    return `可破坏 ${br} · 实心 ${so} · 金砖 ${go}`; })()}`
})).concat(Array.from({ length: 2 }, (_, i) => ({
  kind: 'random', level: 5 + i * 3, name: '随机关卡',
  note: '每次进入重新生成',
  grid: pattern(5 + i * 3).grid          // 界面里预览一张真实样例
})));

const G = {
  state: S.TITLE,
  level: 0,
  score: 0,
  best: +(localStorage.getItem('neon-breaker-best') || 0) || 0,
  lives: 3,
  combo: 0,
  comboTimer: 0,
  shake: 0,
  time: 0,
  stuckTimer: 0,          // 距上次击破砖块的时间，用于打破角度自洽的死循环
  lastBricks: -1,
  infinite: false,        // 练习模式：无限生命
  practice: false,        // 本局是否练习模式（练习分数不计入最高分）
  selectIdx: 0,
  selectHint: 0,
  confirmNew: false,      // "开新局会覆盖存档"的二次确认
  msg: '',
  msgTimer: 0,
  flash: 0,
  slowFx: 0,
  playTime: 0             // 本局累计游玩秒数（存进存档）
};

let paddle, balls, bricks, drops, particles, floats;
// 爆炸波（炸药砖触发；冲击波道具以后复用同一套）——纯表现层，不存档。
// explodingDepth > 0 表示"当前正在结算一波爆炸"，用来阻断炸药砖的无限连锁。
let shockwaves = [], explodingDepth = 0;
let portalA = null, portalB = null;   // 传送门配对（每关最多一对）
// 传送门的**共享**使用次数（A/B 不分家：一对门一共能用 PORTAL_MAX_USES 次）。
// 放在这里而不是砖上，是因为它和 portalA/portalB 同生命周期 —— 每关 loadLevel 重置。
let portalUses = 0;
const PORTAL_MAX_USES = 10;
let levelGrid = null;                 // 本关的格子快照（loadLevel 时拍，见 repairAfterPortalLoss）
let brickW, brickH, brickTop, cols = 10;
let autoSaveArmed = false;      // 本局是否需要自动存档（开局/读档后开启）
let autoSaveTimer = 0;          // 距上次自动存档的秒数

function makePaddle(){
  return { w: 130, h: 14, x: W/2 - 65, y: H - 46, vx: 0 };
}

// 挡板位置统一夹取到墙内侧（两侧各留 24px），宽度变化后也必须调用
function clampPaddle(){
  paddle.x = clamp(paddle.x, 24, W - 24 - paddle.w);
}

function makeBall(x, y, vx, vy){
  return {
    x, y,
    r: 7,
    vx, vy,
    trail: [],
    stuck: false,
    offset: 0,
    vTimer: 0,       // 近乎纯竖直运动的累计时长（防死循环）
    portalCd: 0,     // 传送门冷却：刚穿出来时不再立刻被传回去
    magnet: 0,       // 磁力剩余秒数（打中磁铁砖获得；>0 时球变黄绿并自己找砖）
    magTarget: null, // 磁力这一帧真正在瞄的那块砖的中心（画绿色引导线用）
    aimTarget: null, // 防卡死引导真正在瞄的那块砖的中心（画琥珀色引导线用）
    turnLock: 0,     // 刚被转弯砖改过向的"让路窗口"（秒）：这段时间角度触发不介入
    deadBounces: 0,  // 连续几次反射都没碰到可破坏砖（保险 4 的计数）
    aimMute: 0,      // "转个圈"之后的静默期（秒）：这段时间护送先别瞄
    assistFx: 0,     // 视觉残留：防卡死引导刚掰过这颗球的轨迹
    magnetFx: 0      // 视觉残留：刚拿到磁力时的强调
  };
}

function resetBall(){
  balls = [ makeBall(paddle.x + paddle.w/2, paddle.y - 8, 0, 0) ];
  balls[0].stuck = true;
}

// 按二维网格铺砖。网格既可以来自 pattern()，也可以来自存档
// （随机关卡每次生成的地图不同，只存砖块下标是不可靠的，必须把地图本身存下来）
function buildFromGrid(grid){
  cols = 10;
  brickW = (W - 120) / cols;
  brickH = 26;
  brickTop = 90;
  bricks = [];
  portalA = null; portalB = null;
  portalUses = 0;                      // 新的一关，传送门次数重新给满
  grid.forEach((row, r) => {
    row.forEach((v, c) => {
      if (v === 0 || v === undefined || v === null) return;   // 空位
      if (Number.isNaN(v)) return;                            // 防御：绝不生成 NaN 砖
      const turn = isTurnTile(v);
      const portal = isPortalTile(v);
      const crack = isCrackTile(v);
      const soft = isSoftTile(v);
      const bomb = isBombTile(v);
      const magnet = isMagnetTile(v);
      // 各类砖的耐久：实心/金砖/传送门一击即"碎"（但前两者分别不可破/必掉道具），
      // 裂纹砖/转弯砖/软砖/炸药砖/磁铁砖有自己的耐久。
      // 注意软砖必须显式列出来：否则会掉进最后的 `: v` 分支拿到 hp=14。
      const hp = (v === -1 || v === 9 || portal) ? 1
               : crack ? CRACK_HP
               : turn  ? TURN_HP
               : soft  ? SOFT_HP
               : bomb  ? BOMB_HP
               : magnet ? MAGNET_HP
               : v;
      const b = {
        x: 60 + c*brickW,
        y: brickTop + r*(brickH + 7),
        w: brickW - 6,
        h: brickH,
        row: r, col: c,
        type: v,
        hp, max: hp,
        solid: v === -1,
        golden: v === 9,
        crack,
        turn,
        dir: turn ? TURN_DIRS[v] : null,
        portal,
        soft,
        bomb,
        magnet,
        portalId: v === T.PORTAL_A ? 1 : v === T.PORTAL_B ? 2 : 0,
        hit: 0,
        dead: false
      };
      // 裂纹砖显示裂纹的阈值
      if (crack) b.crackAt = CRACK_AT;
      bricks.push(b);
      if (v === T.PORTAL_A) portalA = b;
      if (v === T.PORTAL_B) portalB = b;
    });
  });
  assertClearance();
}

// 铺完砖后校验"净空"：随机关卡的砖区底边到挡板必须留够距离，否则球从砖底弹回挡板的
// 来回趟数不足，玩家来不及反应（行数放宽到 10 行时就只剩 141px）。
// 这个耦合以前是隐式的（brickTop / 行距 / 行数三处散落），加一道显式检查，
// 以后有人调其中任何一个都能立刻发现，而不是靠手感。
// 只管随机关卡（level >= 5）：设计关卡由人摆，第 5 关"金字塔"本来就是紧凑布局。
function assertClearance(){
  if (!bricks.length || !paddle) return;
  if (G.level < 5) return;
  let bottom = 0;
  for (const b of bricks) if (b.y + b.h > bottom) bottom = b.y + b.h;
  const gap = paddle.y - bottom;
  if (gap < SAFE_MIN_GAP && typeof console !== 'undefined' && console.warn)
    console.warn(`[neon-breaker] 第 ${G.level + 1} 关净空不足：${gap.toFixed(0)}px < SAFE_MIN_GAP ${SAFE_MIN_GAP}px`);
}

// 取 (x,y) 所在的传送门（球心判定）
function portalAt(x, y){
  if (!portalA && !portalB) return null;        // 绝大多数关卡没有传送门，快速短路
  for (const b of bricks){
    if (!b.portal || b.dead) continue;
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
  }
  return null;
}

/* 传送门用满次数后**两扇门一起消失**。

   两扇一起消失是设计决定：它们是一对装置，只剩一扇门既进不去也出不来，
   留着只会变成一个画着圆环的空格子。次数也是**一对共享**的（不分 A/B）——
   "传过去再传回来"各算一次，用满 10 次之后就没了。

   消失之后必须**重新算一次可达性**：`openTrappedBricks` 的注释里写明了，
   "口袋里有一扇门"是被当作可达的（见 reachableCells 的第二轮传播）。
   门没了，那条判定就作废了 —— 如果口袋里还有没打掉的可破坏砖，
   这一关就变成了永远打不通的死局。所以这里补跑一次同一套"开门"逻辑。 */
function expirePortals(){
  if (!portalA && !portalB) return;
  const spots = [];
  for (const p of [portalA, portalB]){
    if (!p || p.dead) continue;
    spots.push([p.x + p.w/2, p.y + p.h/2]);
    p.dead = true;
    addParticles(p.x + p.w/2, p.y + p.h/2, '#8b5cf6', 22, 1.2);
  }
  const [mx, my] = spots[0] || [W/2, 200];
  floats.push({ x: mx, y: my - 18, text: `传送门已耗尽`, color: '#c4b5fd', life: 1.6, vy: -34 });
  portalA = null; portalB = null;
  G.shake = Math.max(G.shake, 6);
  repairAfterPortalLoss();
}

/* 门没了之后的可达性补修复。
   只在"真的又出现够不到的可破坏砖"时才动手（平时一次都不改），
   而且复用同一套 `openTrappedBricks` —— 不另写一份判定，避免两处漂移。 */
function repairAfterPortalLoss(){
  if (!levelGrid) return;
  const P = levelGrid.map(r => r.slice());
  // 门已经没了：把门格显式清成空位。空位和门在可达性里本来都算"能通行"，
  // 但这里必须清掉，否则 reachableCells 会继续用"另一扇门直达"那条规则。
  for (let r = 0; r < P.length; r++) for (let c = 0; c < P[r].length; c++)
    if (isPortalTile(P[r][c])) P[r][c] = 0;
  const changed = [];
  openTrappedBricks(P, changed);
  widenNarrowPockets(P, changed);       // 同一套收尾（幂等：修过就什么都不做）
  if (!changed.length) return;
  // 把"新开的那道门"落到场上的砖对象上：实心砖 -> 普通砖
  for (const [r, c] of changed){
    const br = bricks.find(b => b.row === r && b.col === c);
    if (br && !br.dead && br.solid){
      br.solid = false;
      br.type = 1;
      br.hp = br.max = 1;
      br.golden = false;
      addParticles(br.x + br.w/2, br.y + br.h/2, '#4dff9e', 14, 1);
    }
    levelGrid[r][c] = 1;            // 快照同步，保证再调一次是幂等的
  }
  floats.push({ x: W/2, y: 150, text: '传送门没了，墙上开了一道门', color: '#4dff9e', life: 2.0, vy: -26 });
}

function loadLevel(n, gridOverride){
  const num = Math.round(Number(n));
  n = Number.isFinite(num) ? Math.max(0, num) : 0;   // 防御：非法关卡号一律退回第 1 关
  const p = pattern(n);
  // 就地改盘面前先复制一份：下面的收尾修复会写盘面，**不能回头改调用方的数组**
  // （存档码解出来的数组、测试里当夹具用的常量盘面，调用方都还要接着用）。
  const grid = (gridOverride || p.grid).map(r => r.slice());
  // 单一收口点：不管是设计关卡、随机关卡、存档码还是导入的关卡码，都从 loadLevel 进来，
  // 所以"够不到的可破坏砖"必须在这里再兜一次 —— 分享出去的关卡码、旧存档里的盘面
  // 都可能带着封闭口袋，而那种盘面是**永远打不通**的（详见 openTrappedBricks）。
  // pattern() 里已经修过一次，这里是幂等的第二道（修过就什么都不做）。
  // 紧接着的第二道收尾同理：只有"一条一格宽的缝"的洞也要放宽 ——
  // 玩家发来的第 78 关存档正是这种（详见 widenNarrowPockets）。
  openTrappedBricks(grid);
  widenNarrowPockets(grid);
  buildFromGrid(grid);
  levelGrid = grid.map(r => r.slice());   // 快照：传送门用尽后补修复时要拿它重算可达性
  drops = []; particles = []; floats = []; shockwaves = []; explodingDepth = 0;
  G.combo = 0; G.comboTimer = 0;
  G.stuckTimer = 0;
  G.lastBricks = bricks.filter(b => !isFurniture(b) && !b.dead).length;
  // 关卡提示只在这里生成，且统一用 1 基关卡号。
  // 之前用 0 基的 n，导致进第 4 关却显示"第 3 关"；
  // 而且调用方各自再写一次 G.msg，会互相覆盖（读档时尤其乱）。
  G.msg = gridOverride ? `第 ${n + 1} 关 · 已还原`
                       : (p.msg ? p.msg : `第 ${n + 1} 关`);
  G.msgTimer = 1.8;
  resetBall();
  G.state = S.READY;
}

// 回到标题/选关界面时把场地清空，否则半透明遮罩下会透出残局砖块
function clearBoard(){
  bricks = [];
  balls = [ makeBall(paddle.x + paddle.w/2, paddle.y - 8, 0, 0) ];
  balls[0].stuck = true;
  drops = []; particles = []; floats = []; shockwaves = []; explodingDepth = 0;
  G.combo = 0; G.comboTimer = 0;
  G.stuckTimer = 0;
  G.shake = 0; G.flash = 0; G.slowFx = 0;
  G.msgTimer = 0;
}

function newGame(){
  G.level = 0; G.score = 0; G.lives = 3; G.shake = 0; G.flash = 0;
  G.practice = false;
  G.infinite = false;     // 普通模式必须显式关掉无限生命，否则会从选关界面"泄漏"进来
  G.playTime = 0;
  G.confirmNew = false;
  paddle = makePaddle();
  loadLevel(0);
  autoSaveArmed = true;
  saveProgress(false);
}

// 练习模式：从选关界面开始，无限生命，分数不计入最高分
function startSelect(){
  G.infinite = false;
  G.selectIdx = 0;
  G.selectHint = 0;
  G.confirmNew = false;
  clearBoard();
  G.state = S.SELECT;
}

function startLevel(idx){
  const it = selectItems[clamp(idx, 0, selectItems.length - 1)];
  G.level = it.level;
  G.score = 0;
  G.practice = G.infinite;
  G.lives = G.infinite ? 99 : 3;
  G.shake = 0; G.flash = 0;
  G.playTime = 0;
  paddle = makePaddle();
  loadLevel(it.level);      // 关卡提示由 loadLevel 统一生成（用 1 基关卡号），这里不再覆盖
  autoSaveArmed = true;
  saveProgress(false);
}

/* ============================ 存档 ============================ */
const SAVE_KEY = 'neon-breaker-save-v1';
const SET_KEY  = 'neon-breaker-settings-v1';
const SAVE_VERSION = 1;

// localStorage 可能被禁用（隐私模式等），统一走安全包装
const Store = (() => {
  let ok = true;
  try { localStorage.setItem('__nb_t', '1'); localStorage.removeItem('__nb_t'); }
  catch (e){ ok = false; }
  const mem = {};
  return {
    get available(){ return ok; },
    get(k){
      try { const v = ok ? localStorage.getItem(k) : mem[k]; return v === undefined ? null : v; }
      catch (e){ return null; }
    },
    set(k, v){ try { if (ok) localStorage.setItem(k, v); else mem[k] = String(v); } catch (e){} },
    del(k){ try { if (ok) localStorage.removeItem(k); else delete mem[k]; } catch (e){} },
  };
})();

// 紧凑编码：砖块只存"存活砖的 下标:剩余血量(36进制)"，球只存位置与速度
// 注意：必须记录所有还活着的砖（含满血砖），否则读档时缺项会被当成"已击破"
const b36 = n => Math.round(n).toString(36);

function serializeSave(){
  const st = bricks.map((b, i) => b.dead ? null : i + ':' + b36(b.hp))
                   .filter(Boolean).join(',');
  // 存下当前实际地图（每行一个字符串，非空格用 36 进制数字），
  // 否则随机关卡读档时会重新随机，砖块下标对不上
  const gri = bricks.reduce((rows, b) => {
    if (!rows[b.row]) rows[b.row] = Array(10).fill('0');
    rows[b.row][b.col] = b.type === -1 ? '-' : b36(b.type);
    return rows;
  }, []).map(r => (r || Array(10).fill('0')).join(''));
  const bl = balls.filter(b => isFinite(b.x) && isFinite(b.y))
                  .map(b => [Math.round(b.x), Math.round(b.y), Math.round(b.vx), Math.round(b.vy),
                             b.stuck ? 1 : 0, +(b.offset || 0).toFixed(2)]);
  return {
    v: SAVE_VERSION,
    ts: Date.now(),
    level: G.level,
    score: Math.round(G.score),
    best: G.best,
    lives: G.lives,
    infinite: !!G.infinite,
    practice: !!G.practice,
    paddleW: paddle.w,
    playTime: Math.round(G.playTime),
    state: G.state,
    bricks: st,
    grid: gri,
    balls: bl
  };
}

/* ---------- 跨设备：存档码 ----------
   没有服务器，localStorage 不会自己同步。这里把存档压成一段可复制的文本，
   用聊天工具/备忘录传过去，在另一台设备粘贴导入即可。 */
const SHARE_PREFIX = 'NB1';

function checksum(str){
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
  return h.toString(36).slice(0, 4).padStart(4, '0');
}

function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// 返回存档码（形如 NB1-ab12-<base64>），失败返回 null
function encodeShareCode(){
  try {
    const json = JSON.stringify(serializeSave());
    return SHARE_PREFIX + '-' + checksum(json) + '-' + b64encode(json);
  } catch (e){ return null; }
}

// 解析存档码。失败返回 { error: '原因' }
function decodeShareCode(text){
  const raw = String(text || '').replace(/\s+/g, '');      // 容忍换行/空格
  if (!raw) return { error: '内容为空' };
  const parts = raw.split('-');
  if (parts.length < 3) return { error: '格式不对（应以 NB1- 开头）' };
  if (parts[0] !== SHARE_PREFIX) return { error: '版本不符（' + parts[0] + '）' };
  const sum = parts[1];
  const body = parts.slice(2).join('-');                    // base64 里可能有 '-'？标准表没有，保险起见拼回去
  let json;
  try { json = b64decode(body); }
  catch (e){ return { error: '编码损坏，复制时可能少了字符' }; }
  if (checksum(json) !== sum) return { error: '校验失败，多半是复制不完整' };
  let data;
  try { data = JSON.parse(json); }
  catch (e){ return { error: '内容不是合法存档' }; }
  try { Store.set(SAVE_KEY, JSON.stringify(data)); }
  catch (e){ return { error: '写入存档失败（空间不足）' }; }
  const info = saveInfo();
  if (!info) { Store.del(SAVE_KEY); return { error: '存档校验未通过，已丢弃' }; }
  return { ok: true, info };
}

/* ---------- 导入界面状态 ---------- */
const importUI = { active: false, text: '', msg: '', ok: false };

function openImport(){
  importUI.active = true;
  importUI.text = '';
  importUI.msg = '把存档码粘贴进来（Ctrl+V），或直接手输';
  importUI.ok = false;
  G.confirmNew = false;
}
function closeImport(){
  importUI.active = false;
  importUI.text = '';
  importUI.msg = '';
}
function tryImport(text){
  const res = decodeShareCode(text);
  if (res.ok){
    importUI.ok = true;
    importUI.msg = '导入成功：第 ' + (res.info.level + 1) + ' 关 · ' + res.info.score + ' 分';
    Sound.win();
    loadProgress();
    autoSaveArmed = true;
    setTimeout(closeImport, 700);
    return true;
  }
  importUI.ok = false;
  importUI.msg = '导入失败：' + res.error;
  Sound.bad();
  return false;
}

function saveProgress(manual){
  const data = serializeSave();
  try { Store.set(SAVE_KEY, JSON.stringify(data)); }
  catch (e){ if (manual) toast('存档失败：空间不足'); return false; }
  autoSaveTimer = 0;
  if (manual) toast('已存档 · 第 ' + (data.level + 1) + ' 关');
  return true;
}

function saveInfo(){
  const raw = Store.get(SAVE_KEY);
  if (!raw) return null;
  try {
    const d = JSON.parse(raw);
    if (!d || typeof d !== 'object' || d.v !== SAVE_VERSION) return null;
    // 关卡号必须是有限整数，否则 loadLevel 会生成空局面
    if (!Number.isFinite(d.level) || Math.round(d.level) !== d.level || d.level < 0) return null;
    if (!Number.isFinite(d.lives) || d.lives < 1) return null;
    if (!Number.isFinite(d.score) || !Number.isFinite(d.paddleW)) return null;
    if (typeof d.bricks !== 'string') return null;
    if (!Array.isArray(d.balls)) return null;
    if (d.grid !== undefined && !Array.isArray(d.grid)) return null;
    return d;
  } catch (e){ return null; }
}

function hasSave(){ return saveInfo() !== null; }

function clearSave(announce){
  Store.del(SAVE_KEY);
  if (announce) toast('存档已清除');
}

// 从存档恢复。返回 false 表示存档无效
function loadProgress(){
  const d = saveInfo();
  if (!d) return false;

  // 优先用存档里的地图还原（随机关卡必须如此），并据此确定下标上界
  let grid = null;
  if (Array.isArray(d.grid)){
    grid = d.grid.map(row => String(row).split('').map(ch => ch === '-' ? -1 : parseInt(ch, 36)));
    const okShape = grid.length > 0 && grid.length <= 40 && grid.every(r => r.length === 10 && r.every(Number.isFinite));
    if (!okShape) grid = null;
  }
  // bricks 数组包含所有非空格（普通砖 + 金砖 + 实心砖）
  let cells = 0;
  (grid || pattern(d.level).grid).forEach(row => row.forEach(v => { if (v !== 0) cells++; }));

  // 第一遍：只校验，不动任何游戏状态
  const alive = new Set();
  const hpMap = new Map();
  for (const part of String(d.bricks).split(',')){
    if (!part) continue;
    const [is, hs] = part.split(':');
    const i = parseInt(is, 10);
    const hp = parseInt(hs, 36);
    if (!Number.isInteger(i) || i < 0 || i >= cells) return false;   // 下标必须在本关范围内
    if (!Number.isFinite(hp) || hp < 1) return false;
    if (hpMap.has(i) && hpMap.get(i) !== hp) return false;           // 同一下标冲突
    hpMap.set(i, hp);
  }
  // 第二遍：数值都干净，才真正落地
  G.level = d.level;
  G.practice = !!d.practice;
  G.infinite = !!d.infinite;
  paddle = makePaddle();
  loadLevel(d.level, grid);                 // 会重置砖块/球/粒子并进入 READY
  G.level = d.level;

  hpMap.forEach((hp, i) => {
    const b = bricks[i];
    if (!b) return;
    b.hp = clamp(hp, 1, b.max);
    b.dead = false;
    alive.add(i);
  });
  // 存档里没提到的可破坏砖 = 已击破
  bricks = bricks.filter((b, i) => b.solid || alive.has(i));

  G.score = Math.max(0, Math.round(d.score));
  G.best = Math.max(G.best, Math.round(d.best) || 0);
  G.lives = clamp(Math.round(d.lives), 1, 999);
  paddle.w = clamp(Math.round(d.paddleW), 60, 260);
  clampPaddle();
  G.playTime = Math.max(0, Math.round(d.playTime) || 0);

  balls = d.balls.map(a => {
    const b = makeBall(Number(a[0]) || W/2, Number(a[1]) || paddle.y - 8,
                       Number(a[2]) || 0, Number(a[3]) || 0);
    b.stuck = !!a[4];
    b.offset = Number(a[5]) || 0;
    return b;
  });
  if (!balls.length) resetBall();
  // 球掉了但还没结算的状态，读档后先给一个安全的贴板球
  if (balls.every(b => b.y > H + 40)) resetBall();

  drops = []; particles = []; floats = []; shockwaves = []; explodingDepth = 0;
  G.combo = 0; G.comboTimer = 0;
  G.stuckTimer = 0;
  G.lastBricks = bricks.filter(b => !isFurniture(b) && !b.dead).length;
  G.shake = 0; G.flash = 0; G.slowFx = 0;
  G.confirmNew = false;              // 读档即退出"开新局"确认态
  G.state = (d.state === S.PLAY && balls.some(b => !b.stuck)) ? S.PLAY : S.READY;
  G.msg = '已读档 · 第 ' + (G.level + 1) + ' 关';
  G.msgTimer = 1.8;
  Sound.win();
  return true;
}

/* ---------- 设置持久化 ---------- */
function saveSettings(){
  Store.set(SET_KEY, JSON.stringify({
    v: SAVE_VERSION,
    muted: Sound.muted,
    infinite: !!G.infinite,
  }));
}
function loadSettings(){
  const raw = Store.get(SET_KEY);
  if (!raw) return;
  try {
    const s = JSON.parse(raw);
    if (!s || s.v !== SAVE_VERSION) return;
    if (s.muted) Sound.setMuted(true);
    G.infinite = !!s.infinite;
  } catch (e){}
}

/* ---------- 存档码导出界面 ---------- */
const shareUI = { active: false, code: '', copied: false, msg: '' };

function openShare(){
  const code = encodeShareCode();
  if (!code){ toast('没有可导出的存档'); return; }
  shareUI.active = true;
  shareUI.code = code;
  shareUI.copied = false;
  shareUI.msg = '这段文本就是你的存档，复制到另一台设备后按 I 导入';
  G.confirmNew = false;
  // 尽量顺手复制到剪贴板（本地文件或非安全上下文下可能被拒绝，所以界面里也会显示全文）
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(() => {
        shareUI.copied = true;
        shareUI.msg = '已复制到剪贴板 —— 发到另一台设备，在那里按 I 粘贴导入';
      }, () => {});
    }
  } catch (e){}
}
function closeShare(){ shareUI.active = false; shareUI.code = ''; shareUI.msg = ''; }

// 把长代码按固定宽度切成多行（canvas 不能自动换行）
function wrapCode(code, perLine){
  const out = [];
  for (let i = 0; i < code.length; i += perLine) out.push(code.slice(i, i + perLine));
  return out;
}


const keys = Object.create(null);
let pointerTarget = null;
/* ============================ 输入 ============================ */
// 自绘准星状态：canvas 上设了 cursor:none（挡板就是光标），所以必须自己画一个，
// 否则游戏区里完全看不见鼠标。用鼠标操作时显示，键盘操作/指针离开时隐藏。
const mouse = { x: W/2, y: H/2, hasPointer: false };

// 选关界面：把屏幕点击 / 触摸映射到卡片（返回 true 表示已处理）
function selectHitTest(px, py){
  const top = 150, gap = 61, h = 48;
  for (let i = 0; i < selectItems.length; i++){
    const y = top + gap * i;
    if (py >= y && py <= y + h && px >= 60 && px <= 900){
      G.selectIdx = i;
      startLevel(i);
      return true;
    }
  }
  return false;
}

// 选关界面的键盘操作
function selectKey(k){
  if (k === 'ArrowUp')   { G.selectIdx = (G.selectIdx - 1 + selectItems.length) % selectItems.length; G.selectHint = 0; return true; }
  if (k === 'ArrowDown') { G.selectIdx = (G.selectIdx + 1) % selectItems.length; G.selectHint = 0; return true; }
  if (k === 'Enter' || k === ' ') { startLevel(G.selectIdx); return true; }
  if (k === 'i' || k === 'I'){ G.infinite = !G.infinite; G.selectHint = 2.0; saveSettings(); return true; }
  if (k === 'Escape' || k === 'c' || k === 'C'){ clearBoard(); G.state = S.TITLE; G.selectHint = 0; return true; }
  const num = '1234567'.indexOf(k);
  if (num >= 0 && num < selectItems.length){ G.selectIdx = num; startLevel(num); return true; }
  if (k === 'r' || k === 'R'){ G.selectIdx = 5; startLevel(5); return true; }
  return false;
}

addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  if (e.key === 'F5' || e.key === 'F9') e.preventDefault();   // 占用来存/读档，别刷新页面
  keys[e.key] = true;
  mouse.hasPointer = false;            // 一按键盘就交还控制权，准星隐去
  Sound.unlock();

  // ---- 模态输入界面必须最先拦截，否则 m / f / r 这类单键会被下面的快捷键吃掉 ----
  if (importUI.active){
    if (e.key === 'Enter'){ tryImport(importUI.text); return; }
    if (e.key === 'Escape'){ closeImport(); return; }
    if (e.key === 'Backspace'){
      importUI.text = importUI.text.slice(0, -1);
      importUI.msg = importUI.text ? '长度 ' + importUI.text.length + ' · 回车导入 · Esc 取消'
                                   : '把存档码粘贴进来（Ctrl+V），或直接手输';
      importUI.ok = false;
      return;
    }
    // 允许手输的字符（存档码是 base64 + 数字字母短横线）
    if (e.key.length === 1 && /[A-Za-z0-9+/=_-]/.test(e.key)){
      if (importUI.text.length < 20000) importUI.text += e.key;
      importUI.msg = '长度 ' + importUI.text.length + ' · 回车导入 · Esc 取消';
      importUI.ok = false;
    }
    return;
  }

  // ---- 导出存档码界面 ----
  if (shareUI.active){
    if (['Escape','e','E','Enter','r','R'].includes(e.key)){ closeShare(); return; }
    return;                                  // 界面打开时吞掉其余按键
  }

  if (e.key === 'm' || e.key === 'M'){ const m = Sound.toggle(); toast(m ? '静音' : '声音开'); return; }
  if (e.key === 'f' || e.key === 'F'){ toggleFullscreen(); return; }

  // R = 继续存档（标题页最显眼的位置就是这个）
  if (e.key === 'r' || e.key === 'R'){
    if (G.state === S.TITLE || G.state === S.PAUSE || G.state === S.OVER || G.state === S.WIN){
      G.confirmNew = false;              // 继续存档即取消"开新局"的确认
      if (hasSave() && loadProgress()) autoSaveArmed = true;
      else toast('没有找到存档');
      return;
    }
  }

  // 确认开新局期间按了别的键：先取消确认，再让该按键正常生效
  // （而不是把按键整个吞掉——否则想按 C 进选关会"按了没反应"）
  if (G.confirmNew && e.key !== ' ' && e.key !== 'Enter'){
    G.confirmNew = false;
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') return;   // 这两个只用于取消
  }

  // 存 / 读 / 删档
  if (e.key === 'F5'){
    if (G.state === S.TITLE || G.state === S.SELECT) toast('先开始一局才能存档');
    else saveProgress(true);
    return;
  }
  if (e.key === 'F9'){
    if (!hasSave()){ toast('没有找到存档'); return; }
    if (loadProgress()) autoSaveArmed = true;
    return;
  }
  // E / I：导出、导入存档码（跨设备就靠这个）
  if (e.key === 'e' || e.key === 'E'){ openShare(); return; }
  if (e.key === 'i' || e.key === 'I'){
    if (G.state === S.SELECT){ selectKey(e.key); return; }   // 选关界面里 I 是无限生命开关
    openImport();
    return;
  }
  if (e.key === 'Delete' || e.key === 'Backspace'){
    if (hasSave()){ clearSave(true); return; }
  }

  // 练习/选关界面：吃掉所有按键
  if (G.state === S.SELECT){ selectKey(e.key); return; }

  // C 键随时进入选关（练习模式）
  if (e.key === 'c' || e.key === 'C'){ startSelect(); return; }

  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape'){
    if (G.state === S.PLAY){ G.state = S.PAUSE; }
    else if (G.state === S.PAUSE){ G.state = S.PLAY; }
    return;
  }
  if (e.key === ' '){
    if (G.state === S.TITLE || G.state === S.OVER || G.state === S.WIN){ requestNewGame(); return; }
    if (G.state === S.READY){ launch(); return; }
    if (G.state === S.LEVEL){ nextLevel(); return; }
  }
  if (e.key === 'Enter'){
    if (G.state === S.TITLE || G.state === S.OVER || G.state === S.WIN) requestNewGame();
    else if (G.state === S.READY) launch();
    else if (G.state === S.LEVEL) nextLevel();
  }
});
addEventListener('keyup', e => { keys[e.key] = false; });
// 导入时直接支持 Ctrl+V 粘贴
addEventListener('paste', e => {
  if (!importUI.active) return;
  const t = (e.clipboardData && e.clipboardData.getData) ? e.clipboardData.getData('text') : '';
  if (!t) return;
  if (e.preventDefault) e.preventDefault();
  importUI.text = t.trim();
  importUI.msg = '已粘贴 ' + importUI.text.length + ' 个字符 · 回车导入 · Esc 取消';
  importUI.ok = false;
});
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  if (G.state === S.PLAY) G.state = S.PAUSE;
});

// 鼠标 / 触摸：挡板跟随 + 准星定位。
// toWorld 已把坐标夹进游戏区，所以这里不需要再夹一次 ——
// 窗口内任何位置（含画面留边）都能控制挡板，没有死区。
function pointerMove(clientX, clientY){
  if (!cssW || !cssH) return;
  const w = toWorld(clientX, clientY);
  pointerTarget = w.x;
  mouse.x = w.x;
  mouse.y = w.y;
  mouse.hasPointer = true;
}
cv.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
cv.addEventListener('mouseleave', () => { mouse.hasPointer = false; });
cv.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') pointerMove(e.clientX, e.clientY); });
// 整个视口都在 canvas 里，pointerleave 基本不会触发；留着以防嵌入 iframe
cv.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') mouse.hasPointer = false; });
cv.addEventListener('touchstart', e => { Sound.unlock(); pointerMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive:true });
cv.addEventListener('touchmove',  e => { pointerMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive:true });
cv.addEventListener('touchend',   () => { mouse.hasPointer = false; }, { passive:true });
cv.addEventListener('touchcancel',() => { mouse.hasPointer = false; }, { passive:true });
cv.addEventListener('pointerdown', e => {
  Sound.unlock();
  const w = toWorld(e.clientX, e.clientY);
  if (G.state === S.SELECT){           // 点卡片直接进关
    selectHitTest(w.x, w.y);
    return;
  }
  if (G.state === S.TITLE || G.state === S.OVER || G.state === S.WIN) requestNewGame();
  else if (G.state === S.READY) launch();
  else if (G.state === S.LEVEL) nextLevel();
});

/* ============================ 动作 ============================ */
// 开新局要防误触：有存档时按一次只是"请求"，再按一次才真的开始
// （否则一个手滑的空格就把存档覆盖了）
function requestNewGame(){
  if (hasSave() && !G.confirmNew){
    G.confirmNew = true;
    Sound.hard();
    return;
  }
  G.confirmNew = false;
  newGame();
}

function cancelConfirm(){
  if (G.confirmNew){ G.confirmNew = false; return true; }
  return false;
}

function launch(){
  if (!balls.length) return;
  // 必须释放所有贴板的球：吃过"3"（三球齐发）后掉命，会有一批球一起贴板，
  // 只发射 balls[0] 的话其余的会永远粘在挡板上。
  const stuck = balls.filter(b => b.stuck);
  if (!stuck.length) return;
  for (const b of stuck){
    b.stuck = false;
    b.offset = 0;
    const speed = 460;
    const ang = rnd(-0.5, 0.5) + (-Math.PI/2);   // 每个球各自带一点角度差
    b.vx = Math.cos(ang) * speed;
    b.vy = Math.sin(ang) * speed;
  }
  G.state = S.PLAY;
  Sound.wall();
}

function nextLevel(){
  G.level++;
  loadLevel(G.level);
  saveProgress(false);        // 新一关刚铺好，是个干净的存档点
}

function toast(text){ G.msg = text; G.msgTimer = 1.6; }

// 已经是"无效收益"的道具就别刷了：挡板已最长时刷 W、已最短时刷 N，
// 接到也毫无变化，只会白占一次掉落机会（还挤掉了本可以出现的有用道具）。
function powerIsNoop(p){
  if (!paddle) return false;                  // 兜底：挡板还没建起来时不做过滤
  if (p.k === 'wide')   return paddle.w >= 260;
  if (p.k === 'narrow') return paddle.w <= 60;
  return false;
}

function spawnDrops(x, y){
  if (Math.random() > 0.30) return;
  const good = POWERS.filter(p => p.good && !powerIsNoop(p));
  const bad  = POWERS.filter(p => !p.good && !powerIsNoop(p));
  const pool = (good.length && (Math.random() < .72 || !bad.length)) ? good : bad;
  if (!pool.length) return;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  drops.push({ x, y, v: 150, p: pick, t: 0 });
}

function applyPower(p, bonus = 0){
  if (p.good){ G.flash = Math.max(G.flash, .35); }
  else { G.shake = Math.max(G.shake, 14); }
  if (p.k === 'wide'){ paddle.w = Math.min(260, paddle.w + 42); Sound.power(); }
  if (p.k === 'narrow'){ paddle.w = Math.max(60, paddle.w - 34); Sound.bad(); }
  // 宽度变了必须重新夹取位置，否则贴边吃道具时挡板会插进侧墙
  clampPaddle();
  if (p.k === 'slow'){
    balls.forEach(b => { if (!b.stuck){ b.vx *= .68; b.vy *= .68; } });
    G.slowFx = 4; Sound.power();
  }
  if (p.k === 'fast'){
    balls.forEach(b => {
      if (b.stuck) return;
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const ns = clamp(sp * 1.32, 400, 1000);   // 乘完必须夹回上限，否则会突破设计速度
      b.vx *= ns / sp; b.vy *= ns / sp;
    });
    Sound.bad();
  }
  if (p.k === 'life'){ G.lives++; Sound.power(); }
  if (p.k === 'shock'){
    // 波心在**球的当前位置**引爆，不是挡板位置。
    // 两个原因：
    //   1. 砖区在顶部、挡板在底部，相距约 420px —— 锚在挡板上的话，
    //      150~170px 的波永远够不到任何一块砖，等于白吃。
    //   2. 这个道具的定位是"球快掉了那一瞬间的救命手段"，锚在球上才成立：
    //      球靠近砖时吃到 = 清一片；球快落底时吃到 = 把球周围的砖掀掉、改变弹道。
    // 多个球时取最靠近砖区的那个 —— 那才是玩家此刻关注的位置。
    const src = balls.reduce((best, b) => {
      if (!best) return b;
      return (b.y < best.y) ? b : best;                 // y 越小越靠上
    }, null);
    const cx = src ? src.x : paddle.x + paddle.w/2;
    const cy = src ? src.y : paddle.y - 6;
    // forceSolids:false —— 道具版负责清场，不负责拆墙：拆墙是炸药砖的职责，
    // 两者分工不同，否则冲击波会变成一把万能钥匙。
    explode(cx, cy, { forceSolids:false, rmax:170, speed:700 });
    Sound.power();
  }
  if (p.k === 'multi'){
    Sound.power();
    const src = balls[0];
    if (src){
      for (let i = 0; i < 2; i++){
        const nb = makeBall(src.x, src.y, 0, 0);
        const ang = -Math.PI/2 + (i ? .5 : -.5);
        const sp = Math.hypot(src.vx, src.vy) || 440;
        nb.vx = Math.cos(ang)*sp;
        nb.vy = Math.sin(ang)*sp;
        nb.stuck = src.stuck;
        balls.push(nb);
      }
    }
  }
  // 接到道具给一点奖励分，和道具名合成一条浮动字，避免两条文字叠在挡板上
  if (bonus > 0){ G.score += bonus; saveBest(); }
  floats.push({ x: paddle.x + paddle.w/2, y: paddle.y - 26,
                text: p.name + (bonus > 0 ? ' +' + bonus : ''), color: p.c, life: 1.1, vy: -34 });
  // 不再额外 toast：挡板上方已经有道具名的浮动字，顶部再来一条是重复的噪声
}

// 距离 (x,y) 最近的、还能被打掉的砖（用于卡死时的柔性引导）
/* ---- 反弹瞬间的一次性拨正 ----
   只在**墙/砖反射发生的那一帧**调用。出射角正常就完全不动；
   落在危险角度（或残局里停滞够久）才拨一次，然后撒手 ——
   两帧之间绝不介入，所以球在两块砖之间的航程是纯净的反射。

   exclude：刚撞上的那块砖。它如果没被打碎，按距离算仍然是"最近的活砖"，
   瞄准它的砖心等于瞄准砖的内部，球会立刻再撞一次 —— 必须排除。

   返回是否真的拨了（供测试与审计统计）。 */
function reflectNudge(b, exclude){
  if (b.turnLock > 0) return false;              // 刚被转弯砖改过向，让路
  const sp = Math.hypot(b.vx, b.vy);
  if (sp <= 1) return false;
  if (!flatAngle(b.vx, b.vy)) return false;      // 出射角正常（含贴竖直）-> 不引导

  /* ★ 贴水平的**下行**球也必须管。这是玩家实测报上来的漏洞。
     这里原来是第一行判据 `if (b.vy > 0) return false;`，注释写的是
     "正在下落 = 该回挡板，别抢玩家的球"。那句话对**正常斜着下落**的球完全正确，
     对**贴水平下落**的球却是错的：它不是"在回挡板"，它是在左右两面墙之间来回滑。
     实测（第 20 关跑满 300 秒）：
       · 贴水平帧占全部帧的 17.0%（3067 / 18000）；
       · 其中 2976 帧是下行、只有 91 帧上行；
       · 最长的一段**连续 2406 帧 = 40.1 秒**谁都碰不到；
       · 58 个"贴水平的反射瞬间"里有 38 个死在 `vy > 0` 这一条上。
     也就是说：这条判据把**绝大多数**真正的卡关样本原样放过了。
     修法：下行的贴水平球**只把下滑角掰陡、水平方向一动不动** ——
     它本来就要回挡板，我们并没有把它从玩家手里抢走（不需要转向朝上的砖），
     只是不让它在墙上滑 40 秒。正常斜着下落（离水平 30° 以上）的球依旧完全不碰。 */
  const descending = b.vy > 0;
  const cur = Math.atan2(b.vy, b.vx);
  let na, aim;

  if (descending){
    // 角度突变：一次掰到 45°，水平分量方向保持原样（该往左还是往左）
    const minFH = 45 * Math.PI / 180;
    const sx = b.vx < 0 ? -1 : 1;
    na = Math.atan2(Math.sin(minFH), sx * Math.cos(minFH));
    // 引导线指向"按新航向落到挡板高度"的那个点 —— 诚实地说"我把它送下来了"
    const tFall = (paddle.y - b.y) / (Math.sin(minFH) * sp);
    aim = { x: clamp(b.x + Math.cos(na) * sp * tFall, 24 + b.r, W - 24 - b.r),
            y: paddle.y };
  } else {
    const tgt = nearestAimBrick(b.x, b.y, true, exclude);
    if (!tgt) return false;
    const cx = tgt.x + tgt.w / 2, cy = tgt.y + tgt.h / 2;
    const want = Math.atan2(cy - b.y, cx - b.x);
    const diff = Math.atan2(Math.sin(want - cur), Math.cos(want - cur));
    // 单次事件就该一次拨够：按比例直接拨向目标砖，残局里再乘规则 2 的加强倍率。
    let level = 0.5 * (assistGate() ? assistBoost() : 1);
    level = clamp(level, 0, 1);
    na = cur + diff * level;
    // ★ 兜底：**拨完不许又落回贴水平**。
    //   实测过没这一条会怎样（第 1 关 300 秒）：拨了 4 次，4 次全部落在贴水平上
    //   （最浅 4.4°），而且那些贴水平航向的射线前面**什么都没有** —— 也就是说
    //   这条规则当时在**制造它自己要修的那个问题**。原因是"最近的砖"常常就在
    //   球自己这一行上，瞄它等于瞄水平。
    //   （残局的停滞护送不设这条：那时故意瞄同一行的砖才是对的，
    //     那正是打到最后几块砖的办法 —— 它走的是另一个函数。）
    const minFH = ANG_FLAT + 5 * Math.PI / 180;   // 至少离水平 35°
    const fh = Math.abs(Math.atan2(Math.abs(Math.sin(na)), Math.abs(Math.cos(na))));
    if (fh < minFH){
      const sx = Math.cos(na) < 0 ? -1 : 1;
      const sy = Math.sin(na) > 0 ? 1 : -1;       // 保持原来的上下倾向
      na = Math.atan2(sy * Math.sin(minFH), sx * Math.cos(minFH));
    }
    aim = { x: cx, y: cy };                       // 画线和拨的必须是同一个目标
  }

  b.vx = Math.cos(na) * sp;
  b.vy = Math.sin(na) * sp;
  b.assistFx = .2;                               // 视觉标记：这一下被拨正了
  b.aimTarget = aim;
  return true;
}

/* 保险 3：连续 5 秒近乎纯竖直弹跳 -> 强制纠偏（17°~43° 的随机偏角），
   避免"球沿一条竖线上下弹、永远碰不到旁边的砖"的无限死循环。
   这条**不是**规则 1 的引导：它不看目标砖、也不管出射角贴不贴水平，
   纯粹是"竖直太久了就踹一脚"。抽成函数是为了让审计脚本能把它数出来 ——
   否则审计会把它误判成"规则 1 在两帧之间偷偷介入"。 */
function verticalNudge(b, dt){
  if (b.stuck) return false;
  const sp = Math.hypot(b.vx, b.vy) || 1;
  if (Math.abs(b.vx) / sp < 0.10) b.vTimer += dt;
  else b.vTimer = 0;
  if (b.vTimer <= 5) return false;
  b.vTimer = 0;
  const dir = Math.random() < .5 ? -1 : 1;
  const ang = dir * (0.30 + Math.random() * 0.45);         // 17°~43°
  b.vx = Math.sin(ang) * sp;
  b.vy = Math.sign(b.vy || -1) * Math.abs(Math.cos(ang) * sp);
  addParticles(b.x, b.y, '#ffd93d', 10, .8);
  if (window.__NB_DEBUG) window.__NB_DEBUG.nudges = (window.__NB_DEBUG.nudges || 0) + 1;
  return true;
}

/* 残局的"停滞护送"：**每帧**把速度朝目标活砖转一点点（`assistTurn()` = 4°/帧 × 规则 2 倍率）。

   它和角度规则（`reflectNudge`，反弹瞬间的一次性事件）是**两件不同的事**：
     · 角度规则修的是"这一趟航向不对"，一次拨正就够，然后必须撒手；
     · 护送修的是"球还没到那个够不到的地方"，绕过实心砖进到口袋里**需要连续修正**，
       只在反射那一帧拨一次会来回蹭却进不去（实测：端到端断言开始偶发失败）。
   触发只有残局（≤3 块可破坏砖）+ 停滞 > 5 秒，所以中局横幅不会因此常亮。

   `fallback=true` 保住「卡关」修复 —— 残局里所有活砖都被死砖挡着时，
   退回"最近的活砖"：球要绕进口袋，直线是被挡着的。

   返回是否真的转了（供测试与审计统计）。 */
function escortToBricks(b){
  if (b.stuck) return false;
  if (G.state !== S.PLAY) return false;
  if (b.aimMute > 0) return false;               // 刚"转了个圈"，先让它飞完这一趟
  if (!assistGate() || G.stuckTimer <= 5) return false;
  const spot = escortSpot(b);
  if (!spot) return false;
  const sp = Math.hypot(b.vx, b.vy);
  if (sp <= 1) return false;
  const cur = Math.atan2(b.vy, b.vx);
  const want = Math.atan2(spot.y - b.y, spot.x - b.x);
  const diff = Math.atan2(Math.sin(want - cur), Math.cos(want - cur));
  const level = clamp((G.stuckTimer - 5) / 25, 0, 1);      // 5 秒起爬升，30 秒满
  const cap = clamp(level * assistBoost(), 0, 1) * assistTurn();
  const turn = clamp(diff, -cap, cap);
  if (!turn) return false;
  const na = cur + turn;
  b.vx = Math.cos(na) * sp;
  b.vy = Math.sin(na) * sp;
  b.assistFx = .2;                               // 视觉标记：轨迹正在被掰弯
  b.aimTarget = { x: spot.x, y: spot.y };
  return true;
}

/* 护送这一帧该把球往哪儿带？—— 分两跳问，这就是"绕过去"的能力。

   只瞄"最近的活砖"是不够的：如果最后几块砖躺在一个**死砖口袋**里
   （三面被围、只留一格开口），"球 -> 砖"的直线一定穿过死砖，
   于是球一次次撞在死砖上弹回来 —— 这恰恰是引导自己造成的死循环。

   所以：
     ① 有"直线打得着"的活砖 -> 直接瞄它（和以前一样，绝大多数情况走这条）；
     ② 一块都打不着 -> 找一块活砖，再找一个**中转空格**：
        球能直线飞到那格、从那一格又能直线打到那块砖。瞄中转格。
        （砖是格状的，所以绕路只需要两跳：球 -> 门口 -> 砖。）

   返回 { x, y, brick } 或 null（连中转格都找不到时不瞄，交给保险 4 去转个圈）。 */
function escortSpot(b){
  const direct = nearestAimBrick(b.x, b.y, false);
  if (direct) return { x: direct.x + direct.w/2, y: direct.y + direct.h/2, brick: direct };
  // 直线够得着的"门口"（洞口那一面的中点）：飞过去就会穿进洞里
  let gate = null, gd = Infinity;
  for (const g of pocketGates()){
    const d = (g.x - b.x) * (g.x - b.x) + (g.y - b.y) * (g.y - b.y);
    if (d >= gd) continue;
    if (lineBlockedBySolidPad(b.x, b.y, g.x, g.y, b.r)) continue;
    gd = d; gate = g;
  }
  if (gate) return { x: gate.x, y: gate.y, brick: gate.brick, gate: true };
  // 直线够不着：借一次墙（球心入射方向只有墙能精确控制）
  const bank = bankAim(b);
  if (bank) return bank;
  // 再不行退回"两跳绕路"（门口那一格的中心）
  const blocked = nearestBrick(b.x, b.y);
  if (!blocked) return null;
  const wp = waypointTo(b, blocked);
  return wp ? { x: wp.x, y: wp.y, brick: blocked } : null;
}

/* "门口"到底该瞄哪一个点：**不是门口那一格的中心，而是那一格朝着开阔地的那一面中点。**
   球要进洞，得从那一面**穿过去** —— 洞的入口是一扇"门"，不是一个"房间"。

   第 78 关的存档把这件事量出来了：最后两块砖在 (2,8)/(3,8)，唯一入口是右边
   那一格 (3,9)，而它朝外的那一面在 x=897（洞口边界），中心却深到 x=855。
   瞄准"格子中心"会让球在进洞前先蹭到洞口的砖角（实测 99-lv78 里
   球真正进洞的帧只占 0.3%）。瞄"面中点"才对得上球真正要走的那条缝。

   返回 [{x, y, brick}]：每块活砖的每个"空位邻居"，它朝外的每一面（不含朝着这块砖
   的那一面），且那一面外面确实没有砖挡着。 */
function pocketGates(){
  const COLS = 10;
  let rows = 0;
  const occ = Object.create(null);
  for (const br of bricks){
    if (br.dead) continue;
    const c = Math.round((br.x - 60) / 84), r = Math.round((br.y - 90) / 33);
    if (r < 0 || c < 0 || c >= COLS) continue;
    occ[r * COLS + c] = br;
    if (r + 1 > rows) rows = r + 1;
  }
  const free = (r, c) => (r < 0 || c < 0 || c >= COLS || r >= rows) ? true : !occ[r * COLS + c];
  const out = [];
  for (const br of bricks){
    if (br.dead || isFurniture(br)) continue;
    const r = Math.round((br.y - 90) / 33), c = Math.round((br.x - 60) / 84);
    if (r < 0 || c < 0 || c >= COLS) continue;
    for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
      const r2 = r + dr, c2 = c + dc;
      if (!free(r2, c2)) continue;                       // 这一面外面是砖，进不去
      const cx2 = 99 + 84 * c2, cy2 = 103 + 33 * r2;     // 门口那一格的中心
      const faces = [
        { x: cx2, y: cy2 - 16.5, nr: r2 - 1, nc: c2 },   // 上表面
        { x: cx2, y: cy2 + 16.5, nr: r2 + 1, nc: c2 },   // 下表面
        { x: cx2 - 42, y: cy2, nr: r2, nc: c2 - 1 },     // 左表面
        { x: cx2 + 42, y: cy2, nr: r2, nc: c2 + 1 }      // 右表面
      ];
      for (const f of faces){
        if (f.nr === r && f.nc === c) continue;          // 就是朝着这块砖的那一面
        if (!free(f.nr, f.nc)) continue;                 // 那一面外面也被砖堵着
        out.push({ x: f.x, y: f.y, brick: br });
      }
    }
  }
  return out;
}

/* 借一次墙（台球里的一库解）。玩家第 78 关的存档暴露了这个缺口：

   那关最后只剩 2 块砖，上下叠在 (2,8) / (3,8)，周围全是死砖，唯一入口是
   右边那一格 (3,9) —— 一个**只有一格宽的洞**。实测（`node shots.cjs 99-lv78`）：
   600 秒只过关 4 次（平均 150 秒一关），球真正进洞的帧只占 0.3%。

   为什么"门口"那一跳救不了它：瞄门口只是赌球**正好沿着"门口 -> 砖"那条线飞进去**。
   球从别处飞到门口时入射方向是错的，穿过门口也打不到砖。
   能精确控制入射方向的只有墙：撞墙时速度分量精确取反。

   做法：把砖心对墙做镜像，球到镜像点的那条线穿过墙面的那个点就是该撞的位置，
   反弹之后球的方向**正好**指向砖心。瞄准点直接取墙面上那一点 ——
   它和镜像点同一个方向，但画得出来（辅助线指向墙上），也不会指到屏幕外。
   两跳都不被死砖挡住才用，取最近的一个。下面没有墙（是挡板），所以只考虑三面。 */
function bankAim(b){
  const pts = [];
  for (const br of bricks){
    if (br.dead || isFurniture(br)) continue;
    pts.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, brick: br });
  }
  // "门口"也是可以借墙进去的目标（第 78 关那种"只有一格宽的洞"就靠这个）
  for (const g of pocketGates()) pts.push(g);
  const planes = [
    { v: true,  at: 24 },        // 左墙（球心的反弹面）
    { v: true,  at: W - 24 },    // 右墙
    { v: false, at: 24 }         // 顶墙
  ];
  let best = null, bd = Infinity;
  for (const pt of pts){
    const cx = pt.x, cy = pt.y, br = pt.brick;
    for (const pl of planes){
      const mx = pl.v ? 2 * pl.at - cx : cx;          // 目标点的镜像点
      const my = pl.v ? cy : 2 * pl.at - cy;
      const dx = mx - b.x, dy = my - b.y;
      const den = pl.v ? dx : dy;
      if (Math.abs(den) < 1e-6) continue;             // 与这面墙平行，撞不上
      const t = (pl.at - (pl.v ? b.x : b.y)) / den;
      if (t <= 0.02 || t >= 0.98) continue;           // 交点必须落在"球 -> 镜像点"这一段上
      const qx = pl.v ? pl.at : b.x + t * dx;
      const qy = pl.v ? b.y + t * dy : pl.at;
      if (pl.v){ if (qy < 24 || qy > H - 8) continue; }        // 撞点要落在墙面范围内
      else     { if (qx < 24 || qx > W - 24) continue; }
      const d = (qx - b.x) * (qx - b.x) + (qy - b.y) * (qy - b.y);
      if (d < 3600 || d >= bd) continue;              // 太近（<60px）不算"借墙"
      if (lineBlockedBySolidPad(b.x, b.y, qx, qy, b.r)) continue;  // 先撞死砖就到不了墙
      if (lineBlockedBySolidPad(qx, qy, cx, cy, b.r)) continue;    // 反弹后那一跳也过不去
      bd = d; best = { x: qx, y: qy, brick: br, bank: true, tx: cx, ty: cy };
    }
  }
  return best;
}

/* 两跳绕路：在网格里找一个**空格**，使得
     · 球 -> 空格中心 这条线不被死砖挡住（第一跳飞得过去），
     · 空格中心 -> 目标砖中心 这条线不被死砖挡住（第二跳打得到）。
   取离球最近的那个。除了死砖之外挡在路上的砖不用管 —— 打掉它们本来就是进展。 */
function waypointTo(b, tgt){
  const cx = tgt.x + tgt.w / 2, cy = tgt.y + tgt.h / 2;
  const COLS = 10;
  let rows = 0;
  const occ = Object.create(null);
  for (const br of bricks){
    if (br.dead) continue;
    const c = Math.round((br.x - 60) / 84), r = Math.round((br.y - 90) / 33);
    if (r < 0 || c < 0 || c >= COLS) continue;
    occ[r * COLS + c] = br;
    if (r + 1 > rows) rows = r + 1;
  }
  let best = null, bd = Infinity;
  for (let r = 0; r < rows; r++){
    for (let c = 0; c < COLS; c++){
      if (occ[r * COLS + c]) continue;                   // 这一格有砖，不是空格
      const px = 60 + c * 84 + 39, py = 90 + r * 33 + 13;
      const dx = px - b.x, dy = py - b.y;
      const d = dx*dx + dy*dy;
      if (d >= bd) continue;
      if (lineBlockedBySolid(b.x, b.y, px, py)) continue;  // 第一跳被死砖挡住
      if (lineBlockedBySolid(px, py, cx, cy)) continue;    // 第二跳被死砖挡住
      bd = d; best = { x: px, y: py };
    }
  }
  return best;
}

/* ---------- 保险 4：连续砸了 N 次墙就"转个圈再瞄准"（玩家提的）----------

   为什么需要它：护送的逻辑是"把球往目标砖掰"，**可如果最后几块砖躺在一个
   死砖口袋（三面被围、只留一格小开口）里，瞄它这件事本身就是无效的** ——
   球到砖的直线一定穿过死砖，球只会一次次撞在死砖上弹回来，然后被再瞄一次。

   实测（手搭盘面：三面死砖 + 右边一格开口，残局只剩口袋里那一块）：
     · 300 秒**一次都没过关**；
     · 最长的"没碰到任何可破坏砖"= 211.6 秒；
     · 连续死反弹（撞墙/撞死砖）最长 1188 次；
     · 护送 95.4% 的帧，瞄的都是"直线被死砖挡着"的那块砖 —— 这就是"瞄死砖"。
   玩家看到的原话就是"一直在撞死砖循环了好几个 40 秒"。

   破法（玩家原话："连续砸墙 10 次就转个圈再瞄准"）：
     · **转个圈**：优先换一块"直线打得着"的砖来瞄（换目标就是换轨道）；
       一块都打不着（砖全在口袋里）时，就大幅转向（±70°~110°）换一条完全不同的轨道；
     · **再瞄准**：转完设 `aimMute = CYCLE_MUTE` 秒。这段时间护送**先别瞄** ——
       否则它会在 9 帧内把球掰回原来那条死路上（单帧上限 9°），"转个圈"就白转了。
       静默期一过，护送自动恢复，从那时的位置/角度重新瞄。

   只在残局门控打开时启用：这也是玩家说的"有瞄准辅助的时候"。
   中局它一次都不会介入 —— 中局玩家自己在控球（审计里的 freeTurns 恒为 0 就是这条的守卫）。 */
const CYCLE_N = 10;                              // 连续砸墙/砸死砖的次数
const CYCLE_MUTE = 1.0;                          // 转完之后"先别瞄"的秒数
const CYCLE_TURN_MIN = 70 * Math.PI / 180;       // 无目标可瞄时的转向幅度
const CYCLE_TURN_MAX = 110 * Math.PI / 180;

function cycleBreak(b){
  if (b.deadBounces < CYCLE_N) return false;
  if (!assistGate()) return false;               // 只在有瞄准辅助的时候（残局）
  const sp = Math.hypot(b.vx, b.vy);
  if (sp <= 1) return false;
  b.deadBounces = 0;
  b.aimMute = CYCLE_MUTE;
  // 1) 能不能换一块"直线打得着"的砖？能就直接换目标（这就是"再瞄准"）
  const tgt = nearestAimBrick(b.x, b.y, false);
  const cur = Math.atan2(b.vy, b.vx);
  let na, aim;
  if (tgt){
    const cx = tgt.x + tgt.w / 2, cy = tgt.y + tgt.h / 2;
    na = Math.atan2(cy - b.y, cx - b.x);
    aim = { x: cx, y: cy };
  } else {
    // 2) 一块都打不着（都在死砖口袋里）-> 转个圈：换一条完全不同的轨道
    const turn = CYCLE_TURN_MIN + Math.random() * (CYCLE_TURN_MAX - CYCLE_TURN_MIN);
    na = cur + (Math.random() < 0.5 ? turn : -turn);
    aim = null;                                  // 这一趟没有目标，只有"换个方向"
  }
  b.vx = Math.cos(na) * sp;
  b.vy = Math.sin(na) * sp;
  b.assistFx = .35;                              // 比拨正亮一点：这一下是"整条轨道换掉"
  b.aimTarget = aim;
  addParticles(b.x, b.y, '#ffd93d', 14, .9);
  if (window.__NB_DEBUG) window.__NB_DEBUG.cycleBreaks = (window.__NB_DEBUG.cycleBreaks || 0) + 1;
  return true;
}

function nearestBrick(x, y, exclude){
  let best = null, bd = Infinity;
  for (const br of bricks){
    if (br.dead || isFurniture(br) || br === exclude) continue;
    const dx = br.x + br.w/2 - x, dy = br.y + br.h/2 - y;
    const d = dx*dx + dy*dy;
    if (d < bd){ bd = d; best = br; }
  }
  return best;
}

/* 线段与矩形是否相交（Liang-Barsky 裁剪，pad 是向外扩的余量）。
   用来问一个很具体的问题：**球到目标砖之间，有没有隔着一块死砖？** */
function segHitsRect(x0, y0, x1, y1, rx, ry, rw, rh, pad){
  const xmin = rx - pad, xmax = rx + rw + pad;
  const ymin = ry - pad, ymax = ry + rh + pad;
  const dx = x1 - x0, dy = y1 - y0;
  let t0 = 0, t1 = 1;
  const clip = (p, q) => {                       // 约束 p·t <= q
    if (Math.abs(p) < 1e-9) return q >= 0;       // 平行：落在区间外就整段裁掉
    const t = q / p;
    if (p < 0){ if (t > t1) return false; if (t > t0) t0 = t; }
    else      { if (t < t0) return false; if (t < t1) t1 = t; }
    return true;
  };
  return clip(-dx, x0 - xmin) && clip(dx, xmax - x0) &&
         clip(-dy, y0 - ymin) && clip(dy, ymax - y0) && t0 <= t1;
}
function lineBlockedBySolid(x0, y0, x1, y1){ return lineBlockedBySolidPad(x0, y0, x1, y1, 2); }
function lineBlockedBySolidPad(x0, y0, x1, y1, pad){
  for (const br of bricks){
    if (br.dead || !br.solid) continue;
    if (segHitsRect(x0, y0, x1, y1, br.x, br.y, br.w, br.h, pad)) return true;
  }
  return false;
}

/* 只瞄**直线打得着**的活砖。
   磁力和防卡死引导都是"把球往目标掰"，可 nearestBrick 只看距离 ——
   目标如果隔着一块死砖，球就只会一次次撞在死砖上弹回来。
   玩家看到的现象就是"引导在瞄死砖"（玩家反馈原话）。
   fallback=true 时，如果所有活砖都被挡着（比如封闭口袋里那几块），
   退回原来的"最近的活砖" —— 残局兜底和「卡关」修复都依赖这个回退。 */
function nearestAimBrick(x, y, fallback, exclude){
  let best = null, bd = Infinity;
  for (const br of bricks){
    if (br.dead || isFurniture(br) || br === exclude) continue;
    const cx = br.x + br.w/2, cy = br.y + br.h/2;
    const d = (cx - x)*(cx - x) + (cy - y)*(cy - y);
    if (d >= bd) continue;                       // 比当前最好还远，连视线都不用测
    if (lineBlockedBySolid(x, y, cx, cy)) continue;
    bd = d; best = br;
  }
  return best || (fallback ? nearestBrick(x, y, exclude) : null);
}

/* ---------- 防卡死引导的开关 ----------
 * 引导要解决的是"最后几块砖某些角度永远打不到"，**不是**"玩家打得慢"。
 * 所以它只在残局启用：场上还剩的可破坏砖 ≤ ASSIST_MAX_BRICKS。
 *
 * 全程陪伴的代价是玩家会觉得"球不受控"。实测（同构驱动、每关 300 秒、鼠标追球）：
 *    第 1 关  ：引导开启 13.3% 的帧，4.2% 的挡板反弹被改写（平均改写 57.9°）
 *    第 20 关：引导开启 39.3% 的帧，20.1% 的挡板反弹被改写（平均改写 74.7°）
 * 关掉引导后，出射角偏离游戏自己规则的程度从 16.9° 掉到 1.0°、超过 15° 的从
 * 20.1% 掉到 0%。而且它每帧最多转 4°（≈240°/秒），注释里"几乎感知不到"是错的。
 * 残局之外完全不介入，玩家看到的轨迹就都是真正的反射。
 */
const ASSIST_MAX_BRICKS = 3;
function breakableLeft(){
  let n = 0;
  for (const br of bricks) if (!br.dead && !isFurniture(br)) n++;
  return n;
}
function assistGate(){ return breakableLeft() <= ASSIST_MAX_BRICKS; }

/* ---------------- 引导强度与"贴水平角度"（用户提的三条规则） ----------------
   规则 1：角度过小就主动引导  —— 后来玩家收窄为：**只管贴水平，竖直的没问题**。
   规则 2：最后几块砖，引导加强。
   规则 3：磁力球用引导的 2~3 倍加强版。

   规则 1 的演变（三轮反馈，都记在 DESIGN-next.md 第 10 节）：
     ① 最初写成"离水平**或竖直**不到 30°"，并且只在残局生效；
     ② 玩家说"小角度还是没有掰弯" -> 把角度触发从残局门控放出来、全程有效；
     ③ 玩家看到引导线一直在，追问之后自己收窄："只用管水平角度过小，竖直的没问题"。
   ③ 是对的，理由在数据里：挡板模型是 `rel × 60°` 偏离竖直，所以"离竖直 30° 以内"
   覆盖了正常打法的一大半（第 1 关 91% 的帧）—— 把竖直也算成"角度不对"，
   等于全程自动瞄准。而贴水平是真正病态的那种：球在左右墙之间横着弹，
   永远落不到挡板，玩家完全没法干预。 */

// 规则 2：砖越少，引导越强。3 块 = 1.0 倍，2 块 = 1.625，1 块 = 2.25 倍。
function assistBoost(){
  const left = clamp(breakableLeft(), 1, ASSIST_MAX_BRICKS);
  return 1 + (ASSIST_MAX_BRICKS - left) * 0.625;
}
// 规则 2 的每帧额度：4°/帧 × 倍率。**只给残局的停滞护送用**（见 escortToBricks）——
// 角度规则已经改成"反弹瞬间的一次性拨正"，没有"每帧几度"这回事了。
const ASSIST_TURN_BASE = 4 * Math.PI / 180;
function assistTurn(){ return ASSIST_TURN_BASE * assistBoost(); }   // 4°/帧 → 9°/帧

// 规则 1（收窄后）：航向离**水平**不到 30° 才算"角度不对"。
//   贴竖直**不再**触发 —— 它是正常打法，不是需要纠正的角度。
const ANG_FLAT = 30 * Math.PI / 180;
function flatAngle(vx, vy){
  if (!vx && !vy) return false;
  const fromHoriz = Math.abs(Math.atan2(Math.abs(vy), Math.abs(vx)));   // 0=水平 · 90°=竖直
